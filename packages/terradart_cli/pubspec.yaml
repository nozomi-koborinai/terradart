name: terradart_cli
description: The terradart command — synth, plan, apply and migrate a TerraDart Stack or an existing Terraform tree, and write outputs as a --dart-define-from-file JSON.
version: 0.33.0
homepage: https://terradart.dev
repository: https://github.com/nozomi-koborinai/terradart
issue_tracker: https://github.com/nozomi-koborinai/terradart/issues
documentation: https://terradart.dev/docs/cli/

topics:
  - terraform
  - opentofu
  - infrastructure
  - cli

environment:
  sdk: ^3.10.0

resolution: workspace

executables:
  terradart: terradart

dependencies:
  args: ^2.5.0
  crypto: ^3.0.3
  path: ^1.9.0
  terradart_migrate: ^0.32.1
  yaml: ^3.1.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
