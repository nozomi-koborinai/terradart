name: terradart_google
description: Curated factory wrappers for Google Cloud resources (Compute, BigQuery, Cloud Run, Cloud SQL, Pub/Sub, Monitoring, ...) for Dart-first Terraform stacks.
version: 0.25.3
homepage: https://github.com/nozomi-koborinai/terradart
repository: https://github.com/nozomi-koborinai/terradart
issue_tracker: https://github.com/nozomi-koborinai/terradart/issues
documentation: https://github.com/nozomi-koborinai/terradart#readme

topics:
  - terraform
  - infrastructure
  - codegen
  - google-cloud

environment:
  sdk: ^3.6.0

# Gate 6 round-trip fixtures use mock PEM blocks for self-managed certificates.
false_secrets:
  - /test/synth/encode_round_trip_test.dart

resolution: workspace

dependencies:
  terradart_core: ^0.25.3
  meta: ^1.15.0

dev_dependencies:
  terradart_codegen: ^0.25.3
  path: ^1.9.0
  lints: ^6.0.0
  test: ^1.25.6
