# Authored barrel manifest for terradart_aws — the human-decided axes of
# the generated barrels under terradart_aws/lib/.
# Same contract as barrels.yaml (fail-closed both directions); consumed via
# `terradart wrap --barrels-manifest`.

umbrellaFile: terradart_aws

umbrellaDoc: |-
  /// Curated **AWS** surface for TerraDart (`hashicorp/aws` Terraform
  /// provider, pinned at `6.66.0`).
  ///
  /// The catalog at that pin is filled: every resource and data source in
  /// the schema has a typed factory, and nested blocks are Dart helper
  /// classes. Six resources whose nesting runs 14 levels deep
  /// (`aws_wafv2_web_acl`, `aws_wafv2_web_acl_rule`, `aws_wafv2_rule_group`,
  /// `aws_quicksight_analysis`, `aws_quicksight_dashboard`,
  /// `aws_quicksight_template`) take those blocks as
  /// `TfArg<Map<String, dynamic>>` for now. A later pin that adds names
  /// lands on request. Credentials never appear in synth output:
  /// authentication happens at apply time via the AWS SDK credential chain
  /// (`AWS_*` environment variables, shared config, or an instance role).
  ///
  /// This umbrella re-exports every per-service barrel. Prefer the
  /// per-service imports in new code.

umbrellaExtraExports:
  - "export 'provider.dart';"

