# Authored barrel manifest for terradart_cloudflare — the human-decided
# axes of the generated barrels under terradart_cloudflare/lib/.
# Same contract as barrels.yaml (fail-closed both directions); consumed via
# `terradart wrap --barrels-manifest`.

umbrellaFile: terradart_cloudflare

umbrellaDoc: |-
  /// Curated **Cloudflare** surface for TerraDart (official
  /// `cloudflare/cloudflare` Terraform provider).
  ///
  /// The catalog at the current provider pin (`5.23.0`) is filled —
  /// every resource and data source in that schema has a typed factory.
  /// Nested plugin-framework objects are Dart helper classes, not
  /// `TfArg<Map<String, dynamic>>`. A later pin that adds names lands
  /// on request. Credentials never appear in synth output:
  /// authentication happens at apply time via CLOUDFLARE_* environment
  /// variables.
  ///
  /// This umbrella re-exports every per-service barrel. Prefer the
  /// per-service imports in new code.

umbrellaExtraExports:
  - "export 'provider.dart';"

barrels:
  access:
    doc: |-
      /// Cloudflare zone IP access rules (not Zero Trust Access).
  account:
    doc: |-
      /// Cloudflare accounts, members, tokens, and organization settings.
  address_map:
    doc: |-
      /// Cloudflare address maps (BYOIP advertising).
  ai:
    doc: |-
      /// Cloudflare AI Gateway and AI Search.
  api_shield:
    doc: |-
      /// Cloudflare API Shield, schema validation, and token validation.
  argo:
    doc: |-
      /// Cloudflare Argo Smart Routing and Tiered Caching.
  byo_ip:
