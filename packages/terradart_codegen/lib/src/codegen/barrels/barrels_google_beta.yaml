# Authored barrel manifest for terradart_google_beta — the human-decided
# axes of the generated barrels under terradart_google_beta/lib/.
# Same contract as barrels.yaml (fail-closed both directions); consumed via
# `terradart wrap --barrels-manifest`.

umbrellaFile: terradart_google_beta

umbrellaDoc: |-
  /// Curated **google-beta** surface for TerraDart.
  ///
  /// Beta-only `google_*` types from `hashicorp/google-beta`. GA resources
  /// live in `package:terradart_google`. Both packages share
  /// `terradart_core` and compose in one `Stack` (each provider block is
  /// emitted separately). Wrappers pin the `google-beta` provider
  /// meta-argument.
  ///
  /// This umbrella re-exports every per-service barrel. Prefer the
  /// per-service imports in new code.
  ///
  /// ## Writing arguments
  ///
  /// <!-- argument-rules:start -->
  /// Pick the form by where the value comes from. The argument's type tells you which forms it takes, and a dot shorthand (`.literal`, `.new`, `.providedAl2023`) names the constructor of that type.
  ///
  /// | The value is | Write |
  /// |---|---|
  /// | known when you synth | `.literal(...)` |
  /// | another resource of this Stack (a `RefTo<R>` input) | its `ref` |
  /// | one attribute of another block | its getter |
  /// | a resource outside this Stack (a `RefTo<R>` input) | `.literal(...)` with its name, ID or ARN |
  /// | one of a fixed set (an enum) | the member |
  /// | one of several exclusive arguments (a sealed type) | the variant |
  /// | a nested block | its helper class; `.new(...)` inside another block or a variant |
  /// | a Terraform variable | the handle `variable<T>()` returns |
  /// | a variable in an enum or `RefTo<R>` input | `.arg(handle)` |
  /// | a secret (a `Sensitive<T>` input) | a sensitive variable, never a literal |
  /// | a reference inside a literal list or map | the getter's `.interpolation` |
  /// | anything else Terraform evaluates | `.expression(...)` |
  ///
  /// Each row is an argument of this Stack body, marked with its row:
  ///
  /// ```dart
  /// final memory = variable<num>('memory_mb');
  /// final runtimeName = variable<String>('runtime');
  /// final dbPassword = variable<String>('db_password', sensitive: true);
  ///
  /// final trust = add(
  ///   DataAwsIamPolicyDocument(
  ///     'trust',
  ///     statement: [
  ///       DataIamPolicyDocumentStatement(
  ///         actions: .literal(['sts:AssumeRole']), // known when you synth
  ///         principals: [
  ///           // a nested block inside another block
  ///           .new(
  ///             type: .literal('Service'),
  ///             identifiers: .literal(['lambda.amazonaws.com']),
  ///           ),
  ///         ],
  ///       ),
  ///     ],
  ///   ),
  /// );
  /// // one attribute of another block
  /// final role = add(AwsIamRole('hello', assumeRolePolicy: trust.json));
  /// add(
  ///   AwsLambdaFunction(
  ///     'hello',
  ///     functionName: .literal('hello'),
  ///     role: role.ref, // another resource of this Stack
  ///     runtime: .arg(runtimeName), // a variable in an enum input
  ///     code: .filename(.literal('build/fn.zip')), // a variant
  ///     memorySize: memory, // a Terraform variable
  ///     // a nested block
  ///     environment: LambdaFunctionEnvironment(
  ///       // a reference inside a literal map
  ///       variables: .literal({'ROLE_ARN': role.arn.interpolation}),
  ///     ),
  ///   ),
  /// );
  /// add(
  ///   AwsSsmParameter(
  ///     'db_password',
  ///     name: .literal('/hello/db_password'),
  ///     type: .securestring, // one of a fixed set
  ///     keyId: .literal('alias/aws/ssm'), // a resource outside this Stack
  ///     value: .value(dbPassword), // a secret
  ///   ),
  /// );
  /// add(
  ///   AwsIamRole(
  ///     'deploy',
  ///     // anything else Terraform evaluates
  ///     assumeRolePolicy: .expression(r'${file("trust.json")}'),
  ///   ),
  /// );
  /// ```
  /// <!-- argument-rules:end -->

umbrellaExtraExports:
  - "export 'provider.dart';"

barrels:
  active_directory:
    doc: |-
      /// Managed Microsoft AD peering (beta-only).
  api_gateway:
    doc: |-
      /// API Gateway APIs, configs, gateways, and resource IAM (beta-only).
  artifact_registry:
    doc: |-
      /// Artifact Registry VPC-SC config (beta-only).
  bigquery:
    doc: |-
      /// BigQuery Analytics Hub data-exchange subscription (beta-only).
  ces:
    doc: |-
      /// Customer Engagement Suite evaluation and security settings (beta-only).
  chronicle:
    doc: |-
      /// Chronicle / Google SecOps SOAR domain (beta-only).
  compute:
    doc: |-
      /// Compute Engine beta-only types: machine images, future
      /// reservations, region backend buckets, network policies, and
      /// backend IAM adjuncts.
  container:
    doc: |-
      /// GKE Hub membership RBAC role binding (beta-only).
  dataflow:
    doc: |-
      /// Dataflow Flex Template job (beta-only).
  dataform:
    doc: |-
      /// Dataform config, release config, and workflow config (beta-only).
  dataplex:
    doc: |-
      /// Dataplex data asset (beta-only).
  firebase:
    doc: |-
      /// Firebase apps, Hosting, Storage, Realtime Database, Extensions,
      /// and AI Logic (beta-only).
  folder:
    doc: |-
      /// Folder-level service identity (beta-only).
  identity:
    doc: |-
      /// Cloud Identity policy (beta-only).
  kms:
    doc: |-
      /// Cloud KMS key-access justification (KAJ) policy configs (beta-only).
  network:
    doc: |-
      /// Network Security / Network Services beta-only types (authorization
      /// policy, SAC, service LB policies).
  organization:
    doc: |-
      /// Organization-level service identity (beta-only).
  os_config:
    doc: |-
      /// OS Config guest policies (beta-only).
  privileged_access_manager:
    doc: |-
      /// Privileged Access Manager settings (beta-only).
  project:
    doc: |-
      /// Project-level beta resources (service identities).
  runtimeconfig:
    doc: |-
      /// Runtime Configurator configs, variables, and config IAM (beta-only).
  saas_runtime:
    doc: |-
      /// SaaS Runtime units, tenants, releases, and rollouts (beta-only).
  security_scanner:
    doc: |-
      /// Web Security Scanner scan config (beta-only).
  service_usage:
    doc: |-
      /// Service Usage consumer quota override (beta-only).
  tags:
    doc: |-
      /// Resource Manager tag binding collection (beta-only).
  tpu:
    doc: |-
      /// Cloud TPU v2 VMs and queued resources (beta-only).
  vertex_ai:
    doc: |-
      /// Vertex AI metadata store, Model Garden enablement, and
      /// featurestore / endpoint IAM (beta-only).
