outputDir: wafv2
deriveClassDoc: true
deriveOutputGetters: true
deriveNestedTypes: true

# Nesting reaches depth 14 with thousands of blocks that repeat a few hundred
# shapes; one helper per shape keeps the file small.
dedupeNestedTypes: true

# Inline rules keep the map shape: their helper names would collide with
# aws_wafv2_web_acl_rule's (Wafv2WebAcl + Rule...), which owns them.
nestedTypeExcludes:
  - rule
