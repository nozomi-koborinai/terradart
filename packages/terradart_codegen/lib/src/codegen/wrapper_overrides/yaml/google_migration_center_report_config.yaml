outputDir: migration

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// Migration Center report configuration — group/preference-set pairings for reports.
  ///
  /// Use [MigrationCenterReportConfigGroupPreferencesetAssignment] for
  /// `group_preferenceset_assignments` entries.

extraImports:
  - "import 'package:meta/meta.dart';"
  - "import 'google_migration_center_group.dart' show GoogleMigrationCenterGroup;"
  - "import 'google_migration_center_preference_set.dart' show GoogleMigrationCenterPreferenceSet;"

paramOrder:
  - location
  - report_config_id
  - display_name
  - description
  - group_preferenceset_assignments
  - deletion_policy
  - project

prelude: |
  /// Terraform `deletion_policy` for Migration Center report configs.
  enum MigrationCenterReportConfigDeletionPolicy implements TerraformEnum {
    delete('DELETE'),
    prevent('PREVENT'),
    abandon('ABANDON');

    const MigrationCenterReportConfigDeletionPolicy(this.terraformValue);
    @override
    final String terraformValue;
  }

  /// `group_preferenceset_assignments` entry on a report config.
  @immutable
  class MigrationCenterReportConfigGroupPreferencesetAssignment {
    const MigrationCenterReportConfigGroupPreferencesetAssignment({
      required this.group,
      required this.preferenceSet,
    });

    final RefTo<GoogleMigrationCenterGroup> group;
    final RefTo<GoogleMigrationCenterPreferenceSet> preferenceSet;

    Map<String, Object?> toArgMap() => {
      'group': group.encodeAs('name').toTfJson(),
      'preference_set': preferenceSet.encodeAs('name').toTfJson(),
    };
  }

dartTypeOverrides:
  deletion_policy: MigrationCenterReportConfigDeletionPolicy

customSlots:
  group_preferenceset_assignments:
    paramDeclaration: 'required List<MigrationCenterReportConfigGroupPreferencesetAssignment> groupPreferencesetAssignments'
    argMapEntry: "'group_preferenceset_assignments': TfArg.literal(groupPreferencesetAssignments.map((a) => a.toArgMap()).toList()),"
