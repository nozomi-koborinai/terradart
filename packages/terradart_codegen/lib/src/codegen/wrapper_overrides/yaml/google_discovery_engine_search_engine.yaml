    DiscoveryEngineSearchEngineTier.expression(String template) : this._(TfArg.expression(template));
    const DiscoveryEngineSearchEngineTier.arg(TfArg<String> arg) : this._(arg);

    static const searchTierStandard = DiscoveryEngineSearchEngineTier._(TfArgLiteral('SEARCH_TIER_STANDARD'));
    static const searchTierEnterprise = DiscoveryEngineSearchEngineTier._(TfArgLiteral('SEARCH_TIER_ENTERPRISE'));

    static const List<DiscoveryEngineSearchEngineTier> values = [searchTierStandard, searchTierEnterprise];
  }

