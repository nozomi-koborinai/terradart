outputDir: datastream
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true
deriveEnums: true

extraImports:
  - "import 'package:meta/meta.dart';"


dartTypeOverrides:
  desired_state: DatastreamStreamDesiredState

prelude: |
  /// Datastream Stream Desired enum for `desired_state`.
  extension type const DatastreamStreamDesiredState._(TfArg<String> _) implements TfArg<String> {
    DatastreamStreamDesiredState.variable(String name) : this._(TfArg.variable(name));
    DatastreamStreamDesiredState.expression(String template) : this._(TfArg.expression(template));
    const DatastreamStreamDesiredState.arg(TfArg<String> arg) : this._(arg);

    static const notStarted = DatastreamStreamDesiredState._(TfArgLiteral('NOT_STARTED'));
    static const running = DatastreamStreamDesiredState._(TfArgLiteral('RUNNING'));
    static const paused = DatastreamStreamDesiredState._(TfArgLiteral('PAUSED'));

    static const List<DatastreamStreamDesiredState> values = [notStarted, running, paused];
  }

curatedDoc: |-
  /// Leftover factory on the apply-excluded path
  /// (synth + `terraform validate` only).
  ///
  /// Needs an organization / folder / billing account /
  /// external artifact that standalone terradart-validate
  /// cannot supply. Do not apply.

paramOrder:
  - create_without_validation
  - customer_managed_encryption_key
  - deletion_policy
  - desired_state
  - display_name
  - labels
  - location
  - project
  - stream_id
  - backfill_none
  - destination_config
  - rule_sets
  - source_config
  - backfill_all

sealedNames:
  "destination_config.bigquery_destination_config, destination_config.gcs_destination_config": system
  "source_config.mongodb_source_config, source_config.mysql_source_config, source_config.oracle_source_config, source_config.postgresql_source_config, source_config.salesforce_source_config, source_config.spanner_source_config, source_config.sql_server_source_config": system
  "destination_config.bigquery_destination_config.append_only, destination_config.bigquery_destination_config.merge": write_mode
  "source_config.mysql_source_config.binary_log_position, source_config.mysql_source_config.gtid": cdc_method
