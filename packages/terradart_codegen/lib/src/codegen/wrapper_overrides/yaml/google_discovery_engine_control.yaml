outputDir: discovery_engine

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveEnums: true
deriveNestedTypes: true

curatedDoc: |-
  /// Vertex AI Search **control** — a serving rule on an engine. Pick
  /// exactly one [DiscoveryEngineControlAction]: boost, filter, redirect,
  /// synonyms, or promote.
  ///
  /// **Cost:** gcp-cost: Vertex AI Search `74B1-77CF-C302` Search API Request
  /// Count - Standard `BADA-EE26-7BDA` **$1.50/count after 10k**.
  /// billing-behavior: controls are design-time ranking rules; query SKUs
  /// fire only on Search API requests. This factory never queries.

dartTypeOverrides:
  solution_type: DiscoveryEngineControlSolutionType

# Identity, then the five action blocks the sealed `action` argument
# replaces, then optional use_cases / conditions.
sealedNames:
  "boost_action.fixed_boost, boost_action.interpolation_boost_spec": boost

paramOrder:
  - location
  - collection_id
  - engine_id
  - control_id
  - display_name
  - solution_type
  - boost_action
  - filter_action
  - redirect_action
  - synonyms_action
  - promote_action
  - use_cases
  - deletion_policy
  - project
  - conditions

argMapOrder:
  - location
  - collection_id
  - engine_id
  - control_id
  - display_name
  - solution_type
  - use_cases
  - deletion_policy
  - project
