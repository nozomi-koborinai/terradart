curatedDoc: |-
  /// Associates a regional [GoogleComputeRegionNetworkFirewallPolicy] with a
  /// VPC network ([attachmentTarget] = network self-link). Regional sibling
  /// of [GoogleComputeNetworkFirewallPolicyAssociation].

paramOrder:
  - name
  - firewall_policy
  - attachment_target
  - region
  - deletion_policy
  - project

extraGetters: |2
