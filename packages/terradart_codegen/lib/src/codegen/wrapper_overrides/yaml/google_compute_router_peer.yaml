outputDir: compute
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveEnums: true
deriveNestedTypes: true

extraImports:
  - "import 'package:meta/meta.dart';"

dartTypeOverrides:
  advertise_mode: ComputeRouterPeerAdvertiseMode

paramOrder:
  - name
  - router
  - interface
  - peer_asn
  - region
  - peer_ip_address
  - advertise_mode
  - advertised_groups
  - advertised_route_priority
  - enable
  - enable_ipv4
  - enable_ipv6
  - ip_address
  - ipv4_nexthop_address
  - ipv6_nexthop_address
  - peer_ipv4_nexthop_address
  - peer_ipv6_nexthop_address
  - export_policies
  - import_policies
  - router_appliance_instance
  - deletion_policy
  - project
  - advertised_ip_ranges
  - bfd
  - custom_learned_ip_ranges
  - md5_authentication_key

prelude: |
  /// `advertise_mode` — BGP prefix advertisement mode of this peer.
  /// Default (when unset) is [ComputeRouterPeerAdvertiseMode.defaultMode].
  extension type const ComputeRouterPeerAdvertiseMode._(TfArg<String> _) implements TfArg<String> {
    ComputeRouterPeerAdvertiseMode.variable(String name) : this._(TfArg.variable(name));
    ComputeRouterPeerAdvertiseMode.expression(String template) : this._(TfArg.expression(template));
    const ComputeRouterPeerAdvertiseMode.arg(TfArg<String> arg) : this._(arg);

    static const defaultMode = ComputeRouterPeerAdvertiseMode._(TfArgLiteral('DEFAULT'));
    static const custom = ComputeRouterPeerAdvertiseMode._(TfArgLiteral('CUSTOM'));

    static const List<ComputeRouterPeerAdvertiseMode> values = [defaultMode, custom];
  }

extraGetters: |2
    TfRef<String> get id => TfRef.attribute<String>(this, 'id');
