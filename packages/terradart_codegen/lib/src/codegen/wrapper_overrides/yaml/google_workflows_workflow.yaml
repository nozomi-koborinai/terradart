outputDir: workflows
deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

dartTypeOverrides:
  call_log_level: WorkflowsWorkflowCallLogLevel
  execution_history_level: WorkflowsWorkflowExecutionHistoryLevel

prelude: |
  /// Platform logging level applied to calls and call responses during
  /// executions of a [GoogleWorkflowsWorkflow].
  extension type const WorkflowsWorkflowCallLogLevel._(TfArg<String> _) implements TfArg<String> {
    WorkflowsWorkflowCallLogLevel.variable(String name) : this._(TfArg.variable(name));
    WorkflowsWorkflowCallLogLevel.expression(String template) : this._(TfArg.expression(template));
    const WorkflowsWorkflowCallLogLevel.arg(TfArg<String> arg) : this._(arg);

    /// No call-logging level specified (the service default applies).
    static const unspecified = WorkflowsWorkflowCallLogLevel._(TfArgLiteral('CALL_LOG_LEVEL_UNSPECIFIED'));
    /// Log all calls and their responses.
    static const logAllCalls = WorkflowsWorkflowCallLogLevel._(TfArgLiteral('LOG_ALL_CALLS'));
    /// Log only calls that error.
    static const logErrorsOnly = WorkflowsWorkflowCallLogLevel._(TfArgLiteral('LOG_ERRORS_ONLY'));
    /// Disable call logging.
    static const logNone = WorkflowsWorkflowCallLogLevel._(TfArgLiteral('LOG_NONE'));

    static const List<WorkflowsWorkflowCallLogLevel> values = [unspecified, logAllCalls, logErrorsOnly, logNone];
  }

  /// Amount of execution history stored for a [GoogleWorkflowsWorkflow].
  extension type const WorkflowsWorkflowExecutionHistoryLevel._(TfArg<String> _) implements TfArg<String> {
    WorkflowsWorkflowExecutionHistoryLevel.variable(String name) : this._(TfArg.variable(name));
    WorkflowsWorkflowExecutionHistoryLevel.expression(String template) : this._(TfArg.expression(template));
    const WorkflowsWorkflowExecutionHistoryLevel.arg(TfArg<String> arg) : this._(arg);

    /// No level specified (defaults to unspecified).
    static const unspecified = WorkflowsWorkflowExecutionHistoryLevel._(TfArgLiteral('EXECUTION_HISTORY_LEVEL_UNSPECIFIED'));
    /// Store basic execution history.
    static const basic = WorkflowsWorkflowExecutionHistoryLevel._(TfArgLiteral('EXECUTION_HISTORY_BASIC'));
    /// Store detailed execution history.
    static const detailed = WorkflowsWorkflowExecutionHistoryLevel._(TfArgLiteral('EXECUTION_HISTORY_DETAILED'));

    static const List<WorkflowsWorkflowExecutionHistoryLevel> values = [unspecified, basic, detailed];
  }

paramOrder:
  - name
  - region
  - description
  - source_contents
  - service_account
  - call_log_level
  - execution_history_level
  - crypto_key_name
  - user_env_vars
  - labels
  - deletion_protection
  - project
