outputDir: memcache

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

dartTypeOverrides:
  memcache_version: MemcacheInstanceVersion

paramOrder:
  - name
  - node_count
  - node_config
  - region
  - authorized_network
  - memcache_version
  - display_name
  - maintenance_policy
  - labels
  - deletion_protection
  - memcache_parameters

curatedDoc: |-
  /// Memorystore for Memcached instance — managed Memcached for session caches.
  ///
  /// Pair with [GoogleVpcAccessConnector] or GCE/GKE on the same VPC via
  /// [authorizedNetwork].
  ///
  /// Required identity:
  /// - [localName]: Terraform local name.
  /// - [name]: instance ID.
  /// - [nodeCount]: number of Memcached nodes.
  ///
  /// Enable `memcache.googleapis.com` via [GoogleProjectService] or
  /// [StackApis.enableApis] before apply.
  ///
  /// Example:
  /// ```dart
  /// GoogleMemcacheInstance(
  ///   'sessions',
  ///   name: TfArg.literal('api-sessions'),
  ///   nodeCount: TfArg.literal(1),
  ///   nodeConfig: MemcacheInstanceNodeConfig(
  ///     cpuCount: TfArg.literal(1),
  ///     memorySizeMb: TfArg.literal(1024),
  ///   ),
  ///   region: TfArg.literal('asia-northeast1'),
  ///   authorizedNetwork: .literal('default'),
  /// );
  /// ```

prelude: |
  /// `memcache_version` — major Memcached software version.
  extension type const MemcacheInstanceVersion._(TfArg<String> _) implements TfArg<String> {
    MemcacheInstanceVersion.variable(String name) : this._(TfArg.variable(name));
    MemcacheInstanceVersion.expression(String template) : this._(TfArg.expression(template));
    const MemcacheInstanceVersion.arg(TfArg<String> arg) : this._(arg);

    static const memcache15 = MemcacheInstanceVersion._(TfArgLiteral('MEMCACHE_1_5'));
    static const memcache1615 = MemcacheInstanceVersion._(TfArgLiteral('MEMCACHE_1_6_15'));

    static const List<MemcacheInstanceVersion> values = [memcache15, memcache1615];
  }

  /// `weekly_maintenance_window.day` on `google_memcache_instance`.
  extension type const MemcacheInstanceWeeklyMaintenanceDay._(TfArg<String> _) implements TfArg<String> {
    MemcacheInstanceWeeklyMaintenanceDay.variable(String name) : this._(TfArg.variable(name));
    MemcacheInstanceWeeklyMaintenanceDay.expression(String template) : this._(TfArg.expression(template));
    const MemcacheInstanceWeeklyMaintenanceDay.arg(TfArg<String> arg) : this._(arg);

    static const dayOfWeekUnspecified = MemcacheInstanceWeeklyMaintenanceDay._(TfArgLiteral('DAY_OF_WEEK_UNSPECIFIED'));
    static const monday = MemcacheInstanceWeeklyMaintenanceDay._(TfArgLiteral('MONDAY'));
    static const tuesday = MemcacheInstanceWeeklyMaintenanceDay._(TfArgLiteral('TUESDAY'));
    static const wednesday = MemcacheInstanceWeeklyMaintenanceDay._(TfArgLiteral('WEDNESDAY'));
    static const thursday = MemcacheInstanceWeeklyMaintenanceDay._(TfArgLiteral('THURSDAY'));
    static const friday = MemcacheInstanceWeeklyMaintenanceDay._(TfArgLiteral('FRIDAY'));
    static const saturday = MemcacheInstanceWeeklyMaintenanceDay._(TfArgLiteral('SATURDAY'));
    static const sunday = MemcacheInstanceWeeklyMaintenanceDay._(TfArgLiteral('SUNDAY'));

    static const List<MemcacheInstanceWeeklyMaintenanceDay> values = [dayOfWeekUnspecified, monday, tuesday, wednesday, thursday, friday, saturday, sunday];
  }

  /// `maintenance_policy.weekly_maintenance_window` nested block.
  class MemcacheInstanceWeeklyMaintenanceWindow {
    const MemcacheInstanceWeeklyMaintenanceWindow({this.day});

    final MemcacheInstanceWeeklyMaintenanceDay? day;

    Map<String, Object?> toArgMap() => {
          if (day != null) 'day': day!.toTfJson(),
        };
  }

  /// `node_config` nested block (required, max=1).
  class MemcacheInstanceNodeConfig {
    const MemcacheInstanceNodeConfig({
      required this.cpuCount,
      required this.memorySizeMb,
    });

    final TfArg<num> cpuCount;
    final TfArg<num> memorySizeMb;

    Map<String, Object?> toArgMap() => {
          'cpu_count': cpuCount.toTfJson(),
          'memory_size_mb': memorySizeMb.toTfJson(),
        };
  }

  /// `maintenance_policy` nested block (max=1).
  class MemcacheInstanceMaintenancePolicy {
    const MemcacheInstanceMaintenancePolicy({this.weeklyMaintenanceWindow});

    final MemcacheInstanceWeeklyMaintenanceWindow? weeklyMaintenanceWindow;

    Map<String, Object?> toArgMap() => {
          if (weeklyMaintenanceWindow != null)
            'weekly_maintenance_window': [weeklyMaintenanceWindow!.toArgMap()],
        };
  }

customSlots:
  node_config:
    paramDeclaration: 'required MemcacheInstanceNodeConfig nodeConfig'
    argMapEntry: "'node_config': TfArg.literal([nodeConfig.toArgMap()]),"
  maintenance_policy:
    paramDeclaration: 'MemcacheInstanceMaintenancePolicy? maintenancePolicy'
    argMapEntry: "if (maintenancePolicy != null) 'maintenance_policy': TfArg.literal([maintenancePolicy.toArgMap()]),"
