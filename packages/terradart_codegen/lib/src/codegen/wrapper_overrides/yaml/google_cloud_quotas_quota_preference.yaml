outputDir: cloud_quotas
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true
deriveEnums: true

extraImports:
  - "import 'package:meta/meta.dart';"

dartTypeOverrides:
  ignore_safety_checks: CloudQuotasQuotaPreferenceIgnoreSafetyChecks

prelude: |
  /// Quota safety checks that may be skipped on create/update.
  extension type const CloudQuotasQuotaPreferenceIgnoreSafetyChecks._(TfArg<String> _) implements TfArg<String> {
    CloudQuotasQuotaPreferenceIgnoreSafetyChecks.variable(String name) : this._(TfArg.variable(name));
    CloudQuotasQuotaPreferenceIgnoreSafetyChecks.expression(String template) : this._(TfArg.expression(template));
    const CloudQuotasQuotaPreferenceIgnoreSafetyChecks.arg(TfArg<String> arg) : this._(arg);

    static const unspecified = CloudQuotasQuotaPreferenceIgnoreSafetyChecks._(TfArgLiteral('QUOTA_SAFETY_CHECK_UNSPECIFIED'));
    static const decreaseBelowUsage = CloudQuotasQuotaPreferenceIgnoreSafetyChecks._(TfArgLiteral('QUOTA_DECREASE_BELOW_USAGE'));
    static const decreasePercentageTooHigh = CloudQuotasQuotaPreferenceIgnoreSafetyChecks._(TfArgLiteral('QUOTA_DECREASE_PERCENTAGE_TOO_HIGH'));

    static const List<CloudQuotasQuotaPreferenceIgnoreSafetyChecks> values = [unspecified, decreaseBelowUsage, decreasePercentageTooHigh];
  }

curatedDoc: |-
  /// Cloud Quotas **quota preference** — preferred quota value for one
  /// service / quota id (optionally dimensioned).
  ///
  /// **Cost / apply:** gcp-cost: no Cloud Billing Catalog SKU after MCP
  /// lookup (`list_services` Cloud Quotas / Quota → empty). billing-behavior:
  /// preference metadata — no existence/hourly charge. Provider MM sets
  /// `exclude_delete: true` — Terraform **cannot destroy** the preference,
  /// so apply-smoke would strand it forever (`never_apply`). Ships without
  /// a quickstart (`tool/example_debt.yaml`).

paramOrder:
  - parent
  - name
  - service
  - quota_id
  - quota_config
  - dimensions
  - contact_email
  - justification
  - ignore_safety_checks
