outputDir: compute

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// Reserves a global (regionless) IP range. Two complementary use cases:
  ///
  /// 1. **HTTP(S) LB VIP** — `addressType: GlobalAddressType.external`,
  ///    `purpose` unset. Allocates a single anycast IPv4 (or IPv6) routed
  ///    across Google's edge.
  /// 2. **Private-services peering range** — `addressType: internal`,
  ///    `purpose: GlobalAddressPurpose.vpcPeering`, `network` pointing at a
  ///    [GoogleComputeNetwork]. Reserves an internal CIDR that
  ///    [GoogleServiceNetworkingConnection] peers with Google's service
  ///    producer VPC (Cloud SQL private IP, Memorystore, etc.).
  ///
  /// Required identity:
  /// - [localName]: Terraform local name (the address segment after
  ///   `google_compute_global_address.`).
  /// - `name`: GCP-internal address resource name. Forces replacement when
  ///   changed.
  ///
  /// Example (Cloud SQL private-IP peering range): see also
  /// [GoogleServiceNetworkingConnection].
  /// ```dart
  /// final psaRange = GoogleComputeGlobalAddress(
  ///   'psa_range',
  ///   name: TfArg.literal('cloudsql-psa-range'),
  ///   addressType: GlobalAddressType.internal,
  ///   purpose: GlobalAddressPurpose.vpcPeering,
  ///   prefixLength: TfArg.literal(16),
  ///   network: vpc.ref,
  /// );
  /// ```
  ///
  /// Example (external LB VIP):
  /// ```dart
  /// final lbVip = GoogleComputeGlobalAddress(
  ///   'lb_vip',
  ///   name: TfArg.literal('global-lb-vip'),
  ///   addressType: GlobalAddressType.external,
  ///   ipVersion: GlobalAddressIpVersion.ipv4,
  /// );
  /// ```

paramOrder:
  - name
  - address_type
  - purpose
  - ip_version
  - address
  - prefix_length
  - network
  - labels
  - description
  - project

dartTypeOverrides:
  address_type: GlobalAddressType
  purpose: GlobalAddressPurpose
  ip_version: GlobalAddressIpVersion

prelude: |
  /// `address_type` for `google_compute_global_address`. Default `external`
  /// (public IP). Use `internal` for in-VPC ranges (private-services
  /// peering, internal load balancer VIPs).
  extension type const GlobalAddressType._(TfArg<String> _) implements TfArg<String> {
    GlobalAddressType.variable(String name) : this._(TfArg.variable(name));
    GlobalAddressType.expression(String template) : this._(TfArg.expression(template));
    const GlobalAddressType.arg(TfArg<String> arg) : this._(arg);

    static const external = GlobalAddressType._(TfArgLiteral('EXTERNAL'));
    static const internal = GlobalAddressType._(TfArgLiteral('INTERNAL'));

    static const List<GlobalAddressType> values = [external, internal];
  }

  /// `purpose` for `google_compute_global_address`. Selects the role the
  /// reserved range plays.
  ///
  /// - [vpcPeering]: the private-services peering use case — reserves an
  ///   internal CIDR on the user's VPC that Google's producer services
  ///   (Cloud SQL private IP, Memorystore, etc) peer into via
  ///   [GoogleServiceNetworkingConnection].
  /// - [privateServiceConnect]: PSC consumer endpoint backing a PSC
  ///   forwarding rule (Beta in MM, GA in the provider).
  extension type const GlobalAddressPurpose._(TfArg<String> _) implements TfArg<String> {
    GlobalAddressPurpose.variable(String name) : this._(TfArg.variable(name));
    GlobalAddressPurpose.expression(String template) : this._(TfArg.expression(template));
    const GlobalAddressPurpose.arg(TfArg<String> arg) : this._(arg);

    static const vpcPeering = GlobalAddressPurpose._(TfArgLiteral('VPC_PEERING'));
    static const privateServiceConnect = GlobalAddressPurpose._(TfArgLiteral('PRIVATE_SERVICE_CONNECT'));

    static const List<GlobalAddressPurpose> values = [vpcPeering, privateServiceConnect];
  }

  /// IP protocol version for the global address. Default `ipv4`.
  extension type const GlobalAddressIpVersion._(TfArg<String> _) implements TfArg<String> {
    GlobalAddressIpVersion.variable(String name) : this._(TfArg.variable(name));
    GlobalAddressIpVersion.expression(String template) : this._(TfArg.expression(template));
    const GlobalAddressIpVersion.arg(TfArg<String> arg) : this._(arg);

    static const ipv4 = GlobalAddressIpVersion._(TfArgLiteral('IPV4'));
    static const ipv6 = GlobalAddressIpVersion._(TfArgLiteral('IPV6'));

    static const List<GlobalAddressIpVersion> values = [ipv4, ipv6];
  }
