    OracleDatabaseCloudExadataInfrastructureDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const OracleDatabaseCloudExadataInfrastructureDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = OracleDatabaseCloudExadataInfrastructureDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = OracleDatabaseCloudExadataInfrastructureDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = OracleDatabaseCloudExadataInfrastructureDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<OracleDatabaseCloudExadataInfrastructureDeletionPolicy> values = [delete, prevent, abandon];
