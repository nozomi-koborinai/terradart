outputDir: dialogflow
enumValues:
  tool.data_store_spec.data_store_connections.data_store_type:
    - PUBLIC_WEB
    - UNSTRUCTURED
    - STRUCTURED
  tool.data_store_spec.data_store_connections.document_processing_mode:
    - DOCUMENTS
    - CHUNKS
  tool.open_api_spec.authentication.api_key_config.request_location:
    - HEADER
    - QUERY_STRING
  tool.open_api_spec.authentication.oauth_config.oauth_grant_type:
    - CLIENT_CREDENTIAL
  tool.open_api_spec.authentication.service_agent_auth_config.service_agent_auth:
    - ID_TOKEN
    - ACCESS_TOKEN

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true
deriveEnums: true

extraImports:
  - "import 'package:meta/meta.dart';"

curatedDoc: |-
  /// Dialogflow CX **tool version** — versioned snapshot of a CX tool.
  ///
  /// **Cost / apply:** gcp-cost: Cloud Dialogflow `FBC0-AA4A-C89A` Text
  /// session SKU `A1CC-751A-CDCC` **$0.20**/session (Audio `9496-0679-69BE`
  /// **$0.45**/session). billing-behavior: tool versions sit on the
  /// never_apply [GoogleDialogflowCxAgent] / tool path. **Never** wire
  /// into apply-smoke.

paramOrder:
  - display_name
  - parent
  - tool
  - deletion_policy
