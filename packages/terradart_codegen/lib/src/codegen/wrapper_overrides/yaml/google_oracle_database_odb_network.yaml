outputDir: oracle

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true
deriveEnums: true

curatedDoc: |-
  /// Oracle Database@Google Cloud ODB network — VPC attachment for ODB subnets.
  ///
  /// Enable `oracledatabase.googleapis.com` before apply. Pair with
  /// [GoogleOracleDatabaseOdbSubnet] under the same [location].

paramOrder:
  - location
  - odb_network_id
  - network
  - gcp_oracle_zone
  - labels
  - deletion_policy
  - deletion_protection
  - project

prelude: |
  /// Terraform `deletion_policy` for ODB networks.
  extension type const OracleDatabaseOdbNetworkDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    OracleDatabaseOdbNetworkDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    OracleDatabaseOdbNetworkDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const OracleDatabaseOdbNetworkDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = OracleDatabaseOdbNetworkDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = OracleDatabaseOdbNetworkDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = OracleDatabaseOdbNetworkDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<OracleDatabaseOdbNetworkDeletionPolicy> values = [delete, prevent, abandon];
  }

dartTypeOverrides:
  deletion_policy: OracleDatabaseOdbNetworkDeletionPolicy

extraGetters: |2
    TfRef<String> get id => TfRef.attribute<String>(this, 'id');
