outputDir: secret_manager
deriveClassDoc: true
deriveOutputGetters: true

paramOrder:
  - secret_id
  - location
  - labels
  - annotations
  - version_aliases
  - version_destroy_ttl
  - expire_time
  - ttl
  - tags
  - deletion_protection
  - project

extraGetters: |2
    TfRef<String> get secretIdRef => TfRef.attribute<String>(this, 'secret_id');
