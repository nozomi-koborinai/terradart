    static const unspecified = DeleteProtectionState._(TfArgLiteral('DELETE_PROTECTION_STATE_UNSPECIFIED'));
    static const enabled = DeleteProtectionState._(TfArgLiteral('DELETE_PROTECTION_ENABLED'));
    static const disabled = DeleteProtectionState._(TfArgLiteral('DELETE_PROTECTION_DISABLED'));

    static const List<DeleteProtectionState> values = [unspecified, enabled, disabled];
  }

  /// `firestore_data_access_mode` -- whether the Firestore document API is
  /// accessible. Only valid for `enterprise` edition. Use to lock down a
