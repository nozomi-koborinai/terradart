  extension type const DeleteProtectionState._(TfArg<String> _) implements TfArg<String> {
    DeleteProtectionState.variable(String name) : this._(TfArg.variable(name));
    DeleteProtectionState.expression(String template) : this._(TfArg.expression(template));
