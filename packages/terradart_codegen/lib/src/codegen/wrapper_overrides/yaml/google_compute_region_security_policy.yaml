    RegionSecurityPolicyType.expression(String template) : this._(TfArg.expression(template));
    const RegionSecurityPolicyType.arg(TfArg<String> arg) : this._(arg);

    static const cloudArmor = RegionSecurityPolicyType._(TfArgLiteral('CLOUD_ARMOR'));
    static const cloudArmorEdge = RegionSecurityPolicyType._(TfArgLiteral('CLOUD_ARMOR_EDGE'));
    static const cloudArmorNetwork = RegionSecurityPolicyType._(TfArgLiteral('CLOUD_ARMOR_NETWORK'));

    static const List<RegionSecurityPolicyType> values = [cloudArmor, cloudArmorEdge, cloudArmorNetwork];
  }

