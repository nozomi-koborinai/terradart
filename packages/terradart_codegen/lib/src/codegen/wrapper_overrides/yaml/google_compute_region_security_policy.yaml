outputDir: compute
deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

dartTypeOverrides:
  type: RegionSecurityPolicyType

paramOrder:
  - description
  - name
  - project
  - region
  - type
  - advanced_options_config
  - ddos_protection_config
  - rules
  - user_defined_fields

extraImports:
