outputDir: migration

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// Migration Center source — ingestion endpoint for discovery or upload data.
  ///
  /// Enable `migrationcenter.googleapis.com` before apply. Pair with
  /// [GoogleMigrationCenterDiscoveryClient] or [GoogleMigrationCenterImportJob].

paramOrder:
  - location
  - source_id
  - display_name
  - description
  - type
  - priority
  - managed
  - deletion_policy
  - project

prelude: |
  /// Terraform `deletion_policy` for Migration Center sources.
  extension type const MigrationCenterSourceDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    MigrationCenterSourceDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    MigrationCenterSourceDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const MigrationCenterSourceDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = MigrationCenterSourceDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = MigrationCenterSourceDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = MigrationCenterSourceDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<MigrationCenterSourceDeletionPolicy> values = [delete, prevent, abandon];
  }

  /// Data source type for `google_migration_center_source.type`.
  extension type const MigrationCenterSourceType._(TfArg<String> _) implements TfArg<String> {
    MigrationCenterSourceType.variable(String name) : this._(TfArg.variable(name));
    MigrationCenterSourceType.expression(String template) : this._(TfArg.expression(template));
    const MigrationCenterSourceType.arg(TfArg<String> arg) : this._(arg);

    static const sourceTypeUnknown = MigrationCenterSourceType._(TfArgLiteral('SOURCE_TYPE_UNKNOWN'));
    static const sourceTypeUpload = MigrationCenterSourceType._(TfArgLiteral('SOURCE_TYPE_UPLOAD'));
    static const sourceTypeGuestOsScan = MigrationCenterSourceType._(TfArgLiteral('SOURCE_TYPE_GUEST_OS_SCAN'));
    static const sourceTypeInventoryScan = MigrationCenterSourceType._(TfArgLiteral('SOURCE_TYPE_INVENTORY_SCAN'));
    static const sourceTypeCustom = MigrationCenterSourceType._(TfArgLiteral('SOURCE_TYPE_CUSTOM'));
    static const sourceTypeDiscoveryClient = MigrationCenterSourceType._(TfArgLiteral('SOURCE_TYPE_DISCOVERY_CLIENT'));

    static const List<MigrationCenterSourceType> values = [sourceTypeUnknown, sourceTypeUpload, sourceTypeGuestOsScan, sourceTypeInventoryScan, sourceTypeCustom, sourceTypeDiscoveryClient];
  }

dartTypeOverrides:
  deletion_policy: MigrationCenterSourceDeletionPolicy
  type: MigrationCenterSourceType
