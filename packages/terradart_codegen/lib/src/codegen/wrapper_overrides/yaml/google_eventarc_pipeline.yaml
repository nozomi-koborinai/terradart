outputDir: eventarc
deriveClassDoc: true
deriveOutputGetters: true

extraImports:
  - "import 'package:terradart_google/src/eventarc/google_eventarc_message_bus.dart' show EventarcMessageBusLoggingConfig;"

customSlots:
  logging_config:
    paramDeclaration: 'EventarcMessageBusLoggingConfig? loggingConfig'
    argMapEntry: "if (loggingConfig != null) 'logging_config': TfArg.literal([loggingConfig.encode()]),"

paramOrder:
  - annotations
  - crypto_key_name
  - display_name
  - labels
  - location
  - pipeline_id
  - project
  - destinations
  - input_payload_format
  - logging_config
  - mediations
  - retry_policy
