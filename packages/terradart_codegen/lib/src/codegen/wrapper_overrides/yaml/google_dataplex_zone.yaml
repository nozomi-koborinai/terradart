outputDir: dataplex
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveEnums: true
deriveNestedTypes: true

extraImports:
  - "import 'package:meta/meta.dart';"

curatedDoc: |-
  /// A zone within a [GoogleDataplexLake] — a logical partition for curated or
  /// raw data assets. Requires [discoverySpec] and [resourceSpec] blocks.

dartTypeOverrides:
  type: DataplexZoneType

prelude: |
  /// `type` on `google_dataplex_zone`.
  extension type const DataplexZoneType._(TfArg<String> _) implements TfArg<String> {
    DataplexZoneType.variable(String name) : this._(TfArg.variable(name));
    DataplexZoneType.expression(String template) : this._(TfArg.expression(template));
    const DataplexZoneType.arg(TfArg<String> arg) : this._(arg);

    static const typeUnspecified = DataplexZoneType._(TfArgLiteral('TYPE_UNSPECIFIED'));
    static const raw = DataplexZoneType._(TfArgLiteral('RAW'));
    static const curated = DataplexZoneType._(TfArgLiteral('CURATED'));

    static const List<DataplexZoneType> values = [typeUnspecified, raw, curated];
  }

paramOrder:
  - name
  - lake
  - location
  - type
  - display_name
  - description
  - discovery_spec
  - resource_spec
  - labels
  - deletion_policy
  - project
