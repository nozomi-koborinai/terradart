outputDir: firebase_data_connect

deriveClassDoc: true
deriveExactlyOne: true
curatedDoc: |-
  /// Required identity:
  /// - [localName]: Terraform local name (the address segment after
  ///   `google_firebase_data_connect_service.`).
  /// - `service_id`: stable user-chosen identifier. Becomes the final
  ///   segment of the service's full resource name. Note (per the schema's
  ///   own warning): this ID is specific to the Data Connect service itself
  ///   and is NOT the ID of the underlying Cloud SQL instance.
  /// - `location`: GCP region (e.g. `'us-central1'`, `'asia-east1'`).
  ///
  /// Example:
  /// ```dart
  /// final svc = GoogleFirebaseDataConnectService(
  ///   'web',
  ///   serviceId: TfArg.literal('web-svc'),
  ///   location: TfArg.literal('us-central1'),
  ///   displayName: TfArg.literal('Web app data connect'),
  /// );
  /// ```
  ///
  /// Setting [deletionPolicy] to [DataConnectDeletionPolicy.force] allows
  /// `terraform destroy` to remove the service even when downstream
  /// schemas / connectors still exist; the default leaves the service in
  /// place if any are present.

# `service_id` + `location` are required identity; `deletion_policy` is a
# destroy-safety knob that materially affects apply behavior, so it comes
# right after identity. `display_name` (mutable label) and the two
# annotation / label maps follow before the standard `project` tail.
# Computed-only attrs (`create_time`, `effective_annotations`,
# `effective_labels`, `etag`, `name`, `reconciling`, `terraform_labels`,
# `uid`, `update_time`) and `id` are filtered by the emitter; `timeouts` is
# the Terraform meta-arg and is also filtered. Each name below is a real
# input slot in the schema -- verified entry-by-entry per the Round 2
# paramOrder anti-hallucination check.
paramOrder:
  - service_id
  - location
  - deletion_policy
  - display_name
  - annotations
  - labels
  - project

deriveNestedTypes: true
deriveOutputGetters: true
dartTypeOverrides:
  deletion_policy: DataConnectDeletionPolicy

prelude: |
  // ===========================================================================
  // Enums (sourced from schema "Possible values" prose)
  // ===========================================================================

  /// `deletion_policy` -- behaviour of `terraform destroy` when downstream
  /// Data Connect schemas / connectors still exist. [defaultPolicy] (the
  /// schema default) refuses to delete the service while any are present;
  /// [force] tears the service down regardless.
  extension type const DataConnectDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    DataConnectDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    DataConnectDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const DataConnectDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const defaultPolicy = DataConnectDeletionPolicy._(TfArgLiteral('DEFAULT'));
    static const force = DataConnectDeletionPolicy._(TfArgLiteral('FORCE'));

    static const List<DataConnectDeletionPolicy> values = [defaultPolicy, force];
  }
