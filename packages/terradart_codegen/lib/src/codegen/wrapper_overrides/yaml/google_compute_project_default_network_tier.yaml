outputDir: compute

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true
# Schema prose uses "following values: PREMIUM or STANDARD" (not MM
# "Possible values: […]"), so deriveEnums cannot emit — hand-write the
# enum in prelude.
deriveEnums: false

dartTypeOverrides:
  network_tier: ComputeProjectDefaultNetworkTier

prelude: |
  /// Default network service tier for new external IPs in the project.
  /// `PREMIUM` uses Google's global backbone; `STANDARD` is regional/ISP.
  extension type const ComputeProjectDefaultNetworkTier._(TfArg<String> _) implements TfArg<String> {
    ComputeProjectDefaultNetworkTier.variable(String name) : this._(TfArg.variable(name));
    ComputeProjectDefaultNetworkTier.expression(String template) : this._(TfArg.expression(template));
    const ComputeProjectDefaultNetworkTier.arg(TfArg<String> arg) : this._(arg);

    static const premium = ComputeProjectDefaultNetworkTier._(TfArgLiteral('PREMIUM'));
    static const standard = ComputeProjectDefaultNetworkTier._(TfArgLiteral('STANDARD'));

    static const List<ComputeProjectDefaultNetworkTier> values = [premium, standard];
  }

curatedDoc: |-
  /// Project-level **Compute Engine default network tier** — a singleton
  /// that sets `PREMIUM` or `STANDARD` as the default for new external IP
  /// addresses in the project.
  ///
  /// This resource is free project metadata. Prefer
  /// [ComputeProjectDefaultNetworkTier.standard] in smoke stacks when you
  /// want the cheaper regional default; `PREMIUM` is Google's usual
  /// project default.
  ///
  /// Enable `compute.googleapis.com` via [GoogleProjectService] before apply.
  ///
  /// Example:
  /// ```dart
  /// GoogleComputeProjectDefaultNetworkTier(
  ///   'defaults',
  ///   networkTier: ComputeProjectDefaultNetworkTier.standard,
  /// );
  /// ```

paramOrder:
  - network_tier
  - project
