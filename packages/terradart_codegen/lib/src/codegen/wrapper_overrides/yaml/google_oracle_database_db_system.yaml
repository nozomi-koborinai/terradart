outputDir: oracle

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true
deriveEnums: true

curatedDoc: |-
  /// Oracle Base Database DB System on Oracle Database@Google Cloud.
  ///
  /// Enable `oracledatabase.googleapis.com` before apply. Requires
  /// [odb_subnet] (and typically [GoogleOracleDatabaseOdbSubnet] refs) plus
  /// [properties] with shape, edition, license model, and SSH public keys.

paramOrder:
  - location
  - db_system_id
  - display_name
  - odb_subnet
  - properties
  - odb_network
  - gcp_oracle_zone
  - labels
  - deletion_policy
  - deletion_protection
  - project

prelude: |
  /// Terraform `deletion_policy` for DB Systems.
  extension type const OracleDatabaseDbSystemDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    OracleDatabaseDbSystemDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    OracleDatabaseDbSystemDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const OracleDatabaseDbSystemDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = OracleDatabaseDbSystemDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = OracleDatabaseDbSystemDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = OracleDatabaseDbSystemDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<OracleDatabaseDbSystemDeletionPolicy> values = [delete, prevent, abandon];
  }

  /// DB System database edition.
  extension type const OracleDatabaseDbSystemDatabaseEdition._(TfArg<String> _) implements TfArg<String> {
    OracleDatabaseDbSystemDatabaseEdition.variable(String name) : this._(TfArg.variable(name));
    OracleDatabaseDbSystemDatabaseEdition.expression(String template) : this._(TfArg.expression(template));
    const OracleDatabaseDbSystemDatabaseEdition.arg(TfArg<String> arg) : this._(arg);

    static const standardEdition = OracleDatabaseDbSystemDatabaseEdition._(TfArgLiteral('STANDARD_EDITION'));
    static const enterpriseEdition = OracleDatabaseDbSystemDatabaseEdition._(TfArgLiteral('ENTERPRISE_EDITION'));

    static const List<OracleDatabaseDbSystemDatabaseEdition> values = [standardEdition, enterpriseEdition];
  }

  /// DB System license model.
  extension type const OracleDatabaseDbSystemLicenseModel._(TfArg<String> _) implements TfArg<String> {
    OracleDatabaseDbSystemLicenseModel.variable(String name) : this._(TfArg.variable(name));
    OracleDatabaseDbSystemLicenseModel.expression(String template) : this._(TfArg.expression(template));
    const OracleDatabaseDbSystemLicenseModel.arg(TfArg<String> arg) : this._(arg);

    static const licenseIncluded = OracleDatabaseDbSystemLicenseModel._(TfArgLiteral('LICENSE_INCLUDED'));
    static const bringYourOwnLicense = OracleDatabaseDbSystemLicenseModel._(TfArgLiteral('BRING_YOUR_OWN_LICENSE'));

    static const List<OracleDatabaseDbSystemLicenseModel> values = [licenseIncluded, bringYourOwnLicense];
  }

dartTypeOverrides:
  deletion_policy: OracleDatabaseDbSystemDeletionPolicy
  properties.database_edition: OracleDatabaseDbSystemDatabaseEdition
  properties.license_model: OracleDatabaseDbSystemLicenseModel

extraGetters: |2
    TfRef<String> get id => TfRef.attribute<String>(this, 'id');
