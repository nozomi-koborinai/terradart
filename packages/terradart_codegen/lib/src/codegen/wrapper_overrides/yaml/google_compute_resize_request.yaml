outputDir: compute

deriveClassDoc: true
deriveOutputGetters: true
deriveNestedTypes: true
deriveEnums: true

extraImports:
  - "import 'package:meta/meta.dart';"

curatedDoc: |-
  /// Compute Engine **zonal MIG resize request** — Dynamic Workload
  /// Scheduler Flex Start capacity ask against a zonal managed instance
  /// group (typically GPU shapes). Zonal sibling of
  /// [GoogleComputeRegionResizeRequest].
  ///
  /// **Cost / apply:** When DWS fulfills the request it provisions GPU VMs.
  /// Cloud Billing Catalog service `6F81-5844-456A` bills those GPU-hours
  /// (e.g. On Demand Nvidia H100 80GB GPU Sao Paulo SKU `0526-B904-9D8B`
  /// **$15.55594/h**). Requires a DWS-compatible MIG
  /// (`requested_run_duration`); not applicable on terradart-validate e2
  /// topology. Ships `never_apply` / `tool/example_debt.yaml`.

paramOrder:
  - name
  - zone
  - instance_group_manager
  - resize_by
  - description
  - requested_run_duration
  - deletion_policy
  - project

extraGetters: |2
    /// Reference to `name` attribute.
    TfRef<String> get nameRef => TfRef.attribute<String>(this, 'name');
