outputDir: bigtable

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// Cloud Bigtable table within an instance.
  ///
  /// Required identity:
  /// - [localName]: Terraform local name.
  /// - [instanceName]: parent instance ID — pass `instance.name`.
  /// - [name]: table ID (1-50 chars, hyphens, underscores, letters).
  /// - [columnFamily]: at least one [BigtableTableColumnFamily].
  ///
  /// Example:
  /// ```dart
  /// GoogleBigtableTable(
  ///   'events',
  ///   instanceName: instance.ref,
  ///   name: TfArg.literal('events'),
  ///   columnFamily: [
  ///     BigtableTableColumnFamily(family: TfArg.literal('cf1')),
  ///   ],
  /// );
  /// ```

paramOrder:
  - instance_name
  - name
  - column_family
  - automated_backup_policy
  - deletion_policy
  - deletion_protection
  - change_stream_retention
  - project

prelude: |
  /// One `column_family` block on `google_bigtable_table`.
  class BigtableTableColumnFamily {
    const BigtableTableColumnFamily({required this.family});

    final TfArg<String> family;

    Map<String, Object?> toArgMap() => {
          'family': family.toTfJson(),
        };
  }

customSlots:
  column_family:
    paramDeclaration: 'List<BigtableTableColumnFamily>? columnFamily'
    argMapEntry: "if (columnFamily != null) 'column_family': TfArg.literal(columnFamily.map((c) => c.toArgMap()).toList()),"
