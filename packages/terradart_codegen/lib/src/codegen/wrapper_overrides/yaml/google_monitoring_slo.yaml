outputDir: monitoring
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

curatedDoc: |-
  /// Service-level objective on a [GoogleMonitoringService]. `sli` is sealed:
  /// exactly one of `.basicSli(...)`, `.requestBasedSli(...)` or
  /// `.windowsBasedSli(...)`; `period` is `.rollingPeriodDays(...)` or
  /// `.calendarPeriod(...)`.
  ///
  /// Example (availability basic SLI):
  /// ```dart
  /// GoogleMonitoringSlo(
  ///   'api_availability',
  ///   service: apiService.name,
  ///   goal: .literal(0.99),
  ///   displayName: .literal('API availability'),
  ///   period: .rollingPeriodDays(.literal(30)),
  ///   sli: .basicSli(
  ///     .new(
  ///       objective: .availability(
  ///         .new(enabled: .literal(true)),
  ///       ),
  ///     ),
  ///   ),
  /// );
  /// ```

dartTypeOverrides:
  calendar_period: MonitoringSloCalendarPeriod

paramOrder:
  - service
  - goal
  - display_name
  - basic_sli
  - request_based_sli
  - windows_based_sli
  - calendar_period
  - rolling_period_days
  - slo_id
  - user_labels
  - project

argMapOrder:
  - service
  - goal
  - display_name
  - calendar_period
  - rolling_period_days
  - slo_id
  - user_labels
  - project
  - basic_sli
  - request_based_sli
  - windows_based_sli

prelude: |
  extension type const MonitoringSloCalendarPeriod._(TfArg<String> _) implements TfArg<String> {
    MonitoringSloCalendarPeriod.variable(String name) : this._(TfArg.variable(name));
    MonitoringSloCalendarPeriod.expression(String template) : this._(TfArg.expression(template));
    const MonitoringSloCalendarPeriod.arg(TfArg<String> arg) : this._(arg);

    static const day = MonitoringSloCalendarPeriod._(TfArgLiteral('DAY'));
    static const week = MonitoringSloCalendarPeriod._(TfArgLiteral('WEEK'));
    static const fortnight = MonitoringSloCalendarPeriod._(TfArgLiteral('FORTNIGHT'));
    static const month = MonitoringSloCalendarPeriod._(TfArgLiteral('MONTH'));

    static const List<MonitoringSloCalendarPeriod> values = [day, week, fortnight, month];
  }

sealedNames:
  "calendar_period, rolling_period_days": period
  "basic_sli.availability, basic_sli.latency": objective
  "windows_based_sli.good_bad_metric_filter, windows_based_sli.good_total_ratio_threshold, windows_based_sli.metric_mean_in_range, windows_based_sli.metric_sum_in_range": criterion
  "windows_based_sli.good_total_ratio_threshold.basic_sli_performance, windows_based_sli.good_total_ratio_threshold.performance": measure
  "windows_based_sli.good_total_ratio_threshold.basic_sli_performance.availability, windows_based_sli.good_total_ratio_threshold.basic_sli_performance.latency": objective
