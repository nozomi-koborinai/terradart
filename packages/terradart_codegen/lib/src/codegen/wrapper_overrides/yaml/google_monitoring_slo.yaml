outputDir: monitoring
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

curatedDoc: |-
  /// Service-level objective on a [GoogleMonitoringService]. `sli` is sealed:
  /// exactly one of `.basicSli(...)`, `.requestBasedSli(...)` or
  /// `.windowsBasedSli(...)`; `period` is `.rollingPeriodDays(...)` or
  /// `.calendarPeriod(...)`.
  ///
  /// Example (availability basic SLI):
  /// ```dart
  /// GoogleMonitoringSlo(
  ///   localName: 'api_availability',
  ///   service: .ref(apiService.nameRef),
  ///   goal: .literal(0.99),
  ///   displayName: .literal('API availability'),
  ///   period: .rollingPeriodDays(.literal(30)),
  ///   sli: .basicSli(
  ///     MonitoringSloBasicSli(
  ///       objective: .availability(
  ///         MonitoringSloBasicSliAvailability(enabled: .literal(true)),
  ///       ),
  ///     ),
  ///   ),
  /// );
  /// ```

dartTypeOverrides:
  calendar_period: MonitoringSloCalendarPeriod

paramOrder:
  - service
  - goal
  - display_name
  - basic_sli
  - request_based_sli
  - windows_based_sli
  - calendar_period
  - rolling_period_days
  - slo_id
  - user_labels
  - project

argMapOrder:
  - service
  - goal
  - display_name
  - calendar_period
  - rolling_period_days
  - slo_id
  - user_labels
  - project
  - basic_sli
  - request_based_sli
  - windows_based_sli

prelude: |
  enum MonitoringSloCalendarPeriod implements TerraformEnum {
    day('DAY'),
    week('WEEK'),
    fortnight('FORTNIGHT'),
    month('MONTH');

    const MonitoringSloCalendarPeriod(this.terraformValue);
    @override
    final String terraformValue;
  }

sealedNames:
  "calendar_period, rolling_period_days": period
  "basic_sli.availability, basic_sli.latency": objective
  "windows_based_sli.good_bad_metric_filter, windows_based_sli.good_total_ratio_threshold, windows_based_sli.metric_mean_in_range, windows_based_sli.metric_sum_in_range": criterion
  "windows_based_sli.good_total_ratio_threshold.basic_sli_performance, windows_based_sli.good_total_ratio_threshold.performance": measure
  "windows_based_sli.good_total_ratio_threshold.basic_sli_performance.availability, windows_based_sli.good_total_ratio_threshold.basic_sli_performance.latency": objective
