outputDir: migration

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// Migration Center assessment report generated from a [GoogleMigrationCenterReportConfig].
  ///
  /// Set [reportConfig] to the report config **id segment** (e.g.
  /// `TfArg.literal('my-report-config')`), not the full resource name —
  /// same path-ID pattern as [GoogleMigrationCenterImportDataFile.importJob].
  /// Always set [type] (API rejects `TYPE_UNSPECIFIED`).

paramOrder:
  - location
  - report_config
  - report_id
  - type
  - display_name
  - description
  - deletion_policy
  - project

prelude: |
  /// Terraform `deletion_policy` for Migration Center reports.
  extension type const MigrationCenterReportDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    MigrationCenterReportDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    MigrationCenterReportDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const MigrationCenterReportDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = MigrationCenterReportDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = MigrationCenterReportDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = MigrationCenterReportDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<MigrationCenterReportDeletionPolicy> values = [delete, prevent, abandon];
  }

  /// Report type for `google_migration_center_report.type`.
  ///
  /// Required at apply time — the API rejects the default `TYPE_UNSPECIFIED`.
  extension type const MigrationCenterReportType._(TfArg<String> _) implements TfArg<String> {
    MigrationCenterReportType.variable(String name) : this._(TfArg.variable(name));
    MigrationCenterReportType.expression(String template) : this._(TfArg.expression(template));
    const MigrationCenterReportType.arg(TfArg<String> arg) : this._(arg);

    static const totalCostOfOwnership = MigrationCenterReportType._(TfArgLiteral('TOTAL_COST_OF_OWNERSHIP'));

    static const List<MigrationCenterReportType> values = [totalCostOfOwnership];
  }

dartTypeOverrides:
  deletion_policy: MigrationCenterReportDeletionPolicy
  type: MigrationCenterReportType
