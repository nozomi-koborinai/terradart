outputDir: managed
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true
deriveEnums: true

extraImports:
  - "import 'package:meta/meta.dart';"

curatedDoc: |-
  /// Kafka Connect **connector** on a [GoogleManagedKafkaConnectCluster].
  ///
  /// **Cost:** no separate Cloud Billing Catalog SKU — connector config on
  /// the parent Connect cluster (Connect DCU bills). Deferred with Connect
  /// (no apply-smoke quickstart).
  ///
  /// Example:
  /// ```dart
  /// final connect = add(GoogleManagedKafkaConnectCluster(
  ///   'connect',
  ///   connectClusterId: .literal('connect'),
  ///   kafkaCluster: .literal('kafka'),
  ///   location: .literal('us-central1'),
  ///   capacityConfig: ManagedKafkaConnectClusterCapacityConfig(
  ///     memoryBytes: .literal('3221225472'),
  ///     vcpuCount: .literal('3'),
  ///   ),
  ///   gcpConfig: ManagedKafkaConnectClusterGcpConfig(
  ///     accessConfig: .new(
  ///       networkConfigs: [
  ///         .new(primarySubnet: .literal('subnet')),
  ///       ],
  ///     ),
  ///   ),
  /// ));
  /// GoogleManagedKafkaConnector(
  ///   'sink',
  ///   connectorId: TfArg.literal('gcs-sink'),
  ///   connectCluster: connect.connectClusterId,
  ///   location: TfArg.literal('us-central1'),
  ///   configs: TfArg.literal({
  ///     'connector.class': 'com.example.SinkConnector',
  ///     'tasks.max': '1',
  ///   }),
  /// );
  /// ```

paramOrder:
  - connector_id
  - connect_cluster
  - location
  - configs
  - task_restart_policy
  - deletion_policy
  - project
