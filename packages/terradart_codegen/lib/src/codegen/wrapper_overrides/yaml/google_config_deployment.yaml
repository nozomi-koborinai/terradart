outputDir: config

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// Infrastructure Manager deployment — actuates a Terraform blueprint from
  /// GCS or a public Git repository using a dedicated service account.
  ///
  /// Enable `config.googleapis.com` via [GoogleProjectService] before apply.
  /// The actuation service account needs `roles/config.agent` (and any roles
  /// required by resources in the blueprint).
  ///
  /// Example (Git blueprint):
  /// ```dart
  /// GoogleConfigDeployment(
  ///   'vpc',
  ///   name: TfArg.literal('my-vpc-deployment'),
  ///   location: TfArg.literal('us-central1'),
  ///   serviceAccount: RefTo.literal(
  ///     'projects/my-project/serviceAccounts/im-sa@my-project.iam.gserviceaccount.com',
  ///   ),
  ///   terraformBlueprint: ConfigDeploymentTerraformBlueprint(
  ///     source: .gitSource(
  ///       .new(
  ///         repo: .literal(
  ///           'https://github.com/terraform-google-modules/terraform-google-network',
  ///         ),
  ///         directory: .literal('modules/vpc'),
  ///         ref: .literal('main'),
  ///       ),
  ///     ),
  ///     inputValues: [
  ///       .new(
  ///         variableName: .literal('project_id'),
  ///         inputValue: .literal('"my-project"'),
  ///       ),
  ///     ],
  ///   ),
  /// );
  /// ```

paramOrder:
  - location
  - name
  - service_account
  - terraform_blueprint
  - labels
  - annotations
  - tf_version_constraint
  - artifacts_gcs_bucket
  - worker_pool
  - import_existing_resources
  - quota_validation
  - force_destroy
  - deletion_policy
  - project

extraImports:
  - "import 'package:meta/meta.dart';"

dartTypeOverrides:
  deletion_policy: ConfigDeploymentDeletionPolicy
  quota_validation: ConfigDeploymentQuotaValidation

prelude: |
  /// Terraform `deletion_policy` for Infrastructure Manager deployments.
  extension type const ConfigDeploymentDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    ConfigDeploymentDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    ConfigDeploymentDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const ConfigDeploymentDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = ConfigDeploymentDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = ConfigDeploymentDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = ConfigDeploymentDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<ConfigDeploymentDeletionPolicy> values = [delete, prevent, abandon];
  }

  /// Quota validation mode for `google_config_deployment.quota_validation`.
  extension type const ConfigDeploymentQuotaValidation._(TfArg<String> _) implements TfArg<String> {
    ConfigDeploymentQuotaValidation.variable(String name) : this._(TfArg.variable(name));
    ConfigDeploymentQuotaValidation.expression(String template) : this._(TfArg.expression(template));
    const ConfigDeploymentQuotaValidation.arg(TfArg<String> arg) : this._(arg);

    static const enabled = ConfigDeploymentQuotaValidation._(TfArgLiteral('ENABLED'));
    static const enforced = ConfigDeploymentQuotaValidation._(TfArgLiteral('ENFORCED'));

    static const List<ConfigDeploymentQuotaValidation> values = [enabled, enforced];
  }
