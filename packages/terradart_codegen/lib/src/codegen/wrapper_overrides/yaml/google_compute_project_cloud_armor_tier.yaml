outputDir: compute

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true
# Hand-write the enum so the factory type name stays
# `ComputeProjectCloudArmorTier` (deriveEnums would emit the awkward
# `ComputeProjectCloudArmorTierCloudArmorTier`).
deriveEnums: false

dartTypeOverrides:
  cloud_armor_tier: ComputeProjectCloudArmorTier

prelude: |
  /// Cloud Armor managed protection tier for the project.
  /// Prefer [caStandard] in smoke stacks — Enterprise Annual bills ~$3000/mo.
  extension type const ComputeProjectCloudArmorTier._(TfArg<String> _) implements TfArg<String> {
    ComputeProjectCloudArmorTier.variable(String name) : this._(TfArg.variable(name));
    ComputeProjectCloudArmorTier.expression(String template) : this._(TfArg.expression(template));
    const ComputeProjectCloudArmorTier.arg(TfArg<String> arg) : this._(arg);

    static const caStandard = ComputeProjectCloudArmorTier._(TfArgLiteral('CA_STANDARD'));
    static const caEnterprisePaygo = ComputeProjectCloudArmorTier._(TfArgLiteral('CA_ENTERPRISE_PAYGO'));
    static const caEnterpriseAnnual = ComputeProjectCloudArmorTier._(TfArgLiteral('CA_ENTERPRISE_ANNUAL'));

    static const List<ComputeProjectCloudArmorTier> values = [caStandard, caEnterprisePaygo, caEnterpriseAnnual];
  }

curatedDoc: |-
  /// Project-level **Cloud Armor managed protection tier** — a singleton that
  /// sets `CA_STANDARD`, `CA_ENTERPRISE_PAYGO`, or `CA_ENTERPRISE_ANNUAL`.
  ///
  /// Prefer [ComputeProjectCloudArmorTier.caStandard] in smoke stacks.
  /// Do **not** set Enterprise tiers in apply-smoke: Cloud Armor Enterprise
  /// Annual bills ~$3000/mo (SKU EFB7-4299-A2EC). `CA_STANDARD` is the free
  /// / pay-as-you-go security-policy tier (no Enterprise subscription SKU).
  ///
  /// Terraform create/update call `setCloudArmorTier`; destroy is state-only
  /// (`only_remove_from_state` upstream) and leaves the GCP tier in place.
  ///
  /// Enable `compute.googleapis.com` via [GoogleProjectService] before apply.
  ///
  /// Example:
  /// ```dart
  /// GoogleComputeProjectCloudArmorTier(
  ///   'armor_tier',
  ///   cloudArmorTier: ComputeProjectCloudArmorTier.caStandard,
  /// );
  /// ```

paramOrder:
  - cloud_armor_tier
  - deletion_policy
  - project
