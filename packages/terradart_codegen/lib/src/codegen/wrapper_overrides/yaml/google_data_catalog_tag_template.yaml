outputDir: data_catalog
deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

extraImports:
  - "import 'package:meta/meta.dart';"

curatedDoc: |-
  /// Data Catalog **tag template** — defines typed fields that
  /// `google_data_catalog_tag` instances fill in (legacy Data Catalog API).
  /// Supply at least one [fields] entry; each field picks exactly one
  /// [DataCatalogTagTemplateFieldType] (primitive or enum).
  ///
  /// Example:
  /// ```dart
  /// GoogleDataCatalogTagTemplate(
  ///   'demo',
  ///   tagTemplateId: TfArg.literal('terradart_template'),
  ///   region: TfArg.literal('us-central1'),
  ///   displayName: TfArg.literal('Demo Tag Template'),
  ///   fields: [
  ///     DataCatalogTagTemplateField(
  ///       fieldId: TfArg.literal('source'),
  ///       displayName: TfArg.literal('Source of data asset'),
  ///       isRequired: TfArg.literal(true),
  ///       type: .primitiveType(.string),
  ///     ),
  ///   ],
  ///   forceDelete: TfArg.literal(true),
  /// );
  /// ```

prelude: |
  /// Primitive field types for [DataCatalogTagTemplatePrimitiveFieldType].
  extension type const DataCatalogTagTemplatePrimitiveType._(TfArg<String> _) implements TfArg<String> {
    DataCatalogTagTemplatePrimitiveType.variable(String name) : this._(TfArg.variable(name));
    DataCatalogTagTemplatePrimitiveType.expression(String template) : this._(TfArg.expression(template));
    const DataCatalogTagTemplatePrimitiveType.arg(TfArg<String> arg) : this._(arg);

    static const doubleType = DataCatalogTagTemplatePrimitiveType._(TfArgLiteral('DOUBLE'));
    static const string = DataCatalogTagTemplatePrimitiveType._(TfArgLiteral('STRING'));
    static const boolType = DataCatalogTagTemplatePrimitiveType._(TfArgLiteral('BOOL'));
    static const timestamp = DataCatalogTagTemplatePrimitiveType._(TfArgLiteral('TIMESTAMP'));
    static const richtext = DataCatalogTagTemplatePrimitiveType._(TfArgLiteral('RICHTEXT'));

    static const List<DataCatalogTagTemplatePrimitiveType> values = [doubleType, string, boolType, timestamp, richtext];
  }

  /// Field value type — exactly one of primitive / enum.
  sealed class DataCatalogTagTemplateFieldType {
    const DataCatalogTagTemplateFieldType();

    /// `type.primitive_type` variant.
    const factory DataCatalogTagTemplateFieldType.primitiveType(
      DataCatalogTagTemplatePrimitiveType primitiveType,
    ) = DataCatalogTagTemplatePrimitiveFieldType;

    /// `type.enum_type` variant.
    const factory DataCatalogTagTemplateFieldType.enumType({
      required List<DataCatalogTagTemplateEnumAllowedValue> allowedValues,
    }) = DataCatalogTagTemplateEnumFieldType;
    @internal
    Map<String, Object?> encode();
  }

  /// `type.primitive_type` variant.
  @immutable
  final class DataCatalogTagTemplatePrimitiveFieldType
      extends DataCatalogTagTemplateFieldType {
    const DataCatalogTagTemplatePrimitiveFieldType(this.primitiveType);
    final DataCatalogTagTemplatePrimitiveType primitiveType;

    @override
    @internal
    Map<String, Object?> encode() => {
          'primitive_type': primitiveType.toTfJson(),
        };
  }

  /// One allowed value inside an enum field type.
  @immutable
  final class DataCatalogTagTemplateEnumAllowedValue {
    const DataCatalogTagTemplateEnumAllowedValue({required this.displayName});
    final TfArg<String> displayName;

    @internal
    Map<String, Object?> encode() => {
          'display_name': displayName.toTfJson(),
        };
  }

  /// `type.enum_type` variant.
  @immutable
  final class DataCatalogTagTemplateEnumFieldType
      extends DataCatalogTagTemplateFieldType {
    const DataCatalogTagTemplateEnumFieldType({required this.allowedValues});
    final List<DataCatalogTagTemplateEnumAllowedValue> allowedValues;

    @override
    @internal
    Map<String, Object?> encode() => {
          'enum_type': [
            {
              'allowed_values': [
                for (final v in allowedValues) v.encode(),
              ],
            },
          ],
        };
  }

  /// One entry in the tag template `fields` set.
  @immutable
  final class DataCatalogTagTemplateField {
    const DataCatalogTagTemplateField({
      required this.fieldId,
      required this.type,
      this.displayName,
      this.description,
      this.isRequired,
      this.order,
    });

    final TfArg<String> fieldId;
    final DataCatalogTagTemplateFieldType type;
    final TfArg<String>? displayName;
    final TfArg<String>? description;
    final TfArg<bool>? isRequired;
    final TfArg<num>? order;

    @internal
    Map<String, Object?> encode() => {
          'field_id': fieldId.toTfJson(),
          'type': [type.encode()],
          if (displayName != null) 'display_name': displayName!.toTfJson(),
          if (description != null) 'description': description!.toTfJson(),
          if (isRequired != null) 'is_required': isRequired!.toTfJson(),
          if (order != null) 'order': order!.toTfJson(),
        };
  }

customSlots:
  fields:
    paramDeclaration: 'required List<DataCatalogTagTemplateField> fields'
    argMapEntry: "'fields': TfArg.literal([for (final f in fields) f.encode()]),"

paramOrder:
  - tag_template_id
  - fields
  - display_name
  - region
  - project
  - force_delete
  - deletion_policy
