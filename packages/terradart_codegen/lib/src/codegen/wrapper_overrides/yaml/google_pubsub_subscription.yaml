outputDir: pubsub
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

curatedDoc: |-
  /// Pass `topic` as the full topic path via `TfArg.ref(otherTopic.id)`
  /// (NOT `topic.nameRef`) so it resolves to
  /// `projects/{project}/topics/{name}`.
  ///
  /// Example (push subscription):
  /// ```dart
  /// final push = GooglePubsubSubscription(
  ///   localName: 'orders_push',
  ///   name: .literal('orders-push'),
  ///   topic: .of(orders),
  ///   delivery: .pushConfig(
  ///     PubsubSubscriptionPushConfig(
  ///       pushEndpoint: .literal('https://app.example.com/push'),
  ///     ),
  ///   ),
  /// );
  /// ```

paramOrder:
  - name
  - topic
  - labels
  - bigquery_config
  - cloud_storage_config
  - push_config
  - ack_deadline_seconds
  - message_retention_duration
  - retain_acked_messages
  - expiration_policy
  - filter
  - dead_letter_policy
  - retry_policy
  - enable_message_ordering
  - enable_exactly_once_delivery
  - message_transforms
  - tags
  - project

dartTypeOverrides:
  ack_deadline_seconds: int

extraImports:
  - "import 'package:meta/meta.dart';"

prelude: |
  // ===========================================================================
  // Nested-block helper classes
  // ===========================================================================
  //
  // Each helper exposes an `encode()` method returning `Map<String, Object?>`.
  // The factory wraps the result via `TfArg.literal(nested.encode())` so the
  // `argMap` invariant `Map<String, TfArg<dynamic>?>` holds. Synth then calls
  // `arg.toTfJson()` and recursively encodes any nested `TfArg` instances.

  // ===========================================================================
  // Factory
  // ===========================================================================


sealedNames:
  "bigquery_config, cloud_storage_config, push_config": delivery
