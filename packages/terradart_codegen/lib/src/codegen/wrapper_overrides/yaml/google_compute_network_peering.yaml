outputDir: compute
deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true
deriveEnums: true

dartTypeOverrides:
  stack_type: ComputeNetworkPeeringStackType
  update_strategy: ComputeNetworkPeeringUpdateStrategy

paramOrder:
  - name
  - network
  - peer_network
  - export_custom_routes
  - import_custom_routes
  - export_subnet_routes_with_public_ip
  - import_subnet_routes_with_public_ip
  - stack_type
  - update_strategy
  - deletion_policy

prelude: |
  /// `stack_type` — IP version stack of the peering. Default (when unset)
  /// is [ComputeNetworkPeeringStackType.ipv4Only].
  extension type const ComputeNetworkPeeringStackType._(TfArg<String> _) implements TfArg<String> {
    ComputeNetworkPeeringStackType.variable(String name) : this._(TfArg.variable(name));
    ComputeNetworkPeeringStackType.expression(String template) : this._(TfArg.expression(template));
    const ComputeNetworkPeeringStackType.arg(TfArg<String> arg) : this._(arg);

    static const ipv4Only = ComputeNetworkPeeringStackType._(TfArgLiteral('IPV4_ONLY'));
    static const ipv4Ipv6 = ComputeNetworkPeeringStackType._(TfArgLiteral('IPV4_IPV6'));

    static const List<ComputeNetworkPeeringStackType> values = [ipv4Only, ipv4Ipv6];
  }

  /// `update_strategy` — how changes to peering config are reconciled.
  /// Default (when unset) is [ComputeNetworkPeeringUpdateStrategy.independent].
  extension type const ComputeNetworkPeeringUpdateStrategy._(TfArg<String> _) implements TfArg<String> {
    ComputeNetworkPeeringUpdateStrategy.variable(String name) : this._(TfArg.variable(name));
    ComputeNetworkPeeringUpdateStrategy.expression(String template) : this._(TfArg.expression(template));
    const ComputeNetworkPeeringUpdateStrategy.arg(TfArg<String> arg) : this._(arg);

    static const independent = ComputeNetworkPeeringUpdateStrategy._(TfArgLiteral('INDEPENDENT'));
    static const consensus = ComputeNetworkPeeringUpdateStrategy._(TfArgLiteral('CONSENSUS'));

    static const List<ComputeNetworkPeeringUpdateStrategy> values = [independent, consensus];
  }
