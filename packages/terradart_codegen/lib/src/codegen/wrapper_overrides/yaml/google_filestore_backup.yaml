outputDir: filestore

deriveClassDoc: true
deriveNestedTypes: true
deriveExactlyOne: true
deriveOutputGetters: true

paramOrder:
  - name
  - location
  - source_instance
  - source_file_share
  - description
  - labels

curatedDoc: |-
  /// Cloud Filestore backup — point-in-time copy of a file share.
  ///
  /// Required identity:
  /// - [localName]: Terraform local name.
  /// - [name]: backup ID (unique within the instance).
  /// - [location]: region matching the source instance.
  /// - [sourceInstance]: full instance name — `instance.id`.
  /// - [sourceFileShare]: export name from [GoogleFilestoreInstance].
  ///
  /// Example:
  /// ```dart
  /// final vpc = add(GoogleComputeNetwork('vpc', name: .literal('vpc')));
  /// final nfs = add(GoogleFilestoreInstance(
  ///   'nfs',
  ///   name: .literal('nfs'),
  ///   tier: FilestoreInstanceTier.standard,
  ///   fileShares: FilestoreInstanceFileShares(
  ///     capacityGb: .literal(1024),
  ///     name: .literal('share1'),
  ///   ),
  ///   networks: [
  ///     FilestoreInstanceNetworks(
  ///       modes: .literal([.modeIpv4]),
  ///       network: vpc.ref,
  ///     ),
  ///   ],
  /// ));
  /// GoogleFilestoreBackup(
  ///   'share_backup',
  ///   name: TfArg.literal('share-backup-1'),
  ///   location: TfArg.literal('asia-northeast1'),
  ///   sourceInstance: nfs.ref,
  ///   sourceFileShare: TfArg.literal('share1'),
  /// );
  /// ```
