outputDir: compute

deriveClassDoc: true
deriveNestedTypes: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveEnums: true

curatedDoc: |-
  /// Legacy Network Load Balancer target pool. Optional [healthChecks] accept
  /// only a legacy [GoogleComputeHttpHealthCheck] (not the newer health-check
  /// resources). Prefer backend services for new HTTP(S) load balancers.

paramOrder:
  - name
  - region
  - description
  - instances
  - health_checks
  - session_affinity
  - backup_pool
  - failover_ratio
  - deletion_policy
  - project

extraGetters: |2

    /// Reference to `self_link` attribute.
    TfRef<String> get selfLink => TfRef.attribute<String>(this, 'self_link');
