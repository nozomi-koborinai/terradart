outputDir: network

deriveClassDoc: true
deriveOutputGetters: true
deriveNestedTypes: true
deriveEnums: true

extraImports:
  - "import 'package:meta/meta.dart';"

dartTypeOverrides:
  type: NetworkServicesEndpointPolicyType

curatedDoc: |-
  /// Cloud Service Mesh **endpoint policy** — matcher that selects sidecar
  /// / proxyless endpoints (`SIDECAR_PROXY` or `GRPC_SERVER`) via xDS
  /// node metadata labels.
  ///
  /// Creating a policy does not attach workloads. Anthos Service Mesh
  /// cluster/endpoint SKUs and Traffic Director Endpoint
  /// (`7573-35C8-9ADC`) bill when endpoints join, not for this config
  /// object.

paramOrder:
  - name
  - type
  - endpoint_matcher
  - traffic_port_selector
  - authorization_policy
  - client_tls_policy
  - server_tls_policy
  - description
  - labels
  - deletion_policy
  - project

extraGetters: |2
    /// Reference to `name` attribute.
    TfRef<String> get nameRef => TfRef.attribute<String>(this, 'name');
