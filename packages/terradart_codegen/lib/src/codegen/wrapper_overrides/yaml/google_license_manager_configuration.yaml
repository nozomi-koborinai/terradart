outputDir: license_manager

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// License Manager configuration for third-party software licenses (e.g. Office SPLA)
  /// on Compute Engine workloads in a region.
  ///
  /// Enable `licensemanager.googleapis.com` via [GoogleProjectService] before apply.
  ///
  /// Example:
  /// ```dart
  /// GoogleLicenseManagerConfiguration(
  ///   'office_spla',
  ///   location: TfArg.literal('us-central1'),
  ///   configurationId: TfArg.literal('office-2021'),
  ///   product: TfArg.literal('Office2021ProfessionalPlus'),
  ///   licenseCount: TfArg.literal(10),
  /// );
  /// ```

paramOrder:
  - location
  - configuration_id
  - product
  - license_count
  - active
  - labels
  - deletion_policy
  - project

prelude: |
  /// Terraform `deletion_policy` for License Manager configurations.
  extension type const LicenseManagerConfigurationDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    LicenseManagerConfigurationDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    LicenseManagerConfigurationDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const LicenseManagerConfigurationDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = LicenseManagerConfigurationDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = LicenseManagerConfigurationDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = LicenseManagerConfigurationDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<LicenseManagerConfigurationDeletionPolicy> values = [delete, prevent, abandon];
  }

dartTypeOverrides:
  deletion_policy: LicenseManagerConfigurationDeletionPolicy
