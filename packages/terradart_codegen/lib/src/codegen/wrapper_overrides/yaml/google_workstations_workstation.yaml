outputDir: workstations
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true
deriveEnums: true

curatedDoc: |-
  /// Cloud Workstations **workstation** instance under a config.
  ///
  /// **Cost:** Cloud Billing Catalog bills **instance VM (vCPU) management
  /// fee** while a workstation runs (us-central1 SKU `8893-953D-5524`
  /// **$0.05/h** per vCPU) plus underlying Compute. Deferred with the
  /// never_apply cluster (no apply-smoke quickstart).
  ///
  /// Example:
  /// ```dart
  /// GoogleWorkstationsWorkstation(
  ///   localName: 'alice',
  ///   workstationId: TfArg.literal('alice'),
  ///   workstationConfigId: cfg.workstationConfigIdRef,
  ///   workstationClusterId: cluster.workstationClusterIdRef,
  ///   location: TfArg.literal('us-central1'),
  /// );
  /// ```

paramOrder:
  - workstation_id
  - workstation_config_id
  - workstation_cluster_id
  - location
  - display_name
  - labels
  - annotations
  - env
  - source_workstation
  - deletion_policy
  - project
