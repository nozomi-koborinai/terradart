curatedDoc: |-
  /// Cloud Workstations **workstation** instance under a config.
  ///
  /// **Cost:** Cloud Billing Catalog bills **instance VM (vCPU) management
  /// fee** while a workstation runs (us-central1 SKU `8893-953D-5524`
  /// **$0.05/h** per vCPU) plus underlying Compute. Deferred with the
  /// never_apply cluster (no apply-smoke quickstart).
  ///
  /// Example:
  /// ```dart
  /// final vpc = add(GoogleComputeNetwork('vpc', name: .literal('vpc')));
  /// final subnet = add(GoogleComputeSubnetwork(
  ///   'subnet',
  ///   name: .literal('subnet'),
  ///   network: vpc.ref,
  /// ));
  /// final cluster = add(GoogleWorkstationsWorkstationCluster(
  ///   'cluster',
  ///   workstationClusterId: .literal('cluster'),
  ///   network: vpc.ref,
  ///   subnetwork: subnet.ref,
  /// ));
  /// final cfg = add(GoogleWorkstationsWorkstationConfig(
  ///   'cfg',
  ///   workstationConfigId: .literal('cfg'),
  ///   workstationClusterId: cluster.workstationClusterId,
  ///   location: .literal('us-central1'),
  /// ));
  /// GoogleWorkstationsWorkstation(
  ///   'alice',
  ///   workstationId: TfArg.literal('alice'),
  ///   workstationConfigId: cfg.workstationConfigId,
  ///   workstationClusterId: cluster.workstationClusterId,
  ///   location: TfArg.literal('us-central1'),
  /// );
  /// ```

