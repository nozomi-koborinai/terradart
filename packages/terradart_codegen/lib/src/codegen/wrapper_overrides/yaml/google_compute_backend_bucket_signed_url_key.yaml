outputDir: compute

deriveClassDoc: true
deriveNestedTypes: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveEnums: true

curatedDoc: |-
  /// Cloud CDN signed-URL key on a [GoogleComputeBackendBucket].
  /// [keyValue] is a 128-bit RFC 4648 §5 base64url secret — pass it via
  /// [TfArg.variable], not a literal (synth rejects sensitive literals).

paramOrder:
  - name
  - backend_bucket
  - key_value
  - deletion_policy
  - project
