outputDir: app
deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// Registers the App Engine application for a GCP project (one per project).
  ///
  /// Required identity:
  /// - [localName]: Terraform local name.
  /// - [locationId]: region or multi-region for the default Firestore database
  ///   when [databaseType] is `CLOUD_FIRESTORE` (e.g. `'us-central'`).
  ///
  /// Example (Native Firestore-backed app in us-central):
  /// ```dart
  /// final app = GoogleAppEngineApplication(
  ///   'app',
  ///   locationId: TfArg.literal('us-central'),
  ///   databaseType: AppEngineDatabaseType.cloudFirestore,
  /// );
  /// ```

paramOrder:
  - location_id
  - database_type
  - serving_status
  - auth_domain
  - ssl_policy
  - feature_settings
  - iap
  - project

prelude: |
  /// Default database mode for an [GoogleAppEngineApplication].
  extension type const AppEngineDatabaseType._(TfArg<String> _) implements TfArg<String> {
    AppEngineDatabaseType.variable(String name) : this._(TfArg.variable(name));
    AppEngineDatabaseType.expression(String template) : this._(TfArg.expression(template));
    const AppEngineDatabaseType.arg(TfArg<String> arg) : this._(arg);

    static const cloudFirestore = AppEngineDatabaseType._(TfArgLiteral('CLOUD_FIRESTORE'));
    static const cloudDatastore = AppEngineDatabaseType._(TfArgLiteral('CLOUD_DATASTORE_COMPATIBILITY'));

    static const List<AppEngineDatabaseType> values = [cloudFirestore, cloudDatastore];
  }

  /// Serving status for an [GoogleAppEngineApplication].
  extension type const AppEngineServingStatus._(TfArg<String> _) implements TfArg<String> {
    AppEngineServingStatus.variable(String name) : this._(TfArg.variable(name));
    AppEngineServingStatus.expression(String template) : this._(TfArg.expression(template));
    const AppEngineServingStatus.arg(TfArg<String> arg) : this._(arg);

    static const serving = AppEngineServingStatus._(TfArgLiteral('SERVING'));
    static const userDisabled = AppEngineServingStatus._(TfArgLiteral('USER_DISABLED'));
    static const systemDisabled = AppEngineServingStatus._(TfArgLiteral('SYSTEM_DISABLED'));

    static const List<AppEngineServingStatus> values = [serving, userDisabled, systemDisabled];
  }

dartTypeOverrides:
  database_type: AppEngineDatabaseType
  serving_status: AppEngineServingStatus
