outputDir: alloydb

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

paramOrder:
  - cluster
  - instance_id
  - instance_type
  - machine_config
  - display_name
  - labels
  - activation_policy
  - annotations
  - availability_type
  - database_flags
  - gce_zone
  - client_connection_config
  - connection_pool_config
  - network_config
  - psc_instance_config
  - query_insights_config
  - read_pool_config

dartTypeOverrides:
  instance_type: AlloydbInstanceType

curatedDoc: |-
  /// AlloyDB instance — primary or read-pool node inside a
  /// [GoogleAlloydbCluster].
  ///
  /// Required identity:
  /// - [localName]: Terraform local name.
  /// - [cluster]: parent cluster ID — `cluster.id`.
  /// - [instanceId]: short instance ID within the cluster.
  /// - [instanceType]: [AlloydbInstanceType.primary] for the first node.
  /// - [machineConfig]: CPU count (and optional machine type).
  ///
  /// Example:
  /// ```dart
  /// GoogleAlloydbInstance(
  ///   'primary',
  ///   cluster: cluster.ref,
  ///   instanceId: TfArg.literal('primary'),
  ///   instanceType: AlloydbInstanceType.primary,
  ///   machineConfig: AlloydbInstanceMachineConfig(
  ///     cpuCount: TfArg.literal(2),
  ///   ),
  /// );
  /// ```

prelude: |
  /// `instance_type` — primary, read pool, or secondary.
  extension type const AlloydbInstanceType._(TfArg<String> _) implements TfArg<String> {
    AlloydbInstanceType.variable(String name) : this._(TfArg.variable(name));
    AlloydbInstanceType.expression(String template) : this._(TfArg.expression(template));
    const AlloydbInstanceType.arg(TfArg<String> arg) : this._(arg);

    static const primary = AlloydbInstanceType._(TfArgLiteral('PRIMARY'));
    static const readPool = AlloydbInstanceType._(TfArgLiteral('READ_POOL'));
    static const secondary = AlloydbInstanceType._(TfArgLiteral('SECONDARY'));

    static const List<AlloydbInstanceType> values = [primary, readPool, secondary];
  }

