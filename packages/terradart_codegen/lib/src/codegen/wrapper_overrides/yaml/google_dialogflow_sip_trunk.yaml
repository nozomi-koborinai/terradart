outputDir: dialogflow

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// Dialogflow CX SIP trunk for Google Telephony Platform trunking.
  ///
  /// Enable `dialogflow.googleapis.com` via [GoogleProjectService] before apply.
  /// [expectedHostname] lists the TLS peer certificate hostnames your carrier presents.
  ///
  /// Example:
  /// ```dart
  /// GoogleDialogflowSipTrunk(
  ///   'carrier_trunk',
  ///   location: TfArg.literal('global'),
  ///   expectedHostname: TfArg.literal(['sip.carrier.example.com']),
  ///   displayName: TfArg.literal('Primary carrier trunk'),
  /// );
  /// ```

paramOrder:
  - location
  - expected_hostname
  - display_name
  - deletion_policy
  - project

prelude: |
  /// Terraform `deletion_policy` for Dialogflow SIP trunks.
  extension type const DialogflowSipTrunkDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    DialogflowSipTrunkDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    DialogflowSipTrunkDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const DialogflowSipTrunkDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = DialogflowSipTrunkDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = DialogflowSipTrunkDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = DialogflowSipTrunkDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<DialogflowSipTrunkDeletionPolicy> values = [delete, prevent, abandon];
  }

dartTypeOverrides:
  deletion_policy: DialogflowSipTrunkDeletionPolicy
