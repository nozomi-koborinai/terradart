outputDir: compute
deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

dartTypeOverrides:
  connection_preference: ServiceAttachmentConnectionPreference

prelude: |
  /// Connection preference for `google_compute_service_attachment.connection_preference`.
  extension type const ServiceAttachmentConnectionPreference._(TfArg<String> _) implements TfArg<String> {
    ServiceAttachmentConnectionPreference.variable(String name) : this._(TfArg.variable(name));
    ServiceAttachmentConnectionPreference.expression(String template) : this._(TfArg.expression(template));
    const ServiceAttachmentConnectionPreference.arg(TfArg<String> arg) : this._(arg);

    static const acceptAutomatic = ServiceAttachmentConnectionPreference._(TfArgLiteral('ACCEPT_AUTOMATIC'));
    static const acceptManual = ServiceAttachmentConnectionPreference._(TfArgLiteral('ACCEPT_MANUAL'));

    static const List<ServiceAttachmentConnectionPreference> values = [acceptAutomatic, acceptManual];
  }

