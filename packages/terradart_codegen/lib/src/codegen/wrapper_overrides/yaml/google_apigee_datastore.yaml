outputDir: apigee

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

paramOrder:
  - org_id
  - display_name
  - target_type
  - datastore_config
  - deletion_policy

prelude: |
  /// Target backend for `google_apigee_datastore`.
  enum ApigeeDatastoreTargetType implements TerraformEnum {
    gcs('gcs'),
    bigquery('bigquery');

    const ApigeeDatastoreTargetType(this.terraformValue);
    @override
    final String terraformValue;
  }

  /// Terraform `deletion_policy` for Apigee datastores.
  enum ApigeeDatastoreDeletionPolicy implements TerraformEnum {
    delete('DELETE'),
    abandon('ABANDON');

    const ApigeeDatastoreDeletionPolicy(this.terraformValue);
    @override
    final String terraformValue;
  }

dartTypeOverrides:
  target_type: ApigeeDatastoreTargetType
  deletion_policy: ApigeeDatastoreDeletionPolicy


extraImports:
  - "import 'package:meta/meta.dart';"
