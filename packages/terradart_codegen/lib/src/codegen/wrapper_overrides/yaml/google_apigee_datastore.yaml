outputDir: apigee

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

paramOrder:
  - org_id
  - display_name
  - target_type
  - datastore_config
  - deletion_policy

prelude: |
  /// Target backend for `google_apigee_datastore`.
  extension type const ApigeeDatastoreTargetType._(TfArg<String> _) implements TfArg<String> {
    ApigeeDatastoreTargetType.variable(String name) : this._(TfArg.variable(name));
    ApigeeDatastoreTargetType.expression(String template) : this._(TfArg.expression(template));
    const ApigeeDatastoreTargetType.arg(TfArg<String> arg) : this._(arg);

    static const gcs = ApigeeDatastoreTargetType._(TfArgLiteral('gcs'));
    static const bigquery = ApigeeDatastoreTargetType._(TfArgLiteral('bigquery'));

    static const List<ApigeeDatastoreTargetType> values = [gcs, bigquery];
  }

  /// Terraform `deletion_policy` for Apigee datastores.
  extension type const ApigeeDatastoreDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    ApigeeDatastoreDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    ApigeeDatastoreDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const ApigeeDatastoreDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = ApigeeDatastoreDeletionPolicy._(TfArgLiteral('DELETE'));
    static const abandon = ApigeeDatastoreDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<ApigeeDatastoreDeletionPolicy> values = [delete, abandon];
  }

dartTypeOverrides:
  target_type: ApigeeDatastoreTargetType
  deletion_policy: ApigeeDatastoreDeletionPolicy


extraImports:
  - "import 'package:meta/meta.dart';"
