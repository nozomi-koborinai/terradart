outputDir: oracle

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

typeNames:
  properties.azure_data_lake_storage_connection_properties.authentication_type: OracleDatabaseGoldengateConnectionAzureDataLakeStorageAuthenticationType
  properties.databricks_connection_properties.authentication_type: OracleDatabaseGoldengateConnectionDatabricksAuthenticationType
  properties.db2_connection_properties.security_protocol: OracleDatabaseGoldengateConnectionDb2SecurityProtocol
  properties.elasticsearch_connection_properties.authentication_type: OracleDatabaseGoldengateConnectionElasticsearchAuthenticationType
  properties.java_message_service_connection_properties.security_protocol: OracleDatabaseGoldengateConnectionJavaMessageServiceSecurityProtocol
  properties.kafka_connection_properties.security_protocol: OracleDatabaseGoldengateConnectionKafkaSecurityProtocol
  properties.kafka_schema_registry_connection_properties.authentication_type: OracleDatabaseGoldengateConnectionKafkaSchemaRegistryAuthenticationType
  properties.snowflake_connection_properties.authentication_type: OracleDatabaseGoldengateConnectionSnowflakeAuthenticationType

curatedDoc: |-
  /// Oracle GoldenGate connection metadata for Oracle Database@Google Cloud.
  ///
  /// Enable `oracledatabase.googleapis.com` before apply. Set [properties]
  /// with `connection_type`, `display_name`, and the type-specific connection
  /// block (for example `generic_connection_properties`).

paramOrder:
  - location
  - goldengate_connection_id
  - properties
  - odb_subnet
  - odb_network
  - gcp_oracle_zone
  - labels
  - deletion_policy
  - deletion_protection
  - project

prelude: |
  /// Terraform `deletion_policy` for GoldenGate connections.
  extension type const OracleDatabaseGoldengateConnectionDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    OracleDatabaseGoldengateConnectionDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    OracleDatabaseGoldengateConnectionDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const OracleDatabaseGoldengateConnectionDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = OracleDatabaseGoldengateConnectionDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = OracleDatabaseGoldengateConnectionDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = OracleDatabaseGoldengateConnectionDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<OracleDatabaseGoldengateConnectionDeletionPolicy> values = [delete, prevent, abandon];
  }

dartTypeOverrides:
  deletion_policy: OracleDatabaseGoldengateConnectionDeletionPolicy

extraGetters: |2
    TfRef<String> get id => TfRef.attribute<String>(this, 'id');
