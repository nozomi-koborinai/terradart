outputDir: cloud_run

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true

curatedDoc: |-
  /// Example (minimal one-shot batch job):
  /// ```dart
  /// final etl = GoogleCloudRunV2Job(
  ///   'etl',
  ///   name: .literal('nightly-etl'),
  ///   location: .literal('asia-northeast1'),
  ///   template: CloudRunV2JobTemplate(
  ///     template: .new(
  ///       containers: [
  ///         .new(
  ///           image: .literal('gcr.io/p/etl:v1'),
  ///         ),
  ///       ],
  ///     ),
  ///   ),
  /// );
  /// ```

# The Cloud Run Admin API takes one source per volume and one value per
# environment variable; the provider leaves both checks to the API.
exactlyOneOf:
  - "template.template.volumes.cloud_sql_instance, template.template.volumes.empty_dir, template.template.volumes.gcs, template.template.volumes.nfs, template.template.volumes.secret"
  - "template.template.containers.env.value, template.template.containers.env.value_source"

sealedNames:
  "template.template.containers.env.value, template.template.containers.env.value_source": source
  "template.template.volumes.cloud_sql_instance, template.template.volumes.empty_dir, template.template.volumes.gcs, template.template.volumes.nfs, template.template.volumes.secret": source
  "binary_authorization.policy, binary_authorization.use_default": policy

paramOrder:
  - name
  - location
  - template
  - binary_authorization
  - launch_stage
  - labels
  - annotations
  - client
  - client_version
  - deletion_protection
  - project
  - run_execution_token
  - start_execution_token
  - tags

extraImports:
  - "import 'package:meta/meta.dart';"

deriveOutputGetters: true

extraGetters: |2
    /// Reference to `execution_count` — total number of executions that
    /// have ever run. Kept (not derived) to preserve the `int` type; the
    /// schema's `number` would widen the derived getter to `TfRef<num>`.
    TfRef<int> get executionCount =>
        TfRef.attribute<int>(this, 'execution_count');

    /// Reference to `latest_created_execution` — `{name, create_time,
    /// completion_time}` triple for the most recently created execution.
    /// Kept (not derived) to preserve the `List<Object?>` element type.
    TfRef<List<Object?>> get latestCreatedExecution =>
        TfRef.attribute<List<Object?>>(this, 'latest_created_execution');

dartTypeOverrides:
  launch_stage: CloudRunV2JobLaunchStage
  template.template.execution_environment: CloudRunV2JobExecutionEnvironment
  template.template.vpc_access.egress: CloudRunV2JobVpcAccessEgress
  template.template.volumes.empty_dir.medium: CloudRunV2JobEmptyDirMedium

prelude: |
  // ===========================================================================
  // Top-level enums
  // ===========================================================================

  /// Launch stage for `google_cloud_run_v2_job.launch_stage`. Setting a
  /// pre-GA stage on input allows preview features in that stage; on read
  /// the field reflects the highest preview level actually used.
  ///
  /// The Job and Service enums share the same Terraform values but live
  /// under separate names ([CloudRunV2JobLaunchStage] vs. [LaunchStage]) so the
  /// `cloud_run.dart` barrel can `show` both.
  extension type const CloudRunV2JobLaunchStage._(TfArg<String> _) implements TfArg<String> {
    CloudRunV2JobLaunchStage.variable(String name) : this._(TfArg.variable(name));
    CloudRunV2JobLaunchStage.expression(String template) : this._(TfArg.expression(template));
    const CloudRunV2JobLaunchStage.arg(TfArg<String> arg) : this._(arg);

    static const unimplemented = CloudRunV2JobLaunchStage._(TfArgLiteral('UNIMPLEMENTED'));
    static const prelaunch = CloudRunV2JobLaunchStage._(TfArgLiteral('PRELAUNCH'));
    static const earlyAccess = CloudRunV2JobLaunchStage._(TfArgLiteral('EARLY_ACCESS'));
    static const alpha = CloudRunV2JobLaunchStage._(TfArgLiteral('ALPHA'));
    static const beta = CloudRunV2JobLaunchStage._(TfArgLiteral('BETA'));
    static const ga = CloudRunV2JobLaunchStage._(TfArgLiteral('GA'));
    static const deprecatedStage = CloudRunV2JobLaunchStage._(TfArgLiteral('DEPRECATED'));

    static const List<CloudRunV2JobLaunchStage> values = [unimplemented, prelaunch, earlyAccess, alpha, beta, ga, deprecatedStage];
  }

  /// Container sandbox environment for [CloudRunV2JobTemplateTemplate.executionEnvironment].
  /// `gen2` enables larger CPU tiers + GCSFuse volumes; `gen1` keeps the
  /// legacy gVisor sandbox.
  extension type const CloudRunV2JobExecutionEnvironment._(TfArg<String> _) implements TfArg<String> {
    CloudRunV2JobExecutionEnvironment.variable(String name) : this._(TfArg.variable(name));
    CloudRunV2JobExecutionEnvironment.expression(String template) : this._(TfArg.expression(template));
    const CloudRunV2JobExecutionEnvironment.arg(TfArg<String> arg) : this._(arg);

    static const gen1 = CloudRunV2JobExecutionEnvironment._(TfArgLiteral('EXECUTION_ENVIRONMENT_GEN1'));
    static const gen2 = CloudRunV2JobExecutionEnvironment._(TfArgLiteral('EXECUTION_ENVIRONMENT_GEN2'));

    static const List<CloudRunV2JobExecutionEnvironment> values = [gen1, gen2];
  }

  /// Egress policy for [CloudRunV2JobVpcAccess.egress] (`template.template.vpc_access.egress`).
  extension type const CloudRunV2JobVpcAccessEgress._(TfArg<String> _) implements TfArg<String> {
    CloudRunV2JobVpcAccessEgress.variable(String name) : this._(TfArg.variable(name));
    CloudRunV2JobVpcAccessEgress.expression(String template) : this._(TfArg.expression(template));
    const CloudRunV2JobVpcAccessEgress.arg(TfArg<String> arg) : this._(arg);

    static const allTraffic = CloudRunV2JobVpcAccessEgress._(TfArgLiteral('ALL_TRAFFIC'));
    static const privateRangesOnly = CloudRunV2JobVpcAccessEgress._(TfArgLiteral('PRIVATE_RANGES_ONLY'));

    static const List<CloudRunV2JobVpcAccessEgress> values = [allTraffic, privateRangesOnly];
  }

  /// Storage medium for [CloudRunV2JobEmptyDirVolume.medium]. The Cloud Run v2 Job
  /// schema documents `MEMORY`; `DISK` is reserved per the Magic-Modules
  /// mirror but rejected by the provider today.
  extension type const CloudRunV2JobEmptyDirMedium._(TfArg<String> _) implements TfArg<String> {
    CloudRunV2JobEmptyDirMedium.variable(String name) : this._(TfArg.variable(name));
    CloudRunV2JobEmptyDirMedium.expression(String template) : this._(TfArg.expression(template));
    const CloudRunV2JobEmptyDirMedium.arg(TfArg<String> arg) : this._(arg);

    static const memory = CloudRunV2JobEmptyDirMedium._(TfArgLiteral('MEMORY'));
    static const disk = CloudRunV2JobEmptyDirMedium._(TfArgLiteral('DISK'));

    static const List<CloudRunV2JobEmptyDirMedium> values = [memory, disk];
  }

