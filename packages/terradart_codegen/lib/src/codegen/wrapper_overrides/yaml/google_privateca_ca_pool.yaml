outputDir: privateca

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

paramOrder:
  - name
  - location
  - tier
  - issuance_policy
  - publishing_options
  - encryption_spec
  - labels
  - deletion_policy
  - project

dartTypeOverrides:
  tier: PrivatecaCaPoolTier

curatedDoc: |-
  /// Certificate Authority Service (CAS) CA pool — container for one or more
  /// certificate authorities used by [GoogleCertificateManagerCertificateIssuanceConfig].
  ///
  /// Required identity:
  /// - [localName]: Terraform local name.
  /// - [name]: pool ID.
  /// - [location]: regional location (e.g. `us-central1`).
  /// - [tier]: `ENTERPRISE` or `DEVOPS`.
  ///
  /// Enable `privateca.googleapis.com` via [GoogleProjectService] before apply.
  ///
  /// Example:
  /// ```dart
  /// final pool = GooglePrivatecaCaPool(
  ///   'app_pool',
  ///   name: TfArg.literal('app-pool'),
  ///   location: TfArg.literal('us-central1'),
  ///   tier: PrivatecaCaPoolTier.devops,
  /// );
  ///
  /// GoogleCertificateManagerCertificateIssuanceConfig(
  ///   'issuance',
  ///   name: TfArg.literal('app-issuance'),
  ///   certificateAuthorityConfig:
  ///       CertificateManagerCertificateIssuanceConfigCertificateAuthorityConfig(
  ///     certificateAuthorityServiceConfig: .new(
  ///       caPool: pool.ref,
  ///     ),
  ///   ),
  ///   keyAlgorithm: CertificateManagerCertificateIssuanceConfigKeyAlgorithm.rsa2048,
  ///   lifetime: TfArg.literal('2592000s'),
  ///   rotationWindowPercentage: TfArg.literal(50),
  /// );
  /// ```

prelude: |
  /// `tier` — CAS pool service tier.
  extension type const PrivatecaCaPoolTier._(TfArg<String> _) implements TfArg<String> {
    PrivatecaCaPoolTier.variable(String name) : this._(TfArg.variable(name));
    PrivatecaCaPoolTier.expression(String template) : this._(TfArg.expression(template));
    const PrivatecaCaPoolTier.arg(TfArg<String> arg) : this._(arg);

    static const enterprise = PrivatecaCaPoolTier._(TfArgLiteral('ENTERPRISE'));
    static const devops = PrivatecaCaPoolTier._(TfArgLiteral('DEVOPS'));

    static const List<PrivatecaCaPoolTier> values = [enterprise, devops];
  }
