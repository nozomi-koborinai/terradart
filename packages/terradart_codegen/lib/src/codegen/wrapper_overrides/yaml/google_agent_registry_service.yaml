outputDir: agent
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true

extraImports:
  - "import 'package:meta/meta.dart';"

curatedDoc: |-
  /// Agent Registry **service** — registers an agent / MCP / endpoint
  /// surface. Pass exactly one [AgentRegistryServiceSpec] variant
  /// (`agent_spec` / `mcp_server_spec` / `endpoint_spec`).
  ///
  /// **Cost / apply:** gcp-cost: no Cloud Billing Catalog SKU after MCP
  /// lookup (no Agent Identity / Agent Registry service in
  /// `list_services`). billing-behavior: registry service metadata — no
  /// existence/hourly charge observed. Not standalone-project applyable on
  /// `terradart-validate` without Agent Identity scaffolding. **Never** wire
  /// into apply-smoke.

# IR's three nested-block specs (`agent_spec`, `mcp_server_spec`,
# `endpoint_spec`) fan out into the sealed virtual `spec` customSlot —
# omit them from paramOrder (lint: exactly-one-paramorder-fanout).
paramOrder:
  - location
  - service_id
  - display_name
  - description
  - spec
  - interfaces
  - deletion_policy
  - project

argMapOrder:
  - location
  - service_id
  - display_name
  - description
  - interfaces
  - deletion_policy
  - project
  - spec

prelude: |
  /// `type` under `agent_spec`.
  extension type const AgentRegistryServiceAgentSpecType._(TfArg<String> _) implements TfArg<String> {
    AgentRegistryServiceAgentSpecType.variable(String name) : this._(TfArg.variable(name));
    AgentRegistryServiceAgentSpecType.expression(String template) : this._(TfArg.expression(template));
    const AgentRegistryServiceAgentSpecType.arg(TfArg<String> arg) : this._(arg);

    static const noSpec = AgentRegistryServiceAgentSpecType._(TfArgLiteral('NO_SPEC'));
    static const a2aAgentCard = AgentRegistryServiceAgentSpecType._(TfArgLiteral('A2A_AGENT_CARD'));

    static const List<AgentRegistryServiceAgentSpecType> values = [noSpec, a2aAgentCard];
  }

  /// `type` under `mcp_server_spec`.
  extension type const AgentRegistryServiceMcpServerSpecType._(TfArg<String> _) implements TfArg<String> {
    AgentRegistryServiceMcpServerSpecType.variable(String name) : this._(TfArg.variable(name));
    AgentRegistryServiceMcpServerSpecType.expression(String template) : this._(TfArg.expression(template));
    const AgentRegistryServiceMcpServerSpecType.arg(TfArg<String> arg) : this._(arg);

    static const noSpec = AgentRegistryServiceMcpServerSpecType._(TfArgLiteral('NO_SPEC'));
    static const toolSpec = AgentRegistryServiceMcpServerSpecType._(TfArgLiteral('TOOL_SPEC'));

    static const List<AgentRegistryServiceMcpServerSpecType> values = [noSpec, toolSpec];
  }

  /// `type` under `endpoint_spec`.
  extension type const AgentRegistryServiceEndpointSpecType._(TfArg<String> _) implements TfArg<String> {
    AgentRegistryServiceEndpointSpecType.variable(String name) : this._(TfArg.variable(name));
    AgentRegistryServiceEndpointSpecType.expression(String template) : this._(TfArg.expression(template));
    const AgentRegistryServiceEndpointSpecType.arg(TfArg<String> arg) : this._(arg);

    static const noSpec = AgentRegistryServiceEndpointSpecType._(TfArgLiteral('NO_SPEC'));

    static const List<AgentRegistryServiceEndpointSpecType> values = [noSpec];
  }

  /// `protocol_binding` under `interfaces`.
  extension type const AgentRegistryServiceInterfacesProtocolBinding._(TfArg<String> _) implements TfArg<String> {
    AgentRegistryServiceInterfacesProtocolBinding.variable(String name) : this._(TfArg.variable(name));
    AgentRegistryServiceInterfacesProtocolBinding.expression(String template) : this._(TfArg.expression(template));
    const AgentRegistryServiceInterfacesProtocolBinding.arg(TfArg<String> arg) : this._(arg);

    static const jsonrpc = AgentRegistryServiceInterfacesProtocolBinding._(TfArgLiteral('JSONRPC'));
    static const grpc = AgentRegistryServiceInterfacesProtocolBinding._(TfArgLiteral('GRPC'));
    static const httpJson = AgentRegistryServiceInterfacesProtocolBinding._(TfArgLiteral('HTTP_JSON'));

    static const List<AgentRegistryServiceInterfacesProtocolBinding> values = [jsonrpc, grpc, httpJson];
  }

  /// Exactly one of agent / MCP server / endpoint spec (MM `exactly_one_of`).
  sealed class AgentRegistryServiceSpec {
    const AgentRegistryServiceSpec();

    /// `agent_spec` — service type is Agent.
    const factory AgentRegistryServiceSpec.agent({
      required AgentRegistryServiceAgentSpecType type,
      TfArg<String>? content,
    }) = AgentRegistryServiceAgentSpec;

    /// `mcp_server_spec` — service type is MCP Server.
    const factory AgentRegistryServiceSpec.mcpServer({
      required AgentRegistryServiceMcpServerSpecType type,
      TfArg<String>? content,
    }) = AgentRegistryServiceMcpServerSpec;

    /// `endpoint_spec` — service type is Endpoint.
    const factory AgentRegistryServiceSpec.endpoint({
      required AgentRegistryServiceEndpointSpecType type,
    }) = AgentRegistryServiceEndpointSpec;

    @internal
    String get blockKey;
    @internal
    Map<String, Object?> encode();
  }

  /// `agent_spec` — service type is Agent.
  @immutable
  final class AgentRegistryServiceAgentSpec extends AgentRegistryServiceSpec {
    const AgentRegistryServiceAgentSpec({required this.type, this.content});

    final AgentRegistryServiceAgentSpecType type;
    final TfArg<String>? content;

    @override
    @internal
    String get blockKey => 'agent_spec';

    @override
    @internal
    Map<String, Object?> encode() => {
      'type': type.toTfJson(),
      if (content != null) 'content': content!.toTfJson(),
    };
  }

  /// `mcp_server_spec` — service type is MCP Server.
  @immutable
  final class AgentRegistryServiceMcpServerSpec extends AgentRegistryServiceSpec {
    const AgentRegistryServiceMcpServerSpec({required this.type, this.content});

    final AgentRegistryServiceMcpServerSpecType type;
    final TfArg<String>? content;

    @override
    @internal
    String get blockKey => 'mcp_server_spec';

    @override
    @internal
    Map<String, Object?> encode() => {
      'type': type.toTfJson(),
      if (content != null) 'content': content!.toTfJson(),
    };
  }

  /// `endpoint_spec` — service type is Endpoint.
  @immutable
  final class AgentRegistryServiceEndpointSpec extends AgentRegistryServiceSpec {
    const AgentRegistryServiceEndpointSpec({required this.type});

    final AgentRegistryServiceEndpointSpecType type;

    @override
    @internal
    String get blockKey => 'endpoint_spec';

    @override
    @internal
    Map<String, Object?> encode() => {
      'type': type.toTfJson(),
    };
  }

  /// Typed helper for the `interfaces` block.
  @immutable
  final class AgentRegistryServiceInterfaces {
    const AgentRegistryServiceInterfaces({
      required this.protocolBinding,
      required this.url,
    });

    final AgentRegistryServiceInterfacesProtocolBinding protocolBinding;
    final TfArg<String> url;

    @internal
    Map<String, Object?> encode() => {
      'protocol_binding': protocolBinding.toTfJson(),
      'url': url.toTfJson(),
    };
  }

customSlots:
  spec:
    paramDeclaration: 'required AgentRegistryServiceSpec spec'
    argMapEntry: 'spec.blockKey: TfArg.literal([spec.encode()]),'
  interfaces:
    paramDeclaration: 'List<AgentRegistryServiceInterfaces>? interfaces'
    argMapEntry: "if (interfaces != null) 'interfaces': TfArg.literal([for (final e in interfaces) e.encode()]),"
