outputDir: oracle

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true
deriveEnums: true

curatedDoc: |-
  /// Oracle Database@Google Cloud ODB subnet under an
  /// [GoogleOracleDatabaseOdbNetwork].
  ///
  /// Enable `oracledatabase.googleapis.com` before apply. Set [odbnetwork] to
  /// the parent network's `odb_network_id` segment in the same [location].

paramOrder:
  - location
  - odbnetwork
  - odb_subnet_id
  - cidr_range
  - purpose
  - labels
  - deletion_policy
  - deletion_protection
  - project

prelude: |
  /// Terraform `deletion_policy` for ODB subnets.
  extension type const OracleDatabaseOdbSubnetDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    OracleDatabaseOdbSubnetDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    OracleDatabaseOdbSubnetDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const OracleDatabaseOdbSubnetDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = OracleDatabaseOdbSubnetDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = OracleDatabaseOdbSubnetDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = OracleDatabaseOdbSubnetDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<OracleDatabaseOdbSubnetDeletionPolicy> values = [delete, prevent, abandon];
  }

  /// ODB subnet purpose.
  extension type const OracleDatabaseOdbSubnetPurpose._(TfArg<String> _) implements TfArg<String> {
    OracleDatabaseOdbSubnetPurpose.variable(String name) : this._(TfArg.variable(name));
    OracleDatabaseOdbSubnetPurpose.expression(String template) : this._(TfArg.expression(template));
    const OracleDatabaseOdbSubnetPurpose.arg(TfArg<String> arg) : this._(arg);

    static const clientSubnet = OracleDatabaseOdbSubnetPurpose._(TfArgLiteral('CLIENT_SUBNET'));
    static const backupSubnet = OracleDatabaseOdbSubnetPurpose._(TfArgLiteral('BACKUP_SUBNET'));

    static const List<OracleDatabaseOdbSubnetPurpose> values = [clientSubnet, backupSubnet];
  }

dartTypeOverrides:
  deletion_policy: OracleDatabaseOdbSubnetDeletionPolicy
  purpose: OracleDatabaseOdbSubnetPurpose

extraGetters: |2
    TfRef<String> get id => TfRef.attribute<String>(this, 'id');
