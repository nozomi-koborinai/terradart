outputDir: certificate_manager

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

sealedNames:
  "managed, self_managed": provisioning
  "self_managed.certificate_pem, self_managed.pem_certificate": certificate
  "self_managed.pem_private_key, self_managed.pem_private_key_wo, self_managed.private_key_pem": private_key

paramOrder:
  - name
  - managed
  - self_managed
  - description
  - location
  - scope
  - labels
  - project

dartTypeOverrides:
  scope: CertificateManagerCertificateScope

curatedDoc: |-
  /// Certificate Manager certificate — Google-managed (auto-renewed) or
  /// self-managed (user-uploaded PEM).
  ///
  /// The managed path pairs with [GoogleCertificateManagerDnsAuthorization]
  /// via [CertificateManagerCertificateManaged.dnsAuthorizations].
  /// Attach issued certs to a load balancer either directly
  /// (`certificate_manager_certificates` on internal HTTPS proxies) or via a
  /// [GoogleCertificateManagerCertificateMap] + map entry on external HTTPS
  /// proxies.
  ///
  /// Required identity:
  /// - [localName]: Terraform local name.
  /// - [name]: certificate ID.
  /// - `provisioning`: sealed [CertificateManagerCertificateProvisioning]
  ///   — exactly one of `.managed(...)` or `.selfManaged(...)`.
  ///
  /// Example (managed + DNS authorization):
  /// ```dart
  /// GoogleCertificateManagerCertificate(
  ///   'app_cert',
  ///   name: .literal('app-cert'),
  ///   provisioning: .managed(
  ///     .new(
  ///       domains: .literal(['app.example.com']),
  ///       dnsAuthorizations: .literal([dnsAuth.id.interpolation]),
  ///     ),
  ///   ),
  /// );
  /// ```

prelude: |
  /// `scope` — where the certificate may be served (default / edge / all
  /// regions / client-auth mTLS).
  extension type const CertificateManagerCertificateScope._(TfArg<String> _) implements TfArg<String> {
    CertificateManagerCertificateScope.variable(String name) : this._(TfArg.variable(name));
    CertificateManagerCertificateScope.expression(String template) : this._(TfArg.expression(template));
    const CertificateManagerCertificateScope.arg(TfArg<String> arg) : this._(arg);

    static const defaultScope = CertificateManagerCertificateScope._(TfArgLiteral('DEFAULT'));
    static const edgeCache = CertificateManagerCertificateScope._(TfArgLiteral('EDGE_CACHE'));
    static const allRegions = CertificateManagerCertificateScope._(TfArgLiteral('ALL_REGIONS'));
    static const clientAuth = CertificateManagerCertificateScope._(TfArgLiteral('CLIENT_AUTH'));

    static const List<CertificateManagerCertificateScope> values = [defaultScope, edgeCache, allRegions, clientAuth];
  }
