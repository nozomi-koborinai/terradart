outputDir: apigee

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

paramOrder:
  - org_id
  - data_collector_id
  - type
  - description
  - deletion_policy

prelude: |
  /// Data type collected by `google_apigee_data_collector`.
  extension type const ApigeeDataCollectorType._(TfArg<String> _) implements TfArg<String> {
    ApigeeDataCollectorType.variable(String name) : this._(TfArg.variable(name));
    ApigeeDataCollectorType.expression(String template) : this._(TfArg.expression(template));
    const ApigeeDataCollectorType.arg(TfArg<String> arg) : this._(arg);

    static const boolean = ApigeeDataCollectorType._(TfArgLiteral('BOOLEAN'));
    static const dateTime = ApigeeDataCollectorType._(TfArgLiteral('DATETIME'));
    static const floatType = ApigeeDataCollectorType._(TfArgLiteral('FLOAT'));
    static const integer = ApigeeDataCollectorType._(TfArgLiteral('INTEGER'));
    static const string = ApigeeDataCollectorType._(TfArgLiteral('STRING'));

    static const List<ApigeeDataCollectorType> values = [boolean, dateTime, floatType, integer, string];
  }

  /// Terraform `deletion_policy` for Apigee data collectors.
  extension type const ApigeeDataCollectorDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    ApigeeDataCollectorDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    ApigeeDataCollectorDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const ApigeeDataCollectorDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = ApigeeDataCollectorDeletionPolicy._(TfArgLiteral('DELETE'));
    static const abandon = ApigeeDataCollectorDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<ApigeeDataCollectorDeletionPolicy> values = [delete, abandon];
  }

dartTypeOverrides:
  type: ApigeeDataCollectorType
  deletion_policy: ApigeeDataCollectorDeletionPolicy
