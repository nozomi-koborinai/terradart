outputDir: filestore

deriveClassDoc: true
deriveNestedTypes: true
deriveExactlyOne: true
deriveOutputGetters: true

paramOrder:
  - name
  - location
  - instance
  - description
  - labels

curatedDoc: |-
  /// Cloud Filestore snapshot — lightweight share snapshot.
  ///
  /// Required identity:
  /// - [localName]: Terraform local name.
  /// - [name]: snapshot ID (unique within the instance).
  /// - [location]: region matching the source instance.
  /// - [instance]: parent instance — `nfs.id`.
  ///
  /// Example:
  /// ```dart
  /// final vpc = add(GoogleComputeNetwork('vpc', name: .literal('vpc')));
  /// final nfs = add(GoogleFilestoreInstance(
  ///   'nfs',
  ///   name: .literal('nfs'),
  ///   tier: FilestoreInstanceTier.basicHdd,
  ///   fileShares: FilestoreInstanceFileShares(
  ///     capacityGb: .literal(1024),
  ///     name: .literal('share'),
  ///   ),
  ///   networks: [
  ///     FilestoreInstanceNetworks(
  ///       modes: .literal([.modeIpv4]),
  ///       network: vpc.ref,
  ///     ),
  ///   ],
  /// ));
  /// GoogleFilestoreSnapshot(
  ///   'share_snap',
  ///   name: TfArg.literal('share-snap-1'),
  ///   location: TfArg.literal('asia-northeast1'),
  ///   instance: nfs.ref,
  /// );
  /// ```
