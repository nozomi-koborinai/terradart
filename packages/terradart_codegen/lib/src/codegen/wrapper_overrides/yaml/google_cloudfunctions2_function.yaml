outputDir: cloud_functions

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

curatedDoc: |-
  /// Cloud Functions Gen 2 function. Gen 2 runs on Cloud Run + Eventarc +
  /// Cloud Build; this resource owns the build step (source archive + runtime),
  /// the runtime service config (memory / CPU / scaling), and optionally an
  /// event-trigger binding.
  ///
  /// Example (HTTP-triggered Python function backed by a GCS source archive):
  /// ```dart
  /// final fn = GoogleCloudfunctions2Function(
  ///   'http_fn',
  ///   name: .literal('hello-http'),
  ///   location: .literal('asia-northeast1'),
  ///   buildConfig: Cloudfunctions2FunctionBuildConfig(
  ///     runtime: .literal('python311'),
  ///     entryPoint: .literal('hello'),
  ///     source: .storageSource(
  ///       .new(
  ///         bucket: .of(bucket),
  ///         object: .literal('hello-http.zip'),
  ///       ),
  ///     ),
  ///     updatePolicy: .automaticUpdatePolicy(
  ///       .new(),
  ///     ),
  ///   ),
  ///   serviceConfig: Cloudfunctions2FunctionServiceConfig(
  ///     availableMemory: .literal('256M'),
  ///     timeoutSeconds: .literal(60),
  ///     ingressSettings: .allowAll,
  ///   ),
  /// );
  /// ```
  ///
  /// Example (Pub/Sub event-triggered function):
  /// ```dart
  /// final fn = GoogleCloudfunctions2Function(
  ///   'sub_fn',
  ///   name: .literal('order-handler'),
  ///   location: .literal('asia-northeast1'),
  ///   buildConfig: Cloudfunctions2FunctionBuildConfig(
  ///     runtime: .literal('python311'),
  ///     entryPoint: .literal('handle'),
  ///     source: .storageSource(
  ///       .new(
  ///         bucket: .of(bucket),
  ///         object: .literal('order-handler.zip'),
  ///       ),
  ///     ),
  ///     updatePolicy: .automaticUpdatePolicy(
  ///       .new(),
  ///     ),
  ///   ),
  ///   eventTrigger: Cloudfunctions2FunctionEventTrigger(
  ///     eventType: .literal('google.cloud.pubsub.topic.v1.messagePublished'),
  ///     pubsubTopic: .of(orders),
  ///     retryPolicy: .retry,
  ///   ),
  /// );
  /// ```

sealedNames:
  "build_config.source.repo_source.branch_name, build_config.source.repo_source.commit_sha, build_config.source.repo_source.tag_name": revision
  "service_config.direct_vpc_network_interface, service_config.vpc_connector": connection

paramOrder:
  - name
  - location
  - description
  - build_config
  - service_config
  - event_trigger
  - labels
  - kms_key_name
  - project

extraImports:
  - "import 'package:meta/meta.dart';"

# dartTypeOverrides intentionally empty: every enum-typed field on this
# resource lives in a nested block (service_config.* / event_trigger.*).
# Those fields are strongly typed at the helper-class level
# (e.g. `IngressSettings? ingressSettings` inside `Cloudfunctions2FunctionServiceConfig`).
# The dartTypeOverrides axis is reserved for root-level enum fields, which
# this resource has none of.

prelude: |
  // ===========================================================================
  // Enums (sourced from schema "Possible values" prose)
  // ===========================================================================

  /// `event_trigger.retry_policy` -- behaviour when the user code raises.
  /// `retry` re-delivers per the system retry budget; `doNotRetry` drops on
  /// first failure; `unspecified` defers to the server default (currently
  /// `doNotRetry`).
  extension type const EventTriggerRetryPolicy._(TfArg<String> _) implements TfArg<String> {
    EventTriggerRetryPolicy.variable(String name) : this._(TfArg.variable(name));
    EventTriggerRetryPolicy.expression(String template) : this._(TfArg.expression(template));
    const EventTriggerRetryPolicy.arg(TfArg<String> arg) : this._(arg);

    static const unspecified = EventTriggerRetryPolicy._(TfArgLiteral('RETRY_POLICY_UNSPECIFIED'));
    static const doNotRetry = EventTriggerRetryPolicy._(TfArgLiteral('RETRY_POLICY_DO_NOT_RETRY'));
    static const retry = EventTriggerRetryPolicy._(TfArgLiteral('RETRY_POLICY_RETRY'));

    static const List<EventTriggerRetryPolicy> values = [unspecified, doNotRetry, retry];
  }

  /// `service_config.ingress_settings` -- which traffic sources can invoke
  /// the underlying Cloud Run service. Defaults server-side to `allowAll`.
  extension type const IngressSettings._(TfArg<String> _) implements TfArg<String> {
    IngressSettings.variable(String name) : this._(TfArg.variable(name));
    IngressSettings.expression(String template) : this._(TfArg.expression(template));
    const IngressSettings.arg(TfArg<String> arg) : this._(arg);

    static const allowAll = IngressSettings._(TfArgLiteral('ALLOW_ALL'));
    static const allowInternalOnly = IngressSettings._(TfArgLiteral('ALLOW_INTERNAL_ONLY'));
    static const allowInternalAndGclb = IngressSettings._(TfArgLiteral('ALLOW_INTERNAL_AND_GCLB'));

    static const List<IngressSettings> values = [allowAll, allowInternalOnly, allowInternalAndGclb];
  }

  /// `service_config.direct_vpc_egress` -- egress policy for direct VPC
  /// network interfaces. Server default is `vpcEgressPrivateRangesOnly`.
  extension type const DirectVpcEgress._(TfArg<String> _) implements TfArg<String> {
    DirectVpcEgress.variable(String name) : this._(TfArg.variable(name));
    DirectVpcEgress.expression(String template) : this._(TfArg.expression(template));
    const DirectVpcEgress.arg(TfArg<String> arg) : this._(arg);

    static const vpcEgressAllTraffic = DirectVpcEgress._(TfArgLiteral('VPC_EGRESS_ALL_TRAFFIC'));
    static const vpcEgressPrivateRangesOnly = DirectVpcEgress._(TfArgLiteral('VPC_EGRESS_PRIVATE_RANGES_ONLY'));

    static const List<DirectVpcEgress> values = [vpcEgressAllTraffic, vpcEgressPrivateRangesOnly];
  }

  /// `service_config.vpc_connector_egress_settings` -- egress policy when
  /// the function attaches via a Serverless VPC Access connector
  /// ([Cloudfunctions2FunctionServiceConfig.vpcConnector]). Mutually exclusive in spirit with
  /// [DirectVpcEgress] (which applies when using direct VPC egress).
  extension type const VpcConnectorEgressSettings._(TfArg<String> _) implements TfArg<String> {
    VpcConnectorEgressSettings.variable(String name) : this._(TfArg.variable(name));
    VpcConnectorEgressSettings.expression(String template) : this._(TfArg.expression(template));
    const VpcConnectorEgressSettings.arg(TfArg<String> arg) : this._(arg);

    static const unspecified = VpcConnectorEgressSettings._(TfArgLiteral('VPC_CONNECTOR_EGRESS_SETTINGS_UNSPECIFIED'));
    static const privateRangesOnly = VpcConnectorEgressSettings._(TfArgLiteral('PRIVATE_RANGES_ONLY'));
    static const allTraffic = VpcConnectorEgressSettings._(TfArgLiteral('ALL_TRAFFIC'));

    static const List<VpcConnectorEgressSettings> values = [unspecified, privateRangesOnly, allTraffic];
  }

dartTypeOverrides:
  event_trigger.retry_policy: EventTriggerRetryPolicy
  service_config.direct_vpc_egress: DirectVpcEgress
  service_config.ingress_settings: IngressSettings
  service_config.vpc_connector_egress_settings: VpcConnectorEgressSettings
