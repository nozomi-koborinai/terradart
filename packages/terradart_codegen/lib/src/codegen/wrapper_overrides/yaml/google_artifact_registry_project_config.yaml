outputDir: artifact_registry

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// Project-level Artifact Registry settings (platform logs) for a location.
  /// The API auto-creates this config; Terraform acquires and updates the
  /// existing resource. Destroy removes it from state only — the live config
  /// remains in GCP.

paramOrder:
  - location
  - platform_logs_config
  - project

extraImports:
  - "import 'package:meta/meta.dart';"

prelude: |
  /// `platform_logs_config.logging_state` — whether platform logs are emitted.
  extension type const ArtifactRegistryPlatformLogsLoggingState._(TfArg<String> _) implements TfArg<String> {
    ArtifactRegistryPlatformLogsLoggingState.variable(String name) : this._(TfArg.variable(name));
    ArtifactRegistryPlatformLogsLoggingState.expression(String template) : this._(TfArg.expression(template));
    const ArtifactRegistryPlatformLogsLoggingState.arg(TfArg<String> arg) : this._(arg);

    static const enabled = ArtifactRegistryPlatformLogsLoggingState._(TfArgLiteral('ENABLED'));
    static const disabled = ArtifactRegistryPlatformLogsLoggingState._(TfArgLiteral('DISABLED'));

    static const List<ArtifactRegistryPlatformLogsLoggingState> values = [enabled, disabled];
  }

  /// `platform_logs_config.severity_level` — minimum log severity to record.
  extension type const ArtifactRegistryPlatformLogsSeverityLevel._(TfArg<String> _) implements TfArg<String> {
    ArtifactRegistryPlatformLogsSeverityLevel.variable(String name) : this._(TfArg.variable(name));
    ArtifactRegistryPlatformLogsSeverityLevel.expression(String template) : this._(TfArg.expression(template));
    const ArtifactRegistryPlatformLogsSeverityLevel.arg(TfArg<String> arg) : this._(arg);

    static const debug = ArtifactRegistryPlatformLogsSeverityLevel._(TfArgLiteral('DEBUG'));
    static const info = ArtifactRegistryPlatformLogsSeverityLevel._(TfArgLiteral('INFO'));
    static const notice = ArtifactRegistryPlatformLogsSeverityLevel._(TfArgLiteral('NOTICE'));
    static const warning = ArtifactRegistryPlatformLogsSeverityLevel._(TfArgLiteral('WARNING'));
    static const error = ArtifactRegistryPlatformLogsSeverityLevel._(TfArgLiteral('ERROR'));
    static const critical = ArtifactRegistryPlatformLogsSeverityLevel._(TfArgLiteral('CRITICAL'));
    static const alert = ArtifactRegistryPlatformLogsSeverityLevel._(TfArgLiteral('ALERT'));
    static const emergency = ArtifactRegistryPlatformLogsSeverityLevel._(TfArgLiteral('EMERGENCY'));

    static const List<ArtifactRegistryPlatformLogsSeverityLevel> values = [debug, info, notice, warning, error, critical, alert, emergency];
  }

  /// `platform_logs_config` block — platform log emission for Artifact Registry
  /// operations in this project/location.
  @immutable
  class ArtifactRegistryProjectConfigPlatformLogsConfig {
    const ArtifactRegistryProjectConfigPlatformLogsConfig({
      this.loggingState,
      this.severityLevel,
    });

    final ArtifactRegistryPlatformLogsLoggingState? loggingState;
    final ArtifactRegistryPlatformLogsSeverityLevel? severityLevel;

    Map<String, Object?> toArgMap() => {
      if (loggingState != null)
        'logging_state': loggingState!.toTfJson(),
      if (severityLevel != null)
        'severity_level': severityLevel!.toTfJson(),
    };
  }

customSlots:
  platform_logs_config:
    paramDeclaration: 'ArtifactRegistryProjectConfigPlatformLogsConfig? platformLogsConfig'
    argMapEntry: "if (platformLogsConfig != null) 'platform_logs_config': TfArg.literal([platformLogsConfig.toArgMap()]),"
