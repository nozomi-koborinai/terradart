outputDir: managed
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true
deriveEnums: true

extraImports:
  - "import 'package:meta/meta.dart';"

curatedDoc: |-
  /// Kafka **ACL** entry set on a [GoogleManagedKafkaCluster].
  ///
  /// **Cost:** no separate Cloud Billing Catalog SKU — ACL metadata on the
  /// parent cluster. Deferred with the cluster (no apply-smoke quickstart).
  ///
  /// [aclId] encodes the resource pattern (see provider docs). Provide at
  /// least one [aclEntries] principal/operation.
  ///
  /// Example:
  /// ```dart
  /// final vpc = add(GoogleComputeNetwork('vpc', name: .literal('vpc')));
  /// final subnet = add(GoogleComputeSubnetwork(
  ///   'subnet',
  ///   name: .literal('subnet'),
  ///   network: vpc.ref,
  /// ));
  /// final cluster = add(GoogleManagedKafkaCluster(
  ///   'cluster',
  ///   clusterId: .literal('cluster'),
  ///   location: .literal('us-central1'),
  ///   capacityConfig: ManagedKafkaClusterCapacityConfig(
  ///     memoryBytes: .literal('3221225472'),
  ///     vcpuCount: .literal('3'),
  ///   ),
  ///   gcpConfig: ManagedKafkaClusterGcpConfig(
  ///     accessConfig: ManagedKafkaClusterAccessConfig(
  ///       networkConfigs: [
  ///         ManagedKafkaClusterNetworkConfigs(subnet: subnet.ref),
  ///       ],
  ///     ),
  ///   ),
  /// ));
  /// GoogleManagedKafkaAcl(
  ///   'eventsAcl',
  ///   aclId: TfArg.literal('topic/events'),
  ///   cluster: cluster.clusterId,
  ///   location: TfArg.literal('us-central1'),
  ///   aclEntries: [
  ///     ManagedKafkaAclEntries(
  ///       principal: TfArg.literal('User:serviceAccount:sa@proj.iam.gserviceaccount.com'),
  ///       operation: .all,
  ///       permissionType: .allow,
  ///     ),
  ///   ],
  /// );
  /// ```

paramOrder:
  - acl_id
  - cluster
  - location
  - acl_entries
  - deletion_policy
  - project
