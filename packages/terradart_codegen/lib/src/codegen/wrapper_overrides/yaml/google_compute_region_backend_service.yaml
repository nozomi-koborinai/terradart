  }

  /// `log_config.optional_mode`. Controls which optional access-log
  /// fields are exported when [ComputeRegionBackendServiceLogConfig.enable] is
  /// true.
  extension type const RegionBackendServiceLogOptionalMode._(TfArg<String> _) implements TfArg<String> {
    RegionBackendServiceLogOptionalMode.variable(String name) : this._(TfArg.variable(name));
    RegionBackendServiceLogOptionalMode.expression(String template) : this._(TfArg.expression(template));
    const RegionBackendServiceLogOptionalMode.arg(TfArg<String> arg) : this._(arg);

    static const includeAllOptional = RegionBackendServiceLogOptionalMode._(TfArgLiteral('INCLUDE_ALL_OPTIONAL'));
    static const excludeAllOptional = RegionBackendServiceLogOptionalMode._(TfArgLiteral('EXCLUDE_ALL_OPTIONAL'));
    static const custom = RegionBackendServiceLogOptionalMode._(TfArgLiteral('CUSTOM'));

