    static const zonalAffinitySpillCrossZone = RegionBackendServiceZonalAffinitySpillover._(TfArgLiteral('ZONAL_AFFINITY_SPILL_CROSS_ZONE'));
    static const zonalAffinityStayWithinZone = RegionBackendServiceZonalAffinitySpillover._(TfArgLiteral('ZONAL_AFFINITY_STAY_WITHIN_ZONE'));

    static const List<RegionBackendServiceZonalAffinitySpillover> values = [zonalAffinityDisabled, zonalAffinitySpillCrossZone, zonalAffinityStayWithinZone];
  }

  /// `connection_tracking_policy.connection_persistence_on_unhealthy_backends`.
