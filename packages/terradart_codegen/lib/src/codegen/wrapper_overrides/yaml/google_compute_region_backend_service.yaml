outputDir: compute

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true

curatedDoc: |-
  /// A **regional** backend service is the load-balancing target for
  /// Internal Application LBs, Internal Proxy NLBs, Regional External
  /// Application LBs, Regional External Proxy NLBs, and Internal /
  /// External Passthrough Network LBs. It groups a set of backends
  /// (instance groups or network endpoint groups) inside a single GCP
  /// region and routes traffic to them according to the configured
  /// [protocol], [loadBalancingScheme], [localityLbPolicy], and
  /// [sessionAffinity].
  ///
  /// For globally-scoped load balancing use `google_compute_backend_service`
  /// (curated separately). The regional resource accepts `INTERNAL` and
  /// `INTERNAL_MANAGED` schemes that the global resource will reject at
  /// apply time, and it also surfaces a handful of regional-only blocks:
  /// [ComputeRegionBackendServiceFailoverPolicy] (Internal Passthrough NLB
  /// failover), [ComputeRegionBackendServiceHaPolicy] (self-managed HA for
  /// Passthrough NLBs), and
  /// [ComputeRegionBackendServiceNetworkPassThroughLbTrafficPolicy] (zonal
  /// affinity for Internal Passthrough NLBs). It does *not* support the
  /// global-only blocks `locality_lb_policies`, `security_settings`, or
  /// `max_stream_duration`, nor the global-only `compression_mode`,
  /// `custom_request_headers`, `custom_response_headers`,
  /// `edge_security_policy`, or `service_lb_policy` attributes.
  ///
  /// Required identity:
  /// - [localName]: Terraform local name (the address segment after
  ///   `google_compute_region_backend_service.`).
  /// - `name`: GCP resource name (1-63 chars, lowercase RFC1035).
  /// - `region`: GCP region. The Terraform schema lists this as
  ///   optional+computed (the provider falls back to the provider-level
  ///   region), but it is wrapped as required here to keep cross-region
  ///   composition explicit.
  ///
  /// Cross-resource references (typical wiring):
  /// - [healthChecks]: list of self-links to `google_compute_health_check`
  ///   or `google_compute_region_health_check` resources. Required unless
  ///   every backend is an internet/serverless NEG, or the resource uses
  ///   [ComputeRegionBackendServiceHaPolicy] (HA-managed services cannot
  ///   coexist with health checks).
  /// - [securityPolicy]: self-link to a regional Cloud Armor
  ///   `google_compute_region_security_policy`. Regional Cloud Armor
  ///   support is restricted to certain `load_balancing_scheme` values
  ///   (notably the regional managed schemes); the API rejects
  ///   incompatible combinations at apply time.
  /// - [ComputeRegionBackendServiceBackend.group]: self-link of an instance
  ///   group, regional MIG, or `region_network_endpoint_group`. All
  ///   backends in one service must share a kind (no mixing instance
  ///   groups with NEGs).
  /// - [network]: self-link of a `google_compute_network`. Required for
  ///   Internal Passthrough NLBs when [ComputeRegionBackendServiceHaPolicy] is
  ///   set, and for External Passthrough NLBs when `haPolicy.fastIpMove`
  ///   is enabled. Only settable when [loadBalancingScheme] is `INTERNAL`,
  ///   or `EXTERNAL` with `haPolicy.fastIpMove`.
  ///
  /// Example (internal application LB backend, IAP-protected):
  /// ```dart
  /// final api = GoogleComputeRegionBackendService(
  ///   'api',
  ///   name: TfArg.literal('api-rbs'),
  ///   region: TfArg.literal('asia-northeast1'),
  ///   protocol: RegionBackendServiceProtocol.https,
  ///   loadBalancingScheme:
  ///       RegionBackendServiceLoadBalancingScheme.internalManaged,
  ///   portName: TfArg.literal('https'),
  ///   timeoutSec: TfArg.literal(30),
  ///   healthChecks: TfArg.literal([
  ///     // From Batch 2: either `google_compute_health_check` or
  ///     // `google_compute_region_health_check` is acceptable.
  ///     'projects/p/regions/asia-northeast1/healthChecks/api-hc',
  ///   ]),
  ///   securityPolicy: TfArg.literal(
  ///     // var.security_policy_id — see Batch 4 regional Cloud Armor.
  ///     'projects/p/regions/asia-northeast1/securityPolicies/edge-deny-all',
  ///   ),
  ///   backend: [
  ///     ComputeRegionBackendServiceBackend(
  ///       group: TfArg.literal(
  ///         // var.backend_group_id — typically a Batch 4 regional NEG
  ///         // or a Batch 3 regional MIG self-link.
  ///         'projects/p/regions/asia-northeast1/networkEndpointGroups/api-rneg',
  ///       ),
  ///       balancingMode: RegionBackendServiceBalancingMode.rate,
  ///       maxRatePerEndpoint: TfArg.literal(100),
  ///       capacityScaler: TfArg.literal(1.0),
  ///     ),
  ///   ],
  ///   iap: ComputeRegionBackendServiceIap(
  ///     enabled: TfArg.literal(true),
  ///     oauth2ClientId: TfArg.literal('xxx.apps.googleusercontent.com'),
  ///     // sensitive — masked at synth.
  ///     oauth2ClientSecret: TfArg.literal('super-secret'),
  ///   ),
  ///   logConfig: ComputeRegionBackendServiceLogConfig(
  ///     enable: TfArg.literal(true),
  ///     sampleRate: TfArg.literal(1.0),
  ///   ),
  /// );
  /// ```
  ///
  /// Sensitive fields (round-trip through the generated `sensitiveFields`
  /// set): `iap.oauth2_client_secret` and the computed
  /// `iap.oauth2_client_secret_sha256` (provider-side detail). The global
  /// `security_settings.aws_v4_authentication.access_key` is **not**
  /// present on the regional resource — `security_settings` has no
  /// regional analog.

paramOrder:
  - name
  - region
  - description
  - protocol
  - port_name
  - load_balancing_scheme
  - locality_lb_policy
  - session_affinity
  - affinity_cookie_ttl_sec
  - timeout_sec
  - connection_draining_timeout_sec
  - enable_cdn
  - ip_address_selection_policy
  - network
  - health_checks
  - security_policy
  - backend
  - cdn_policy
  - iap
  - circuit_breakers
  - consistent_hash
  - connection_tracking_policy
  - outlier_detection
  - log_config
  - custom_metrics
  - strong_session_affinity_cookie
  - failover_policy
  - ha_policy
  - network_pass_through_lb_traffic_policy
  - tls_settings
  - params
  - project

extraImports:
  - "import 'package:meta/meta.dart';"

deriveOutputGetters: true

extraGetters: |2

    /// Reference to the server-assigned numeric `generated_id`.
    /// Kept at `TfRef<int>` — schema type is `number` (derived would widen
    /// to `TfRef<num>`).
    TfRef<int> get generatedId => TfRef.attribute<int>(this, 'generated_id');

dartTypeOverrides:
  protocol: RegionBackendServiceProtocol
  load_balancing_scheme: RegionBackendServiceLoadBalancingScheme
  locality_lb_policy: RegionBackendServiceLocalityLbPolicy
  session_affinity: RegionBackendServiceSessionAffinity
  ip_address_selection_policy: RegionBackendServiceIpAddressSelectionPolicy
  backend.balancing_mode: RegionBackendServiceBalancingMode
  cdn_policy.cache_mode: RegionBackendServiceCacheMode
  connection_tracking_policy.connection_persistence_on_unhealthy_backends: RegionBackendServiceConnectionPersistence
  connection_tracking_policy.tracking_mode: RegionBackendServiceTrackingMode
  ha_policy.fast_ip_move: RegionBackendServiceFastIpMove
  log_config.optional_mode: RegionBackendServiceLogOptionalMode
  network_pass_through_lb_traffic_policy.zonal_affinity.spillover: RegionBackendServiceZonalAffinitySpillover

prelude: |
  // ===========================================================================
  // Top-level enums
  // ===========================================================================

  /// Wire protocol the regional backend service uses to talk to backends.
  /// `HTTP2` and `H2C` require an HTTP(S)-class load balancer; `TCP`,
  /// `SSL`, and `UDP` are for Passthrough Network Load Balancing /
  /// regional internal proxy routing. `GRPC` is required when the URL
  /// map is bound to a regional target gRPC proxy.
  extension type const RegionBackendServiceProtocol._(TfArg<String> _) implements TfArg<String> {
    RegionBackendServiceProtocol.variable(String name) : this._(TfArg.variable(name));
    RegionBackendServiceProtocol.expression(String template) : this._(TfArg.expression(template));
    const RegionBackendServiceProtocol.arg(TfArg<String> arg) : this._(arg);

    static const http = RegionBackendServiceProtocol._(TfArgLiteral('HTTP'));
    static const https = RegionBackendServiceProtocol._(TfArgLiteral('HTTPS'));
    static const http2 = RegionBackendServiceProtocol._(TfArgLiteral('HTTP2'));
    static const tcp = RegionBackendServiceProtocol._(TfArgLiteral('TCP'));
    static const ssl = RegionBackendServiceProtocol._(TfArgLiteral('SSL'));
    static const udp = RegionBackendServiceProtocol._(TfArgLiteral('UDP'));
    static const grpc = RegionBackendServiceProtocol._(TfArgLiteral('GRPC'));
    static const unspecified = RegionBackendServiceProtocol._(TfArgLiteral('UNSPECIFIED'));
    static const h2c = RegionBackendServiceProtocol._(TfArgLiteral('H2C'));

    static const List<RegionBackendServiceProtocol> values = [http, https, http2, tcp, ssl, udp, grpc, unspecified, h2c];
  }

  /// `load_balancing_scheme`. A backend service of one scheme cannot be
  /// repurposed for another — the value is effectively immutable.
  ///
  /// **Regional-vs-global**: this wrapper is for the *regional* variant
  /// (`google_compute_region_backend_service`). The full set of values
  /// is accepted at apply time depending on the front-end load balancer
  /// kind — most notably [internal] (Internal Passthrough NLB) and
  /// [internalManaged] (Internal Application LB / Regional External
  /// Application LB) are unique to the regional resource and will be
  /// rejected by `google_compute_backend_service`.
  extension type const RegionBackendServiceLoadBalancingScheme._(TfArg<String> _) implements TfArg<String> {
    RegionBackendServiceLoadBalancingScheme.variable(String name) : this._(TfArg.variable(name));
    RegionBackendServiceLoadBalancingScheme.expression(String template) : this._(TfArg.expression(template));
    const RegionBackendServiceLoadBalancingScheme.arg(TfArg<String> arg) : this._(arg);

    static const external = RegionBackendServiceLoadBalancingScheme._(TfArgLiteral('EXTERNAL'));
    static const externalManaged = RegionBackendServiceLoadBalancingScheme._(TfArgLiteral('EXTERNAL_MANAGED'));
    static const internal = RegionBackendServiceLoadBalancingScheme._(TfArgLiteral('INTERNAL'));
    static const internalManaged = RegionBackendServiceLoadBalancingScheme._(TfArgLiteral('INTERNAL_MANAGED'));
    static const internalSelfManaged = RegionBackendServiceLoadBalancingScheme._(TfArgLiteral('INTERNAL_SELF_MANAGED'));

    static const List<RegionBackendServiceLoadBalancingScheme> values = [external, externalManaged, internal, internalManaged, internalSelfManaged];
  }

  /// `locality_lb_policy`. See the schema docstring for the matrix of which
  /// values are valid for which combination of `protocol` and
  /// `load_balancing_scheme` — Cloud Load Balancing silently coerces
  /// invalid values to the scheme's default at apply time. For External
  /// Passthrough NLBs only [maglev] and [weightedMaglev] are honored;
  /// for INTERNAL_MANAGED with HTTP-class protocols the full set is
  /// available.
  extension type const RegionBackendServiceLocalityLbPolicy._(TfArg<String> _) implements TfArg<String> {
    RegionBackendServiceLocalityLbPolicy.variable(String name) : this._(TfArg.variable(name));
    RegionBackendServiceLocalityLbPolicy.expression(String template) : this._(TfArg.expression(template));
    const RegionBackendServiceLocalityLbPolicy.arg(TfArg<String> arg) : this._(arg);

    static const roundRobin = RegionBackendServiceLocalityLbPolicy._(TfArgLiteral('ROUND_ROBIN'));
    static const leastRequest = RegionBackendServiceLocalityLbPolicy._(TfArgLiteral('LEAST_REQUEST'));
    static const ringHash = RegionBackendServiceLocalityLbPolicy._(TfArgLiteral('RING_HASH'));
    static const random = RegionBackendServiceLocalityLbPolicy._(TfArgLiteral('RANDOM'));
    static const originalDestination = RegionBackendServiceLocalityLbPolicy._(TfArgLiteral('ORIGINAL_DESTINATION'));
    static const maglev = RegionBackendServiceLocalityLbPolicy._(TfArgLiteral('MAGLEV'));
    static const weightedMaglev = RegionBackendServiceLocalityLbPolicy._(TfArgLiteral('WEIGHTED_MAGLEV'));
    static const weightedRoundRobin = RegionBackendServiceLocalityLbPolicy._(TfArgLiteral('WEIGHTED_ROUND_ROBIN'));

    static const List<RegionBackendServiceLocalityLbPolicy> values = [roundRobin, leastRequest, ringHash, random, originalDestination, maglev, weightedMaglev, weightedRoundRobin];
  }

  /// `session_affinity`. Applicable only when the locality LB policy is
  /// one of `MAGLEV`, `WEIGHTED_MAGLEV`, or `RING_HASH` for HTTP-class
  /// balancers; for Passthrough NLBs [clientIp] and the
  /// 5-tuple variants apply directly. The regional resource adds
  /// [clientIpNoDestination] (Passthrough NLB variant that ignores the
  /// destination tuple component) versus the global resource.
  extension type const RegionBackendServiceSessionAffinity._(TfArg<String> _) implements TfArg<String> {
    RegionBackendServiceSessionAffinity.variable(String name) : this._(TfArg.variable(name));
    RegionBackendServiceSessionAffinity.expression(String template) : this._(TfArg.expression(template));
    const RegionBackendServiceSessionAffinity.arg(TfArg<String> arg) : this._(arg);

    static const none = RegionBackendServiceSessionAffinity._(TfArgLiteral('NONE'));
    static const clientIp = RegionBackendServiceSessionAffinity._(TfArgLiteral('CLIENT_IP'));
    static const clientIpPortProto = RegionBackendServiceSessionAffinity._(TfArgLiteral('CLIENT_IP_PORT_PROTO'));
    static const clientIpProto = RegionBackendServiceSessionAffinity._(TfArgLiteral('CLIENT_IP_PROTO'));
    static const generatedCookie = RegionBackendServiceSessionAffinity._(TfArgLiteral('GENERATED_COOKIE'));
    static const headerField = RegionBackendServiceSessionAffinity._(TfArgLiteral('HEADER_FIELD'));
    static const httpCookie = RegionBackendServiceSessionAffinity._(TfArgLiteral('HTTP_COOKIE'));
    static const clientIpNoDestination = RegionBackendServiceSessionAffinity._(TfArgLiteral('CLIENT_IP_NO_DESTINATION'));
    static const strongCookieAffinity = RegionBackendServiceSessionAffinity._(TfArgLiteral('STRONG_COOKIE_AFFINITY'));

    static const List<RegionBackendServiceSessionAffinity> values = [none, clientIp, clientIpPortProto, clientIpProto, generatedCookie, headerField, httpCookie, clientIpNoDestination, strongCookieAffinity];
  }

  /// `ip_address_selection_policy`. Controls IPv4-vs-IPv6 preference when
  /// the load balancer dials a backend (or when a proxyless gRPC client
  /// dials directly).
  extension type const RegionBackendServiceIpAddressSelectionPolicy._(TfArg<String> _) implements TfArg<String> {
    RegionBackendServiceIpAddressSelectionPolicy.variable(String name) : this._(TfArg.variable(name));
    RegionBackendServiceIpAddressSelectionPolicy.expression(String template) : this._(TfArg.expression(template));
    const RegionBackendServiceIpAddressSelectionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const ipv4Only = RegionBackendServiceIpAddressSelectionPolicy._(TfArgLiteral('IPV4_ONLY'));
    static const preferIpv6 = RegionBackendServiceIpAddressSelectionPolicy._(TfArgLiteral('PREFER_IPV6'));
    static const ipv6Only = RegionBackendServiceIpAddressSelectionPolicy._(TfArgLiteral('IPV6_ONLY'));

    static const List<RegionBackendServiceIpAddressSelectionPolicy> values = [ipv4Only, preferIpv6, ipv6Only];
  }

  /// Per-backend balancing mode. See [ComputeRegionBackendServiceBackend.balancingMode].
  /// Note: the regional resource omits the global `IN_FLIGHT` mode.
  extension type const RegionBackendServiceBalancingMode._(TfArg<String> _) implements TfArg<String> {
    RegionBackendServiceBalancingMode.variable(String name) : this._(TfArg.variable(name));
    RegionBackendServiceBalancingMode.expression(String template) : this._(TfArg.expression(template));
    const RegionBackendServiceBalancingMode.arg(TfArg<String> arg) : this._(arg);

    static const utilization = RegionBackendServiceBalancingMode._(TfArgLiteral('UTILIZATION'));
    static const rate = RegionBackendServiceBalancingMode._(TfArgLiteral('RATE'));
    static const connection = RegionBackendServiceBalancingMode._(TfArgLiteral('CONNECTION'));
    static const customMetrics = RegionBackendServiceBalancingMode._(TfArgLiteral('CUSTOM_METRICS'));

    static const List<RegionBackendServiceBalancingMode> values = [utilization, rate, connection, customMetrics];
  }

  /// `cdn_policy.cache_mode`. Enabling CDN (`enable_cdn = true`) without
