    argMapEntry: "if (tcpHealthCheck != null) 'tcp_health_check': TfArg.literal([tcpHealthCheck.toArgMap()]),"
  ssl_health_check:
    paramDeclaration: 'ComputeHealthCheckSslHealthCheckConfig? sslHealthCheck'
    argMapEntry: "if (sslHealthCheck != null) 'ssl_health_check': TfArg.literal([sslHealthCheck.toArgMap()]),"
  grpc_health_check:
    paramDeclaration: 'ComputeHealthCheckGrpcHealthCheckConfig? grpcHealthCheck'
    argMapEntry: "if (grpcHealthCheck != null) 'grpc_health_check': TfArg.literal([grpcHealthCheck.toArgMap()]),"
  log_config:
    paramDeclaration: 'ComputeHealthCheckHealthCheckLogConfig? logConfig'
    argMapEntry: "if (logConfig != null) 'log_config': TfArg.literal([logConfig.toArgMap()]),"
