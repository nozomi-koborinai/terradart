outputDir: contact

deriveClassDoc: true
deriveNestedTypes: true
deriveExactlyOne: true
deriveOutputGetters: true

curatedDoc: |-
  /// Location-level CMEK for Contact Center AI Insights.
  ///
  /// Enable `contactcenterinsights.googleapis.com` via [GoogleProjectService]
  /// before apply. The [kmsKey] must live in the same region as [location].
  ///
  /// Example:
  /// ```dart
  /// final ring = add(GoogleKmsKeyRing(
  ///   'ring',
  ///   name: .literal('ring'),
  ///   location: .literal('asia-northeast1'),
  /// ));
  /// final paymentsKey = add(GoogleKmsCryptoKey(
  ///   'payments_key',
  ///   name: .literal('payments'),
  ///   keyRing: ring.ref,
  /// ));
  /// GoogleContactCenterInsightsEncryptionSpec(
  ///   'insights_cmek',
  ///   location: TfArg.literal('asia-northeast1'),
  ///   kmsKey: paymentsKey.ref,
  /// );
  /// ```

paramOrder:
  - location
  - kms_key
  - project
