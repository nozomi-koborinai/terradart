outputDir: identity
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true
deriveEnums: true

extraImports:
  - "import 'package:meta/meta.dart';"


dartTypeOverrides:
  initial_group_config: CloudIdentityGroupInitialGroupConfig

prelude: |
  /// Cloud Identity Group Initial Group enum for `initial_group_config`.
  extension type const CloudIdentityGroupInitialGroupConfig._(TfArg<String> _) implements TfArg<String> {
    CloudIdentityGroupInitialGroupConfig.variable(String name) : this._(TfArg.variable(name));
    CloudIdentityGroupInitialGroupConfig.expression(String template) : this._(TfArg.expression(template));
    const CloudIdentityGroupInitialGroupConfig.arg(TfArg<String> arg) : this._(arg);

    static const initialGroupConfigUnspecified = CloudIdentityGroupInitialGroupConfig._(TfArgLiteral('INITIAL_GROUP_CONFIG_UNSPECIFIED'));
    static const withInitialOwner = CloudIdentityGroupInitialGroupConfig._(TfArgLiteral('WITH_INITIAL_OWNER'));
    static const empty = CloudIdentityGroupInitialGroupConfig._(TfArgLiteral('EMPTY'));

    static const List<CloudIdentityGroupInitialGroupConfig> values = [initialGroupConfigUnspecified, withInitialOwner, empty];
  }

curatedDoc: |-
  /// Leftover factory on the apply-excluded path
  /// (synth + `terraform validate` only).
  ///
  /// Needs an organization / folder / billing account /
  /// external artifact that standalone terradart-validate
  /// cannot supply. Do not apply.

paramOrder:
  - deletion_policy
  - description
  - display_name
  - initial_group_config
  - labels
  - parent
  - group_key
