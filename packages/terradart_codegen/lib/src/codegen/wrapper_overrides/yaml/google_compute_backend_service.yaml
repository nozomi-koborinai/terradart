outputDir: compute

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true

curatedDoc: |-
  /// A **global** backend service is the load-balancing target for global
  /// external HTTP(S) load balancers and for Traffic Director's self-managed
  /// internal load balancing. It groups a set of backends (instance groups,
  /// network endpoint groups, or backend buckets) and routes traffic to
  /// them according to the configured [protocol], [loadBalancingScheme],
  /// [localityLbPolicy], and [sessionAffinity].
  ///
  /// For regional load balancing use `google_compute_region_backend_service`
  /// (curated separately). Regional-only [LoadBalancingScheme] values
  /// (`INTERNAL`, `INTERNAL_MANAGED`) are surfaced on this wrapper because
  /// they appear in the Terraform schema, but the GCP API will reject them
  /// on a global backend service at apply time.
  ///
  /// Required identity:
  /// - [localName]: Terraform local name (the address segment after
  ///   `google_compute_backend_service.`).
  /// - `name`: GCP resource name (1-63 chars, lowercase RFC1035).
  ///
  /// Cross-resource references (typical wiring):
  /// - [healthChecks]: list of self-links to `google_compute_health_check`
  ///   resources. Required unless every backend is an internet/serverless NEG.
  /// - [securityPolicy]: self-link to a Cloud Armor `google_compute_security_policy`.
  /// - [ComputeBackendServiceBackend.group]: self-link of an instance group, MIG,
  ///   or NEG. All backends in one service must share a kind (no mixing
  ///   instance groups with NEGs).
  ///
  /// Example (external HTTPS load balancer backend, IAP-protected):
  /// ```dart
  /// final api = GoogleComputeBackendService(
  ///   'api',
  ///   name: TfArg.literal('api-backend'),
  ///   protocol: BackendServiceProtocol.https,
  ///   loadBalancingScheme:
  ///       LoadBalancingScheme.externalManaged,
  ///   portName: TfArg.literal('https'),
  ///   timeoutSec: TfArg.literal(30),
  ///   enableCdn: TfArg.literal(false),
  ///   healthChecks: TfArg.literal([
  ///     // var.health_check_id resolves to a `google_compute_health_check`
  ///     // self-link from Batch 2.
  ///     'projects/p/global/healthChecks/api-hc',
  ///   ]),
  ///   securityPolicy: .literal(
  ///     // var.security_policy_id — see Cloud Armor curation in Batch 4.
  ///     'projects/p/global/securityPolicies/edge-deny-all',
  ///   ),
  ///   backend: [
  ///     ComputeBackendServiceBackend(
  ///       group: TfArg.literal(
  ///         // var.backend_group_id — typically a Batch 4 NEG or a
  ///         // Batch 3 MIG self-link.
  ///         'projects/p/zones/asia-northeast1-a/networkEndpointGroups/api-neg',
  ///       ),
  ///       balancingMode: BackendServiceBalancingMode.rate,
  ///       maxRatePerEndpoint: TfArg.literal(100),
  ///       capacityScaler: TfArg.literal(1.0),
  ///     ),
  ///   ],
  ///   iap: ComputeBackendServiceIap(
  ///     enabled: TfArg.literal(true),
  ///     oauth2ClientId: .oauth2ClientId(
  ///       TfArg.literal('xxx.apps.googleusercontent.com'),
  ///     ),
  ///     // sensitive — masked at synth.
  ///     oauth2ClientSecret: .oauth2ClientSecret(
  ///       TfArg.literal('super-secret'),
  ///     ),
  ///   ),
  ///   logConfig: ComputeBackendServiceLogConfig(
  ///     enable: TfArg.literal(true),
  ///     sampleRate: TfArg.literal(1.0),
  ///   ),
  /// );
  /// ```
  ///
  /// Sensitive fields (round-trip through the generated `sensitiveFields`
  /// set): `iap.oauth2_client_secret`, `iap.oauth2_client_secret_sha256`
  /// (computed), and `security_settings.aws_v4_authentication.access_key`.

paramOrder:
  - name
  - description
  - protocol
  - port_name
  - load_balancing_scheme
  - locality_lb_policy
  - session_affinity
  - affinity_cookie_ttl_sec
  - timeout_sec
  - connection_draining_timeout_sec
  - enable_cdn
  - compression_mode
  - ip_address_selection_policy
  - custom_request_headers
  - custom_response_headers
  - health_checks
  - security_policy
  - edge_security_policy
  - service_lb_policy
  - external_managed_migration_state
  - external_managed_migration_testing_percentage
  - backend
  - cdn_policy
  - iap
  - circuit_breakers
  - consistent_hash
  - outlier_detection
  - log_config
  - security_settings
  - locality_lb_policies
  - custom_metrics
  - max_stream_duration
  - strong_session_affinity_cookie
  - tls_settings
  - params
  - project

extraImports:
  - "import 'package:meta/meta.dart';"

deriveOutputGetters: true

extraGetters: |2

    /// Reference to the server-assigned numeric `generated_id`.
    /// Kept at `TfRef<int>` — schema type is `number` (derived would widen
    /// to `TfRef<num>`).
    TfRef<int> get generatedId => TfRef.attribute<int>(this, 'generated_id');

dartTypeOverrides:
  protocol: BackendServiceProtocol
  load_balancing_scheme: LoadBalancingScheme
  locality_lb_policy: LocalityLbPolicy
  session_affinity: SessionAffinity
  compression_mode: BackendServiceCompressionMode
  ip_address_selection_policy: IpAddressSelectionPolicy
  external_managed_migration_state: ExternalManagedMigrationState
  backend.balancing_mode: BackendServiceBalancingMode
  backend.preference: BackendServicePreference
  cdn_policy.cache_mode: BackendServiceCacheMode
  locality_lb_policies.policy.name: LocalityLbPolicy
  log_config.optional_mode: BackendServiceLogOptionalMode

prelude: |
  // ===========================================================================
  // Top-level enums
  // ===========================================================================

  /// Wire protocol the backend service uses to talk to backends. `HTTP2`
  /// and `H2C` require an HTTP(S)-class load balancer; `TCP`, `SSL`, and
  /// `UDP` are for Network Load Balancing / Traffic Director TCP routing.
  /// `GRPC` is required when the URL map is bound to a target gRPC proxy.
  extension type const BackendServiceProtocol._(TfArg<String> _) implements TfArg<String> {
    BackendServiceProtocol.variable(String name) : this._(TfArg.variable(name));
    BackendServiceProtocol.expression(String template) : this._(TfArg.expression(template));
    const BackendServiceProtocol.arg(TfArg<String> arg) : this._(arg);

    static const http = BackendServiceProtocol._(TfArgLiteral('HTTP'));
    static const https = BackendServiceProtocol._(TfArgLiteral('HTTPS'));
    static const http2 = BackendServiceProtocol._(TfArgLiteral('HTTP2'));
    static const tcp = BackendServiceProtocol._(TfArgLiteral('TCP'));
    static const ssl = BackendServiceProtocol._(TfArgLiteral('SSL'));
    static const udp = BackendServiceProtocol._(TfArgLiteral('UDP'));
    static const grpc = BackendServiceProtocol._(TfArgLiteral('GRPC'));
    static const unspecified = BackendServiceProtocol._(TfArgLiteral('UNSPECIFIED'));
    static const h2c = BackendServiceProtocol._(TfArgLiteral('H2C'));

    static const List<BackendServiceProtocol> values = [http, https, http2, tcp, ssl, udp, grpc, unspecified, h2c];
  }

  /// `load_balancing_scheme`. A backend service of one scheme cannot be
  /// repurposed for another — the value is effectively immutable except
  /// through the [ExternalManagedMigrationState] dance.
  ///
  /// **Global-vs-regional**: this wrapper is for the *global* variant
  /// (`google_compute_backend_service`). Only [external],
  /// [externalManaged], and [internalSelfManaged] are valid at apply time
  /// on a global backend service. [internalManaged] is included because
  /// the Terraform schema accepts it but it will be rejected by the GCP
  /// API on a global resource — use `google_compute_region_backend_service`
  /// (curated separately) for `INTERNAL_MANAGED`.
  extension type const LoadBalancingScheme._(TfArg<String> _) implements TfArg<String> {
    LoadBalancingScheme.variable(String name) : this._(TfArg.variable(name));
    LoadBalancingScheme.expression(String template) : this._(TfArg.expression(template));
    const LoadBalancingScheme.arg(TfArg<String> arg) : this._(arg);

    static const external = LoadBalancingScheme._(TfArgLiteral('EXTERNAL'));
    static const externalManaged = LoadBalancingScheme._(TfArgLiteral('EXTERNAL_MANAGED'));
    static const internalSelfManaged = LoadBalancingScheme._(TfArgLiteral('INTERNAL_SELF_MANAGED'));
    static const internalManaged = LoadBalancingScheme._(TfArgLiteral('INTERNAL_MANAGED'));

    static const List<LoadBalancingScheme> values = [external, externalManaged, internalSelfManaged, internalManaged];
  }

  /// `locality_lb_policy`. See the schema docstring for the matrix of which
  /// values are valid for which combination of `protocol` and
  /// `load_balancing_scheme` — Cloud Load Balancing silently coerces
  /// invalid values to the scheme's default at apply time.
  extension type const LocalityLbPolicy._(TfArg<String> _) implements TfArg<String> {
    LocalityLbPolicy.variable(String name) : this._(TfArg.variable(name));
    LocalityLbPolicy.expression(String template) : this._(TfArg.expression(template));
    const LocalityLbPolicy.arg(TfArg<String> arg) : this._(arg);

    static const roundRobin = LocalityLbPolicy._(TfArgLiteral('ROUND_ROBIN'));
    static const leastRequest = LocalityLbPolicy._(TfArgLiteral('LEAST_REQUEST'));
    static const ringHash = LocalityLbPolicy._(TfArgLiteral('RING_HASH'));
    static const random = LocalityLbPolicy._(TfArgLiteral('RANDOM'));
    static const originalDestination = LocalityLbPolicy._(TfArgLiteral('ORIGINAL_DESTINATION'));
    static const maglev = LocalityLbPolicy._(TfArgLiteral('MAGLEV'));
    static const weightedMaglev = LocalityLbPolicy._(TfArgLiteral('WEIGHTED_MAGLEV'));
    static const weightedRoundRobin = LocalityLbPolicy._(TfArgLiteral('WEIGHTED_ROUND_ROBIN'));

    static const List<LocalityLbPolicy> values = [roundRobin, leastRequest, ringHash, random, originalDestination, maglev, weightedMaglev, weightedRoundRobin];
  }

  /// `session_affinity`. Applicable only when the locality LB policy is
  /// one of `MAGLEV`, `WEIGHTED_MAGLEV`, or `RING_HASH` (otherwise the
  /// setting is silently ignored).
  extension type const SessionAffinity._(TfArg<String> _) implements TfArg<String> {
    SessionAffinity.variable(String name) : this._(TfArg.variable(name));
    SessionAffinity.expression(String template) : this._(TfArg.expression(template));
    const SessionAffinity.arg(TfArg<String> arg) : this._(arg);

    static const none = SessionAffinity._(TfArgLiteral('NONE'));
    static const clientIp = SessionAffinity._(TfArgLiteral('CLIENT_IP'));
    static const clientIpPortProto = SessionAffinity._(TfArgLiteral('CLIENT_IP_PORT_PROTO'));
    static const clientIpProto = SessionAffinity._(TfArgLiteral('CLIENT_IP_PROTO'));
    static const generatedCookie = SessionAffinity._(TfArgLiteral('GENERATED_COOKIE'));
    static const headerField = SessionAffinity._(TfArgLiteral('HEADER_FIELD'));
    static const httpCookie = SessionAffinity._(TfArgLiteral('HTTP_COOKIE'));
    static const strongCookieAffinity = SessionAffinity._(TfArgLiteral('STRONG_COOKIE_AFFINITY'));

    static const List<SessionAffinity> values = [none, clientIp, clientIpPortProto, clientIpProto, generatedCookie, headerField, httpCookie, strongCookieAffinity];
  }

  /// `compression_mode`. Brotli / gzip negotiation based on the client's
  /// `Accept-Encoding` header.
  extension type const BackendServiceCompressionMode._(TfArg<String> _) implements TfArg<String> {
    BackendServiceCompressionMode.variable(String name) : this._(TfArg.variable(name));
    BackendServiceCompressionMode.expression(String template) : this._(TfArg.expression(template));
    const BackendServiceCompressionMode.arg(TfArg<String> arg) : this._(arg);

    static const automatic = BackendServiceCompressionMode._(TfArgLiteral('AUTOMATIC'));
    static const disabled = BackendServiceCompressionMode._(TfArgLiteral('DISABLED'));

    static const List<BackendServiceCompressionMode> values = [automatic, disabled];
  }

  /// `ip_address_selection_policy`. Controls IPv4-vs-IPv6 preference when
  /// the load balancer dials a backend (or when a proxyless gRPC client
  /// dials directly).
  extension type const IpAddressSelectionPolicy._(TfArg<String> _) implements TfArg<String> {
    IpAddressSelectionPolicy.variable(String name) : this._(TfArg.variable(name));
    IpAddressSelectionPolicy.expression(String template) : this._(TfArg.expression(template));
    const IpAddressSelectionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const ipv4Only = IpAddressSelectionPolicy._(TfArgLiteral('IPV4_ONLY'));
    static const preferIpv6 = IpAddressSelectionPolicy._(TfArgLiteral('PREFER_IPV6'));
    static const ipv6Only = IpAddressSelectionPolicy._(TfArgLiteral('IPV6_ONLY'));

    static const List<IpAddressSelectionPolicy> values = [ipv4Only, preferIpv6, ipv6Only];
  }

  /// `external_managed_migration_state`. Drives the Classic ALB →
  /// Application Load Balancer migration. State must transition
  /// `PREPARE` → optional `TEST_BY_PERCENTAGE` → `TEST_ALL_TRAFFIC`
  /// before the load balancing scheme can flip from `EXTERNAL` to
  /// `EXTERNAL_MANAGED`; same order in reverse to roll back.
  extension type const ExternalManagedMigrationState._(TfArg<String> _) implements TfArg<String> {
    ExternalManagedMigrationState.variable(String name) : this._(TfArg.variable(name));
    ExternalManagedMigrationState.expression(String template) : this._(TfArg.expression(template));
    const ExternalManagedMigrationState.arg(TfArg<String> arg) : this._(arg);

    static const prepare = ExternalManagedMigrationState._(TfArgLiteral('PREPARE'));
    static const testByPercentage = ExternalManagedMigrationState._(TfArgLiteral('TEST_BY_PERCENTAGE'));
    static const testAllTraffic = ExternalManagedMigrationState._(TfArgLiteral('TEST_ALL_TRAFFIC'));

    static const List<ExternalManagedMigrationState> values = [prepare, testByPercentage, testAllTraffic];
  }

  /// Per-backend balancing mode. See [ComputeBackendServiceBackend.balancingMode].
  extension type const BackendServiceBalancingMode._(TfArg<String> _) implements TfArg<String> {
    BackendServiceBalancingMode.variable(String name) : this._(TfArg.variable(name));
    BackendServiceBalancingMode.expression(String template) : this._(TfArg.expression(template));
    const BackendServiceBalancingMode.arg(TfArg<String> arg) : this._(arg);

    static const utilization = BackendServiceBalancingMode._(TfArgLiteral('UTILIZATION'));
    static const rate = BackendServiceBalancingMode._(TfArgLiteral('RATE'));
    static const connection = BackendServiceBalancingMode._(TfArgLiteral('CONNECTION'));
    static const customMetrics = BackendServiceBalancingMode._(TfArgLiteral('CUSTOM_METRICS'));
    static const inFlight = BackendServiceBalancingMode._(TfArgLiteral('IN_FLIGHT'));

    static const List<BackendServiceBalancingMode> values = [utilization, rate, connection, customMetrics, inFlight];
  }

  /// `backend.preference`. Cannot be set when `load_balancing_scheme` is
  /// `EXTERNAL`.
  extension type const BackendServicePreference._(TfArg<String> _) implements TfArg<String> {
    BackendServicePreference.variable(String name) : this._(TfArg.variable(name));
    BackendServicePreference.expression(String template) : this._(TfArg.expression(template));
    const BackendServicePreference.arg(TfArg<String> arg) : this._(arg);

    static const preferred = BackendServicePreference._(TfArgLiteral('PREFERRED'));
    static const defaultPref = BackendServicePreference._(TfArgLiteral('DEFAULT'));

    static const List<BackendServicePreference> values = [preferred, defaultPref];
  }

  /// `cdn_policy.cache_mode`. Enabling CDN (`enable_cdn = true`) without
