outputDir: compute
deriveClassDoc: true
deriveOutputGetters: true
deriveNestedTypes: true
# WAF size enum values (`8KB` / `16KB`) are not legal Dart identifiers.
# Freeze the unused advanced-options subtree; leftover smoke only sets parent.
nestedTypeExcludes:
  - advanced_options_config

curatedDoc: |-
  /// Organization Cloud Armor security policy — leftover factory on the
  /// apply-excluded path (synth + `terraform validate` only).
  ///
  /// Needs an organization / folder / external artifact that
  /// standalone terradart-validate cannot supply. Do not apply.

paramOrder:
  - deletion_policy
  - description
  - display_name
  - parent
  - short_name
  - type
  - advanced_options_config
