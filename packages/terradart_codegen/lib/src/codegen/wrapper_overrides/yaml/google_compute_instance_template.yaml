outputDir: compute

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

curatedDoc: |-
  /// Required identity:
  /// - [localName]: Terraform local name (the address segment after
  ///   `google_compute_instance_template.`).
  /// - `machineType`: short machine type name (e.g. `'e2-medium'`) or full
  ///   self-link of a custom machine type (e.g. `'custom-6-20480'` for 6 vCPU /
  ///   20 GB of RAM).
  /// - `disk`: at least one [ComputeInstanceTemplateDisk]; GCP enforces `min_items=1`
  ///   on the underlying `disk` block. The first entry should usually be the
  ///   boot disk (`boot: true`).
  /// - `networkInterface`: at least one [ComputeInstanceTemplateNetworkInterface]
  ///   entry. GCP requires every template to attach to a VPC.
  ///
  /// Identity (`name` / `namePrefix`):
  /// - When both are omitted Terraform auto-generates a unique name.
  /// - `name` and `namePrefix` are mutually exclusive (GCP / Terraform reject
  ///   setting both); this wrapper does not enforce that — pass one or the
  ///   other.
  ///
  /// Example (minimal):
  /// ```dart
  /// final tmpl = GoogleComputeInstanceTemplate(
  ///   'web',
  ///   namePrefix: .literal('web-'),
  ///   machineType: .literal('e2-medium'),
  ///   disk: [
  ///     ComputeInstanceTemplateDisk(
  ///       boot: .literal(true),
  ///       sourceImage: .literal('debian-cloud/debian-12'),
  ///       autoDelete: .literal(true),
  ///     ),
  ///   ],
  ///   networkInterface: [
  ///     ComputeInstanceTemplateNetworkInterface(
  ///       network: vpc.ref,
  ///       accessConfig: [.new()],
  ///     ),
  ///   ],
  /// );
  /// ```
  ///
  /// Instance templates are global resources (no `zone`) consumed by managed
  /// instance groups and regional MIGs.
  ///
  /// `selfLinkUnique` disambiguates templates that share a `name_prefix`;
  /// prefer it over `selfLink` when referencing from a MIG that recreates
  /// templates frequently.

paramOrder:
  - name
  - name_prefix
  - machine_type
  - description
  - instance_description
  - labels
  - tags
  - metadata
  - metadata_startup_script
  - can_ip_forward
  - min_cpu_platform
  - region
  - resource_manager_tags
  - resource_policies
  - key_revocation_action_type
  - disk
  - network_interface
  - service_account
  - scheduling
  - shielded_instance_config
  - confidential_instance_config
  - guest_accelerator
  - advanced_machine_features
  - reservation_affinity
  - network_performance_config
  - project
  - workload_identity_config

extraGetters: |2
    /// Reference to `id` attribute (full path
    /// `projects/{project}/global/instanceTemplates/{name}`).
    TfRef<String> get id => TfRef.attribute<String>(this, 'id');

extraImports:
  - "import 'package:meta/meta.dart';"

# `metadata_startup_script` is not schema-flagged as sensitive but
# frequently holds bootstrap credentials in practice. Mask it on synth so
# the rendered `main.tf.json` does not carry secrets in plaintext.
# The schema additionally flags `disk.source_image_encryption_key.raw_key` /
# `.rsa_encrypted_key` and `disk.source_snapshot_encryption_key.raw_key` /
# `.rsa_encrypted_key` as sensitive; those are inside the nested `disk`
# block payload and remain unmasked here (callers are expected to source
# them from secret stores rather than literals).
extraSensitiveFields:
  - metadata_startup_script

prelude: |
  // ===========================================================================
  // Enums (all prefixed `InstanceTemplate` to avoid collision with
  // `google_compute_instance` in the same `compute/` package.)
  // ===========================================================================

  /// `disk.mode` -- read / write mode for an attached or boot disk. Boot
  /// disks must be `READ_WRITE`.
  extension type const InstanceTemplateDiskMode._(TfArg<String> _) implements TfArg<String> {
    InstanceTemplateDiskMode.variable(String name) : this._(TfArg.variable(name));
    InstanceTemplateDiskMode.expression(String template) : this._(TfArg.expression(template));
    const InstanceTemplateDiskMode.arg(TfArg<String> arg) : this._(arg);

    static const readWrite = InstanceTemplateDiskMode._(TfArgLiteral('READ_WRITE'));
    static const readOnly = InstanceTemplateDiskMode._(TfArgLiteral('READ_ONLY'));

    static const List<InstanceTemplateDiskMode> values = [readWrite, readOnly];
  }

  /// `network_interface.nic_type` -- vNIC family used for the interface.
  extension type const InstanceTemplateNicType._(TfArg<String> _) implements TfArg<String> {
    InstanceTemplateNicType.variable(String name) : this._(TfArg.variable(name));
    InstanceTemplateNicType.expression(String template) : this._(TfArg.expression(template));
    const InstanceTemplateNicType.arg(TfArg<String> arg) : this._(arg);

    static const gvnic = InstanceTemplateNicType._(TfArgLiteral('GVNIC'));
    static const virtioNet = InstanceTemplateNicType._(TfArgLiteral('VIRTIO_NET'));
    static const mrdma = InstanceTemplateNicType._(TfArgLiteral('MRDMA'));
    static const irdma = InstanceTemplateNicType._(TfArgLiteral('IRDMA'));

    static const List<InstanceTemplateNicType> values = [gvnic, virtioNet, mrdma, irdma];
  }

  /// `network_interface.access_config.network_tier` -- service tier for the
  /// external IP. `STANDARD` is regional; `PREMIUM` is global.
  extension type const InstanceTemplateAccessConfigNetworkTier._(TfArg<String> _) implements TfArg<String> {
    InstanceTemplateAccessConfigNetworkTier.variable(String name) : this._(TfArg.variable(name));
    InstanceTemplateAccessConfigNetworkTier.expression(String template) : this._(TfArg.expression(template));
    const InstanceTemplateAccessConfigNetworkTier.arg(TfArg<String> arg) : this._(arg);

    static const premium = InstanceTemplateAccessConfigNetworkTier._(TfArgLiteral('PREMIUM'));
    static const standard = InstanceTemplateAccessConfigNetworkTier._(TfArgLiteral('STANDARD'));
    static const fixedStandard = InstanceTemplateAccessConfigNetworkTier._(TfArgLiteral('FIXED_STANDARD'));

    static const List<InstanceTemplateAccessConfigNetworkTier> values = [premium, standard, fixedStandard];
  }

  /// `scheduling.on_host_maintenance` -- behaviour during host maintenance.
  /// `MIGRATE` (live migration) is the default for standard VMs; preemptible /
  /// SPOT / confidential VMs must use `TERMINATE`.
  extension type const InstanceTemplateOnHostMaintenance._(TfArg<String> _) implements TfArg<String> {
    InstanceTemplateOnHostMaintenance.variable(String name) : this._(TfArg.variable(name));
    InstanceTemplateOnHostMaintenance.expression(String template) : this._(TfArg.expression(template));
    const InstanceTemplateOnHostMaintenance.arg(TfArg<String> arg) : this._(arg);

    static const migrate = InstanceTemplateOnHostMaintenance._(TfArgLiteral('MIGRATE'));
    static const terminate = InstanceTemplateOnHostMaintenance._(TfArgLiteral('TERMINATE'));

    static const List<InstanceTemplateOnHostMaintenance> values = [migrate, terminate];
  }

  /// `scheduling.provisioning_model` -- VM provisioning model. `STANDARD` runs
  /// at on-demand prices with no termination guarantees from GCP; `SPOT` runs
  /// at preemptible prices and may be reclaimed at any time.
  extension type const InstanceTemplateProvisioningModel._(TfArg<String> _) implements TfArg<String> {
    InstanceTemplateProvisioningModel.variable(String name) : this._(TfArg.variable(name));
    InstanceTemplateProvisioningModel.expression(String template) : this._(TfArg.expression(template));
    const InstanceTemplateProvisioningModel.arg(TfArg<String> arg) : this._(arg);

    static const standard = InstanceTemplateProvisioningModel._(TfArgLiteral('STANDARD'));
    static const spot = InstanceTemplateProvisioningModel._(TfArgLiteral('SPOT'));

    static const List<InstanceTemplateProvisioningModel> values = [standard, spot];
  }

  /// `scheduling.instance_termination_action` -- action when a SPOT VM is
  /// preempted or `max_run_duration` elapses.
  extension type const InstanceTemplateInstanceTerminationAction._(TfArg<String> _) implements TfArg<String> {
    InstanceTemplateInstanceTerminationAction.variable(String name) : this._(TfArg.variable(name));
    InstanceTemplateInstanceTerminationAction.expression(String template) : this._(TfArg.expression(template));
    const InstanceTemplateInstanceTerminationAction.arg(TfArg<String> arg) : this._(arg);

    static const stop = InstanceTemplateInstanceTerminationAction._(TfArgLiteral('STOP'));
    static const delete = InstanceTemplateInstanceTerminationAction._(TfArgLiteral('DELETE'));

    static const List<InstanceTemplateInstanceTerminationAction> values = [stop, delete];
  }

  /// `confidential_instance_config.confidential_instance_type` -- confidential
  /// computing technology. `SEV` and `SEV_SNP` require AMD CPUs (the latter
  /// also requires `min_cpu_platform = "AMD Milan"`). `TDX` requires Intel.
  extension type const InstanceTemplateConfidentialInstanceType._(TfArg<String> _) implements TfArg<String> {
    InstanceTemplateConfidentialInstanceType.variable(String name) : this._(TfArg.variable(name));
    InstanceTemplateConfidentialInstanceType.expression(String template) : this._(TfArg.expression(template));
    const InstanceTemplateConfidentialInstanceType.arg(TfArg<String> arg) : this._(arg);

    static const sev = InstanceTemplateConfidentialInstanceType._(TfArgLiteral('SEV'));
    static const sevSnp = InstanceTemplateConfidentialInstanceType._(TfArgLiteral('SEV_SNP'));
    static const tdx = InstanceTemplateConfidentialInstanceType._(TfArgLiteral('TDX'));

    static const List<InstanceTemplateConfidentialInstanceType> values = [sev, sevSnp, tdx];
  }

  /// `advanced_machine_features.performance_monitoring_unit` -- PMU level
  /// exposed to the guest. `ARCHITECTURAL` is the minimum stable subset;
  /// `ENHANCED` exposes the broadest set of counters.
  extension type const InstanceTemplatePerformanceMonitoringUnit._(TfArg<String> _) implements TfArg<String> {
    InstanceTemplatePerformanceMonitoringUnit.variable(String name) : this._(TfArg.variable(name));
    InstanceTemplatePerformanceMonitoringUnit.expression(String template) : this._(TfArg.expression(template));
    const InstanceTemplatePerformanceMonitoringUnit.arg(TfArg<String> arg) : this._(arg);

    static const architectural = InstanceTemplatePerformanceMonitoringUnit._(TfArgLiteral('ARCHITECTURAL'));
    static const standard = InstanceTemplatePerformanceMonitoringUnit._(TfArgLiteral('STANDARD'));
    static const enhanced = InstanceTemplatePerformanceMonitoringUnit._(TfArgLiteral('ENHANCED'));

    static const List<InstanceTemplatePerformanceMonitoringUnit> values = [architectural, standard, enhanced];
  }

  /// `reservation_affinity.type` -- reservation consumption mode. Pair
  /// `specificReservation` with [InstanceTemplateReservationAffinityType.specificReservation]
  /// to target a named reservation; `noReservation` opts out.
  extension type const InstanceTemplateReservationAffinityType._(TfArg<String> _) implements TfArg<String> {
    InstanceTemplateReservationAffinityType.variable(String name) : this._(TfArg.variable(name));
    InstanceTemplateReservationAffinityType.expression(String template) : this._(TfArg.expression(template));
    const InstanceTemplateReservationAffinityType.arg(TfArg<String> arg) : this._(arg);

    static const anyReservation = InstanceTemplateReservationAffinityType._(TfArgLiteral('ANY_RESERVATION'));
    static const specificReservation = InstanceTemplateReservationAffinityType._(TfArgLiteral('SPECIFIC_RESERVATION'));
    static const noReservation = InstanceTemplateReservationAffinityType._(TfArgLiteral('NO_RESERVATION'));

    static const List<InstanceTemplateReservationAffinityType> values = [anyReservation, specificReservation, noReservation];
  }

  // ===========================================================================
  // Nested-block helpers. Each exposes `toArgMap()` returning the raw
  // `Map<String, Object?>` shape Terraform expects. Single-instance
  // (`max_items=1`) blocks are wrapped in `[map]` by the factory; list-typed
  // sub-blocks are emitted as `List<Map>`.
  //
  // All type names are prefixed `InstanceTemplate` to coexist with
  // `google_compute_instance`'s helpers in the same `compute/` output dir.
  // ===========================================================================

dartTypeOverrides:
  advanced_machine_features.performance_monitoring_unit: InstanceTemplatePerformanceMonitoringUnit
  confidential_instance_config.confidential_instance_type: InstanceTemplateConfidentialInstanceType
  disk.mode: InstanceTemplateDiskMode
  network_interface.access_config.network_tier: InstanceTemplateAccessConfigNetworkTier
  network_interface.ipv6_access_config.network_tier: InstanceTemplateAccessConfigNetworkTier
  network_interface.nic_type: InstanceTemplateNicType
  reservation_affinity.type: InstanceTemplateReservationAffinityType
  scheduling.instance_termination_action: InstanceTemplateInstanceTerminationAction
  scheduling.on_host_maintenance: InstanceTemplateOnHostMaintenance
  scheduling.provisioning_model: InstanceTemplateProvisioningModel
