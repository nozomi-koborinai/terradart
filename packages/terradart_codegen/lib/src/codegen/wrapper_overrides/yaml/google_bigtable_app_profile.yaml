outputDir: bigtable

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// Cloud Bigtable app profile — routes client traffic to clusters.
  ///
  /// Required identity:
  /// - [localName]: Terraform local name.
  /// - [appProfileId]: profile ID within the instance.
  /// - [instance]: parent instance — pass `instance.name`.
  /// - [routing]: pick exactly one [BigtableAppProfileRouting] variant
  ///   (single-cluster, or multi-cluster across
  ///   [multiClusterRoutingClusterIds]). [isolation] optionally picks
  ///   standard or Data Boost isolation.
  ///
  /// Example (single-cluster routing):
  /// ```dart
  /// GoogleBigtableAppProfile(
  ///   'default',
  ///   appProfileId: TfArg.literal('default'),
  ///   instance: instance.ref,
  ///   routing: .singleClusterRouting(
  ///     .new(
  ///       clusterId: TfArg.literal('events-c1'),
  ///     ),
  ///   ),
  /// );
  /// ```

paramOrder:
  - app_profile_id
  - instance
  - single_cluster_routing
  - multi_cluster_routing_use_any
  - multi_cluster_routing_cluster_ids
  - standard_isolation
  - data_boost_isolation_read_only
  - description
  - ignore_warnings
  - row_affinity
  - deletion_policy
  - project

dartTypeOverrides:
  data_boost_isolation_read_only.compute_billing_owner: BigtableAppProfileComputeBillingOwner

prelude: |
  /// `compute_billing_owner` on `data_boost_isolation_read_only`.
  extension type const BigtableAppProfileComputeBillingOwner._(TfArg<String> _) implements TfArg<String> {
    BigtableAppProfileComputeBillingOwner.variable(String name) : this._(TfArg.variable(name));
    BigtableAppProfileComputeBillingOwner.expression(String template) : this._(TfArg.expression(template));
    const BigtableAppProfileComputeBillingOwner.arg(TfArg<String> arg) : this._(arg);

    static const hostPays = BigtableAppProfileComputeBillingOwner._(TfArgLiteral('HOST_PAYS'));

    static const List<BigtableAppProfileComputeBillingOwner> values = [hostPays];
  }

sealedNames:
  "multi_cluster_routing_use_any, single_cluster_routing": routing
  "data_boost_isolation_read_only, standard_isolation": isolation
