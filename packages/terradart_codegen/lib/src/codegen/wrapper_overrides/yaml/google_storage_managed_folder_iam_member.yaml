outputDir: storage
deriveClassDoc: true
deriveNestedTypes: true
deriveExactlyOne: true
deriveOutputGetters: true

curatedDoc: |-
  /// Additive IAM grant on a [GoogleStorageManagedFolder]. Prefer this over
  /// binding/policy when you only need to add one (`role`, `member`) tuple.
  ///
  /// Example:
  /// ```dart
  /// GoogleStorageManagedFolderIamMember(
  ///   'folder_viewer',
  ///   bucket: assets.ref,
  ///   managedFolder: folder.ref,
  ///   role: TfArg.literal('roles/storage.objectViewer'),
  ///   member: reader.principal,
  /// );
  /// ```

paramOrder:
  - bucket
  - managed_folder
  - role
  - member
  - condition
