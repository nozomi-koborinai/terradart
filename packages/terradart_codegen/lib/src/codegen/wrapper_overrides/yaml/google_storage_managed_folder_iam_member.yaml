outputDir: storage
deriveClassDoc: true
deriveNestedTypes: true
deriveExactlyOne: true
deriveOutputGetters: true

curatedDoc: |-
  /// Additive IAM grant on a [GoogleStorageManagedFolder]. Prefer this over
  /// binding/policy when you only need to add one (`role`, `member`) tuple.
  ///
  /// Example:
  /// ```dart
  /// final assets = add(GoogleStorageBucket(
  ///   'assets',
  ///   name: .literal('assets'),
  ///   location: .literal('US'),
  /// ));
  /// final folder = add(GoogleStorageManagedFolder(
  ///   'folder',
  ///   bucket: assets.ref,
  ///   name: .literal('reports/'),
  /// ));
  /// final reader = add(GoogleServiceAccount(
  ///   'reader',
  ///   accountId: .literal('reader'),
  /// ));
  /// GoogleStorageManagedFolderIamMember(
  ///   'folder_viewer',
  ///   managedFolder: folder.ref,
  ///   role: TfArg.literal('roles/storage.objectViewer'),
  ///   member: reader.principal,
  /// );
  /// ```

paramOrder:
  - bucket
  - managed_folder
  - role
  - member
  - condition
