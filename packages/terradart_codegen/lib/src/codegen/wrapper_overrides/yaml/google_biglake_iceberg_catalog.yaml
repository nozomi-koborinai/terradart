outputDir: biglake
deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

# MM uses hyphenated api_name (catalog-type / credential-mode), so
# deriveEnums cannot merge enum_values onto schema attrs — hand-write.

dartTypeOverrides:
  catalog_type: BiglakeIcebergCatalogType
  credential_mode: BiglakeIcebergCatalogCredentialMode

prelude: |
  /// Terraform `catalog_type` for [GoogleBiglakeIcebergCatalog].
  extension type const BiglakeIcebergCatalogType._(TfArg<String> _) implements TfArg<String> {
    BiglakeIcebergCatalogType.variable(String name) : this._(TfArg.variable(name));
    BiglakeIcebergCatalogType.expression(String template) : this._(TfArg.expression(template));
    const BiglakeIcebergCatalogType.arg(TfArg<String> arg) : this._(arg);

    static const catalogTypeGcsBucket = BiglakeIcebergCatalogType._(TfArgLiteral('CATALOG_TYPE_GCS_BUCKET'));
    static const catalogTypeBiglake = BiglakeIcebergCatalogType._(TfArgLiteral('CATALOG_TYPE_BIGLAKE'));
    static const catalogTypeFederated = BiglakeIcebergCatalogType._(TfArgLiteral('CATALOG_TYPE_FEDERATED'));

    static const List<BiglakeIcebergCatalogType> values = [catalogTypeGcsBucket, catalogTypeBiglake, catalogTypeFederated];
  }

  /// Terraform `credential_mode` for [GoogleBiglakeIcebergCatalog].
  extension type const BiglakeIcebergCatalogCredentialMode._(TfArg<String> _) implements TfArg<String> {
    BiglakeIcebergCatalogCredentialMode.variable(String name) : this._(TfArg.variable(name));
    BiglakeIcebergCatalogCredentialMode.expression(String template) : this._(TfArg.expression(template));
    const BiglakeIcebergCatalogCredentialMode.arg(TfArg<String> arg) : this._(arg);

    static const credentialModeEndUser = BiglakeIcebergCatalogCredentialMode._(TfArgLiteral('CREDENTIAL_MODE_END_USER'));
    static const credentialModeVendedCredentials = BiglakeIcebergCatalogCredentialMode._(TfArgLiteral('CREDENTIAL_MODE_VENDED_CREDENTIALS'));

    static const List<BiglakeIcebergCatalogCredentialMode> values = [credentialModeEndUser, credentialModeVendedCredentials];
  }

curatedDoc: |-
  /// BigLake Iceberg catalog backed by a GCS bucket
  /// (`CATALOG_TYPE_GCS_BUCKET`).
  ///
  /// [name] must equal the bucket name (not `gs://…`). Enable
  /// `biglake.googleapis.com` via [GoogleProjectService] before apply.
  /// Pair with [GoogleStorageBucket] + [GoogleBiglakeIcebergNamespace] /
  /// [GoogleBiglakeIcebergTable].

paramOrder:
  - name
  - catalog_type
  - credential_mode
  - primary_location
  - default_location
  - federated_catalog_options
  - restricted_locations_config
  - deletion_policy
  - project
