outputDir: colab
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

extraImports:
  - "import 'package:meta/meta.dart';"

dartTypeOverrides:
  desired_state: ColabScheduleDesiredState

prelude: |
  /// Terraform `desired_state` for [GoogleColabSchedule].
  enum ColabScheduleDesiredState implements TerraformEnum {
    active('ACTIVE'),
    paused('PAUSED');

    const ColabScheduleDesiredState(this.terraformValue);
    @override
    final String terraformValue;
  }

curatedDoc: |-
  /// Colab Enterprise notebook execution schedule.
  ///
  /// Prefer [desiredState] `PAUSED` in examples so apply does not start
  /// Vertex Colab VMs. Enable `aiplatform.googleapis.com` before apply.
  /// [createNotebookExecutionJobRequest] is a nested-block Map
  /// (`notebook_execution_job` → GCS notebook source + template + output).

sealedNames:
  "create_notebook_execution_job_request, create_pipeline_job_request": request
  "create_notebook_execution_job_request.notebook_execution_job.custom_environment_spec, create_notebook_execution_job_request.notebook_execution_job.notebook_runtime_template_resource_name": compute
  "create_notebook_execution_job_request.notebook_execution_job.execution_user, create_notebook_execution_job_request.notebook_execution_job.service_account": identity

paramOrder:
  - location
  - display_name
  - cron
  - max_concurrent_run_count
  - create_notebook_execution_job_request
  - desired_state
  - allow_queueing
  - max_run_count
  - start_time
  - end_time
  - deletion_policy
  - project
  - max_concurrent_active_run_count
  - create_pipeline_job_request
