outputDir: dataplex
deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

dartTypeOverrides:
  data_classification: DataplexAspectTypeDataClassification

prelude: |
  /// Data-classification level a [GoogleDataplexAspectType] applies to the
  /// aspects (metadata) it governs.
  extension type const DataplexAspectTypeDataClassification._(TfArg<String> _) implements TfArg<String> {
    DataplexAspectTypeDataClassification.variable(String name) : this._(TfArg.variable(name));
    DataplexAspectTypeDataClassification.expression(String template) : this._(TfArg.expression(template));
    const DataplexAspectTypeDataClassification.arg(TfArg<String> arg) : this._(arg);

    /// Unspecified — no explicit classification.
    static const unspecified = DataplexAspectTypeDataClassification._(TfArgLiteral('DATA_CLASSIFICATION_UNSPECIFIED'));
    /// Classification applies to both the metadata and the underlying data.
    static const metadataAndData = DataplexAspectTypeDataClassification._(TfArgLiteral('METADATA_AND_DATA'));

    static const List<DataplexAspectTypeDataClassification> values = [unspecified, metadataAndData];
  }

paramOrder:
  - aspect_type_id
  - location
  - display_name
  - description
  - metadata_template
  - data_classification
  - deletion_policy
  - project
