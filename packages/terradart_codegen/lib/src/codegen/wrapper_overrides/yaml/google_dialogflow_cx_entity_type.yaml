outputDir: dialogflow

deriveClassDoc: true
deriveOutputGetters: true
deriveNestedTypes: true
deriveEnums: true

dartTypeOverrides:
  kind: DialogflowCxEntityTypeKind
  auto_expansion_mode: DialogflowCxEntityTypeAutoExpansionMode

extraImports:
  - "import 'package:meta/meta.dart';"

curatedDoc: |-
  /// Dialogflow CX **entity type** — custom entities / synonyms for a CX
  /// agent.
  ///
  /// **Cost / apply:** gcp-cost: Cloud Dialogflow `FBC0-AA4A-C89A` Text
  /// session SKU `A1CC-751A-CDCC` **$0.20**/session (Audio `9496-0679-69BE`
  /// **$0.45**/session). billing-behavior: entity types sit on the
  /// never_apply [GoogleDialogflowCxAgent] session path. **Never** wire
  /// into apply-smoke.

paramOrder:
  - display_name
  - kind
  - parent
  - language_code
  - auto_expansion_mode
  - enable_fuzzy_extraction
  - redact
  - entities
  - excluded_phrases
  - deletion_policy

extraGetters: |2
    /// Reference to `id` attribute.
    TfRef<String> get idRef => TfRef.attribute<String>(this, 'id');

    /// Reference to `name` attribute.
    TfRef<String> get nameRef => TfRef.attribute<String>(this, 'name');
