outputDir: migration

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// Migration Center asset group — annotate a bundle of related assets.
  ///
  /// Pair with [GoogleMigrationCenterPreferenceSet] via
  /// [GoogleMigrationCenterReportConfig] `group_preferenceset_assignments`.

paramOrder:
  - location
  - group_id
  - display_name
  - description
  - labels
  - deletion_policy
  - project

prelude: |
  /// Terraform `deletion_policy` for Migration Center groups.
  extension type const MigrationCenterGroupDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    MigrationCenterGroupDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    MigrationCenterGroupDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const MigrationCenterGroupDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = MigrationCenterGroupDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = MigrationCenterGroupDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = MigrationCenterGroupDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<MigrationCenterGroupDeletionPolicy> values = [delete, prevent, abandon];
  }

dartTypeOverrides:
  deletion_policy: MigrationCenterGroupDeletionPolicy
