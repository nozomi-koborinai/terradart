outputDir: migration

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// Migration Center import job that ingests uploaded data into a source.
  ///
  /// Set [assetSource] to `source.name`.

paramOrder:
  - location
  - import_job_id
  - asset_source
  - display_name
  - labels
  - deletion_policy
  - project

prelude: |
  /// Terraform `deletion_policy` for Migration Center import jobs.
  extension type const MigrationCenterImportJobDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    MigrationCenterImportJobDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    MigrationCenterImportJobDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const MigrationCenterImportJobDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = MigrationCenterImportJobDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = MigrationCenterImportJobDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = MigrationCenterImportJobDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<MigrationCenterImportJobDeletionPolicy> values = [delete, prevent, abandon];
  }

dartTypeOverrides:
  deletion_policy: MigrationCenterImportJobDeletionPolicy
