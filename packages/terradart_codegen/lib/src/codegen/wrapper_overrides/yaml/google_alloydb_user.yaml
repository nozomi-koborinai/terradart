outputDir: alloydb

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

paramOrder:
  - cluster
  - user_id
  - user_type
  - password
  - password_wo
  - password_wo_version

dartTypeOverrides:
  user_type: AlloydbUserType

curatedDoc: |-
  /// AlloyDB database user inside a [GoogleAlloydbCluster].
  ///
  /// Required identity:
  /// - [localName]: Terraform local name.
  /// - [cluster]: parent cluster — `cluster.id`.
  /// - [userId]: username.
  /// - [userType]: [AlloydbUserType.alloydbBuiltIn] or IAM user.
  ///
  /// Example:
  /// ```dart
  /// GoogleAlloydbUser(
  ///   'app',
  ///   cluster: cluster.ref,
  ///   userId: TfArg.literal('app'),
  ///   userType: AlloydbUserType.alloydbBuiltIn,
  ///   password: .passwordWo(.literal(dbPassword)),
  ///   passwordWoVersion: TfArg.literal('1'),
  /// );
  /// ```

prelude: |
  /// `user_type` — built-in vs IAM-authenticated user.
  extension type const AlloydbUserType._(TfArg<String> _) implements TfArg<String> {
    AlloydbUserType.variable(String name) : this._(TfArg.variable(name));
    AlloydbUserType.expression(String template) : this._(TfArg.expression(template));
    const AlloydbUserType.arg(TfArg<String> arg) : this._(arg);

    static const alloydbBuiltIn = AlloydbUserType._(TfArgLiteral('ALLOYDB_BUILT_IN'));
    static const alloydbIamUser = AlloydbUserType._(TfArgLiteral('ALLOYDB_IAM_USER'));

    static const List<AlloydbUserType> values = [alloydbBuiltIn, alloydbIamUser];
  }
