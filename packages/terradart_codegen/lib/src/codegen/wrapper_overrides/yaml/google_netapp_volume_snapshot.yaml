outputDir: netapp
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true
deriveEnums: true

curatedDoc: |-
  /// NetApp Volumes **volume snapshot**.
  ///
  /// **Cost:** no dedicated snapshot SKU under NetApp Volumes
  /// `FC86-5113-7C81` beyond pool/backup capacity lines — snapshot space
  /// is consumed from the parent pool. Deferred with the pool (no
  /// apply-smoke quickstart).
  ///
  /// Example:
  /// ```dart
  /// final vol = add(GoogleNetappVolume(
  ///   'vol',
  ///   name: .literal('vol'),
  ///   location: .literal('us-central1'),
  ///   storagePool: .literal('pool'),
  ///   capacityGib: .literal('100'),
  ///   protocols: .literal([.nfsv3]),
  /// ));
  /// GoogleNetappVolumeSnapshot(
  ///   'snap',
  ///   name: TfArg.literal('daily'),
  ///   location: TfArg.literal('us-central1'),
  ///   volumeName: vol.name,
  /// );
  /// ```

paramOrder:
  - name
  - location
  - volume_name
  - description
  - labels
  - deletion_policy
  - project
