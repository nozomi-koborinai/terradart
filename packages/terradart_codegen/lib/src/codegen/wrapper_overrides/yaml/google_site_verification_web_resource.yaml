prelude: |
  /// Site Verification Web Resource Verification enum for `verification_method`.
  extension type const SiteVerificationWebResourceVerificationMethod._(TfArg<String> _) implements TfArg<String> {
    SiteVerificationWebResourceVerificationMethod.variable(String name) : this._(TfArg.variable(name));
    SiteVerificationWebResourceVerificationMethod.expression(String template) : this._(TfArg.expression(template));
    const SiteVerificationWebResourceVerificationMethod.arg(TfArg<String> arg) : this._(arg);

    static const analytics = SiteVerificationWebResourceVerificationMethod._(TfArgLiteral('ANALYTICS'));
    static const dnsCname = SiteVerificationWebResourceVerificationMethod._(TfArgLiteral('DNS_CNAME'));
    static const dnsTxt = SiteVerificationWebResourceVerificationMethod._(TfArgLiteral('DNS_TXT'));
    static const file = SiteVerificationWebResourceVerificationMethod._(TfArgLiteral('FILE'));
    static const meta = SiteVerificationWebResourceVerificationMethod._(TfArgLiteral('META'));
    static const tagManager = SiteVerificationWebResourceVerificationMethod._(TfArgLiteral('TAG_MANAGER'));

    static const List<SiteVerificationWebResourceVerificationMethod> values = [analytics, dnsCname, dnsTxt, file, meta, tagManager];
  }

curatedDoc: |-
  /// Leftover factory on the apply-excluded path
  /// (synth + `terraform validate` only).
