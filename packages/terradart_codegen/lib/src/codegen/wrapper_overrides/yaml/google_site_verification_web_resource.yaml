outputDir: site_verification
deriveClassDoc: true
deriveOutputGetters: true
deriveNestedTypes: true
deriveEnums: true

extraImports:
  - "import 'package:meta/meta.dart';"


dartTypeOverrides:
  verification_method: SiteVerificationWebResourceVerificationMethod

prelude: |
  /// Site Verification Web Resource Verification enum for `verification_method`.
  enum SiteVerificationWebResourceVerificationMethod implements TerraformEnum {
    analytics('ANALYTICS'),
    dnsCname('DNS_CNAME'),
    dnsTxt('DNS_TXT'),
    file('FILE'),
    meta('META'),
    tagManager('TAG_MANAGER');

    const SiteVerificationWebResourceVerificationMethod(this.terraformValue);
    @override
    final String terraformValue;
  }

curatedDoc: |-
  /// Leftover factory on the apply-excluded path
  /// (synth + `terraform validate` only).
  ///
  /// Needs an organization / folder / billing account /
  /// external artifact that standalone terradart-validate
  /// cannot supply. Do not apply.

paramOrder:
  - deletion_policy
  - verification_method
  - site
