outputDir: deployment_manager
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true
deriveEnums: true

extraImports:
  - "import 'package:meta/meta.dart';"


dartTypeOverrides:
  create_policy: DeploymentManagerDeploymentCreatePolicy
  delete_policy: DeploymentManagerDeploymentDeletePolicy

prelude: |
  /// Deployment Manager Deployment Create enum for `create_policy`.
  extension type const DeploymentManagerDeploymentCreatePolicy._(TfArg<String> _) implements TfArg<String> {
    DeploymentManagerDeploymentCreatePolicy.variable(String name) : this._(TfArg.variable(name));
    DeploymentManagerDeploymentCreatePolicy.expression(String template) : this._(TfArg.expression(template));
    const DeploymentManagerDeploymentCreatePolicy.arg(TfArg<String> arg) : this._(arg);

    static const acquire = DeploymentManagerDeploymentCreatePolicy._(TfArgLiteral('ACQUIRE'));
    static const createOrAcquire = DeploymentManagerDeploymentCreatePolicy._(TfArgLiteral('CREATE_OR_ACQUIRE'));

    static const List<DeploymentManagerDeploymentCreatePolicy> values = [acquire, createOrAcquire];
  }

  /// Deployment Manager Deployment Delete enum for `delete_policy`.
  extension type const DeploymentManagerDeploymentDeletePolicy._(TfArg<String> _) implements TfArg<String> {
    DeploymentManagerDeploymentDeletePolicy.variable(String name) : this._(TfArg.variable(name));
    DeploymentManagerDeploymentDeletePolicy.expression(String template) : this._(TfArg.expression(template));
    const DeploymentManagerDeploymentDeletePolicy.arg(TfArg<String> arg) : this._(arg);

    static const abandon = DeploymentManagerDeploymentDeletePolicy._(TfArgLiteral('ABANDON'));
    static const delete = DeploymentManagerDeploymentDeletePolicy._(TfArgLiteral('DELETE'));

    static const List<DeploymentManagerDeploymentDeletePolicy> values = [abandon, delete];
  }

curatedDoc: |-
  /// Leftover factory on the apply-excluded path
  /// (synth + `terraform validate` only).
  ///
  /// Needs an organization / folder / billing account /
  /// external artifact that standalone terradart-validate
  /// cannot supply. Do not apply.

paramOrder:
  - create_policy
  - delete_policy
  - deletion_policy
  - description
  - name
  - preview
  - project
  - labels
  - target
