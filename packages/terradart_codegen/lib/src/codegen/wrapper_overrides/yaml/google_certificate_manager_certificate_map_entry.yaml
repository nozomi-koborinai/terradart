outputDir: certificate_manager

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true
deriveEnums: true

sealedNames:
  "hostname, matcher": match

paramOrder:
  - name
  - map
  - certificates
  - hostname
  - matcher
  - description
  - labels
  - project

# `match` carries a dynamic argMap key (`match.blockKey`), so it is emitted
# last, after the static-keyed entries, for readability.
argMapOrder:
  - name
  - map
  - certificates
  - description
  - labels
  - hostname
  - matcher
  - project

curatedDoc: |-
  /// One hostname (or matcher) row inside a [GoogleCertificateManagerCertificateMap].
  ///
  /// Binds up to fifteen [GoogleCertificateManagerCertificate] resources to
  /// a Server Name Indication (SNI) hostname or a predefined matcher. The
  /// provider requires **exactly one** of hostname / matcher, modeled here as
  /// the sealed [CertificateManagerCertificateMapEntryMatch].
  ///
  /// Required identity:
  /// - [localName]: Terraform local name.
  /// - [name]: entry ID unique within the parent map.
  /// - [map]: the parent map — pass the map's `ref`.
  /// - [match]: the SNI hostname or predefined matcher this entry selects.
  /// - [certificates]: one or more certificate resource names — pass a
  ///   literal list of each certificate's `id.interpolation`.
  ///
  /// Example:
  /// ```dart
  /// final cmCert = add(GoogleCertificateManagerCertificate(
  ///   'app_cert',
  ///   name: .literal('app-cert'),
  ///   provisioning: .managed(
  ///     .new(domains: .literal(['app.example.com'])),
  ///   ),
  /// ));
  /// final cmMap = add(GoogleCertificateManagerCertificateMap(
  ///   'cert_map',
  ///   name: .literal('cert-map'),
  /// ));
  /// GoogleCertificateManagerCertificateMapEntry(
  ///   'app_entry',
  ///   name: .literal('app-entry'),
  ///   map: cmMap.ref,
  ///   match: CertificateManagerCertificateMapEntryMatch.hostname(
  ///     .literal('app.example.com'),
  ///   ),
  ///   certificates: .literal([cmCert.id.interpolation]),
  /// );
  /// ```
