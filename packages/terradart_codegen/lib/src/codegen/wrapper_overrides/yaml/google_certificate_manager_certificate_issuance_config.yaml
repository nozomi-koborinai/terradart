outputDir: certificate_manager

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

dartTypeOverrides:
  key_algorithm: CertificateManagerCertificateIssuanceConfigKeyAlgorithm

paramOrder:
  - name
  - certificate_authority_config
  - key_algorithm
  - lifetime
  - rotation_window_percentage
  - description
  - location
  - labels

curatedDoc: |-
  /// Certificate issuance policy for Google-managed Certificate Manager certs.
  ///
  /// Binds a [GoogleCertificateManagerCertificate] managed provisioning path to
  /// a Certificate Authority Service pool and defines key algorithm, lifetime,
  /// and rotation window.
  ///
  /// Required identity:
  /// - [localName]: Terraform local name.
  /// - [name]: issuance config ID.
  /// - [certificateAuthorityConfig]: CA pool reference (CAS `ca_pool` resource).
  /// - [keyAlgorithm]: `RSA_2048` or `ECDSA_P256`.
  /// - [lifetime]: certificate lifetime (e.g. `86400s`).
  /// - [rotationWindowPercentage]: percent of lifetime before rotation (0–100).
  ///
  /// Example:
  /// ```dart
  /// GoogleCertificateManagerCertificateIssuanceConfig(
  ///   'app_issuance',
  ///   name: TfArg.literal('app-issuance'),
  ///   certificateAuthorityConfig:
  ///       CertificateManagerCertificateIssuanceConfigCertificateAuthorityConfig(
  ///     certificateAuthorityServiceConfig: .new(
  ///       caPool: pool.ref,
  ///     ),
  ///   ),
  ///   keyAlgorithm: CertificateManagerCertificateIssuanceConfigKeyAlgorithm.rsa2048,
  ///   lifetime: TfArg.literal('2592000s'),
  ///   rotationWindowPercentage: TfArg.literal(50),
  /// );
  /// ```

prelude: |
  /// `key_algorithm` — private key algorithm for issued certificates.
  extension type const CertificateManagerCertificateIssuanceConfigKeyAlgorithm._(TfArg<String> _) implements TfArg<String> {
    CertificateManagerCertificateIssuanceConfigKeyAlgorithm.variable(String name) : this._(TfArg.variable(name));
    CertificateManagerCertificateIssuanceConfigKeyAlgorithm.expression(String template) : this._(TfArg.expression(template));
    const CertificateManagerCertificateIssuanceConfigKeyAlgorithm.arg(TfArg<String> arg) : this._(arg);

    static const rsa2048 = CertificateManagerCertificateIssuanceConfigKeyAlgorithm._(TfArgLiteral('RSA_2048'));
    static const ecdsaP256 = CertificateManagerCertificateIssuanceConfigKeyAlgorithm._(TfArgLiteral('ECDSA_P256'));

    static const List<CertificateManagerCertificateIssuanceConfigKeyAlgorithm> values = [rsa2048, ecdsaP256];
  }

  /// CAS pool reference inside [CertificateManagerCertificateIssuanceConfigCertificateAuthorityConfig].
  final class CertificateManagerCertificateIssuanceConfigCertificateAuthorityServiceConfig {
    const CertificateManagerCertificateIssuanceConfigCertificateAuthorityServiceConfig({
      required this.caPool,
    });

    final RefTo<GooglePrivatecaCaPool> caPool;

    @internal
    Map<String, Object?> encode() => {
      'ca_pool': caPool.encodeAs('id').toTfJson(),
    };
  }

  /// Certificate authority backend for [GoogleCertificateManagerCertificateIssuanceConfig].
  final class CertificateManagerCertificateIssuanceConfigCertificateAuthorityConfig {
    const CertificateManagerCertificateIssuanceConfigCertificateAuthorityConfig({
      required this.certificateAuthorityServiceConfig,
    });

    final CertificateManagerCertificateIssuanceConfigCertificateAuthorityServiceConfig
        certificateAuthorityServiceConfig;

    @internal
    Map<String, Object?> encode() => {
      'certificate_authority_service_config':
          certificateAuthorityServiceConfig.encode(),
    };
  }

customSlots:
  certificate_authority_config:
    paramDeclaration: 'required CertificateManagerCertificateIssuanceConfigCertificateAuthorityConfig certificateAuthorityConfig'
    argMapEntry: "'certificate_authority_config': TfArg.literal([certificateAuthorityConfig.encode()]),"
