outputDir: artifact_registry

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true

# User-settable params first; nested blocks in the middle; computed-only
# attrs (create_time, update_time, name, registry_uri, terraform_labels,
# effective_labels) are filtered. `timeouts` is also filtered (lifecycle
# meta-arg). `vulnerability_scanning_config` is exposed because its
# `enablement_config` is user-settable; the other two fields of that block
# are computed and surface as read getters.
sealedNames:
  "remote_repository_config.apt_repository, remote_repository_config.common_repository, remote_repository_config.docker_repository, remote_repository_config.maven_repository, remote_repository_config.npm_repository, remote_repository_config.python_repository, remote_repository_config.yum_repository": format

paramOrder:
  - repository_id
  - format
  - mode
  - description
  - location
  - kms_key_name
  - labels
  - docker_config
  - maven_config
  - virtual_repository_config
  - remote_repository_config
  - cleanup_policies
  - cleanup_policy_dry_run
  - vulnerability_scanning_config
  - project

dartTypeOverrides:
  mode: ArtifactRegistryMode
  cleanup_policies.action: ArtifactRegistryCleanupAction
  cleanup_policies.condition.tag_state: ArtifactRegistryCleanupTagState
  maven_config.version_policy: ArtifactRegistryMavenVersionPolicy
  remote_repository_config.apt_repository.public_repository.repository_base: ArtifactRegistryAptRepositoryBase
  remote_repository_config.docker_repository.public_repository: ArtifactRegistryDockerPublicRepository
  remote_repository_config.maven_repository.public_repository: ArtifactRegistryMavenPublicRepository
  remote_repository_config.npm_repository.public_repository: ArtifactRegistryNpmPublicRepository
  remote_repository_config.yum_repository.public_repository.repository_base: ArtifactRegistryYumRepositoryBase
  vulnerability_scanning_config.enablement_config: ArtifactRegistryVulnerabilityEnablementConfig

extraImports:
  - "import 'package:meta/meta.dart';"

deriveOutputGetters: true

prelude: |
  // ===========================================================================
  // Top-level enums
  // ===========================================================================

