outputDir: project
deriveClassDoc: true
deriveNestedTypes: true
deriveExactlyOne: true
deriveOutputGetters: true

dartTypeOverrides:
  service: GoogleApi
extraImports:
  - "import 'google_api.dart' show GoogleApi;"

curatedDoc: |-
  /// Enables a single Google Cloud API on a project. Each GCP API (Pub/Sub,
  /// Cloud Tasks, Secret Manager, Cloud Scheduler, …) requires its matching
  /// `google_project_service` resource to be enabled before its resources
  /// can be created — typically wired as an explicit `dependsOn` so Terraform
  /// applies the API enablement first.
  ///
  /// Required identity:
  /// - [localName]: Terraform local name (the address segment after
  ///   `google_project_service.`).
  /// - `service`: the API to enable, a [GoogleApi] constant such as
  ///   [GoogleApi.pubsub] for `pubsub.googleapis.com`. A Google API without
  ///   a constant goes through [GoogleApi.custom]; a variable, another
  ///   resource's attribute or a service outside `googleapis.com` (a Cloud
  ///   Endpoints service) goes through [GoogleApi.arg].
  ///
  /// Optional knobs:
  /// - `project`: explicit project ID; defaults to the provider's `project`
  ///   when omitted.
  /// - `disableOnDestroy`: when `false`, leaves the API enabled if the
  ///   resource is destroyed. **Recommended `false` for personal/shared
  ///   projects** — disabling APIs that other resources outside Terraform's
  ///   knowledge depend on can break unrelated workloads.
  /// - `disableDependentServices`: when `true`, also disables any APIs that
  ///   depend on this one. Default `false`.
  ///
  /// Example pairing with [GooglePubsubTopic]:
  /// ```dart
  /// final pubsubApi = GoogleProjectService(
  ///   'pubsub',
  ///   service: .pubsub,
  ///   disableOnDestroy: .literal(false),
  /// );
  ///
  /// final orders = GooglePubsubTopic(
  ///   'orders',
  ///   name: .literal('orders-prod'),
  ///   dependsOn: [pubsubApi],
  /// );
  /// ```

paramOrder:
  - service
  - project
  - disable_on_destroy
  - disable_dependent_services
