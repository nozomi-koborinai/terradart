outputDir: oracle

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// Assigns a [GoogleOracleDatabaseGoldengateConnection] to a
  /// [GoogleOracleDatabaseGoldengateDeployment] for replication workloads.
  ///
  /// Enable `oracledatabase.googleapis.com` before apply.

paramOrder:
  - location
  - goldengate_connection_assignment_id
  - properties
  - display_name
  - labels
  - deletion_policy
  - deletion_protection
  - project

prelude: |
  /// Terraform `deletion_policy` for GoldenGate connection assignments.
  extension type const OracleDatabaseGoldengateConnectionAssignmentDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    OracleDatabaseGoldengateConnectionAssignmentDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    OracleDatabaseGoldengateConnectionAssignmentDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const OracleDatabaseGoldengateConnectionAssignmentDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = OracleDatabaseGoldengateConnectionAssignmentDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = OracleDatabaseGoldengateConnectionAssignmentDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = OracleDatabaseGoldengateConnectionAssignmentDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<OracleDatabaseGoldengateConnectionAssignmentDeletionPolicy> values = [delete, prevent, abandon];
  }

dartTypeOverrides:
  deletion_policy: OracleDatabaseGoldengateConnectionAssignmentDeletionPolicy

extraGetters: |2
    TfRef<String> get id => TfRef.attribute<String>(this, 'id');
