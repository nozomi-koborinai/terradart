outputDir: oracle

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveEnums: true
deriveNestedTypes: true

curatedDoc: |-
  /// Oracle Exadata VM cluster on Oracle Database@Google Cloud.
  ///
  /// Enable `oracledatabase.googleapis.com` before apply. Requires
  /// [exadata_infrastructure] from [GoogleOracleDatabaseCloudExadataInfrastructure].
  /// For ODB networking, wire [odb_network], [odb_subnet], and
  /// [backup_odb_subnet] to [GoogleOracleDatabaseOdbNetwork] / subnet refs.

paramOrder:
  - location
  - cloud_vm_cluster_id
  - display_name
  - exadata_infrastructure
  - odb_network
  - odb_subnet
  - backup_odb_subnet
  - properties
  - labels
  - deletion_policy
  - deletion_protection
  - project
  - backup_subnet_cidr
  - cidr
  - exascale_db_storage_vault
  - network

prelude: |
  /// Terraform `deletion_policy` for Cloud VM clusters.
  extension type const OracleDatabaseCloudVmClusterDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    OracleDatabaseCloudVmClusterDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    OracleDatabaseCloudVmClusterDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const OracleDatabaseCloudVmClusterDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = OracleDatabaseCloudVmClusterDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = OracleDatabaseCloudVmClusterDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = OracleDatabaseCloudVmClusterDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<OracleDatabaseCloudVmClusterDeletionPolicy> values = [delete, prevent, abandon];
  }

dartTypeOverrides:
  deletion_policy: OracleDatabaseCloudVmClusterDeletionPolicy

extraGetters: |2
    TfRef<String> get id => TfRef.attribute<String>(this, 'id');
