outputDir: eventarc
deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

paramOrder:
  - annotations
  - crypto_key_name
  - display_name
  - labels
  - location
  - message_bus_id
  - project
  - logging_config

extraImports:
  - "import 'package:meta/meta.dart';"

prelude: |
  /// `logging_config.log_severity` — minimum log severity forwarded to
  /// Cloud Logging / Platform Telemetry.
  extension type const EventarcMessageBusLogSeverity._(TfArg<String> _) implements TfArg<String> {
    EventarcMessageBusLogSeverity.variable(String name) : this._(TfArg.variable(name));
    EventarcMessageBusLogSeverity.expression(String template) : this._(TfArg.expression(template));
    const EventarcMessageBusLogSeverity.arg(TfArg<String> arg) : this._(arg);

    static const none = EventarcMessageBusLogSeverity._(TfArgLiteral('NONE'));
    static const debug = EventarcMessageBusLogSeverity._(TfArgLiteral('DEBUG'));
    static const info = EventarcMessageBusLogSeverity._(TfArgLiteral('INFO'));
    static const notice = EventarcMessageBusLogSeverity._(TfArgLiteral('NOTICE'));
    static const warning = EventarcMessageBusLogSeverity._(TfArgLiteral('WARNING'));
    static const error = EventarcMessageBusLogSeverity._(TfArgLiteral('ERROR'));
    static const critical = EventarcMessageBusLogSeverity._(TfArgLiteral('CRITICAL'));
    static const alert = EventarcMessageBusLogSeverity._(TfArgLiteral('ALERT'));
    static const emergency = EventarcMessageBusLogSeverity._(TfArgLiteral('EMERGENCY'));

    static const List<EventarcMessageBusLogSeverity> values = [none, debug, info, notice, warning, error, critical, alert, emergency];
  }

  /// `logging_config` block — shared across Eventarc message buses, API
  /// sources, and pipelines.
  @immutable
  class EventarcMessageBusLoggingConfig {
    const EventarcMessageBusLoggingConfig({this.logSeverity});

    final EventarcMessageBusLogSeverity? logSeverity;

    @internal
    Map<String, Object?> encode() => {
      if (logSeverity != null) 'log_severity': logSeverity!.toTfJson(),
    };
  }

customSlots:
  logging_config:
    paramDeclaration: 'EventarcMessageBusLoggingConfig? loggingConfig'
    argMapEntry: "if (loggingConfig != null) 'logging_config': TfArg.literal([loggingConfig.encode()]),"
