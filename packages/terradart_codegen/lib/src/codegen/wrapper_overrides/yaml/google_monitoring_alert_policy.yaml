outputDir: monitoring

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

curatedDoc: |-
  /// Required identity beyond [localName]:
  /// - `displayName`: human-readable label shown in dashboards / notifications
  ///   (<= 512 Unicode characters).
  /// - `combiner`: how multiple [conditions] combine into an incident. Use
  ///   [AlertCombiner.and] / [AlertCombiner.or] / [AlertCombiner.andWithMatchingResource].
  /// - `conditions`: non-empty list. Each [MonitoringAlertPolicyConditions] carries a
  ///   `displayName` plus EXACTLY one of the 6 condition-type sub-blocks
  ///   ([MonitoringAlertPolicyConditions.conditionThreshold], `conditionAbsent`,
  ///   `conditionMatchedLog`, `conditionMonitoringQueryLanguage`,
  ///   `conditionPrometheusQueryLanguage`, `conditionSql`).
  ///
  /// Modeling choice for `conditions`: each entry is a single [MonitoringAlertPolicyConditions]
  /// helper with one required `displayName` plus 6 mutually-exclusive nullable
  /// sub-fields. Terraform enforces the exactly_one_of contract at apply time,
  /// so we keep the Dart shape flat (and the count of generated classes
  /// manageable) instead of introducing a 6-variant sealed type.
  ///
  /// Example (threshold on Compute Engine instance uptime):
  /// ```dart
  /// final policy = GoogleMonitoringAlertPolicy(
  ///   'compute_uptime',
  ///   displayName: TfArg.literal('Compute instance uptime SLO'),
  ///   combiner: AlertCombiner.or,
  ///   conditions: const [
  ///     MonitoringAlertPolicyConditions(
  ///       displayName: TfArgLiteral('uptime < 95% over 5 min'),
  ///       conditionThreshold: .new(
  ///         filter: TfArgLiteral(
  ///           'metric.type="compute.googleapis.com/instance/uptime" '
  ///           'resource.type="gce_instance"',
  ///         ),
  ///         comparison: Comparison.lessThan,
  ///         thresholdValue: TfArgLiteral(0.95),
  ///         duration: TfArgLiteral('300s'),
  ///       ),
  ///     ),
  ///   ],
  ///   notificationChannels: TfArg.literal(const <String>[]),
  ///   alertStrategy: const MonitoringAlertPolicyAlertStrategy(autoClose: TfArgLiteral('1800s')),
  ///   severity: AlertSeverity.warning,
  /// );
  /// ```

# User-settable attrs first (display_name / combiner are required), then
# the conditions list, then alert_strategy / documentation / notification_channels,
# then optional metadata. Computed-only attrs (creation_record, id, name) are
# filtered out — they're not constructor inputs. `timeouts` is also filtered
# (Terraform meta-arg).
sealedNames:
  "conditions.condition_sql.daily, conditions.condition_sql.hourly, conditions.condition_sql.minutes": schedule

paramOrder:
  - display_name
  - combiner
  - conditions
  - notification_channels
  - alert_strategy
  - documentation
  - enabled
  - severity
  - user_labels
  - project

dartTypeOverrides:
  combiner: AlertCombiner
  severity: AlertSeverity
  conditions.condition_monitoring_query_language.evaluation_missing_data: EvaluationMissingData
  conditions.condition_absent.aggregations.cross_series_reducer: Reducer
  conditions.condition_absent.aggregations.per_series_aligner: Aligner
  conditions.condition_sql.row_count_test.comparison: Comparison
  conditions.condition_threshold.aggregations.cross_series_reducer: Reducer
  conditions.condition_threshold.aggregations.per_series_aligner: Aligner
  conditions.condition_threshold.denominator_aggregations.cross_series_reducer: Reducer
  conditions.condition_threshold.denominator_aggregations.per_series_aligner: Aligner
  conditions.condition_threshold.comparison: Comparison
  conditions.condition_threshold.evaluation_missing_data: EvaluationMissingData

