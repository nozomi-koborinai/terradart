outputDir: oracle

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// Oracle GoldenGate deployment on Oracle Database@Google Cloud.
  ///
  /// Enable `oracledatabase.googleapis.com` before apply. Requires an
  /// [odb_subnet] in the target region and [properties] with deployment type
  /// and OGG admin credentials.

paramOrder:
  - location
  - goldengate_deployment_id
  - display_name
  - odb_subnet
  - odb_network
  - gcp_oracle_zone
  - properties
  - labels
  - deletion_policy
  - project

prelude: |
  /// Terraform `deletion_policy` for GoldenGate deployments (defaults to PREVENT).
  extension type const OracleDatabaseGoldengateDeploymentDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    OracleDatabaseGoldengateDeploymentDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    OracleDatabaseGoldengateDeploymentDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const OracleDatabaseGoldengateDeploymentDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = OracleDatabaseGoldengateDeploymentDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = OracleDatabaseGoldengateDeploymentDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = OracleDatabaseGoldengateDeploymentDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<OracleDatabaseGoldengateDeploymentDeletionPolicy> values = [delete, prevent, abandon];
  }

dartTypeOverrides:
  deletion_policy: OracleDatabaseGoldengateDeploymentDeletionPolicy

extraGetters: |2
    TfRef<String> get id => TfRef.attribute<String>(this, 'id');
