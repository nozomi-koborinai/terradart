outputDir: bigquery
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true

curatedDoc: |-
  /// A single access entry on a BigQuery dataset, managed as a standalone
  /// resource (the non-inline counterpart of `GoogleBigqueryDataset.access`).
  ///
  /// Provide **exactly one** principal/target per entry:
  /// - a principal — [userByEmail] / [groupByEmail] / [domain] /
  ///   [specialGroup] / [iamMember] — paired with [role]; **or**
  /// - an authorized resource — [view] / [routine] / [authorizedDataset]
  ///   (these do **not** take a [role]).
  ///
  /// Example (grant a group READER):
  /// ```dart
  /// GoogleBigqueryDatasetAccess(
  ///   'analysts_reader',
  ///   datasetId: dataset.ref,
  ///   role: .literal('READER'),
  ///   grantee: .groupByEmail(.literal('analysts@example.com')),
  /// );
  /// ```

extraImports:
  - "import 'package:meta/meta.dart';"
  - "import '../bigquery/google_bigquery_dataset.dart' show BigqueryDatasetAccessCondition;"

dartTypeOverrides:
  special_group: BigqueryDatasetAccessPredefinedGroup

prelude: |
  /// Predefined BigQuery special group for [GoogleBigqueryDatasetAccess].
  extension type const BigqueryDatasetAccessPredefinedGroup._(TfArg<String> _) implements TfArg<String> {
    BigqueryDatasetAccessPredefinedGroup.variable(String name) : this._(TfArg.variable(name));
    BigqueryDatasetAccessPredefinedGroup.expression(String template) : this._(TfArg.expression(template));
    const BigqueryDatasetAccessPredefinedGroup.arg(TfArg<String> arg) : this._(arg);

    /// Owners of the enclosing project.
    static const projectOwners = BigqueryDatasetAccessPredefinedGroup._(TfArgLiteral('projectOwners'));
    /// Readers of the enclosing project.
    static const projectReaders = BigqueryDatasetAccessPredefinedGroup._(TfArgLiteral('projectReaders'));
    /// Writers of the enclosing project.
    static const projectWriters = BigqueryDatasetAccessPredefinedGroup._(TfArgLiteral('projectWriters'));
    /// All authenticated BigQuery users.
    static const allAuthenticatedUsers = BigqueryDatasetAccessPredefinedGroup._(TfArgLiteral('allAuthenticatedUsers'));

    static const List<BigqueryDatasetAccessPredefinedGroup> values = [projectOwners, projectReaders, projectWriters, allAuthenticatedUsers];
  }

  /// Target resource types an authorized [BigqueryDatasetAccessAuthorizedDataset]
  /// applies to. Currently only views are supported.
  extension type const BigqueryDatasetAccessDatasetTargetType._(TfArg<String> _) implements TfArg<String> {
    BigqueryDatasetAccessDatasetTargetType.variable(String name) : this._(TfArg.variable(name));
    BigqueryDatasetAccessDatasetTargetType.expression(String template) : this._(TfArg.expression(template));
    const BigqueryDatasetAccessDatasetTargetType.arg(TfArg<String> arg) : this._(arg);

    /// The entry applies to views in the dataset.
    static const views = BigqueryDatasetAccessDatasetTargetType._(TfArgLiteral('VIEWS'));

    static const List<BigqueryDatasetAccessDatasetTargetType> values = [views];
  }

  /// A reference to a BigQuery dataset (`project_id` + `dataset_id`).
  @immutable
  class BigqueryDatasetAccessAuthDatasetReference {
    const BigqueryDatasetAccessAuthDatasetReference({
      required this.datasetId,
      required this.projectId,
    });

    final RefTo<GoogleBigqueryDataset> datasetId;
    final TfArg<String> projectId;

    Map<String, Object?> encode() => {
          'dataset_id': datasetId.encodeAs('dataset_id').toTfJson(),
          'project_id': projectId.toTfJson(),
        };
  }

  /// `dataset` access block — grants another dataset's resources access to
  /// this dataset (an "authorized dataset").
  @immutable
  class BigqueryDatasetAccessAuthorizedDataset {
    const BigqueryDatasetAccessAuthorizedDataset({
      required this.dataset,
      required this.targetTypes,
    });

    /// The dataset being authorized.
    final BigqueryDatasetAccessAuthDatasetReference dataset;

    /// Which resource types the entry applies to (currently
    /// [BigqueryDatasetAccessDatasetTargetType.views]).
    final List<BigqueryDatasetAccessDatasetTargetType> targetTypes;

    Map<String, Object?> encode() => {
          'dataset': dataset.encode(),
          'target_types': targetTypes.map((t) => t.toTfJson()).toList(),
        };
  }

  /// `view` access block — an authorized view that may query this dataset.
  @immutable
  class BigqueryDatasetAccessAuthorizedView {
    const BigqueryDatasetAccessAuthorizedView({
      required this.datasetId,
      required this.projectId,
      required this.tableId,
    });

    final RefTo<GoogleBigqueryDataset> datasetId;
    final TfArg<String> projectId;
    final TfArg<String> tableId;

    Map<String, Object?> encode() => {
          'dataset_id': datasetId.encodeAs('dataset_id').toTfJson(),
          'project_id': projectId.toTfJson(),
          'table_id': tableId.toTfJson(),
        };
  }

  /// `routine` access block — an authorized routine that may access this
  /// dataset.
  @immutable
  class BigqueryDatasetAccessAuthorizedRoutine {
    const BigqueryDatasetAccessAuthorizedRoutine({
      required this.datasetId,
      required this.projectId,
      required this.routineId,
    });

    final RefTo<GoogleBigqueryDataset> datasetId;
    final TfArg<String> projectId;
    final TfArg<String> routineId;

    Map<String, Object?> encode() => {
          'dataset_id': datasetId.encodeAs('dataset_id').toTfJson(),
          'project_id': projectId.toTfJson(),
          'routine_id': routineId.toTfJson(),
        };
  }

customSlots:
  view:
    paramDeclaration: "BigqueryDatasetAccessAuthorizedView? view"
    argMapEntry: "if (view != null) 'view': TfArg.literal(view.encode()),"
  routine:
    paramDeclaration: "BigqueryDatasetAccessAuthorizedRoutine? routine"
    argMapEntry: "if (routine != null) 'routine': TfArg.literal(routine.encode()),"
  dataset:
    paramDeclaration: "BigqueryDatasetAccessAuthorizedDataset? authorizedDataset"
    argMapEntry: "if (authorizedDataset != null) 'dataset': TfArg.literal(authorizedDataset.encode()),"
  condition:
    paramDeclaration: "BigqueryDatasetAccessCondition? condition"
    argMapEntry: "if (condition != null) 'condition': TfArg.literal(condition.encode()),"

paramOrder:
  - dataset_id
  - role
  - user_by_email
  - group_by_email
  - domain
  - special_group
  - iam_member
  - view
  - routine
  - dataset
  - condition
  - deletion_policy
  - project

sealedNames:
  "dataset, domain, group_by_email, iam_member, routine, special_group, user_by_email, view": grantee
