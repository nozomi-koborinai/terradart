outputDir: app
deriveClassDoc: true
deriveOutputGetters: true
deriveEnums: true
deriveNestedTypes: true
# `automatic_scaling` / `manual_scaling` are the real schema block names the
# `scaling` customSlot's sealed variants (AutomaticScalingMode /
# ManualScalingMode) already dispatch to via `.blockKey` — the collector's
# customSlotKeys check only matches the bare declared slot name (`scaling`),
# not the block names a virtual/sealed customSlot dynamically dispatches to,
# so without this exclude the collector would derive a second, redundant
# class per block (different name, since the derived name lacks the
# hand-written "Mode" suffix — not a compile collision here, but dead,
# confusing API surface with no enum sites to gain from typing it).
nestedTypeExcludes:
  - automatic_scaling
  - manual_scaling

paramOrder:
  - service
  - version_id
  - runtime
  - runtime_api_version
  - instance_class
  - scaling
  - liveness_check
  - readiness_check
  - vpc_access_connector
  - env_variables
  - beta_settings
  - default_expiration
  - delete_service_on_destroy
  - deletion_policy
  - noop_on_destroy
  - nobuild_files_regex
  - runtime_channel
  - runtime_main_executable_path
  - service_account
  - serving_status
  - inbound_services
  - project

dartTypeOverrides:
  serving_status: AppEngineFlexibleAppVersionServingStatus

extraImports:
  - "import 'package:meta/meta.dart';"

prelude: |
  /// Automatic or manual scaling for [GoogleAppEngineFlexibleAppVersion].
  sealed class AppEngineFlexibleAppVersionScaling {
    const AppEngineFlexibleAppVersionScaling();

    String get blockKey;

    Map<String, Object?> encode();
  }

  /// `automatic_scaling` block — request/latency-driven autoscaling.
  @immutable
  final class AppEngineFlexibleAppVersionAutomaticScalingMode
      extends AppEngineFlexibleAppVersionScaling {
    const AppEngineFlexibleAppVersionAutomaticScalingMode({
      required this.minTotalInstances,
    });

    final TfArg<int> minTotalInstances;

    @override
    String get blockKey => 'automatic_scaling';

    @override
    Map<String, Object?> encode() => {
          'min_total_instances': minTotalInstances.toTfJson(),
        };
  }

  /// `manual_scaling` block — fixed instance count.
  @immutable
  final class AppEngineFlexibleAppVersionManualScalingMode
      extends AppEngineFlexibleAppVersionScaling {
    const AppEngineFlexibleAppVersionManualScalingMode({
      required this.instances,
    });

    final TfArg<int> instances;

    @override
    String get blockKey => 'manual_scaling';

    @override
    Map<String, Object?> encode() => {'instances': instances.toTfJson()};
  }

customSlots:
  scaling:
    paramDeclaration: 'required AppEngineFlexibleAppVersionScaling scaling'
    argMapEntry: "scaling.blockKey: TfArg.literal(scaling.encode()),"
