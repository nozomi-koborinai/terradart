outputDir: chronicle

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// Chronicle native dashboard (Google SecOps).
  ///
  /// Enable `chronicle.googleapis.com` before apply. Use [ChronicleNativeDashboardFilter]
  /// for `filters` blocks.
  ///
  /// Pair with [GoogleChronicleDashboardChart] — charts reference [name].

paramOrder:
  - location
  - instance
  - display_name
  - description
  - access
  - type
  - is_pinned
  - filters
  - charts
  - deletion_policy
  - project

extraImports:
  - "import 'package:meta/meta.dart';"

dartTypeOverrides:
  access: ChronicleNativeDashboardAccess
  type: ChronicleNativeDashboardType
  deletion_policy: ChronicleNativeDashboardDeletionPolicy

prelude: |
