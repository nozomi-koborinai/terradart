  extension type const ChronicleNativeDashboardAccess._(TfArg<String> _) implements TfArg<String> {
    ChronicleNativeDashboardAccess.variable(String name) : this._(TfArg.variable(name));
    ChronicleNativeDashboardAccess.expression(String template) : this._(TfArg.expression(template));
    const ChronicleNativeDashboardAccess.arg(TfArg<String> arg) : this._(arg);

    static const dashboardPrivate = ChronicleNativeDashboardAccess._(TfArgLiteral('DASHBOARD_PRIVATE'));
    static const dashboardPublic = ChronicleNativeDashboardAccess._(TfArgLiteral('DASHBOARD_PUBLIC'));

    static const List<ChronicleNativeDashboardAccess> values = [dashboardPrivate, dashboardPublic];
  }

