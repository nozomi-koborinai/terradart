outputDir: discovery_engine
deriveEnums: true
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true
# The schema lists the entity names per data source in prose; the API
# rejects a name its data source does not have.
enumValues:
  bap_config.supported_connector_modes:
    - DATA_INGESTION
    - ACTIONS
    - END_USER_AUTHENTICATION
  entities.entity_name:
    - Lead
    - Opportunity
    - Contact
    - Account
    - Case
    - Contract
    - Campaign
    - project
    - issue
    - attachment
    - comment
    - worklog
    - Content
    - Space

extraImports:
  - "import 'package:meta/meta.dart';"

curatedDoc: |-
  /// Discovery Engine third-party data connector — leftover factory on the
  /// apply-excluded path (synth + `terraform validate` only).
  ///
  /// Needs an organization / folder / external artifact that
  /// standalone terradart-validate cannot supply. Do not apply.

sealedNames:
  "json_params, params": params

paramOrder:
  - auto_run_disabled
  - collection_display_name
  - collection_id
  - connector_modes
  - data_source
  - data_source_version
  - deletion_policy
  - incremental_refresh_interval
  - incremental_sync_disabled
  - json_params
  - kms_key_name
  - location
  - project
  - refresh_interval
  - static_ip_enabled
  - sync_mode
  - action_config
  - bap_config
  - destination_configs
  - entities
  - params
  - tag
  - metadata
