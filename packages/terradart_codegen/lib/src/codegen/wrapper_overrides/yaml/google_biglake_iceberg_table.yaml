outputDir: biglake
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

curatedDoc: |-
  /// Iceberg table under a [GoogleBiglakeIcebergNamespace].
  ///
  /// Pass [schema] as a nested-block Map (`type` / `fields` / optional
  /// `identifier_field_ids`). [location] is the table's GCS path
  /// (`gs://bucket/namespace/table`). Enable `biglake.googleapis.com`
  /// before apply.

paramOrder:
  - catalog
  - namespace
  - name
  - location
  - schema
  - partition_spec
  - sort_order
  - properties
  - deletion_policy
  - project
