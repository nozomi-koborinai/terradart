outputDir: bigtable

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

curatedDoc: |-
  /// Cloud Bigtable instance — the top-level container for clusters and tables.
  ///
  /// Required identity:
  /// - [localName]: Terraform local name.
  /// - [name]: instance ID (6-33 chars, lowercase letters, numbers, hyphens).
  /// - [cluster]: at least one [BigtableInstanceCluster] (zone + node count).
  ///
  /// Enable `bigtableadmin.googleapis.com` via [Apis.enable] before apply.
  ///
  /// Example (single-zone development instance):
  /// ```dart
  /// GoogleBigtableInstance(
  ///   'events',
  ///   name: TfArg.literal('events-dev'),
  ///   instanceType: BigtableInstanceType.development,
  ///   cluster: [
  ///     BigtableInstanceCluster(
  ///       clusterId: TfArg.literal('events-c1'),
  ///       zone: TfArg.literal('us-central1-b'),
  ///       numNodes: TfArg.literal(1),
  ///     ),
  ///   ],
  /// );
  /// ```

paramOrder:
  - name
  - cluster
  - display_name
  - instance_type
  - edition
  - labels
  - deletion_policy
  - deletion_protection
  - force_destroy
  - project
  - tags

dartTypeOverrides:
  instance_type: BigtableInstanceType
  edition: BigtableInstanceEdition
  cluster.storage_type: BigtableClusterStorageType

prelude: |
  /// `instance_type` on `google_bigtable_instance`.
  extension type const BigtableInstanceType._(TfArg<String> _) implements TfArg<String> {
    BigtableInstanceType.variable(String name) : this._(TfArg.variable(name));
    BigtableInstanceType.expression(String template) : this._(TfArg.expression(template));
    const BigtableInstanceType.arg(TfArg<String> arg) : this._(arg);

    static const development = BigtableInstanceType._(TfArgLiteral('DEVELOPMENT'));
    static const production = BigtableInstanceType._(TfArgLiteral('PRODUCTION'));

    static const List<BigtableInstanceType> values = [development, production];
  }

  /// `edition` on `google_bigtable_instance`.
  extension type const BigtableInstanceEdition._(TfArg<String> _) implements TfArg<String> {
    BigtableInstanceEdition.variable(String name) : this._(TfArg.variable(name));
    BigtableInstanceEdition.expression(String template) : this._(TfArg.expression(template));
    const BigtableInstanceEdition.arg(TfArg<String> arg) : this._(arg);

    static const enterprise = BigtableInstanceEdition._(TfArgLiteral('ENTERPRISE'));
    static const enterprisePlus = BigtableInstanceEdition._(TfArgLiteral('ENTERPRISE_PLUS'));

    static const List<BigtableInstanceEdition> values = [enterprise, enterprisePlus];
  }

  /// `storage_type` on a Bigtable cluster.
  extension type const BigtableClusterStorageType._(TfArg<String> _) implements TfArg<String> {
    BigtableClusterStorageType.variable(String name) : this._(TfArg.variable(name));
    BigtableClusterStorageType.expression(String template) : this._(TfArg.expression(template));
    const BigtableClusterStorageType.arg(TfArg<String> arg) : this._(arg);

    static const ssd = BigtableClusterStorageType._(TfArgLiteral('SSD'));
    static const hdd = BigtableClusterStorageType._(TfArgLiteral('HDD'));

    static const List<BigtableClusterStorageType> values = [ssd, hdd];
  }
