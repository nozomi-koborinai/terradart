outputDir: dialogflow
deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

dartTypeOverrides:
  api_version: DialogflowAgentApiVersion
  match_mode: DialogflowAgentMatchMode
  tier: DialogflowAgentTier

prelude: |
  /// Dialogflow API version surfaced for a [GoogleDialogflowAgent].
  extension type const DialogflowAgentApiVersion._(TfArg<String> _) implements TfArg<String> {
    DialogflowAgentApiVersion.variable(String name) : this._(TfArg.variable(name));
    DialogflowAgentApiVersion.expression(String template) : this._(TfArg.expression(template));
    const DialogflowAgentApiVersion.arg(TfArg<String> arg) : this._(arg);

    /// Legacy V1 API.
    static const v1 = DialogflowAgentApiVersion._(TfArgLiteral('API_VERSION_V1'));
    /// V2 API (default).
    static const v2 = DialogflowAgentApiVersion._(TfArgLiteral('API_VERSION_V2'));
    /// V2beta1 API.
    static const v2Beta1 = DialogflowAgentApiVersion._(TfArgLiteral('API_VERSION_V2_BETA_1'));

    static const List<DialogflowAgentApiVersion> values = [v1, v2, v2Beta1];
  }

  /// How intents are matched from user queries for a [GoogleDialogflowAgent].
  extension type const DialogflowAgentMatchMode._(TfArg<String> _) implements TfArg<String> {
    DialogflowAgentMatchMode.variable(String name) : this._(TfArg.variable(name));
    DialogflowAgentMatchMode.expression(String template) : this._(TfArg.expression(template));
    const DialogflowAgentMatchMode.arg(TfArg<String> arg) : this._(arg);

    /// Hybrid (rules + ML) — best for small intent sets / templates.
    static const hybrid = DialogflowAgentMatchMode._(TfArgLiteral('MATCH_MODE_HYBRID'));
    /// ML-only — best for large intent sets.
    static const mlOnly = DialogflowAgentMatchMode._(TfArgLiteral('MATCH_MODE_ML_ONLY'));

    static const List<DialogflowAgentMatchMode> values = [hybrid, mlOnly];
  }

  /// Service tier of a [GoogleDialogflowAgent].
  extension type const DialogflowAgentTier._(TfArg<String> _) implements TfArg<String> {
    DialogflowAgentTier.variable(String name) : this._(TfArg.variable(name));
    DialogflowAgentTier.expression(String template) : this._(TfArg.expression(template));
    const DialogflowAgentTier.arg(TfArg<String> arg) : this._(arg);

    /// Standard tier (default).
    static const standard = DialogflowAgentTier._(TfArgLiteral('TIER_STANDARD'));
    /// Enterprise tier (Essentials).
    static const enterprise = DialogflowAgentTier._(TfArgLiteral('TIER_ENTERPRISE'));
    /// Enterprise tier (Plus).
    static const enterprisePlus = DialogflowAgentTier._(TfArgLiteral('TIER_ENTERPRISE_PLUS'));

    static const List<DialogflowAgentTier> values = [standard, enterprise, enterprisePlus];
  }

paramOrder:
  - display_name
  - default_language_code
  - time_zone
  - description
  - avatar_uri
  - enable_logging
  - match_mode
  - classification_threshold
  - api_version
  - tier
  - supported_language_codes
  - project
