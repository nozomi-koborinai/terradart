outputDir: app
deriveClassDoc: true
deriveOutputGetters: true

paramOrder:
  - domain_name
  - override_strategy
  - ssl_settings
  - deletion_policy
  - project

dartTypeOverrides:
  override_strategy: AppEngineDomainMappingOverrideStrategy

prelude: |
  /// `override_strategy` on `google_app_engine_domain_mapping`.
  enum AppEngineDomainMappingOverrideStrategy implements TerraformEnum {
    strict('STRICT'),
    overrideStrategy('OVERRIDE');

    const AppEngineDomainMappingOverrideStrategy(this.terraformValue);
    @override
    final String terraformValue;
  }
