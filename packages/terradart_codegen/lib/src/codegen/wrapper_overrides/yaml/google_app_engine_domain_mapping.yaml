outputDir: app
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

extraImports:
  - "import 'package:meta/meta.dart';"

paramOrder:
  - domain_name
  - override_strategy
  - ssl_settings
  - deletion_policy
  - project

dartTypeOverrides:
  override_strategy: AppEngineDomainMappingOverrideStrategy

prelude: |
  /// `override_strategy` on `google_app_engine_domain_mapping`.
  extension type const AppEngineDomainMappingOverrideStrategy._(TfArg<String> _) implements TfArg<String> {
    AppEngineDomainMappingOverrideStrategy.variable(String name) : this._(TfArg.variable(name));
    AppEngineDomainMappingOverrideStrategy.expression(String template) : this._(TfArg.expression(template));
    const AppEngineDomainMappingOverrideStrategy.arg(TfArg<String> arg) : this._(arg);

    static const strict = AppEngineDomainMappingOverrideStrategy._(TfArgLiteral('STRICT'));
    static const overrideStrategy = AppEngineDomainMappingOverrideStrategy._(TfArgLiteral('OVERRIDE'));

    static const List<AppEngineDomainMappingOverrideStrategy> values = [strict, overrideStrategy];
  }
