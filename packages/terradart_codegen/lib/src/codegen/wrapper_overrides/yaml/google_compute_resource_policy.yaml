outputDir: compute
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

sealedNames:
  "disk_consistency_group_policy, group_placement_policy, instance_schedule_policy, snapshot_schedule_policy": kind

curatedDoc: |-
  /// A Compute Engine resource policy. Set at most one policy [kind]
  /// (`.snapshotSchedulePolicy(...)`, `.groupPlacementPolicy(...)`,
  /// `.instanceSchedulePolicy(...)`, `.diskConsistencyGroupPolicy(...)`);
  /// [workloadPolicy] places instances for HA / throughput workloads.
  ///
  /// Example (daily snapshot schedule, keep 7 days):
  /// ```dart
  /// GoogleComputeResourcePolicy(
  ///   'daily_snapshots',
  ///   name: .literal('daily-snapshots'),
  ///   region: .literal('us-central1'),
  ///   kind: .snapshotSchedulePolicy(
  ///     .new(
  ///       schedule: .dailySchedule(
  ///         .new(
  ///           daysInCycle: .literal(1),
  ///           startTime: .literal('04:00'),
  ///         ),
  ///       ),
  ///       retentionPolicy: .new(
  ///             maxRetentionDays: .literal(7),
  ///             onSourceDiskDelete: .applyRetentionPolicy,
  ///           ),
  ///     ),
  ///   ),
  /// );
  /// ```

prelude: |
  /// Day of week for a weekly snapshot schedule.
  extension type const ComputeResourcePolicySnapshotDayOfWeek._(TfArg<String> _) implements TfArg<String> {
    ComputeResourcePolicySnapshotDayOfWeek.variable(String name) : this._(TfArg.variable(name));
    ComputeResourcePolicySnapshotDayOfWeek.expression(String template) : this._(TfArg.expression(template));
    const ComputeResourcePolicySnapshotDayOfWeek.arg(TfArg<String> arg) : this._(arg);

    static const monday = ComputeResourcePolicySnapshotDayOfWeek._(TfArgLiteral('MONDAY'));
    static const tuesday = ComputeResourcePolicySnapshotDayOfWeek._(TfArgLiteral('TUESDAY'));
    static const wednesday = ComputeResourcePolicySnapshotDayOfWeek._(TfArgLiteral('WEDNESDAY'));
    static const thursday = ComputeResourcePolicySnapshotDayOfWeek._(TfArgLiteral('THURSDAY'));
    static const friday = ComputeResourcePolicySnapshotDayOfWeek._(TfArgLiteral('FRIDAY'));
    static const saturday = ComputeResourcePolicySnapshotDayOfWeek._(TfArgLiteral('SATURDAY'));
    static const sunday = ComputeResourcePolicySnapshotDayOfWeek._(TfArgLiteral('SUNDAY'));

    static const List<ComputeResourcePolicySnapshotDayOfWeek> values = [monday, tuesday, wednesday, thursday, friday, saturday, sunday];
  }

  /// Behaviour when the source disk of a scheduled snapshot is deleted.
  extension type const ComputeResourcePolicyOnSourceDiskDelete._(TfArg<String> _) implements TfArg<String> {
    ComputeResourcePolicyOnSourceDiskDelete.variable(String name) : this._(TfArg.variable(name));
    ComputeResourcePolicyOnSourceDiskDelete.expression(String template) : this._(TfArg.expression(template));
    const ComputeResourcePolicyOnSourceDiskDelete.arg(TfArg<String> arg) : this._(arg);

    /// Keep auto-created snapshots when the source disk is deleted.
    static const keepAutoSnapshots = ComputeResourcePolicyOnSourceDiskDelete._(TfArgLiteral('KEEP_AUTO_SNAPSHOTS'));
    /// Apply the retention policy to auto-created snapshots.
    static const applyRetentionPolicy = ComputeResourcePolicyOnSourceDiskDelete._(TfArgLiteral('APPLY_RETENTION_POLICY'));

    static const List<ComputeResourcePolicyOnSourceDiskDelete> values = [keepAutoSnapshots, applyRetentionPolicy];
  }

  /// Workload-placement intent for a [GoogleComputeResourcePolicy].
  extension type const ComputeResourcePolicyWorkloadType._(TfArg<String> _) implements TfArg<String> {
    ComputeResourcePolicyWorkloadType.variable(String name) : this._(TfArg.variable(name));
    ComputeResourcePolicyWorkloadType.expression(String template) : this._(TfArg.expression(template));
    const ComputeResourcePolicyWorkloadType.arg(TfArg<String> arg) : this._(arg);

    /// Spread instances to maximize availability.
    static const highAvailability = ComputeResourcePolicyWorkloadType._(TfArgLiteral('HIGH_AVAILABILITY'));
    /// Pack instances to maximize throughput.
    static const highThroughput = ComputeResourcePolicyWorkloadType._(TfArgLiteral('HIGH_THROUGHPUT'));

    static const List<ComputeResourcePolicyWorkloadType> values = [highAvailability, highThroughput];
  }

  /// Maximum topology distance for a high-throughput workload policy.
  extension type const ComputeResourcePolicyMaxTopologyDistance._(TfArg<String> _) implements TfArg<String> {
    ComputeResourcePolicyMaxTopologyDistance.variable(String name) : this._(TfArg.variable(name));
    ComputeResourcePolicyMaxTopologyDistance.expression(String template) : this._(TfArg.expression(template));
    const ComputeResourcePolicyMaxTopologyDistance.arg(TfArg<String> arg) : this._(arg);

    static const block = ComputeResourcePolicyMaxTopologyDistance._(TfArgLiteral('BLOCK'));
    static const cluster = ComputeResourcePolicyMaxTopologyDistance._(TfArgLiteral('CLUSTER'));
    static const subblock = ComputeResourcePolicyMaxTopologyDistance._(TfArgLiteral('SUBBLOCK'));

    static const List<ComputeResourcePolicyMaxTopologyDistance> values = [block, cluster, subblock];
  }

paramOrder:
  - name
  - region
  - description
  - snapshot_schedule_policy
  - workload_policy
  - group_placement_policy
  - instance_schedule_policy
  - disk_consistency_group_policy
  - deletion_policy
  - project

dartTypeOverrides:
  snapshot_schedule_policy.retention_policy.on_source_disk_delete: ComputeResourcePolicyOnSourceDiskDelete
  snapshot_schedule_policy.schedule.weekly_schedule.day_of_weeks.day: ComputeResourcePolicySnapshotDayOfWeek
  workload_policy.max_topology_distance: ComputeResourcePolicyMaxTopologyDistance
  workload_policy.type: ComputeResourcePolicyWorkloadType
