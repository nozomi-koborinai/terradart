outputDir: kms
deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

dartTypeOverrides:
  state: KmsCryptoKeyVersionState

prelude: |
  /// Operational state for `google_kms_crypto_key_version.state`. Usually
  /// read-only; set only to manually `ENABLE` or `DISABLE` a version.
  extension type const KmsCryptoKeyVersionState._(TfArg<String> _) implements TfArg<String> {
    KmsCryptoKeyVersionState.variable(String name) : this._(TfArg.variable(name));
    KmsCryptoKeyVersionState.expression(String template) : this._(TfArg.expression(template));
    const KmsCryptoKeyVersionState.arg(TfArg<String> arg) : this._(arg);

    static const pendingGeneration = KmsCryptoKeyVersionState._(TfArgLiteral('PENDING_GENERATION'));
    static const enabled = KmsCryptoKeyVersionState._(TfArgLiteral('ENABLED'));
    static const disabled = KmsCryptoKeyVersionState._(TfArgLiteral('DISABLED'));
    static const destroyed = KmsCryptoKeyVersionState._(TfArgLiteral('DESTROYED'));
    static const destroyScheduled = KmsCryptoKeyVersionState._(TfArgLiteral('DESTROY_SCHEDULED'));

    static const List<KmsCryptoKeyVersionState> values = [pendingGeneration, enabled, disabled, destroyed, destroyScheduled];
  }

paramOrder:
  - crypto_key
  - state
  - external_protection_level_options

curatedDoc: |-
  /// Manages a [GoogleKmsCryptoKey] version (rotation / destroy lifecycle).
  /// Pass `cryptoKey` as the parent key (`key.ref`) or its id path.
  ///
  /// Example:
  /// ```dart
  /// GoogleKmsCryptoKeyVersion(
  ///   'v1',
  ///   cryptoKey: ringKey.ref,
  /// );
  /// ```
