outputDir: secret_manager
deriveClassDoc: true
deriveNestedTypes: true
deriveExactlyOne: true
deriveOutputGetters: true

paramOrder:
  - secret
  - secret_data
  - secret_data_wo
  - secret_data_wo_version
  - enabled
  - is_secret_data_base64
  - deletion_policy

# Named like the hand-written `payload` of google_secret_manager_secret_version.
sealedNames:
  "secret_data, secret_data_wo": payload
