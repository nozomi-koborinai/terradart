outputDir: logging
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveEnums: true
deriveNestedTypes: true

dartTypeOverrides:
  visibility: LoggingSavedQueryVisibility

paramOrder:
  - name
  - display_name
  - parent
  - location
  - visibility
  - description
  - logging_query
  - ops_analytics_query

curatedDoc: |-
  /// Saved Logging query (Logs Explorer or Ops Analytics). `definition` is
  /// sealed: exactly one of `.loggingQuery(...)` or `.opsAnalyticsQuery(...)`.
  ///
  /// Example:
  /// ```dart
  /// GoogleLoggingSavedQuery(
  ///   'audit_errors',
  ///   name: .literal('audit-errors'),
  ///   displayName: .literal('Audit errors (7d)'),
  ///   parent: .literal('projects/my-proj/locations/global'),
  ///   location: .literal('global'),
  ///   visibility: .literal(.private),
  ///   definition: .loggingQuery(
  ///     .new(
  ///       filter: .literal(
  ///         'logName:"cloudaudit.googleapis.com" AND severity>=ERROR',
  ///       ),
  ///     ),
  ///   ),
  /// );
  /// ```

sealedNames:
  "logging_query, ops_analytics_query": definition
