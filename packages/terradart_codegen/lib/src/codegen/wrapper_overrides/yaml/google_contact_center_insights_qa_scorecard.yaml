    const ContactCenterInsightsQaScorecardSource.arg(TfArg<String> arg) : this._(arg);

    /// Customer-authored scorecard.
    static const customerDefined = ContactCenterInsightsQaScorecardSource._(TfArgLiteral('QA_SCORECARD_SOURCE_CUSTOMER_DEFINED'));
