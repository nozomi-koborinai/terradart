outputDir: access_context_manager
deriveClassDoc: true
deriveOutputGetters: true
deriveNestedTypes: true

extraImports:
  - "import 'package:meta/meta.dart';"

paramOrder:
  - name
  - parent
  - title
  - description
  - basic
  - custom
  - deletion_policy

extraGetters: |2
    TfRef<String> get id => TfRef.attribute<String>(this, 'id');
    TfRef<String> get nameRef => TfRef.attribute<String>(this, 'name');
