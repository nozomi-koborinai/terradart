outputDir: migration

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

curatedDoc: |-
  /// Migration Center preference set — sizing / target-product assumptions for reports.
  ///
  /// Pair with [GoogleMigrationCenterGroup] via
  /// [GoogleMigrationCenterReportConfig] `group_preferenceset_assignments`.
  /// Optional `virtual_machine_preferences` nested blocks are omitted from this
  /// curated surface; extend the override when a Wave needs typed VM prefs.

paramOrder:
  - location
  - preference_set_id
  - display_name
  - description
  - deletion_policy
  - virtual_machine_preferences
  - project

prelude: |
  /// Terraform `deletion_policy` for Migration Center preference sets.
  extension type const MigrationCenterPreferenceSetDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    MigrationCenterPreferenceSetDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    MigrationCenterPreferenceSetDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const MigrationCenterPreferenceSetDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = MigrationCenterPreferenceSetDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = MigrationCenterPreferenceSetDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = MigrationCenterPreferenceSetDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<MigrationCenterPreferenceSetDeletionPolicy> values = [delete, prevent, abandon];
  }

dartTypeOverrides:
  deletion_policy: MigrationCenterPreferenceSetDeletionPolicy
