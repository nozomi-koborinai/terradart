outputDir: datastream
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

extraImports:
  - "import 'package:meta/meta.dart';"

curatedDoc: |-
  /// Leftover factory on the apply-excluded path
  /// (synth + `terraform validate` only).
  ///
  /// Needs an organization / folder / billing account /
  /// external artifact that standalone terradart-validate
  /// cannot supply. Do not apply.

paramOrder:
  - connection_profile_id
  - create_without_validation
  - deletion_policy
  - display_name
  - labels
  - location
  - project
  - forward_ssh_connectivity
  - gcs_profile
  - private_connectivity
  - bigquery_profile
  - mongodb_profile
  - mysql_profile
  - oracle_profile
  - postgresql_profile
  - sql_server_profile

sealedNames:
  "bigquery_profile, gcs_profile, mongodb_profile, mysql_profile, oracle_profile, postgresql_profile, sql_server_profile": endpoint
  "forward_ssh_connectivity.password, forward_ssh_connectivity.private_key": credential
