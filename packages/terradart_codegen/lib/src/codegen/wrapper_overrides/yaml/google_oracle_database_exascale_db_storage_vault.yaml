outputDir: oracle

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true
deriveEnums: true

curatedDoc: |-
  /// Oracle Exascale DB storage vault on Oracle Database@Google Cloud.
  ///
  /// Enable `oracledatabase.googleapis.com` before apply. Pair with
  /// [GoogleOracleDatabaseExadbVmCluster] via `properties.exascale_db_storage_vault`.

paramOrder:
  - location
  - exascale_db_storage_vault_id
  - display_name
  - properties
  - labels
  - deletion_policy
  - deletion_protection
  - project

prelude: |
  /// Terraform `deletion_policy` for Exascale DB storage vaults.
  extension type const OracleDatabaseExascaleDbStorageVaultDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    OracleDatabaseExascaleDbStorageVaultDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    OracleDatabaseExascaleDbStorageVaultDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const OracleDatabaseExascaleDbStorageVaultDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = OracleDatabaseExascaleDbStorageVaultDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = OracleDatabaseExascaleDbStorageVaultDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = OracleDatabaseExascaleDbStorageVaultDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<OracleDatabaseExascaleDbStorageVaultDeletionPolicy> values = [delete, prevent, abandon];
  }

dartTypeOverrides:
  deletion_policy: OracleDatabaseExascaleDbStorageVaultDeletionPolicy

extraGetters: |2
    TfRef<String> get id => TfRef.attribute<String>(this, 'id');
