curatedDoc: |-
  /// Authoritative IAM policy for a GKE Hub fleet scope.
  ///
  /// `policy_data` replaces the entire IAM policy, overwriting grants made
  /// outside Terraform. Prefer [GoogleGkeHubScopeIamMember] for single-principal grants.

paramOrder:
  - scope_id
  - policy_data
  - project
