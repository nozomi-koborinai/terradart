outputDir: network

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// ULL mirroring collector rule — traffic match criteria on a collector.
  ///
  /// Set [ullMirroringCollector] to `collector.name`. Requires a
  /// [NetworkSecurityUllMirroringCollectorRuleMatch] block.

extraImports:
  - "import 'package:meta/meta.dart';"

paramOrder:
  - location
  - ull_mirroring_collector
  - ull_mirroring_collector_rule_id
  - match
  - labels
  - deletion_policy
  - project

prelude: |
  /// Terraform `deletion_policy` for ULL mirroring collector rules.
  extension type const NetworkSecurityUllMirroringCollectorRuleDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    NetworkSecurityUllMirroringCollectorRuleDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    NetworkSecurityUllMirroringCollectorRuleDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const NetworkSecurityUllMirroringCollectorRuleDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = NetworkSecurityUllMirroringCollectorRuleDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = NetworkSecurityUllMirroringCollectorRuleDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = NetworkSecurityUllMirroringCollectorRuleDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<NetworkSecurityUllMirroringCollectorRuleDeletionPolicy> values = [delete, prevent, abandon];
  }

  /// Traffic direction for `match.direction`.
  extension type const NetworkSecurityUllMirroringCollectorRuleDirection._(TfArg<String> _) implements TfArg<String> {
    NetworkSecurityUllMirroringCollectorRuleDirection.variable(String name) : this._(TfArg.variable(name));
    NetworkSecurityUllMirroringCollectorRuleDirection.expression(String template) : this._(TfArg.expression(template));
    const NetworkSecurityUllMirroringCollectorRuleDirection.arg(TfArg<String> arg) : this._(arg);

    static const ingress = NetworkSecurityUllMirroringCollectorRuleDirection._(TfArgLiteral('INGRESS'));
    static const egress = NetworkSecurityUllMirroringCollectorRuleDirection._(TfArgLiteral('EGRESS'));

    static const List<NetworkSecurityUllMirroringCollectorRuleDirection> values = [ingress, egress];
  }

  /// `match` block on a ULL mirroring collector rule.
  @immutable
  class NetworkSecurityUllMirroringCollectorRuleMatch {
    const NetworkSecurityUllMirroringCollectorRuleMatch({
      this.direction,
      this.srcIpRanges,
      this.dstIpRanges,
      this.ipProtocols,
    });

    final NetworkSecurityUllMirroringCollectorRuleDirection? direction;
    final List<TfArg<String>>? srcIpRanges;
    final List<TfArg<String>>? dstIpRanges;
    final List<TfArg<String>>? ipProtocols;

    Map<String, Object?> toArgMap() => {
      if (direction != null) 'direction': direction!.toTfJson(),
      if (srcIpRanges != null)
        'src_ip_ranges': srcIpRanges!.map((v) => v.toTfJson()).toList(),
      if (dstIpRanges != null)
        'dst_ip_ranges': dstIpRanges!.map((v) => v.toTfJson()).toList(),
      if (ipProtocols != null)
        'ip_protocols': ipProtocols!.map((v) => v.toTfJson()).toList(),
    };
  }

dartTypeOverrides:
  deletion_policy: NetworkSecurityUllMirroringCollectorRuleDeletionPolicy

customSlots:
  match:
    paramDeclaration: 'required NetworkSecurityUllMirroringCollectorRuleMatch match'
    argMapEntry: "'match': TfArg.literal([match.toArgMap()]),"
