outputDir: network

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// Network Connectivity Center **spoke** attached to a
  /// [GoogleNetworkConnectivityHub]. Provide exactly one [attachment]
  /// variant (VPC, VPN tunnels, interconnect, router appliance, producer VPC,
  /// or NCC gateway).
  ///
  /// Example (VPC spoke):
  /// ```dart
  /// GoogleNetworkConnectivitySpoke(
  ///   localName: 'vpc_spoke',
  ///   name: .literal('vpc-spoke'),
  ///   location: .literal('global'),
  ///   hub: hub.ref,
  ///   attachment: .linkedVpcNetwork(
  ///     NetworkConnectivitySpokeLinkedVpcNetwork(uri: .ref(vpc.id)),
  ///   ),
  /// );
  /// ```

# The API requires one attachment; Magic Modules only marks them conflicting.
exactlyOneOf:
  - "gateway, linked_interconnect_attachments, linked_producer_vpc_network, linked_router_appliance_instances, linked_vpc_network, linked_vpn_tunnels"
sealedNames:
  "gateway, linked_interconnect_attachments, linked_producer_vpc_network, linked_router_appliance_instances, linked_vpc_network, linked_vpn_tunnels": attachment

paramOrder:
  - name
  - location
  - hub
  - gateway
  - linked_interconnect_attachments
  - linked_producer_vpc_network
  - linked_router_appliance_instances
  - linked_vpc_network
  - linked_vpn_tunnels
  - group
  - description
  - labels
  - deletion_policy
  - project
