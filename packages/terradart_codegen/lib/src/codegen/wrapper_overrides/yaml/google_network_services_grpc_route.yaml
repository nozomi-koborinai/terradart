outputDir: network

deriveClassDoc: true
deriveOutputGetters: true
deriveNestedTypes: true
deriveEnums: true

# Hyphenated nested enum `retry_conditions` (`connect-failure`, …) cannot
# wrap until screamingToCamel treats `-` as a snake separator (naming.dart
# is outside wave_allowed_paths). Freeze the whole `rules` subtree so
# --strict-nested records it as frozen-by-exclude rather than a gap.
nestedTypeExcludes:
  - rules

curatedDoc: |-
  /// Cloud Service Mesh **gRPC route** — hostname + method matchers that
  /// attach to a [GoogleNetworkServicesMesh] (or a gateway). Config only
  /// until workloads join the mesh; do not attach a
  /// [GoogleNetworkServicesGateway] in apply-smoke (SWG is $1.25/h).
  ///
  /// Nested `rules` stay as `List<Map<String, dynamic>>` until hyphenated
  /// schema enums (`connect-failure`, …) can camelCase legally in wrap.

paramOrder:
  - name
  - hostnames
  - rules
  - meshes
  - gateways
  - location
  - description
  - labels
  - deletion_policy
  - project

extraGetters: |2
    /// Reference to `name` attribute.
    TfRef<String> get nameRef => TfRef.attribute<String>(this, 'name');
