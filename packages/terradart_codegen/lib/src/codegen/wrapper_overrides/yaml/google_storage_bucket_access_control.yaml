outputDir: storage
deriveClassDoc: true
deriveNestedTypes: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveEnums: true

dartTypeOverrides:
  role: StorageBucketAccessControlRole

curatedDoc: |-
  /// Fine-grained **bucket ACL** entry (one entity + optional role). Requires a
  /// bucket with uniform bucket-level access **disabled** — HNS buckets cannot
  /// use this resource. Prefer IAM ([GoogleStorageBucketIamMember]) on modern
  /// buckets.
  ///
  /// Example:
  /// ```dart
  /// final legacy = add(GoogleStorageBucket(
  ///   'legacy',
  ///   name: .literal('legacy-bucket'),
  ///   location: .literal('US'),
  /// ));
  /// GoogleStorageBucketAccessControl(
  ///   'legacy_reader',
  ///   bucket: legacy.ref,
  ///   entity: .literal('allAuthenticatedUsers'),
  ///   role: StorageBucketAccessControlRole.reader,
  /// );
  /// ```

paramOrder:
  - bucket
  - entity
  - role
  - deletion_policy
