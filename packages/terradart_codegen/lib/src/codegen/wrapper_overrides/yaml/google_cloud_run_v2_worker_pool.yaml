outputDir: cloud_run
deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

dartTypeOverrides:
  launch_stage: CloudRunV2WorkerPoolLaunchStage
  instance_splits.type: CloudRunV2WorkerPoolInstanceSplitType
  template.encryption_key_revocation_action: CloudRunV2WorkerPoolEncryptionKeyRevocationAction
  scaling.scaling_mode: ScalingMode
  template.volumes.empty_dir.medium: EmptyDirMedium

extraImports:
  - "import 'package:meta/meta.dart';"
  - "import 'package:terradart_google/src/cloud_run/google_cloud_run_v2_service.dart' show EmptyDirMedium, ScalingMode;"

prelude: |
  /// Launch stage for `google_cloud_run_v2_worker_pool.launch_stage`. Shares
  /// Terraform values with [LaunchStage] / [CloudRunV2JobLaunchStage] but uses
  /// a worker-pool-specific name so `cloud_run.dart` can export all three.
  extension type const CloudRunV2WorkerPoolLaunchStage._(TfArg<String> _) implements TfArg<String> {
    CloudRunV2WorkerPoolLaunchStage.variable(String name) : this._(TfArg.variable(name));
    CloudRunV2WorkerPoolLaunchStage.expression(String template) : this._(TfArg.expression(template));
    const CloudRunV2WorkerPoolLaunchStage.arg(TfArg<String> arg) : this._(arg);

    static const unimplemented = CloudRunV2WorkerPoolLaunchStage._(TfArgLiteral('UNIMPLEMENTED'));
    static const prelaunch = CloudRunV2WorkerPoolLaunchStage._(TfArgLiteral('PRELAUNCH'));
    static const earlyAccess = CloudRunV2WorkerPoolLaunchStage._(TfArgLiteral('EARLY_ACCESS'));
    static const alpha = CloudRunV2WorkerPoolLaunchStage._(TfArgLiteral('ALPHA'));
    static const beta = CloudRunV2WorkerPoolLaunchStage._(TfArgLiteral('BETA'));
    static const ga = CloudRunV2WorkerPoolLaunchStage._(TfArgLiteral('GA'));
    static const deprecatedStage = CloudRunV2WorkerPoolLaunchStage._(TfArgLiteral('DEPRECATED'));

    static const List<CloudRunV2WorkerPoolLaunchStage> values = [unimplemented, prelaunch, earlyAccess, alpha, beta, ga, deprecatedStage];
  }

  extension type const CloudRunV2WorkerPoolInstanceSplitType._(TfArg<String> _) implements TfArg<String> {
    CloudRunV2WorkerPoolInstanceSplitType.variable(String name) : this._(TfArg.variable(name));
    CloudRunV2WorkerPoolInstanceSplitType.expression(String template) : this._(TfArg.expression(template));
    const CloudRunV2WorkerPoolInstanceSplitType.arg(TfArg<String> arg) : this._(arg);

    static const latest = CloudRunV2WorkerPoolInstanceSplitType._(TfArgLiteral('INSTANCE_SPLIT_ALLOCATION_TYPE_LATEST'));
    static const revision = CloudRunV2WorkerPoolInstanceSplitType._(TfArgLiteral('INSTANCE_SPLIT_ALLOCATION_TYPE_REVISION'));

    static const List<CloudRunV2WorkerPoolInstanceSplitType> values = [latest, revision];
  }

  extension type const CloudRunV2WorkerPoolEncryptionKeyRevocationAction._(TfArg<String> _) implements TfArg<String> {
    CloudRunV2WorkerPoolEncryptionKeyRevocationAction.variable(String name) : this._(TfArg.variable(name));
    CloudRunV2WorkerPoolEncryptionKeyRevocationAction.expression(String template) : this._(TfArg.expression(template));
    const CloudRunV2WorkerPoolEncryptionKeyRevocationAction.arg(TfArg<String> arg) : this._(arg);

    static const preventNew = CloudRunV2WorkerPoolEncryptionKeyRevocationAction._(TfArgLiteral('PREVENT_NEW'));
    static const shutdown = CloudRunV2WorkerPoolEncryptionKeyRevocationAction._(TfArgLiteral('SHUTDOWN'));

    static const List<CloudRunV2WorkerPoolEncryptionKeyRevocationAction> values = [preventNew, shutdown];
  }


paramOrder:
- annotations
- client
- client_version
- deletion_protection
- description
- labels
- launch_stage
- location
- name
- project
- binary_authorization
- instance_splits
- scaling
- template

# The Cloud Run Admin API takes one source per volume and one value per
# environment variable; the provider leaves both checks to the API.
exactlyOneOf:
  - "template.volumes.cloud_sql_instance, template.volumes.empty_dir, template.volumes.gcs, template.volumes.nfs, template.volumes.secret"
  - "template.containers.env.value, template.containers.env.value_source"

sealedNames:
  "template.containers.env.value, template.containers.env.value_source": source
  "template.volumes.cloud_sql_instance, template.volumes.empty_dir, template.volumes.gcs, template.volumes.nfs, template.volumes.secret": source
  "binary_authorization.policy, binary_authorization.use_default": policy
