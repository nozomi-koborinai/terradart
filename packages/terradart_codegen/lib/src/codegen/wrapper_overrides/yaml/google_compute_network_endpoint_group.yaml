outputDir: compute

deriveClassDoc: true
deriveExactlyOne: true

curatedDoc: |-
  /// Dominant L7 LB pattern: zonal VM-IP+port endpoints in a single subnet,
  /// attached to a backend service. For internet-fronted (hybrid) endpoints
  /// with no GCP backing VM, see `GoogleComputeGlobalNetworkEndpointGroup`.
  /// For regional Serverless / PSC NEGs, see
  /// `GoogleComputeRegionNetworkEndpointGroup`.
  ///
  /// Required identity:
  /// - [localName]: Terraform local name.
  /// - `name`: GCP-internal NEG resource name. Must comply with RFC1035.
  /// - `zone`: the zone the NEG (and its member endpoints) lives in.
  /// - `network`: the VPC the endpoints belong to. Pass `vpc.ref`.
  ///
  /// When renaming or recreating an in-use NEG, detaching it from the backend
  /// service first avoids the `create_before_destroy` cascade to dependents.
  ///
  /// Example (zonal VM-IP+port NEG fronting a regional internal L7 LB):
  /// ```dart
  /// final neg = GoogleComputeNetworkEndpointGroup(
  ///   'app_neg',
  ///   name: TfArg.literal('app-neg-usc1a'),
  ///   zone: TfArg.literal('us-central1-a'),
  ///   network: vpc.ref,
  ///   subnetwork: subnet.ref,
  ///   networkEndpointType:
  ///       NetworkEndpointGroupType.gceVmIpPort,
  ///   defaultPort: TfArg.literal(8080),
  /// );
  /// ```

deriveNestedTypes: true
deriveOutputGetters: true

paramOrder:
  - name
  - zone
  - network
  - subnetwork
  - network_endpoint_type
  - default_port
  - description
  - project

dartTypeOverrides:
  network_endpoint_type: NetworkEndpointGroupType

prelude: |
  /// `network_endpoint_type` for `google_compute_network_endpoint_group`.
  ///
  /// Default in the GCP API is [gceVmIpPort], which is the dominant value
  /// for L7 LB with VM-backed endpoints (each endpoint is a `(VM IP, port)`
  /// pair). [gceVmIp] is used for L4 internal LB with VMs as endpoints
  /// (port is implicit). [nonGcpPrivateIpPort] is reserved for **hybrid
  /// connectivity** NEGs that point at on-prem / multi-cloud private IPs
  /// reachable via Cloud VPN or Interconnect.
  ///
  /// [internetIpPort], [internetFqdnPort], [serverless], and
  /// [privateServiceConnect] are accepted by the schema on this zonal
  /// resource for completeness, but practical use is rarer than on the
  /// global / regional siblings: internet-fronted endpoints are typically
  /// modeled with `GoogleComputeGlobalNetworkEndpointGroup`, while
  /// Serverless and PSC endpoints are typically modeled with
  /// `GoogleComputeRegionNetworkEndpointGroup`. Prefer those resources
  /// for the dominant patterns; reach for the zonal variants only when
  /// you have a specific zonal-scoped use case.
  extension type const NetworkEndpointGroupType._(TfArg<String> _) implements TfArg<String> {
    NetworkEndpointGroupType.variable(String name) : this._(TfArg.variable(name));
    NetworkEndpointGroupType.expression(String template) : this._(TfArg.expression(template));
    const NetworkEndpointGroupType.arg(TfArg<String> arg) : this._(arg);

    static const gceVmIpPort = NetworkEndpointGroupType._(TfArgLiteral('GCE_VM_IP_PORT'));
    static const gceVmIp = NetworkEndpointGroupType._(TfArgLiteral('GCE_VM_IP'));
    static const nonGcpPrivateIpPort = NetworkEndpointGroupType._(TfArgLiteral('NON_GCP_PRIVATE_IP_PORT'));
    static const internetIpPort = NetworkEndpointGroupType._(TfArgLiteral('INTERNET_IP_PORT'));
    static const internetFqdnPort = NetworkEndpointGroupType._(TfArgLiteral('INTERNET_FQDN_PORT'));
    static const serverless = NetworkEndpointGroupType._(TfArgLiteral('SERVERLESS'));
    static const privateServiceConnect = NetworkEndpointGroupType._(TfArgLiteral('PRIVATE_SERVICE_CONNECT'));
    static const gceVmIpDedicatedBackend = NetworkEndpointGroupType._(TfArgLiteral('GCE_VM_IP_DEDICATED_BACKEND'));

    static const List<NetworkEndpointGroupType> values = [gceVmIpPort, gceVmIp, nonGcpPrivateIpPort, internetIpPort, internetFqdnPort, serverless, privateServiceConnect, gceVmIpDedicatedBackend];
  }
