dartTypeOverrides:
  type: PrivatecaCertificateAuthorityType
  desired_state: PrivatecaCertificateAuthorityDesiredState
  key_spec.algorithm: PrivatecaCertificateAuthorityKeyAlgorithm

curatedDoc: |-
  /// Certificate Authority Service (CAS) certificate authority — issues
  /// certs inside a [GooglePrivatecaCaPool] for [GoogleCertificateManagerCertificateIssuanceConfig].
  ///
  /// Required identity:
  /// - [localName]: Terraform local name.
  /// - [certificateAuthorityId]: short CA ID within the pool.
  /// - [pool]: full CAS pool ID — `pool.id` from [GooglePrivatecaCaPool].
  /// - [location]: regional location (match the pool).
  /// - [config]: subject + X.509 profile ([PrivatecaCertificateAuthorityConfig]).
  /// - [keySpec]: managed key algorithm ([PrivatecaCertificateAuthorityKeySpec]).
  ///
  /// Example (self-signed root in a DEVOPS pool):
  /// ```dart
  /// GooglePrivatecaCertificateAuthority(
  ///   'app_ca',
  ///   certificateAuthorityId: TfArg.literal('app-root-ca'),
  ///   pool: caPool.ref,
  ///   location: TfArg.literal('us-central1'),
  ///   config: PrivatecaCertificateAuthorityConfig(
  ///     subjectConfig: .new(
  ///       subject: .new(
  ///         commonName: TfArg.literal('app.example.com'),
  ///       ),
  ///     ),
  ///     x509Config: .new(
  ///       caOptions: .new(
  ///         isCa: .literal(true),
  ///       ),
  ///       keyUsage: .new(
  ///         baseKeyUsage: .new(
  ///           certSign: .literal(true),
  ///           crlSign: .literal(true),
  ///         ),
  ///         extendedKeyUsage: .new(),
  ///       ),
  ///     ),
  ///   ),
  ///   keySpec: .algorithm(.rsaPkcs14096Sha256),
  /// );
  /// ```

prelude: |
  /// `type` — CA tier (must match the parent pool tier).
  extension type const PrivatecaCertificateAuthorityType._(TfArg<String> _) implements TfArg<String> {
    PrivatecaCertificateAuthorityType.variable(String name) : this._(TfArg.variable(name));
    PrivatecaCertificateAuthorityType.expression(String template) : this._(TfArg.expression(template));
    const PrivatecaCertificateAuthorityType.arg(TfArg<String> arg) : this._(arg);

    static const selfSigned = PrivatecaCertificateAuthorityType._(TfArgLiteral('SELF_SIGNED'));
    static const subordinate = PrivatecaCertificateAuthorityType._(TfArgLiteral('SUBORDINATE'));

    static const List<PrivatecaCertificateAuthorityType> values = [selfSigned, subordinate];
  }

  /// `desired_state` — operational state target for the CA.
  extension type const PrivatecaCertificateAuthorityDesiredState._(TfArg<String> _) implements TfArg<String> {
    PrivatecaCertificateAuthorityDesiredState.variable(String name) : this._(TfArg.variable(name));
    PrivatecaCertificateAuthorityDesiredState.expression(String template) : this._(TfArg.expression(template));
    const PrivatecaCertificateAuthorityDesiredState.arg(TfArg<String> arg) : this._(arg);

    static const enabled = PrivatecaCertificateAuthorityDesiredState._(TfArgLiteral('ENABLED'));
    static const staged = PrivatecaCertificateAuthorityDesiredState._(TfArgLiteral('STAGED'));
    static const disabled = PrivatecaCertificateAuthorityDesiredState._(TfArgLiteral('DISABLED'));

    static const List<PrivatecaCertificateAuthorityDesiredState> values = [enabled, staged, disabled];
  }

  /// `key_spec.algorithm` — managed Cloud KMS key algorithm.
  extension type const PrivatecaCertificateAuthorityKeyAlgorithm._(TfArg<String> _) implements TfArg<String> {
    PrivatecaCertificateAuthorityKeyAlgorithm.variable(String name) : this._(TfArg.variable(name));
    PrivatecaCertificateAuthorityKeyAlgorithm.expression(String template) : this._(TfArg.expression(template));
    const PrivatecaCertificateAuthorityKeyAlgorithm.arg(TfArg<String> arg) : this._(arg);

    static const signHashAlgorithmUnspecified = PrivatecaCertificateAuthorityKeyAlgorithm._(TfArgLiteral('SIGN_HASH_ALGORITHM_UNSPECIFIED'));
    static const rsaPss2048Sha256 = PrivatecaCertificateAuthorityKeyAlgorithm._(TfArgLiteral('RSA_PSS_2048_SHA256'));
    static const rsaPss3072Sha256 = PrivatecaCertificateAuthorityKeyAlgorithm._(TfArgLiteral('RSA_PSS_3072_SHA256'));
    static const rsaPss4096Sha256 = PrivatecaCertificateAuthorityKeyAlgorithm._(TfArgLiteral('RSA_PSS_4096_SHA256'));
    static const rsaPkcs12048Sha256 = PrivatecaCertificateAuthorityKeyAlgorithm._(TfArgLiteral('RSA_PKCS1_2048_SHA256'));
    static const rsaPkcs13072Sha256 = PrivatecaCertificateAuthorityKeyAlgorithm._(TfArgLiteral('RSA_PKCS1_3072_SHA256'));
    static const rsaPkcs14096Sha256 = PrivatecaCertificateAuthorityKeyAlgorithm._(TfArgLiteral('RSA_PKCS1_4096_SHA256'));
    static const ecP256Sha256 = PrivatecaCertificateAuthorityKeyAlgorithm._(TfArgLiteral('EC_P256_SHA256'));
    static const ecP384Sha384 = PrivatecaCertificateAuthorityKeyAlgorithm._(TfArgLiteral('EC_P384_SHA384'));

    static const List<PrivatecaCertificateAuthorityKeyAlgorithm> values = [signHashAlgorithmUnspecified, rsaPss2048Sha256, rsaPss3072Sha256, rsaPss4096Sha256, rsaPkcs12048Sha256, rsaPkcs13072Sha256, rsaPkcs14096Sha256, ecP256Sha256, ecP384Sha384];
  }
