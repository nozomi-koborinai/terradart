curatedDoc: |-
  /// Authoritative IAM policy for a Compute Engine image.
  ///
  /// `policy_data` replaces the entire IAM policy, overwriting grants made
  /// outside Terraform. Prefer [GoogleComputeImageIamMember] for single-principal grants.

paramOrder:
  - image
  - policy_data
  - project
