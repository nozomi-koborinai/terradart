dartTypeOverrides:
  tier: FilestoreInstanceTier
  file_shares.nfs_export_options.access_mode: FilestoreInstanceNfsExportAccessMode
  file_shares.nfs_export_options.squash_mode: FilestoreInstanceNfsSquashMode
