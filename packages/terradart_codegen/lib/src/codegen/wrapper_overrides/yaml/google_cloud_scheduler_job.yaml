outputDir: cloud_scheduler
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

curatedDoc: |-
  /// `region` is treated as Required for ergonomic clarity in v0.0.x, even
  /// though the underlying provider attribute is technically Optional (it
  /// falls back to the provider default). This avoids subtle issues where a
  /// stack pinned to one region quietly schedules jobs in another.
  ///
  /// Choose exactly one [CloudSchedulerJobTarget]:
  /// - `.pubsubTarget(...)` — its `topicName` takes the topic itself and
  ///   emits `topic.id`, the full `projects/.../topics/...` path.
  /// - `.httpTarget(...)` — generic HTTP webhook.
  /// - `.appEngineHttpTarget(...)` — App Engine routing.
  ///
  /// Example:
  /// ```dart
  /// final orders = GooglePubsubTopic(
  ///   localName: 'orders',
  ///   name: .literal('orders'),
  /// );
  /// final job = GoogleCloudSchedulerJob(
  ///   localName: 'nightly',
  ///   name: .literal('nightly'),
  ///   region: .literal('us-central1'),
  ///   schedule: .literal('0 0 * * *'),
  ///   target: .pubsubTarget(
  ///     .new(topicName: .of(orders)),
  ///   ),
  /// );
  /// ```

# Identity (name, region) first; the three target blocks become the
# sealed `target` argument at their position.
paramOrder:
  - name
  - region
  - pubsub_target
  - http_target
  - app_engine_http_target
  - description
  - schedule
  - time_zone
  - paused
  - attempt_deadline
  - retry_config
  - project

argMapOrder:
  - name
  - region
  - description
  - schedule
  - time_zone
  - paused
  - attempt_deadline
  - retry_config
  - project
  - pubsub_target
  - http_target
  - app_engine_http_target

# Hand-written tightens `region` from `optional + computed` to required
# for ergonomic clarity; matches the existing IAM-member precedent
# (e.g. google_cloud_tasks_queue_iam_member tightens `location`).
requiredParams:
  - region
