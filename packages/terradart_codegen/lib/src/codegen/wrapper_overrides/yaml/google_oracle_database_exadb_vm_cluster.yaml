outputDir: oracle

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true
deriveEnums: true

curatedDoc: |-
  /// Oracle Exadata VM cluster (ExaDB) on Oracle Database@Google Cloud.
  ///
  /// Enable `oracledatabase.googleapis.com` before apply. Requires client and
  /// backup [odb_subnet] refs plus [properties] with Exascale vault wiring,
  /// `shape_attribute`, and SSH public keys.

paramOrder:
  - location
  - exadb_vm_cluster_id
  - display_name
  - odb_subnet
  - backup_odb_subnet
  - odb_network
  - properties
  - labels
  - deletion_policy
  - deletion_protection
  - project

prelude: |
  /// Terraform `deletion_policy` for ExaDB VM clusters.
  extension type const OracleDatabaseExadbVmClusterDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    OracleDatabaseExadbVmClusterDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    OracleDatabaseExadbVmClusterDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const OracleDatabaseExadbVmClusterDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = OracleDatabaseExadbVmClusterDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = OracleDatabaseExadbVmClusterDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = OracleDatabaseExadbVmClusterDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<OracleDatabaseExadbVmClusterDeletionPolicy> values = [delete, prevent, abandon];
  }

dartTypeOverrides:
  deletion_policy: OracleDatabaseExadbVmClusterDeletionPolicy

extraGetters: |2
    TfRef<String> get id => TfRef.attribute<String>(this, 'id');
