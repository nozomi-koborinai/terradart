outputDir: compute

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

sealedNames:
  "ncc_gateway, network": network

paramOrder:
  - name
  - network
  - region
  - project
  - description
  - encrypted_interconnect_router
  - bgp
  - md5_authentication_keys
  - params
  - ncc_gateway

extraImports:
  - "import 'package:meta/meta.dart';"

prelude: |
  /// `bgp.advertise_mode` — which BGP prefix advertisement mode the router
  /// uses. Default (when unset) is [ComputeRouterBgpAdvertiseMode.defaultMode].
  extension type const ComputeRouterBgpAdvertiseMode._(TfArg<String> _) implements TfArg<String> {
    ComputeRouterBgpAdvertiseMode.variable(String name) : this._(TfArg.variable(name));
    ComputeRouterBgpAdvertiseMode.expression(String template) : this._(TfArg.expression(template));
    const ComputeRouterBgpAdvertiseMode.arg(TfArg<String> arg) : this._(arg);

    static const defaultMode = ComputeRouterBgpAdvertiseMode._(TfArgLiteral('DEFAULT'));
    static const custom = ComputeRouterBgpAdvertiseMode._(TfArgLiteral('CUSTOM'));

    static const List<ComputeRouterBgpAdvertiseMode> values = [defaultMode, custom];
  }

  /// `bgp` block — local BGP session parameters for a Cloud Router.
  @immutable
  class ComputeRouterBgp {
    const ComputeRouterBgp({
      this.advertiseMode,
      this.advertisedGroups,
      this.asn,
      this.identifierRange,
      this.keepaliveInterval,
    });

    /// Advertisement mode. [ComputeRouterBgpAdvertiseMode.custom] requires
    /// [advertisedGroups].
    final ComputeRouterBgpAdvertiseMode? advertiseMode;

    /// Prefix groups to advertise when [advertiseMode] is
    /// [ComputeRouterBgpAdvertiseMode.custom].
    final List<String>? advertisedGroups;

    /// Local BGP ASN (RFC6996 private range).
    final TfArg<int>? asn;

    /// Link-local IPv4 range for valid BGP identifiers on this router.
    final TfArg<String>? identifierRange;

    /// Seconds between BGP keepalive messages (hold time is 3× this value).
    final TfArg<int>? keepaliveInterval;

    @internal
    Map<String, Object?> encode() => {
      if (advertiseMode != null)
        'advertise_mode': advertiseMode!.toTfJson(),
      if (advertisedGroups != null) 'advertised_groups': advertisedGroups,
      if (asn != null) 'asn': asn!.toTfJson(),
      if (identifierRange != null) 'identifier_range': identifierRange!.toTfJson(),
      if (keepaliveInterval != null)
        'keepalive_interval': keepaliveInterval!.toTfJson(),
    };
  }

customSlots:
  bgp:
    paramDeclaration: 'ComputeRouterBgp? bgp'
    argMapEntry: "if (bgp != null) 'bgp': TfArg.literal([bgp.encode()]),"

extraGetters: |2
    TfRef<String> get id => TfRef.attribute<String>(this, 'id');
