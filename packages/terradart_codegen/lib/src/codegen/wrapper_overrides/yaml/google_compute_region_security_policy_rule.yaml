outputDir: compute
deriveClassDoc: true
deriveOutputGetters: true

paramOrder:
  - action
  - description
  - preview
  - priority
  - project
  - region
  - security_policy
  - match
  - network_match
  - preconfigured_waf_config
  - rate_limit_options

extraImports:
  - "import 'package:meta/meta.dart';"
  - "import 'package:terradart_google/src/compute/google_compute_security_policy.dart' show SecurityPolicyRuleMatchVersionedExpr;"

prelude: |
  /// `rate_limit_options.enforce_on_key` — request attribute the rate-limit
  /// threshold is keyed on (regional Cloud Armor standalone rule).
  enum ComputeRegionSecurityPolicyRuleRateLimitEnforceOnKey implements TerraformEnum {
    all('ALL'),
    ip('IP'),
    httpHeader('HTTP_HEADER'),
    xffIp('XFF_IP'),
    httpCookie('HTTP_COOKIE'),
    httpPath('HTTP_PATH'),
    sni('SNI'),
    regionCode('REGION_CODE'),
    tlsJa3Fingerprint('TLS_JA3_FINGERPRINT'),
    tlsJa4Fingerprint('TLS_JA4_FINGERPRINT'),
    userIp('USER_IP');

    const ComputeRegionSecurityPolicyRuleRateLimitEnforceOnKey(this.terraformValue);
    @override
    final String terraformValue;
  }

  /// `match` block — condition that fires this regional standalone rule.
  @immutable
  class ComputeRegionSecurityPolicyRuleMatch {
    const ComputeRegionSecurityPolicyRuleMatch({
      this.versionedExpr,
      this.config,
    });

    final SecurityPolicyRuleMatchVersionedExpr? versionedExpr;
    final ComputeRegionSecurityPolicyRuleMatchConfig? config;

    Map<String, Object?> toArgMap() => {
      if (versionedExpr != null)
        'versioned_expr': versionedExpr!.terraformValue,
      if (config != null) 'config': config!.toArgMap(),
    };
  }

  @immutable
  class ComputeRegionSecurityPolicyRuleMatchConfig {
    const ComputeRegionSecurityPolicyRuleMatchConfig({required this.srcIpRanges});

    final List<String> srcIpRanges;

    Map<String, Object?> toArgMap() => {'src_ip_ranges': srcIpRanges};
  }

  @immutable
  class ComputeRegionSecurityPolicyRuleRateLimitOptions {
    const ComputeRegionSecurityPolicyRuleRateLimitOptions({
      this.enforceOnKey,
      this.enforceOnKeyName,
    });

    final ComputeRegionSecurityPolicyRuleRateLimitEnforceOnKey? enforceOnKey;
    final TfArg<String>? enforceOnKeyName;

    Map<String, Object?> toArgMap() => {
      if (enforceOnKey != null)
        'enforce_on_key': enforceOnKey!.terraformValue,
      if (enforceOnKeyName != null)
        'enforce_on_key_name': enforceOnKeyName!.toTfJson(),
    };
  }

customSlots:
  match:
    paramDeclaration: 'ComputeRegionSecurityPolicyRuleMatch? match'
    argMapEntry: "if (match != null) 'match': TfArg.literal([match.toArgMap()]),"
  rate_limit_options:
    paramDeclaration: 'ComputeRegionSecurityPolicyRuleRateLimitOptions? rateLimitOptions'
    argMapEntry: "if (rateLimitOptions != null) 'rate_limit_options': TfArg.literal([rateLimitOptions.toArgMap()]),"
