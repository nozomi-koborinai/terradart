outputDir: compute

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

paramOrder:
  - name
  - source_disk
  - description
  - labels
  - deletion_policy
  - params
  - region
  - project

extraGetters: |2

    /// Reference to `self_link` attribute.
    TfRef<String> get selfLink => TfRef.attribute<String>(this, 'self_link');

prelude: |
  /// Terraform `deletion_policy` for regional instant snapshots.
  extension type const ComputeRegionInstantSnapshotDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    ComputeRegionInstantSnapshotDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    ComputeRegionInstantSnapshotDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const ComputeRegionInstantSnapshotDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = ComputeRegionInstantSnapshotDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = ComputeRegionInstantSnapshotDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = ComputeRegionInstantSnapshotDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<ComputeRegionInstantSnapshotDeletionPolicy> values = [delete, prevent, abandon];
  }

  /// `params` block (max=1). Carries request-time metadata such as
  /// Resource Manager tags applied at create time.
  @immutable
  class ComputeRegionInstantSnapshotParams {
    const ComputeRegionInstantSnapshotParams({this.resourceManagerTags});

    final Map<String, String>? resourceManagerTags;

    Map<String, Object?> toArgMap() => {
          if (resourceManagerTags != null)
            'resource_manager_tags': resourceManagerTags,
        };
  }

dartTypeOverrides:
  deletion_policy: ComputeRegionInstantSnapshotDeletionPolicy

customSlots:
  params:
    paramDeclaration: 'ComputeRegionInstantSnapshotParams? params'
    argMapEntry: "if (params != null) 'params': TfArg.literal([params.toArgMap()]),"

extraImports:
  - "import 'package:meta/meta.dart';"
