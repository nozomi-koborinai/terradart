curatedDoc: |-
  /// Authoritative IAM binding for a single `role` on a Cloud Data Fusion instance.
  ///
  /// Replaces the entire member list for that role, overwriting grants made
  /// outside Terraform. Prefer [GoogleDataFusionInstanceIamMember] for additive grants.

paramOrder:
  - name
  - role
  - members
  - condition
  - region
  - project
