outputDir: network

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

extraImports:
  - "import 'package:meta/meta.dart';"

dartTypeOverrides:
  peering: NetworkConnectivityInternalRangePeering
  usage: NetworkConnectivityInternalRangeUsage

curatedDoc: |-
  /// Network Connectivity **internal range** — reserves or allocates a CIDR
  /// inside a VPC for NCC / PSC / migration use.
  ///
  /// Pass either [ipCidrRange] or [prefixLength] (auto-allocation).
  /// When using [prefixLength], optionally set [allocationOptions].
  ///
  /// Example:
  /// ```dart
  /// GoogleNetworkConnectivityInternalRange(
  ///   'reserved',
  ///   name: TfArg.literal('terradart-ir'),
  ///   network: vpc.ref,
  ///   usage: NetworkConnectivityInternalRangeUsage.forVpc,
  ///   peering: NetworkConnectivityInternalRangePeering.forSelf,
  ///   ipCidrRange: TfArg.literal('10.9.0.0/24'),
  /// );
  /// ```

prelude: |
  /// `usage` for [GoogleNetworkConnectivityInternalRange].
  extension type const NetworkConnectivityInternalRangeUsage._(TfArg<String> _) implements TfArg<String> {
    NetworkConnectivityInternalRangeUsage.variable(String name) : this._(TfArg.variable(name));
    NetworkConnectivityInternalRangeUsage.expression(String template) : this._(TfArg.expression(template));
    const NetworkConnectivityInternalRangeUsage.arg(TfArg<String> arg) : this._(arg);

    static const forVpc = NetworkConnectivityInternalRangeUsage._(TfArgLiteral('FOR_VPC'));
    static const externalToVpc = NetworkConnectivityInternalRangeUsage._(TfArgLiteral('EXTERNAL_TO_VPC'));
    static const forMigration = NetworkConnectivityInternalRangeUsage._(TfArgLiteral('FOR_MIGRATION'));

    static const List<NetworkConnectivityInternalRangeUsage> values = [forVpc, externalToVpc, forMigration];
  }

  /// `peering` for [GoogleNetworkConnectivityInternalRange].
  extension type const NetworkConnectivityInternalRangePeering._(TfArg<String> _) implements TfArg<String> {
    NetworkConnectivityInternalRangePeering.variable(String name) : this._(TfArg.variable(name));
    NetworkConnectivityInternalRangePeering.expression(String template) : this._(TfArg.expression(template));
    const NetworkConnectivityInternalRangePeering.arg(TfArg<String> arg) : this._(arg);

    static const forSelf = NetworkConnectivityInternalRangePeering._(TfArgLiteral('FOR_SELF'));
    static const forPeer = NetworkConnectivityInternalRangePeering._(TfArgLiteral('FOR_PEER'));
    static const notShared = NetworkConnectivityInternalRangePeering._(TfArgLiteral('NOT_SHARED'));

    static const List<NetworkConnectivityInternalRangePeering> values = [forSelf, forPeer, notShared];
  }

  /// `allocation_strategy` on [NetworkConnectivityInternalRangeAllocationOptions].
  extension type const NetworkConnectivityInternalRangeAllocationStrategy._(TfArg<String> _) implements TfArg<String> {
    NetworkConnectivityInternalRangeAllocationStrategy.variable(String name) : this._(TfArg.variable(name));
    NetworkConnectivityInternalRangeAllocationStrategy.expression(String template) : this._(TfArg.expression(template));
    const NetworkConnectivityInternalRangeAllocationStrategy.arg(TfArg<String> arg) : this._(arg);

    static const random = NetworkConnectivityInternalRangeAllocationStrategy._(TfArgLiteral('RANDOM'));
    static const firstAvailable = NetworkConnectivityInternalRangeAllocationStrategy._(TfArgLiteral('FIRST_AVAILABLE'));
    static const randomFirstNAvailable = NetworkConnectivityInternalRangeAllocationStrategy._(TfArgLiteral('RANDOM_FIRST_N_AVAILABLE'));
    static const firstSmallestFitting = NetworkConnectivityInternalRangeAllocationStrategy._(TfArgLiteral('FIRST_SMALLEST_FITTING'));

    static const List<NetworkConnectivityInternalRangeAllocationStrategy> values = [random, firstAvailable, randomFirstNAvailable, firstSmallestFitting];
  }

  /// Optional `allocation_options` when auto-allocating via [prefixLength].
  @immutable
  final class NetworkConnectivityInternalRangeAllocationOptions {
    const NetworkConnectivityInternalRangeAllocationOptions({
      this.allocationStrategy,
      this.firstAvailableRangesLookupSize,
    });

    final NetworkConnectivityInternalRangeAllocationStrategy?
        allocationStrategy;
    final TfArg<int>? firstAvailableRangesLookupSize;

    @internal
    Map<String, Object?> encode() => {
          if (allocationStrategy != null)
            'allocation_strategy': allocationStrategy!.toTfJson(),
          if (firstAvailableRangesLookupSize != null)
            'first_available_ranges_lookup_size':
                firstAvailableRangesLookupSize!.toTfJson(),
        };
  }

customSlots:
  allocation_options:
    paramDeclaration: 'NetworkConnectivityInternalRangeAllocationOptions? allocationOptions'
    argMapEntry: "if (allocationOptions != null) 'allocation_options': TfArg.literal([allocationOptions.encode()]),"

paramOrder:
  - name
  - network
  - usage
  - peering
  - ip_cidr_range
  - prefix_length
  - allocation_options
  - description
  - target_cidr_range
  - overlaps
  - labels
  - migration
  - project
