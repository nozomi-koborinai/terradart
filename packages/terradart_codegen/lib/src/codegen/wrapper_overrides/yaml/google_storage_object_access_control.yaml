outputDir: storage
deriveClassDoc: true
deriveNestedTypes: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveEnums: true

dartTypeOverrides:
  role: StorageObjectAccessControlRole

curatedDoc: |-
  /// Fine-grained **object ACL** entry on one object. Requires a bucket with
  /// uniform bucket-level access **disabled**. Prefer IAM on modern buckets.
  ///
  /// Example:
  /// ```dart
  /// final legacy = add(GoogleStorageBucket(
  ///   'legacy',
  ///   name: .literal('legacy'),
  ///   location: .literal('US'),
  /// ));
  /// GoogleStorageObjectAccessControl(
  ///   'object_reader',
  ///   bucket: legacy.ref,
  ///   object: TfArg.literal('config/app.json'),
  ///   entity: .literal('allAuthenticatedUsers'),
  ///   role: StorageObjectAccessControlRole.reader,
  /// );
  /// ```

paramOrder:
  - bucket
  - object
  - entity
  - role
  - deletion_policy
