outputDir: migration

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// Migration Center on-prem discovery client bound to a [GoogleMigrationCenterSource].
  ///
  /// Set [source] to `source.name` and [serviceAccount] to the
  /// discovery agent service account email.

paramOrder:
  - location
  - discovery_client_id
  - source
  - service_account
  - display_name
  - description
  - ttl
  - labels
  - deletion_policy
  - project

prelude: |
  /// Terraform `deletion_policy` for Migration Center discovery clients.
  extension type const MigrationCenterDiscoveryClientDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    MigrationCenterDiscoveryClientDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    MigrationCenterDiscoveryClientDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const MigrationCenterDiscoveryClientDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = MigrationCenterDiscoveryClientDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = MigrationCenterDiscoveryClientDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = MigrationCenterDiscoveryClientDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<MigrationCenterDiscoveryClientDeletionPolicy> values = [delete, prevent, abandon];
  }

dartTypeOverrides:
  deletion_policy: MigrationCenterDiscoveryClientDeletionPolicy
