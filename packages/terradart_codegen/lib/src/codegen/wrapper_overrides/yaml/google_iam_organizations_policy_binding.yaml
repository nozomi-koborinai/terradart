outputDir: iam
deriveClassDoc: true
deriveEnums: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

extraImports:
  - "import 'package:meta/meta.dart';"

curatedDoc: |-
  /// Leftover factory on the apply-excluded path
  /// (synth + `terraform validate` only).
  ///
  /// Needs an organization / folder / billing account /
  /// external artifact that standalone terradart-validate
  /// cannot supply. Do not apply.

# IAM v3 requires `target` and holds its members in a proto oneof; Magic
# Modules only marks them conflicting.
exactlyOneOf:
  - "target.principal_set, target.resource"

paramOrder:
  - annotations
  - deletion_policy
  - display_name
  - location
  - organization
  - policy
  - policy_binding_id
  - policy_kind
  - condition
  - target
