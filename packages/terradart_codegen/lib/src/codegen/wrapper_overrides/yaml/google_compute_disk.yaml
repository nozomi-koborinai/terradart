outputDir: compute

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

paramOrder:
  - name
  - zone
  - type
  - size
  - image
  - snapshot
  - description
  - labels
  - guest_os_features
  - project
  - disk_encryption_key
  - source_image_encryption_key
  - source_snapshot_encryption_key
  - async_primary_disk
  - params

extraGetters: |2

    /// Reference to `self_link` attribute.
    TfRef<String> get selfLink => TfRef.attribute<String>(this, 'self_link');

prelude: |
  /// `guest_os_features[].type` for zonal persistent disks.
  extension type const ComputeDiskGuestOsFeatureType._(TfArg<String> _) implements TfArg<String> {
    ComputeDiskGuestOsFeatureType.variable(String name) : this._(TfArg.variable(name));
    ComputeDiskGuestOsFeatureType.expression(String template) : this._(TfArg.expression(template));
    const ComputeDiskGuestOsFeatureType.arg(TfArg<String> arg) : this._(arg);

    static const multiIpSubnet = ComputeDiskGuestOsFeatureType._(TfArgLiteral('MULTI_IP_SUBNET'));
    static const secureBoot = ComputeDiskGuestOsFeatureType._(TfArgLiteral('SECURE_BOOT'));
    static const sevCapable = ComputeDiskGuestOsFeatureType._(TfArgLiteral('SEV_CAPABLE'));
    static const uefiCompatible = ComputeDiskGuestOsFeatureType._(TfArgLiteral('UEFI_COMPATIBLE'));
    static const virtioScsiMultiqueue = ComputeDiskGuestOsFeatureType._(TfArgLiteral('VIRTIO_SCSI_MULTIQUEUE'));
    static const windows = ComputeDiskGuestOsFeatureType._(TfArgLiteral('WINDOWS'));
    static const gVnic = ComputeDiskGuestOsFeatureType._(TfArgLiteral('GVNIC'));
    static const sevLiveMigratable = ComputeDiskGuestOsFeatureType._(TfArgLiteral('SEV_LIVE_MIGRATABLE'));
    static const sevSnpCapable = ComputeDiskGuestOsFeatureType._(TfArgLiteral('SEV_SNP_CAPABLE'));
    static const suspendResumeCompatible = ComputeDiskGuestOsFeatureType._(TfArgLiteral('SUSPEND_RESUME_COMPATIBLE'));
    static const tdxCapable = ComputeDiskGuestOsFeatureType._(TfArgLiteral('TDX_CAPABLE'));
    static const sevLiveMigratableV2 = ComputeDiskGuestOsFeatureType._(TfArgLiteral('SEV_LIVE_MIGRATABLE_V2'));
    static const snpSvsmCapable = ComputeDiskGuestOsFeatureType._(TfArgLiteral('SNP_SVSM_CAPABLE'));

    static const List<ComputeDiskGuestOsFeatureType> values = [multiIpSubnet, secureBoot, sevCapable, uefiCompatible, virtioScsiMultiqueue, windows, gVnic, sevLiveMigratable, sevSnpCapable, suspendResumeCompatible, tdxCapable, sevLiveMigratableV2, snpSvsmCapable];
  }

  /// One entry of the `guest_os_features` block (repeatable list).
  @immutable
  class ComputeDiskGuestOsFeature {
    const ComputeDiskGuestOsFeature({required this.type});

    final ComputeDiskGuestOsFeatureType type;

    Map<String, Object?> toArgMap() => {'type': type.toTfJson()};
  }

customSlots:
  guest_os_features:
    paramDeclaration: 'List<ComputeDiskGuestOsFeature>? guestOsFeatures'
    argMapEntry: "if (guestOsFeatures != null) 'guest_os_features': TfArg.literal(guestOsFeatures.map((f) => f.toArgMap()).toList()),"

extraImports:
  - "import 'package:meta/meta.dart';"
