outputDir: firestore

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true

curatedDoc: |-
  /// Configures a periodic backup for one Cloud Firestore database. Each
  /// schedule has a single [retention] window and exactly one
  /// [recurrence]: either [FirestoreBackupScheduleDailyRecurrence] (every day) or
  /// [FirestoreBackupScheduleWeeklyRecurrence] (one day per week). The schema models the two
  /// recurrences as independent optional blocks, but the Firestore
  /// service rejects schedules without exactly one -- the sealed
  /// [FirestoreBackupScheduleBackupRecurrence] dispatch enforces that at the type level.
  ///
  /// Example (keep daily backups for 7 days):
  /// ```dart
  /// final daily = GoogleFirestoreBackupSchedule(
  ///   'daily',
  ///   database: db.ref,
  ///   retention: TfArg.literal('604800s'),
  ///   recurrence: const FirestoreBackupScheduleDailyRecurrence(),
  /// );
  /// ```
  ///
  /// Example (weekly backup every Monday, retained 4 weeks):
  /// ```dart
  /// final weekly = GoogleFirestoreBackupSchedule(
  ///   'weekly',
  ///   database: db.ref,
  ///   retention: TfArg.literal('2419200s'),
  ///   recurrence: const FirestoreBackupScheduleWeeklyRecurrence(BackupDayOfWeek.monday),
  /// );
  /// ```
  ///
  /// `retention` is a Google `Duration` string (seconds-suffixed, up to
  /// nine fractional digits, e.g. `"86400s"`). Maximum 14 weeks.

# Slot order: identity (database) first, then required retention, then
# the virtual `recurrence` slot that replaces the two IR-level
# `daily_recurrence` / `weekly_recurrence` slots, then project. The IR's
# two nested-block slots are intentionally omitted from paramOrder --
# the emitter silently skips IR slots not listed.
paramOrder:
  - database
  - retention
  - recurrence
  - project

# argMap places `recurrence` at the end because its key is dynamic
# (`recurrence.blockKey`). Static-keyed entries stay above.
argMapOrder:
  - database
  - retention
  - project
  - recurrence

extraImports:
  - "import 'package:meta/meta.dart';"

prelude: |
  // ===========================================================================
  // FirestoreBackupScheduleBackupRecurrence -- sealed (Daily | Weekly)
  // ===========================================================================

  /// Choice of recurrence for a [GoogleFirestoreBackupSchedule]. Sealed so
  /// the dichotomy is exhaustive at the type level. The Firestore service
  /// requires exactly one of `daily_recurrence` / `weekly_recurrence` --
  /// the schema marks both as independently optional but rejects
  /// schedules with neither or both.
  sealed class FirestoreBackupScheduleBackupRecurrence {
    const FirestoreBackupScheduleBackupRecurrence();

    /// `daily_recurrence` block.
    const factory FirestoreBackupScheduleBackupRecurrence.daily() = FirestoreBackupScheduleDailyRecurrence;

    /// `weekly_recurrence` block.
    const factory FirestoreBackupScheduleBackupRecurrence.weekly([BackupDayOfWeek? day]) = FirestoreBackupScheduleWeeklyRecurrence;

    /// argMap key under which this recurrence is emitted
    /// (`daily_recurrence` or `weekly_recurrence`).
    @internal
    String get blockKey;

    /// JSON fragment for the block value (always a single-element list
    /// because both blocks are `nesting_mode: list, max_items: 1`).
    @internal
    List<Map<String, Object?>> encode();
  }

  /// `daily_recurrence` block. Carries no fields -- its presence alone
  /// signals "run every day". The encoded value is a single empty map
  /// (matching the schema's `max_items: 1, list` shape).
  @immutable
  final class FirestoreBackupScheduleDailyRecurrence extends FirestoreBackupScheduleBackupRecurrence {
    const FirestoreBackupScheduleDailyRecurrence();

    @override
    @internal
    String get blockKey => 'daily_recurrence';

    @override
    @internal
    List<Map<String, Object?>> encode() => const [<String, Object?>{}];
  }

  /// `weekly_recurrence` block. Optional [day] specifies which weekday the
  /// backup runs on; when null, the provider defaults to the schema's
  /// `DAY_OF_WEEK_UNSPECIFIED` (server picks). Pin a specific day for
  /// predictable backup windows.
  @immutable
  final class FirestoreBackupScheduleWeeklyRecurrence extends FirestoreBackupScheduleBackupRecurrence {
    const FirestoreBackupScheduleWeeklyRecurrence([this.day]);

    /// Day of week to run. When null, the field is omitted from the
    /// encoded block and the provider treats it as
    /// `DAY_OF_WEEK_UNSPECIFIED`.
    final BackupDayOfWeek? day;

    @override
    @internal
    String get blockKey => 'weekly_recurrence';

    @override
    @internal
    List<Map<String, Object?>> encode() => [
      {
        if (day != null) 'day': day!.toTfJson(),
      },
    ];
  }

  /// `weekly_recurrence.day` -- which day of the week the weekly backup
  /// runs on. `dayOfWeekUnspecified` is the schema-default sentinel
  /// (server picks the day); the seven concrete weekdays pin the slot.
  extension type const BackupDayOfWeek._(TfArg<String> _) implements TfArg<String> {
    BackupDayOfWeek.variable(String name) : this._(TfArg.variable(name));
    BackupDayOfWeek.expression(String template) : this._(TfArg.expression(template));
    const BackupDayOfWeek.arg(TfArg<String> arg) : this._(arg);

    static const dayOfWeekUnspecified = BackupDayOfWeek._(TfArgLiteral('DAY_OF_WEEK_UNSPECIFIED'));
    static const monday = BackupDayOfWeek._(TfArgLiteral('MONDAY'));
    static const tuesday = BackupDayOfWeek._(TfArgLiteral('TUESDAY'));
    static const wednesday = BackupDayOfWeek._(TfArgLiteral('WEDNESDAY'));
    static const thursday = BackupDayOfWeek._(TfArgLiteral('THURSDAY'));
    static const friday = BackupDayOfWeek._(TfArgLiteral('FRIDAY'));
    static const saturday = BackupDayOfWeek._(TfArgLiteral('SATURDAY'));
    static const sunday = BackupDayOfWeek._(TfArgLiteral('SUNDAY'));

    static const List<BackupDayOfWeek> values = [dayOfWeekUnspecified, monday, tuesday, wednesday, thursday, friday, saturday, sunday];
  }

customSlots:
  # Virtual slot replacing the IR's two nested-block slots
  # (`daily_recurrence`, `weekly_recurrence`) with a single sealed-typed
  # param. The argMap key is dispatched at runtime via `recurrence.blockKey`
  # so whichever subclass the caller picked determines the snake-case
  # Terraform key. The encoded value is a list (single map) because both
  # underlying blocks are `nesting_mode: list, max_items: 1`.
  recurrence:
    paramDeclaration: 'required FirestoreBackupScheduleBackupRecurrence recurrence'
    argMapEntry: 'recurrence.blockKey: TfArg.literal(recurrence.encode()),'
