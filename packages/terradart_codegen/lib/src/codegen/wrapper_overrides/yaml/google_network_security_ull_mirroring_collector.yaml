outputDir: network

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// ULL mirroring collector appliance bound to a [GoogleNetworkSecurityUllMirroringEngine].
  ///
  /// Set [engine] to `engine.name` and [forwardingRule] to a regional
  /// internal forwarding rule self-link receiving mirrored traffic.

paramOrder:
  - location
  - ull_mirroring_collector_id
  - engine
  - forwarding_rule
  - labels
  - deletion_policy
  - project

prelude: |
  /// Terraform `deletion_policy` for ULL mirroring collectors.
  extension type const NetworkSecurityUllMirroringCollectorDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    NetworkSecurityUllMirroringCollectorDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    NetworkSecurityUllMirroringCollectorDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const NetworkSecurityUllMirroringCollectorDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = NetworkSecurityUllMirroringCollectorDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = NetworkSecurityUllMirroringCollectorDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = NetworkSecurityUllMirroringCollectorDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<NetworkSecurityUllMirroringCollectorDeletionPolicy> values = [delete, prevent, abandon];
  }

dartTypeOverrides:
  deletion_policy: NetworkSecurityUllMirroringCollectorDeletionPolicy
