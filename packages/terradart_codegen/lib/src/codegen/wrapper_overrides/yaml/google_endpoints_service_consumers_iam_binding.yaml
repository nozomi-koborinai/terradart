outputDir: endpoints

deriveClassDoc: true
deriveOutputGetters: true

curatedDoc: |-
  /// Authoritative IAM binding for a single `role` on a Cloud Endpoints service consumer.
  ///
  /// Replaces the entire member list for that role, overwriting grants made
  /// outside Terraform. Prefer [GoogleEndpointsServiceConsumersIamMember] for additive grants.

paramOrder:
  - service_name
  - consumer_project
  - role
  - members
  - condition
