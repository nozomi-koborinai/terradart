outputDir: dataplex
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveEnums: true
deriveNestedTypes: true
curatedDoc: |-
  /// A Dataplex data scan (profile, quality, discovery, or documentation).
  ///
  /// Choose exactly one scan type via [scanSpec]; [data] names the entity or
  /// resource to scan and [executionSpec] its trigger.

sealedNames:
  "data_discovery_spec, data_documentation_spec, data_profile_spec, data_quality_spec": scan_spec

