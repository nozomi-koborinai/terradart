  - data_discovery_spec
  - data_documentation_spec
  - data
  - execution_spec
  - display_name
  - description
  - labels
  - execution_identity
  - deletion_policy
  - project

argMapOrder:
  - data_scan_id
  - location
  - display_name
  - description
