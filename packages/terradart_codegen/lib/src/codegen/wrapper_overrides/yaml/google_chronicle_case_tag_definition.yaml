outputDir: chronicle

deriveClassDoc: true
deriveNestedTypes: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveEnums: true

dartTypeOverrides:
  comparison_type: ChronicleCaseTagDefinitionComparisonType
  match_criteria: ChronicleCaseTagDefinitionMatchCriteria

curatedDoc: |-
  /// A Chronicle (Google SecOps) case tag rule: cases matching `value`
  /// by `matchCriteria` / `comparisonType` get the `displayName` tag.
  /// `propertyName` applies only with `matchCriteria:
  /// .byEntityPropertyName`.

paramOrder:
  - location
  - instance
  - display_name
  - match_criteria
  - comparison_type
  - value
  - property_name
  - priority
  - can_be_case_title
  - deletion_policy
  - project
