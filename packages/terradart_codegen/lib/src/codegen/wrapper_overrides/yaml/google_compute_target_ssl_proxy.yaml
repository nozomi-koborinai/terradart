outputDir: compute
deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

dartTypeOverrides:
  proxy_header: TargetSslProxyProxyHeader

prelude: |
  extension type const TargetSslProxyProxyHeader._(TfArg<String> _) implements TfArg<String> {
    TargetSslProxyProxyHeader.variable(String name) : this._(TfArg.variable(name));
    TargetSslProxyProxyHeader.expression(String template) : this._(TfArg.expression(template));
    const TargetSslProxyProxyHeader.arg(TfArg<String> arg) : this._(arg);

    static const none = TargetSslProxyProxyHeader._(TfArgLiteral('NONE'));
    static const proxyV1 = TargetSslProxyProxyHeader._(TfArgLiteral('PROXY_V1'));

    static const List<TargetSslProxyProxyHeader> values = [none, proxyV1];
  }

paramOrder:
  - backend_service
  - certificate_map
  - description
  - name
  - project
  - proxy_header
  - ssl_certificates
  - ssl_policy
