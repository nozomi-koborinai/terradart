outputDir: chronicle

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// Chronicle (Google SecOps) custom list shared across playbooks.
  ///
  /// Enable `chronicle.googleapis.com` via [GoogleProjectService] before apply.
  /// [instance] is the Chronicle instance ID in [location] (e.g. `us`).
  /// [environments] is a JSON-encoded list of environment names.
  ///
  /// Example:
  /// ```dart
  /// GoogleChronicleCustomList(
  ///   'approved_files',
  ///   location: TfArg.literal('us'),
  ///   instance: TfArg.literal('00000000-0000-0000-0000-000000000000'),
  ///   entityIdentifier: TfArg.literal('filename.bin'),
  ///   category: TfArg.literal('Approved Files'),
  ///   environments: TfArg.literal('["Default Environment"]'),
  /// );
  /// ```

paramOrder:
  - location
  - instance
  - entity_identifier
  - category
  - environments
  - deletion_policy
  - project

prelude: |
  /// Terraform `deletion_policy` for Chronicle custom lists.
  extension type const ChronicleCustomListDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    ChronicleCustomListDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    ChronicleCustomListDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const ChronicleCustomListDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = ChronicleCustomListDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = ChronicleCustomListDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = ChronicleCustomListDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<ChronicleCustomListDeletionPolicy> values = [delete, prevent, abandon];
  }

dartTypeOverrides:
  deletion_policy: ChronicleCustomListDeletionPolicy
