outputDir: compute

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

curatedDoc: |-
  /// Required identity:
  /// - [localName]: Terraform local name (the address segment after
  ///   `google_compute_instance.`).
  /// - `name`: GCE instance name. Forces replacement when changed.
  /// - `machineType`: short machine type name (e.g. `'e2-medium'`) or full
  ///   self-link of a custom machine type.
  /// - `bootDisk`: a [ComputeInstanceBootDisk] describing the boot volume; the wrapper
  ///   converts this to the single-element `boot_disk` block GCP expects.
  /// - `networkInterface`: at least one [ComputeInstanceNetworkInterface] entry. GCP requires
  ///   every VM to attach to a VPC.
  ///
  /// Example (minimal):
  /// ```dart
  /// final vm = GoogleComputeInstance(
  ///   'web',
  ///   name: .literal('web-01'),
  ///   machineType: .literal('e2-medium'),
  ///   zone: .literal('us-central1-a'),
  ///   bootDisk: ComputeInstanceBootDisk(
  ///     initializeParams: .new(
  ///       image: .literal('debian-cloud/debian-12'),
  ///     ),
  ///   ),
  ///   networkInterface: [
  ///     ComputeInstanceNetworkInterface(
  ///       network: vpc.ref,
  ///       accessConfig: [.new()],
  ///     ),
  ///   ],
  /// );
  /// ```

paramOrder:
  - name
  - machine_type
  - zone
  - description
  - hostname
  - labels
  - tags
  - metadata
  - metadata_startup_script
  - can_ip_forward
  - deletion_protection
  - allow_stopping_for_update
  - desired_status
  - min_cpu_platform
  - enable_display
  - resource_policies
  - key_revocation_action_type
  - boot_disk
  - network_interface
  - attached_disk
  - scratch_disk
  - service_account
  - scheduling
  - shielded_instance_config
  - confidential_instance_config
  - guest_accelerator
  - advanced_machine_features
  - reservation_affinity
  - params
  - network_performance_config
  - project
  - instance_encryption_key
  - workload_identity_config

extraGetters: |2
    /// Reference to `id` attribute (full path
    /// `projects/{project}/zones/{zone}/instances/{name}`).
    TfRef<String> get id => TfRef.attribute<String>(this, 'id');

extraImports:
  - "import 'package:meta/meta.dart';"

# `metadata_startup_script` is not schema-flagged as sensitive but
# frequently holds bootstrap credentials in practice. Mask it on synth so
# the rendered `main.tf.json` does not carry secrets in plaintext.
extraSensitiveFields:
  - metadata_startup_script

