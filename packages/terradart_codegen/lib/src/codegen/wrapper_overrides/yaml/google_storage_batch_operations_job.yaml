outputDir: storage
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

curatedDoc: |-
  /// Storage Batch Operations **job** — one serverless batch transform over
  /// objects in a bucket (metadata update, hold, rewrite/KMS, or delete).
  /// Provide exactly one [operation] variant.
  ///
  /// Jobs are create-once configuration; set [deleteProtection] to `false` in
  /// smoke stacks so Terraform can destroy the job record. Enable
  /// `storagebatchoperations.googleapis.com` before apply.
  ///
  /// Example (stamp custom metadata on a prefix):
  /// ```dart
  /// GoogleStorageBatchOperationsJob(
  ///   localName: 'stamp_meta',
  ///   jobId: .literal('stamp-meta'),
  ///   deleteProtection: .literal(false),
  ///   bucketList: StorageBatchOperationsJobBucketList(
  ///     buckets: StorageBatchOperationsJobBucketListBuckets(
  ///       bucket: assets.ref,
  ///       objects: .prefixList(
  ///         StorageBatchOperationsJobBucketListBucketsPrefixList(
  ///           includedObjectPrefixes: .literal(['config/']),
  ///         ),
  ///       ),
  ///     ),
  ///   ),
  ///   operation: .putMetadata(
  ///     StorageBatchOperationsJobPutMetadata(
  ///       customMetadata: .literal({'managed-by': 'terradart'}),
  ///     ),
  ///   ),
  /// );
  /// ```

sealedNames:
  "bucket_list.buckets.manifest, bucket_list.buckets.prefix_list": objects
  "delete_object, put_metadata, put_object_hold, rewrite_object": operation

# The API rejects a job without a bucket list.
requiredParams:
  - bucket_list

paramOrder:
  - job_id
  - bucket_list
  - delete_object
  - put_metadata
  - rewrite_object
  - put_object_hold
  - description
  - delete_protection
  - deletion_policy
  - project

argMapOrder:
  - job_id
  - bucket_list
  - description
  - delete_protection
  - deletion_policy
  - project
  - delete_object
  - put_metadata
  - rewrite_object
  - put_object_hold

extraImports:
  - "import 'package:meta/meta.dart';"

