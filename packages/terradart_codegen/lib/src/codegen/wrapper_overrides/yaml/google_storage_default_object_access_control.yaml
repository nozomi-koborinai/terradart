outputDir: storage
deriveClassDoc: true
deriveNestedTypes: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveEnums: true

dartTypeOverrides:
  role: StorageDefaultObjectAccessControlRole

curatedDoc: |-
  /// Default **object ACL** applied to new objects in a bucket. Requires
  /// uniform bucket-level access **disabled**. Prefer IAM on modern buckets.
  ///
  /// Example:
  /// ```dart
  /// final legacy = add(GoogleStorageBucket(
  ///   'legacy',
  ///   name: .literal('legacy-bucket'),
  ///   location: .literal('US'),
  /// ));
  /// GoogleStorageDefaultObjectAccessControl(
  ///   'default_reader',
  ///   bucket: legacy.ref,
  ///   entity: .literal('allAuthenticatedUsers'),
  ///   role: StorageDefaultObjectAccessControlRole.reader,
  /// );
  /// ```

paramOrder:
  - bucket
  - entity
  - role
  - deletion_policy
