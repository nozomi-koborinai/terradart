outputDir: dialogflow
enumValues:
  data_store_spec.data_store_connections.data_store_type:
    - PUBLIC_WEB
    - UNSTRUCTURED
    - STRUCTURED
  data_store_spec.data_store_connections.document_processing_mode:
    - DOCUMENTS
    - CHUNKS
  open_api_spec.authentication.api_key_config.request_location:
    - HEADER
    - QUERY_STRING
  open_api_spec.authentication.oauth_config.oauth_grant_type:
    - CLIENT_CREDENTIAL
  open_api_spec.authentication.service_agent_auth_config.service_agent_auth:
    - ID_TOKEN
    - ACCESS_TOKEN

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true
deriveEnums: true

extraImports:
  - "import 'package:meta/meta.dart';"

curatedDoc: |-
  /// Dialogflow CX **tool** — OpenAPI / function / data-store tool bound to
  /// a CX agent.
  ///
  /// **Cost / apply:** gcp-cost: Cloud Dialogflow `FBC0-AA4A-C89A` Text
  /// session SKU `A1CC-751A-CDCC` **$0.20**/session. billing-behavior: tools
  /// extend never_apply [GoogleDialogflowCxAgent] session paths; not
  /// applyable without that agent on `terradart-validate`. **Never** wire
  /// into apply-smoke.

paramOrder:
  - display_name
  - description
  - parent
  - open_api_spec
  - function_spec
  - data_store_spec
  - deletion_policy
