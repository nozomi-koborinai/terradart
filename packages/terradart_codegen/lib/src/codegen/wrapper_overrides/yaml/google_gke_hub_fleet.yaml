outputDir: container

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// Registers the **default GKE Hub fleet** for a project. Every project has
  /// at most one fleet; this resource creates it when absent.
  ///
  /// Pair with [GoogleGkeHubMembership] to enroll a [GoogleContainerCluster]
  /// in fleet management (config sync, multi-cluster services, etc.).
  ///
  /// Required identity:
  /// - [localName]: Terraform local name (the address segment after
  ///   `google_gke_hub_fleet.`).
  ///
  /// Optional:
  /// - `displayName`: human-readable fleet label in the GCP console.
  /// - `project`: defaults to the provider's `project` when omitted.
  ///
  /// Example:
  /// ```dart
  /// final fleet = GoogleGkeHubFleet(
  ///   'default',
  ///   displayName: TfArg.literal('Production fleet'),
  ///   defaultClusterConfig: GkeHubFleetDefaultClusterConfig(
  ///     securityPostureConfig: .new(
  ///       mode: GkeHubFleetSecurityPostureMode.basic,
  ///     ),
  ///   ),
  /// );
  /// ```

paramOrder:
  - display_name
  - project
  - default_cluster_config

extraImports:
  - "import 'package:meta/meta.dart';"

prelude: |
  extension type const GkeHubFleetBinaryAuthorizationEvaluationMode._(TfArg<String> _) implements TfArg<String> {
    GkeHubFleetBinaryAuthorizationEvaluationMode.variable(String name) : this._(TfArg.variable(name));
    GkeHubFleetBinaryAuthorizationEvaluationMode.expression(String template) : this._(TfArg.expression(template));
    const GkeHubFleetBinaryAuthorizationEvaluationMode.arg(TfArg<String> arg) : this._(arg);

    static const disabled = GkeHubFleetBinaryAuthorizationEvaluationMode._(TfArgLiteral('DISABLED'));
    static const policyBindings = GkeHubFleetBinaryAuthorizationEvaluationMode._(TfArgLiteral('POLICY_BINDINGS'));

    static const List<GkeHubFleetBinaryAuthorizationEvaluationMode> values = [disabled, policyBindings];
  }

  extension type const GkeHubFleetSecurityPostureMode._(TfArg<String> _) implements TfArg<String> {
    GkeHubFleetSecurityPostureMode.variable(String name) : this._(TfArg.variable(name));
    GkeHubFleetSecurityPostureMode.expression(String template) : this._(TfArg.expression(template));
    const GkeHubFleetSecurityPostureMode.arg(TfArg<String> arg) : this._(arg);

    static const disabled = GkeHubFleetSecurityPostureMode._(TfArgLiteral('DISABLED'));
    static const basic = GkeHubFleetSecurityPostureMode._(TfArgLiteral('BASIC'));
    static const enterprise = GkeHubFleetSecurityPostureMode._(TfArgLiteral('ENTERPRISE'));

    static const List<GkeHubFleetSecurityPostureMode> values = [disabled, basic, enterprise];
  }

  extension type const GkeHubFleetSecurityPostureVulnerabilityMode._(TfArg<String> _) implements TfArg<String> {
    GkeHubFleetSecurityPostureVulnerabilityMode.variable(String name) : this._(TfArg.variable(name));
    GkeHubFleetSecurityPostureVulnerabilityMode.expression(String template) : this._(TfArg.expression(template));
    const GkeHubFleetSecurityPostureVulnerabilityMode.arg(TfArg<String> arg) : this._(arg);

    static const vulnerabilityDisabled = GkeHubFleetSecurityPostureVulnerabilityMode._(TfArgLiteral('VULNERABILITY_DISABLED'));
    static const vulnerabilityBasic = GkeHubFleetSecurityPostureVulnerabilityMode._(TfArgLiteral('VULNERABILITY_BASIC'));
    static const vulnerabilityEnterprise = GkeHubFleetSecurityPostureVulnerabilityMode._(TfArgLiteral('VULNERABILITY_ENTERPRISE'));

    static const List<GkeHubFleetSecurityPostureVulnerabilityMode> values = [vulnerabilityDisabled, vulnerabilityBasic, vulnerabilityEnterprise];
  }

  @immutable
  class GkeHubFleetBinaryAuthorizationConfig {
    const GkeHubFleetBinaryAuthorizationConfig({this.evaluationMode});

    final GkeHubFleetBinaryAuthorizationEvaluationMode? evaluationMode;

    Map<String, Object?> encode() => {
      if (evaluationMode != null)
        'evaluation_mode': evaluationMode!.toTfJson(),
    };
  }

  @immutable
  class GkeHubFleetSecurityPostureConfig {
    const GkeHubFleetSecurityPostureConfig({
      this.mode,
      this.vulnerabilityMode,
    });

    final GkeHubFleetSecurityPostureMode? mode;
    final GkeHubFleetSecurityPostureVulnerabilityMode? vulnerabilityMode;

    Map<String, Object?> encode() => {
      if (mode != null) 'mode': mode!.toTfJson(),
      if (vulnerabilityMode != null)
        'vulnerability_mode': vulnerabilityMode!.toTfJson(),
    };
  }

  @immutable
  class GkeHubFleetDefaultClusterConfig {
    const GkeHubFleetDefaultClusterConfig({
      this.binaryAuthorizationConfig,
      this.securityPostureConfig,
    });

    final GkeHubFleetBinaryAuthorizationConfig? binaryAuthorizationConfig;
    final GkeHubFleetSecurityPostureConfig? securityPostureConfig;

    Map<String, Object?> encode() => {
      if (binaryAuthorizationConfig != null)
        'binary_authorization_config': [binaryAuthorizationConfig!.encode()],
      if (securityPostureConfig != null)
        'security_posture_config': [securityPostureConfig!.encode()],
    };
  }

customSlots:
  default_cluster_config:
    paramDeclaration: 'GkeHubFleetDefaultClusterConfig? defaultClusterConfig'
    argMapEntry: "if (defaultClusterConfig != null) 'default_cluster_config': TfArg.literal([defaultClusterConfig.encode()]),"
