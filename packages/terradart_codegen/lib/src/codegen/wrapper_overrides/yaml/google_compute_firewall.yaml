outputDir: compute

deriveClassDoc: true
deriveExactlyOne: true

curatedDoc: |-
  /// This resource models a VPC firewall rule.
  ///
  /// Required identity:
  /// - [localName]: Terraform local name (the address segment after
  ///   `google_compute_firewall.`).
  /// - `name`: GCP firewall rule name.
  /// - `network`: VPC network this rule attaches to. Typically
  ///   `vpc.ref` where `vpc` is a `GoogleComputeNetwork`.
  ///
  /// Choose exactly one [ComputeFirewallRulePolicy]: `.allow([...])`
  /// permits matching traffic, `.deny([...])` blocks it.
  ///
  /// Example:
  /// ```dart
  /// final allowSsh = GoogleComputeFirewall(
  ///   'allow_ssh',
  ///   name: TfArg.literal('allow-ssh'),
  ///   network: vpc.ref,
  ///   direction: FirewallDirection.ingress,
  ///   priority: TfArg.literal(1000),
  ///   rulePolicy: .allow([
  ///     .new(protocol: .literal('tcp'), ports: .literal(['22'])),
  ///   ]),
  ///   sourceRanges: TfArg.literal(['10.0.0.0/8']),
  /// );
  /// ```
  ///
  /// Composition pattern: extends `Resource` for runtime behavior. The
  /// single `log_config` block is modeled as a helper class in the
  /// `prelude` below.

paramOrder:
  - name
  - network
  - direction
  - priority
  - allow
  - deny
  - source_ranges
  - source_tags
  - source_service_accounts
  - target_tags
  - target_service_accounts
  - destination_ranges
  - log_config
  - disabled
  - enable_logging
  - description
  - params
  - project

argMapOrder:
  - name
  - network
  - direction
  - priority
  - source_ranges
  - source_tags
  - source_service_accounts
  - target_tags
  - target_service_accounts
  - destination_ranges
  - log_config
  - disabled
  - enable_logging
  - description
  - params
  - project
  - allow
  - deny

deriveNestedTypes: true
deriveOutputGetters: true

sealedNames:
  "allow, deny": rule_policy

extraImports:
  - "import 'package:meta/meta.dart';"

dartTypeOverrides:
  direction: FirewallDirection

prelude: |
  // Phase 4.5.1: dartTypeOverrides re-enabled. Callers pass enum values
  // directly; TfArg detects `.toTfJson()` getter.

  /// Direction of traffic this firewall rule applies to. For `ingress`,
  /// at least one of `sourceRanges` / `sourceTags` / `sourceServiceAccounts`
  /// is required by GCP.
  extension type const FirewallDirection._(TfArg<String> _) implements TfArg<String> {
    FirewallDirection.variable(String name) : this._(TfArg.variable(name));
    FirewallDirection.expression(String template) : this._(TfArg.expression(template));
    const FirewallDirection.arg(TfArg<String> arg) : this._(arg);

    static const ingress = FirewallDirection._(TfArgLiteral('INGRESS'));
    static const egress = FirewallDirection._(TfArgLiteral('EGRESS'));

    static const List<FirewallDirection> values = [ingress, egress];
  }

  /// Whether to include or exclude metadata for firewall logs.
  /// Used as the `metadata` field of [ComputeFirewallLogConfig].
  extension type const FirewallLogMetadata._(TfArg<String> _) implements TfArg<String> {
    FirewallLogMetadata.variable(String name) : this._(TfArg.variable(name));
    FirewallLogMetadata.expression(String template) : this._(TfArg.expression(template));
    const FirewallLogMetadata.arg(TfArg<String> arg) : this._(arg);

    static const includeAllMetadata = FirewallLogMetadata._(TfArgLiteral('INCLUDE_ALL_METADATA'));
    static const excludeAllMetadata = FirewallLogMetadata._(TfArgLiteral('EXCLUDE_ALL_METADATA'));

    static const List<FirewallLogMetadata> values = [includeAllMetadata, excludeAllMetadata];
  }


  /// Firewall logging configuration (single block, max_items=1).
  /// Setting this enables Cloud Logging export for matched traffic.
  class ComputeFirewallLogConfig {
    const ComputeFirewallLogConfig({required this.metadata});
    final FirewallLogMetadata metadata;
    Map<String, Object?> toArgMap() => {
          'metadata': metadata.toTfJson(),
        };
  }

customSlots:
  log_config:
    paramDeclaration: 'ComputeFirewallLogConfig? logConfig'
    argMapEntry: "if (logConfig != null) 'log_config': TfArg.literal([logConfig.toArgMap()]),"
