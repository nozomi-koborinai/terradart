outputDir: access_context_manager
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveEnums: true
deriveNestedTypes: true

extraImports:
  - "import 'package:meta/meta.dart';"

dartTypeOverrides:
  perimeter_type: AccessContextManagerServicePerimeterType

paramOrder:
  - name
  - parent
  - title
  - description
  - perimeter_type
  - use_explicit_dry_run_spec
  - spec
  - status
  - deletion_policy

extraGetters: |2
    TfRef<String> get id => TfRef.attribute<String>(this, 'id');
