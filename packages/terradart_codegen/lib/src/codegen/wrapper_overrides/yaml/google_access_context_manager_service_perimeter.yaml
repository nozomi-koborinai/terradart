outputDir: access_context_manager
deriveClassDoc: true
deriveOutputGetters: true
deriveEnums: true

dartTypeOverrides:
  perimeter_type: AccessContextManagerServicePerimeterPerimeterType

paramOrder:
  - name
  - parent
  - title
  - description
  - perimeter_type
