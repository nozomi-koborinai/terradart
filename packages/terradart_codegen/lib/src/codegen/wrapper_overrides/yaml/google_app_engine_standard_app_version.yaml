outputDir: app
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveEnums: true
deriveNestedTypes: true
# The schema lists the classes per scaling mode in prose; the API takes
# any of them and rejects a class the chosen scaling mode does not run.
enumValues:
  instance_class:
    - F1
    - F2
    - F4
    - F4_1G
    - B1
    - B2
    - B4
    - B8
    - B4_1G

extraImports:
  - "import 'package:meta/meta.dart';"

sealedNames:
  "app_engine_apis, app_engine_bundled_services": legacy_services

paramOrder:
  - service
  - version_id
  - runtime
  - runtime_api_version
  - instance_class
  - env_variables
  - handlers
  - deployment
  - entrypoint
  - automatic_scaling
  - manual_scaling
  - vpc_access_connector
  - app_engine_apis
  - delete_service_on_destroy
  - deletion_policy
  - noop_on_destroy
  - service_account
  - threadsafe
  - inbound_services
  - project
  - app_engine_bundled_services
  - basic_scaling
  - libraries
