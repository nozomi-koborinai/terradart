outputDir: bigquery
deriveClassDoc: true
deriveNestedTypes: true
deriveExactlyOne: true
deriveOutputGetters: true

curatedDoc: |-
  /// Additive IAM grant on a [GoogleBigqueryDatapolicyv2DataPolicy]. Prefer
  /// this over binding/policy when adding one (`role`, `member`) tuple.
  ///
  /// Example:
  /// ```dart
  /// GoogleBigqueryDatapolicyv2DataPolicyIamMember(
  ///   'raw_reader',
  ///   dataPolicy: .literal('raw-access'),
  ///   location: TfArg.literal('us-central1'),
  ///   role: TfArg.literal('roles/bigquerydatapolicy.maskedReader'),
  ///   member: reader.principal,
  /// );
  /// ```

paramOrder:
  - data_policy_id
  - role
  - member
  - condition
  - location
  - project
