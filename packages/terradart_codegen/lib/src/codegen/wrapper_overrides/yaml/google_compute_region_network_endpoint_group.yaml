    paramDeclaration: 'ComputeRegionNetworkEndpointGroupRegionNetworkEndpointGroupAppEngine? appEngine'
    argMapEntry: "if (appEngine != null) 'app_engine': TfArg.literal([appEngine.toArgMap()]),"
