outputDir: network

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// Partner Cross-Cloud Interconnect (CCI) transport for Network Connectivity.
  ///
  /// Enable `networkconnectivity.googleapis.com` via [GoogleProjectService]
  /// before apply. [network] must reference an existing VPC; [remoteProfile]
  /// is the full URL of a `remoteTransportProfiles` resource in the same region.
  ///
  /// Example:
  /// ```dart
  /// GoogleNetworkConnectivityTransport(
  ///   'aws_cci',
  ///   name: TfArg.literal('my-transport'),
  ///   region: TfArg.literal('us-east4'),
  ///   network: vpc.ref,
  ///   remoteProfile: TfArg.literal(
  ///     'https://networkconnectivity.googleapis.com/v1/projects/my-project/locations/us-east4/remoteTransportProfiles/aws-us-east-1',
  ///   ),
  ///   bandwidth: TfArg.literal('BPS_1G'),
  /// );
  /// ```

paramOrder:
  - name
  - region
  - network
  - remote_profile
  - description
  - bandwidth
  - remote_account_id
  - provided_activation_key
  - advertised_routes
  - stack_type
  - mtu_limit
  - labels
  - deletion_policy
  - project

prelude: |
  /// Terraform `deletion_policy` for Network Connectivity transports.
  extension type const NetworkConnectivityTransportDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    NetworkConnectivityTransportDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    NetworkConnectivityTransportDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const NetworkConnectivityTransportDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = NetworkConnectivityTransportDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = NetworkConnectivityTransportDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = NetworkConnectivityTransportDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<NetworkConnectivityTransportDeletionPolicy> values = [delete, prevent, abandon];
  }

  /// IP stack for `google_network_connectivity_transport.stack_type`.
  extension type const NetworkConnectivityTransportStackType._(TfArg<String> _) implements TfArg<String> {
    NetworkConnectivityTransportStackType.variable(String name) : this._(TfArg.variable(name));
    NetworkConnectivityTransportStackType.expression(String template) : this._(TfArg.expression(template));
    const NetworkConnectivityTransportStackType.arg(TfArg<String> arg) : this._(arg);

    static const ipv4Ipv6 = NetworkConnectivityTransportStackType._(TfArgLiteral('IPV4_IPV6'));
    static const ipv4Only = NetworkConnectivityTransportStackType._(TfArgLiteral('IPV4_ONLY'));

    static const List<NetworkConnectivityTransportStackType> values = [ipv4Ipv6, ipv4Only];
  }

dartTypeOverrides:
