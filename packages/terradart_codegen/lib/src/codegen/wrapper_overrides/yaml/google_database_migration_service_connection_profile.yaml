outputDir: database_migration
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

extraImports:
  - "import 'package:meta/meta.dart';"

curatedDoc: |-
  /// Leftover factory on the apply-excluded path
  /// (synth + `terraform validate` only).
  ///
  /// Needs an organization / folder / billing account /
  /// external artifact that standalone terradart-validate
  /// cannot supply. Do not apply.

paramOrder:
  - connection_profile_id
  - deletion_policy
  - display_name
  - labels
  - location
  - project
  - role
  - postgresql

sealedNames:
  "cloudsql.settings.ip_config.authorized_networks.expire_time, cloudsql.settings.ip_config.authorized_networks.ttl": expiration
  "oracle.forward_ssh_connectivity.password, oracle.forward_ssh_connectivity.private_key": credential
