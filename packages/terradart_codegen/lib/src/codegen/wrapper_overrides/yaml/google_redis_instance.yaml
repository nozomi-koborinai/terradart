outputDir: redis

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

paramOrder:
  - name
  - memory_size_gb
  - region
  - tier
  - authorized_network
  - connect_mode
  - auth_enabled
  - transit_encryption_mode
  - replica_count
  - read_replicas_mode
  - redis_version
  - display_name
  - labels
  - deletion_protection
  - maintenance_policy
  - persistence_config

dartTypeOverrides:
  tier: RedisInstanceTier
  connect_mode: RedisInstanceConnectMode
  transit_encryption_mode: RedisInstanceTransitEncryptionMode
  read_replicas_mode: RedisInstanceReadReplicasMode

curatedDoc: |-
  /// Memorystore for Redis instance — managed Redis for app caches and sessions.
  ///
  /// Pair with [GoogleVpcAccessConnector] (Cloud Run) or GCE/GKE workloads on
  /// the same VPC via [authorizedNetwork].
  ///
  /// Required identity:
  /// - [localName]: Terraform local name.
  /// - [name]: instance ID.
  /// - [memorySizeGb]: memory size in GiB.
  ///
  /// Optional hardening / operations:
  /// - [authEnabled] turns Redis AUTH on (read the password via [authString]).
  /// - [transitEncryptionMode] enables in-transit TLS ([serverCaCerts]).
  /// - [replicaCount] / [readReplicasMode] add read replicas on
  ///   `STANDARD_HA` instances ([readEndpoint], [readEndpointPort]).
  /// - [maintenancePolicy] pins the weekly maintenance window.
  /// - [persistenceConfig] turns on RDB snapshots.
  ///
  /// Enable `redis.googleapis.com` via [GoogleProjectService] or
  /// [StackApis.enableApis] before apply.
  ///
  /// Example (basic tier on the default VPC):
  /// ```dart
  /// GoogleRedisInstance(
  ///   'cache',
  ///   name: TfArg.literal('api-cache'),
  ///   memorySizeGb: TfArg.literal(1),
  ///   region: TfArg.literal('us-central1'),
  ///   tier: RedisInstanceTier.basic,
  ///   authorizedNetwork: .literal('default'),
  /// );
  /// ```

prelude: |
  /// `tier` — Memorystore service tier.
  extension type const RedisInstanceTier._(TfArg<String> _) implements TfArg<String> {
    RedisInstanceTier.variable(String name) : this._(TfArg.variable(name));
    RedisInstanceTier.expression(String template) : this._(TfArg.expression(template));
    const RedisInstanceTier.arg(TfArg<String> arg) : this._(arg);

    static const basic = RedisInstanceTier._(TfArgLiteral('BASIC'));
    static const standardHa = RedisInstanceTier._(TfArgLiteral('STANDARD_HA'));

    static const List<RedisInstanceTier> values = [basic, standardHa];
  }

  /// `connect_mode` — how clients reach the instance.
  extension type const RedisInstanceConnectMode._(TfArg<String> _) implements TfArg<String> {
    RedisInstanceConnectMode.variable(String name) : this._(TfArg.variable(name));
    RedisInstanceConnectMode.expression(String template) : this._(TfArg.expression(template));
    const RedisInstanceConnectMode.arg(TfArg<String> arg) : this._(arg);

    static const directPeering = RedisInstanceConnectMode._(TfArgLiteral('DIRECT_PEERING'));
    static const privateServiceAccess = RedisInstanceConnectMode._(TfArgLiteral('PRIVATE_SERVICE_ACCESS'));

    static const List<RedisInstanceConnectMode> values = [directPeering, privateServiceAccess];
  }

  /// `transit_encryption_mode` — in-transit TLS mode (provider default
  /// `DISABLED`). When `SERVER_AUTHENTICATION` is set, clients verify the
  /// server against [GoogleRedisInstance.serverCaCerts].
  extension type const RedisInstanceTransitEncryptionMode._(TfArg<String> _) implements TfArg<String> {
    RedisInstanceTransitEncryptionMode.variable(String name) : this._(TfArg.variable(name));
    RedisInstanceTransitEncryptionMode.expression(String template) : this._(TfArg.expression(template));
    const RedisInstanceTransitEncryptionMode.arg(TfArg<String> arg) : this._(arg);

    static const serverAuthentication = RedisInstanceTransitEncryptionMode._(TfArgLiteral('SERVER_AUTHENTICATION'));
    static const disabled = RedisInstanceTransitEncryptionMode._(TfArgLiteral('DISABLED'));

    static const List<RedisInstanceTransitEncryptionMode> values = [serverAuthentication, disabled];
  }

  /// `read_replicas_mode` — read replica support (`STANDARD_HA` tier only;
  /// pair with `replica_count`).
  extension type const RedisInstanceReadReplicasMode._(TfArg<String> _) implements TfArg<String> {
    RedisInstanceReadReplicasMode.variable(String name) : this._(TfArg.variable(name));
    RedisInstanceReadReplicasMode.expression(String template) : this._(TfArg.expression(template));
    const RedisInstanceReadReplicasMode.arg(TfArg<String> arg) : this._(arg);

    static const readReplicasDisabled = RedisInstanceReadReplicasMode._(TfArgLiteral('READ_REPLICAS_DISABLED'));
    static const readReplicasEnabled = RedisInstanceReadReplicasMode._(TfArgLiteral('READ_REPLICAS_ENABLED'));

    static const List<RedisInstanceReadReplicasMode> values = [readReplicasDisabled, readReplicasEnabled];
  }

  /// `weekly_maintenance_window.day` on `google_redis_instance`.
  extension type const RedisInstanceWeeklyMaintenanceDay._(TfArg<String> _) implements TfArg<String> {
    RedisInstanceWeeklyMaintenanceDay.variable(String name) : this._(TfArg.variable(name));
    RedisInstanceWeeklyMaintenanceDay.expression(String template) : this._(TfArg.expression(template));
    const RedisInstanceWeeklyMaintenanceDay.arg(TfArg<String> arg) : this._(arg);

    static const dayOfWeekUnspecified = RedisInstanceWeeklyMaintenanceDay._(TfArgLiteral('DAY_OF_WEEK_UNSPECIFIED'));
    static const monday = RedisInstanceWeeklyMaintenanceDay._(TfArgLiteral('MONDAY'));
    static const tuesday = RedisInstanceWeeklyMaintenanceDay._(TfArgLiteral('TUESDAY'));
    static const wednesday = RedisInstanceWeeklyMaintenanceDay._(TfArgLiteral('WEDNESDAY'));
    static const thursday = RedisInstanceWeeklyMaintenanceDay._(TfArgLiteral('THURSDAY'));
    static const friday = RedisInstanceWeeklyMaintenanceDay._(TfArgLiteral('FRIDAY'));
    static const saturday = RedisInstanceWeeklyMaintenanceDay._(TfArgLiteral('SATURDAY'));
    static const sunday = RedisInstanceWeeklyMaintenanceDay._(TfArgLiteral('SUNDAY'));

    static const List<RedisInstanceWeeklyMaintenanceDay> values = [dayOfWeekUnspecified, monday, tuesday, wednesday, thursday, friday, saturday, sunday];
  }

  /// `persistence_config.persistence_mode` on `google_redis_instance`.
  extension type const RedisInstancePersistenceMode._(TfArg<String> _) implements TfArg<String> {
    RedisInstancePersistenceMode.variable(String name) : this._(TfArg.variable(name));
    RedisInstancePersistenceMode.expression(String template) : this._(TfArg.expression(template));
    const RedisInstancePersistenceMode.arg(TfArg<String> arg) : this._(arg);

    static const disabled = RedisInstancePersistenceMode._(TfArgLiteral('DISABLED'));
    static const rdb = RedisInstancePersistenceMode._(TfArgLiteral('RDB'));

    static const List<RedisInstancePersistenceMode> values = [disabled, rdb];
  }

  /// `persistence_config.rdb_snapshot_period` on `google_redis_instance`.
  extension type const RedisInstanceRdbSnapshotPeriod._(TfArg<String> _) implements TfArg<String> {
    RedisInstanceRdbSnapshotPeriod.variable(String name) : this._(TfArg.variable(name));
    RedisInstanceRdbSnapshotPeriod.expression(String template) : this._(TfArg.expression(template));
    const RedisInstanceRdbSnapshotPeriod.arg(TfArg<String> arg) : this._(arg);

    static const oneHour = RedisInstanceRdbSnapshotPeriod._(TfArgLiteral('ONE_HOUR'));
    static const sixHours = RedisInstanceRdbSnapshotPeriod._(TfArgLiteral('SIX_HOURS'));
    static const twelveHours = RedisInstanceRdbSnapshotPeriod._(TfArgLiteral('TWELVE_HOURS'));
    static const twentyFourHours = RedisInstanceRdbSnapshotPeriod._(TfArgLiteral('TWENTY_FOUR_HOURS'));

    static const List<RedisInstanceRdbSnapshotPeriod> values = [oneHour, sixHours, twelveHours, twentyFourHours];
  }

  /// `weekly_maintenance_window.start_time` nested block (required, max=1) —
  /// UTC time of day the maintenance window opens (`google.type.TimeOfDay`;
  /// unset fields default to 0).
  class RedisInstanceMaintenanceStartTime {
    const RedisInstanceMaintenanceStartTime({
      this.hours,
      this.minutes,
      this.seconds,
      this.nanos,
    });

    /// Hour of day in UTC (0-23).
    final TfArg<num>? hours;

    /// Minutes of hour (0-59).
    final TfArg<num>? minutes;

    final TfArg<num>? seconds;
    final TfArg<num>? nanos;

    Map<String, Object?> toArgMap() => {
          if (hours != null) 'hours': hours!.toTfJson(),
          if (minutes != null) 'minutes': minutes!.toTfJson(),
          if (seconds != null) 'seconds': seconds!.toTfJson(),
          if (nanos != null) 'nanos': nanos!.toTfJson(),
        };
  }

  /// `weekly_maintenance_window` nested block — the weekly window
  /// maintenance updates may start in. The provider requires [startTime]
  /// (`start_time` carries `min_items = 1`).
  class RedisInstanceWeeklyMaintenanceWindow {
    const RedisInstanceWeeklyMaintenanceWindow({
      required this.day,
      required this.startTime,
    });

    final RedisInstanceWeeklyMaintenanceDay day;
    final RedisInstanceMaintenanceStartTime startTime;

    Map<String, Object?> toArgMap() => {
          'day': day.toTfJson(),
          'start_time': [startTime.toArgMap()],
        };
  }

  /// `maintenance_policy` nested block (max=1).
  class RedisInstanceMaintenancePolicy {
    const RedisInstanceMaintenancePolicy({
      required this.weeklyMaintenanceWindow,
    });

    final RedisInstanceWeeklyMaintenanceWindow weeklyMaintenanceWindow;

    Map<String, Object?> toArgMap() => {
          'weekly_maintenance_window': [weeklyMaintenanceWindow.toArgMap()],
        };
  }

  /// `persistence_config` nested block (max=1).
  ///
  /// Set [persistenceMode] to [RedisInstancePersistenceMode.rdb] to turn
  /// RDB snapshots on; [rdbSnapshotPeriod] then controls the cadence.
  class RedisInstancePersistenceConfig {
    const RedisInstancePersistenceConfig({
      this.persistenceMode,
      this.rdbSnapshotPeriod,
      this.rdbSnapshotStartTime,
    });

    final RedisInstancePersistenceMode? persistenceMode;

    final RedisInstanceRdbSnapshotPeriod? rdbSnapshotPeriod;

    /// RFC3339 timestamp the first snapshot was/will be attempted at, and
    /// to which future snapshots align.
    final TfArg<String>? rdbSnapshotStartTime;

    Map<String, Object?> toArgMap() => {
          if (persistenceMode != null)
            'persistence_mode': persistenceMode!.toTfJson(),
          if (rdbSnapshotPeriod != null)
            'rdb_snapshot_period': rdbSnapshotPeriod!.toTfJson(),
          if (rdbSnapshotStartTime != null)
            'rdb_snapshot_start_time': rdbSnapshotStartTime!.toTfJson(),
        };
  }

customSlots:
  maintenance_policy:
    paramDeclaration: 'RedisInstanceMaintenancePolicy? maintenancePolicy'
    argMapEntry: "if (maintenancePolicy != null) 'maintenance_policy': TfArg.literal([maintenancePolicy.toArgMap()]),"
  persistence_config:
    paramDeclaration: 'RedisInstancePersistenceConfig? persistenceConfig'
    argMapEntry: "if (persistenceConfig != null) 'persistence_config': TfArg.literal([persistenceConfig.toArgMap()]),"
