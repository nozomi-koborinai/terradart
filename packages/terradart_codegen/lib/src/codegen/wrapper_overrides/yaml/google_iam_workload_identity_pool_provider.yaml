outputDir: iam

deriveClassDoc: true
deriveOutputGetters: true

curatedDoc: |-
  /// Configures a **Workload Identity Federation provider** inside an existing
  /// [GoogleIamWorkloadIdentityPool] — the trust binding that maps external
  /// identities (GitHub Actions OIDC, AWS, SAML, X.509) into GCP subjects.
  ///
  /// Required identity:
  /// - [localName]: Terraform local name.
  /// - `workloadIdentityPoolId`: pool ID string **or**
  ///   `TfArg.ref(pool.nameRef)` from [GoogleIamWorkloadIdentityPool].
  /// - `workloadIdentityPoolProviderId`: provider ID (4–32 chars, `[a-z0-9-]`).
  ///
  /// Trust source — set **exactly one** of [oidc], [aws], [saml], or [x509]
  /// (mutually exclusive at the API level):
  /// - [IamWorkloadIdentityPoolProviderOidc] — generic OIDC / GitHub Actions.
  /// - [IamWorkloadIdentityPoolProviderAws] — AWS account federation.
  /// - [IamWorkloadIdentityPoolProviderSaml] — SAML 2.0 IdP metadata.
  /// - [IamWorkloadIdentityPoolProviderX509] — X.509 certificate trust store.
  ///
  /// Example (GitHub Actions OIDC):
  /// ```dart
  /// final githubProvider = GoogleIamWorkloadIdentityPoolProvider(
  ///   localName: 'github_provider',
  ///   workloadIdentityPoolId: TfArg.ref(pool.nameRef),
  ///   workloadIdentityPoolProviderId: TfArg.literal('github-actions'),
  ///   displayName: TfArg.literal('GitHub Actions'),
  ///   attributeCondition: TfArg.literal(
  ///     'assertion.repository_owner == "my-org"',
  ///   ),
  ///   attributeMapping: {
  ///     'google.subject': TfArg.literal('assertion.repository'),
  ///     'attribute.repository_owner': TfArg.literal(
  ///       'assertion.repository_owner',
  ///     ),
  ///   },
  ///   oidc: IamWorkloadIdentityPoolProviderOidc(
  ///     issuerUri: TfArg.literal(
  ///       'https://token.actions.githubusercontent.com',
  ///     ),
  ///   ),
  /// );
  /// ```

paramOrder:
  - workload_identity_pool_id
  - workload_identity_pool_provider_id
  - display_name
  - description
  - disabled
  - attribute_condition
  - attribute_mapping
  - oidc
  - aws
  - saml
  - x509
  - project

prelude: |
  /// OIDC trust configuration for a workload identity pool provider.
  @immutable
  class IamWorkloadIdentityPoolProviderOidc {
    const IamWorkloadIdentityPoolProviderOidc({
      this.allowedAudiences,
      required this.issuerUri,
      this.jwksJson,
    });

    final List<TfArg<String>>? allowedAudiences;
    final TfArg<String> issuerUri;
    final TfArg<String>? jwksJson;

    Map<String, Object?> encode() => {
      if (allowedAudiences != null)
        'allowed_audiences': allowedAudiences!.map((a) => a.toTfJson()).toList(),
      'issuer_uri': issuerUri.toTfJson(),
      if (jwksJson != null) 'jwks_json': jwksJson!.toTfJson(),
    };
  }

  /// AWS trust configuration for a workload identity pool provider.
  @immutable
  class IamWorkloadIdentityPoolProviderAws {
    const IamWorkloadIdentityPoolProviderAws({this.accountId});

    final TfArg<String>? accountId;

    Map<String, Object?> encode() => {
      if (accountId != null) 'account_id': accountId!.toTfJson(),
    };
  }

  /// SAML 2.0 trust configuration for a workload identity pool provider.
  @immutable
  class IamWorkloadIdentityPoolProviderSaml {
    const IamWorkloadIdentityPoolProviderSaml({required this.idpMetadataXml});

    final TfArg<String> idpMetadataXml;

    Map<String, Object?> encode() => {
      'idp_metadata_xml': idpMetadataXml.toTfJson(),
    };
  }

  /// X.509 certificate trust configuration for a workload identity pool provider.
  @immutable
  class IamWorkloadIdentityPoolProviderX509 {
    const IamWorkloadIdentityPoolProviderX509({this.trustStore});

    final IamWorkloadIdentityPoolProviderX509TrustStore? trustStore;

    Map<String, Object?> encode() => {
      if (trustStore != null) 'trust_store': [trustStore!.encode()],
    };
  }

  /// Trust store for [IamWorkloadIdentityPoolProviderX509].
  @immutable
  class IamWorkloadIdentityPoolProviderX509TrustStore {
    const IamWorkloadIdentityPoolProviderX509TrustStore({
      this.trustAnchors,
      this.intermediateCas,
    });

    final List<IamWorkloadIdentityPoolProviderX509PemCertificate>? trustAnchors;
    final List<IamWorkloadIdentityPoolProviderX509PemCertificate>? intermediateCas;

    Map<String, Object?> encode() => {
      if (trustAnchors != null)
        'trust_anchors': trustAnchors!.map((a) => a.encode()).toList(),
      if (intermediateCas != null)
        'intermediate_cas': intermediateCas!.map((a) => a.encode()).toList(),
    };
  }

  /// PEM certificate entry for X.509 federation trust stores.
  @immutable
  class IamWorkloadIdentityPoolProviderX509PemCertificate {
    const IamWorkloadIdentityPoolProviderX509PemCertificate({
      this.pemCertificate,
    });

    final TfArg<String>? pemCertificate;

    Map<String, Object?> encode() => {
      if (pemCertificate != null) 'pem_certificate': pemCertificate!.toTfJson(),
    };
  }

extraImports:
  - "import 'package:meta/meta.dart';"

customSlots:
  oidc:
    paramDeclaration: 'IamWorkloadIdentityPoolProviderOidc? oidc'
    argMapEntry: "if (oidc != null) 'oidc': TfArg.literal([oidc.encode()]),"
  aws:
    paramDeclaration: 'IamWorkloadIdentityPoolProviderAws? aws'
    argMapEntry: "if (aws != null) 'aws': TfArg.literal([aws.encode()]),"
  saml:
    paramDeclaration: 'IamWorkloadIdentityPoolProviderSaml? saml'
    argMapEntry: "if (saml != null) 'saml': TfArg.literal([saml.encode()]),"
  x509:
    paramDeclaration: 'IamWorkloadIdentityPoolProviderX509? x509'
    argMapEntry: "if (x509 != null) 'x509': TfArg.literal([x509.encode()]),"
