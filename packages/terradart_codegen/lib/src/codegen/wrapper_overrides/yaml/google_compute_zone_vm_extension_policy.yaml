outputDir: compute

deriveClassDoc: true
deriveOutputGetters: false

paramOrder:
  - name
  - zone
  - extension_policies
  - description
  - project

extraGetters: |2
    TfRef<String> get nameRef => TfRef.attribute<String>(this, 'name');
    TfRef<String> get id => TfRef.attribute<String>(this, 'id');
