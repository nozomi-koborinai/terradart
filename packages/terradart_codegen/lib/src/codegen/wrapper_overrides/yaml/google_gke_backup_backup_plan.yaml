outputDir: gke_backup

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// Defines a **GKE Backup plan** — scheduled backups of a
  /// [GoogleContainerCluster] into a backup store.
  ///
  /// Required identity:
  /// - [localName]: Terraform local name.
  /// - `name`: backup plan ID (unique per project/location).
  /// - `location`: GCP region (e.g. `'asia-northeast1'`).
  /// - `cluster`: target cluster — typically `cluster.id`.
  ///
  /// Pair with [GoogleGkeBackupRestorePlan] for restore workflows.

extraImports:
  - "import 'package:meta/meta.dart';"

prelude: |
  extension type const GkeBackupBackupPlanDayOfWeek._(TfArg<String> _) implements TfArg<String> {
    GkeBackupBackupPlanDayOfWeek.variable(String name) : this._(TfArg.variable(name));
    GkeBackupBackupPlanDayOfWeek.expression(String template) : this._(TfArg.expression(template));
    const GkeBackupBackupPlanDayOfWeek.arg(TfArg<String> arg) : this._(arg);

    static const monday = GkeBackupBackupPlanDayOfWeek._(TfArgLiteral('MONDAY'));
    static const tuesday = GkeBackupBackupPlanDayOfWeek._(TfArgLiteral('TUESDAY'));
    static const wednesday = GkeBackupBackupPlanDayOfWeek._(TfArgLiteral('WEDNESDAY'));
    static const thursday = GkeBackupBackupPlanDayOfWeek._(TfArgLiteral('THURSDAY'));
    static const friday = GkeBackupBackupPlanDayOfWeek._(TfArgLiteral('FRIDAY'));
    static const saturday = GkeBackupBackupPlanDayOfWeek._(TfArgLiteral('SATURDAY'));
    static const sunday = GkeBackupBackupPlanDayOfWeek._(TfArgLiteral('SUNDAY'));

    static const List<GkeBackupBackupPlanDayOfWeek> values = [monday, tuesday, wednesday, thursday, friday, saturday, sunday];
  }

  @immutable
  class GkeBackupBackupPlanExclusionWindowDaysOfWeek {
    const GkeBackupBackupPlanExclusionWindowDaysOfWeek({this.daysOfWeek});

    final List<GkeBackupBackupPlanDayOfWeek>? daysOfWeek;

    Map<String, Object?> toArgMap() => {
      if (daysOfWeek != null)
        'days_of_week': daysOfWeek!.map((d) => d.toTfJson()).toList(),
    };
  }

  @immutable
  class GkeBackupBackupPlanExclusionWindow {
    const GkeBackupBackupPlanExclusionWindow({
      this.daysOfWeek,
    });

    final GkeBackupBackupPlanExclusionWindowDaysOfWeek? daysOfWeek;

    Map<String, Object?> toArgMap() => {
      if (daysOfWeek != null) 'days_of_week': [daysOfWeek!.toArgMap()],
    };
  }

  @immutable
  class GkeBackupBackupPlanRpoConfig {
    const GkeBackupBackupPlanRpoConfig({this.exclusionWindows});

    final List<GkeBackupBackupPlanExclusionWindow>? exclusionWindows;

    Map<String, Object?> toArgMap() => {
      if (exclusionWindows != null)
        'exclusion_windows': exclusionWindows!.map((w) => w.toArgMap()).toList(),
    };
  }

  @immutable
  class GkeBackupBackupPlanBackupSchedule {
    const GkeBackupBackupPlanBackupSchedule({
      this.cronSchedule,
      this.rpoConfig,
    });

    final TfArg<String>? cronSchedule;
    final GkeBackupBackupPlanRpoConfig? rpoConfig;

    Map<String, Object?> encode() => {
      if (cronSchedule != null) 'cron_schedule': cronSchedule!.toTfJson(),
      if (rpoConfig != null) 'rpo_config': [rpoConfig!.toArgMap()],
    };
  }

customSlots:
  backup_schedule:
    paramDeclaration: 'GkeBackupBackupPlanBackupSchedule? backupSchedule'
    argMapEntry: "if (backupSchedule != null) 'backup_schedule': TfArg.literal([backupSchedule.encode()]),"

paramOrder:
  - name
  - location
  - cluster
  - description
  - deactivated
  - labels
  - backup_config
  - backup_schedule
  - retention_policy
  - project

extraGetters: |2
    TfRef<String> get id => TfRef.attribute<String>(this, 'id');

sealedNames:
  "backup_config.all_namespaces, backup_config.selected_applications, backup_config.selected_namespace_labels, backup_config.selected_namespaces": scope
