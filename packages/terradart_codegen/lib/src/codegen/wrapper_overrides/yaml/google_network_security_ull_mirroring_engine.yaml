outputDir: network

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// ULL mirroring engine — logical infrastructure for Ultra Low Latency mirroring.
  ///
  /// Enable `networksecurity.googleapis.com` before apply. Pair with
  /// [GoogleNetworkSecurityUllMirroringCollector] in the same [location] zone
  /// (e.g. `us-south1-d`).

paramOrder:
  - location
  - ull_mirroring_engine_id
  - labels
  - deletion_policy
  - project

prelude: |
  /// Terraform `deletion_policy` for ULL mirroring engines.
  extension type const NetworkSecurityUllMirroringEngineDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    NetworkSecurityUllMirroringEngineDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    NetworkSecurityUllMirroringEngineDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const NetworkSecurityUllMirroringEngineDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = NetworkSecurityUllMirroringEngineDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = NetworkSecurityUllMirroringEngineDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = NetworkSecurityUllMirroringEngineDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<NetworkSecurityUllMirroringEngineDeletionPolicy> values = [delete, prevent, abandon];
  }

dartTypeOverrides:
  deletion_policy: NetworkSecurityUllMirroringEngineDeletionPolicy
