outputDir: oracle

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true
deriveEnums: true

curatedDoc: |-
  /// Oracle Autonomous Database on Oracle Database@Google Cloud.
  ///
  /// Enable `oracledatabase.googleapis.com` before apply. Set [properties]
  /// with `db_workload` and `license_type`. For private networking, wire
  /// [odb_subnet] / [odb_network] to [GoogleOracleDatabaseOdbSubnet] refs.

paramOrder:
  - location
  - autonomous_database_id
  - database
  - display_name
  - admin_password
  - properties
  - odb_subnet
  - odb_network
  - network
  - cidr
  - labels
  - source_config
  - deletion_policy
  - deletion_protection
  - project

prelude: |
  /// Terraform `deletion_policy` for Autonomous Databases.
  extension type const OracleDatabaseAutonomousDatabaseDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    OracleDatabaseAutonomousDatabaseDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    OracleDatabaseAutonomousDatabaseDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const OracleDatabaseAutonomousDatabaseDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = OracleDatabaseAutonomousDatabaseDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = OracleDatabaseAutonomousDatabaseDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = OracleDatabaseAutonomousDatabaseDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<OracleDatabaseAutonomousDatabaseDeletionPolicy> values = [delete, prevent, abandon];
  }

  /// Autonomous Database workload type.
  extension type const OracleDatabaseAutonomousDatabaseDbWorkload._(TfArg<String> _) implements TfArg<String> {
    OracleDatabaseAutonomousDatabaseDbWorkload.variable(String name) : this._(TfArg.variable(name));
    OracleDatabaseAutonomousDatabaseDbWorkload.expression(String template) : this._(TfArg.expression(template));
    const OracleDatabaseAutonomousDatabaseDbWorkload.arg(TfArg<String> arg) : this._(arg);

    static const dbWorkloadUnspecified = OracleDatabaseAutonomousDatabaseDbWorkload._(TfArgLiteral('DB_WORKLOAD_UNSPECIFIED'));
    static const oltp = OracleDatabaseAutonomousDatabaseDbWorkload._(TfArgLiteral('OLTP'));
    static const dw = OracleDatabaseAutonomousDatabaseDbWorkload._(TfArgLiteral('DW'));
    static const ajd = OracleDatabaseAutonomousDatabaseDbWorkload._(TfArgLiteral('AJD'));
    static const apex = OracleDatabaseAutonomousDatabaseDbWorkload._(TfArgLiteral('APEX'));

    static const List<OracleDatabaseAutonomousDatabaseDbWorkload> values = [dbWorkloadUnspecified, oltp, dw, ajd, apex];
  }

  /// Autonomous Database license type.
  extension type const OracleDatabaseAutonomousDatabaseLicenseType._(TfArg<String> _) implements TfArg<String> {
    OracleDatabaseAutonomousDatabaseLicenseType.variable(String name) : this._(TfArg.variable(name));
    OracleDatabaseAutonomousDatabaseLicenseType.expression(String template) : this._(TfArg.expression(template));
    const OracleDatabaseAutonomousDatabaseLicenseType.arg(TfArg<String> arg) : this._(arg);

    static const licenseTypeUnspecified = OracleDatabaseAutonomousDatabaseLicenseType._(TfArgLiteral('LICENSE_TYPE_UNSPECIFIED'));
    static const licenseIncluded = OracleDatabaseAutonomousDatabaseLicenseType._(TfArgLiteral('LICENSE_INCLUDED'));
    static const bringYourOwnLicense = OracleDatabaseAutonomousDatabaseLicenseType._(TfArgLiteral('BRING_YOUR_OWN_LICENSE'));

    static const List<OracleDatabaseAutonomousDatabaseLicenseType> values = [licenseTypeUnspecified, licenseIncluded, bringYourOwnLicense];
  }

dartTypeOverrides:
  deletion_policy: OracleDatabaseAutonomousDatabaseDeletionPolicy
  properties.db_workload: OracleDatabaseAutonomousDatabaseDbWorkload
  properties.license_type: OracleDatabaseAutonomousDatabaseLicenseType

extraGetters: |2
    TfRef<String> get id => TfRef.attribute<String>(this, 'id');
