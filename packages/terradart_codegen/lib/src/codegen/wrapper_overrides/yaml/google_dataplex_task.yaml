outputDir: dataplex
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true
# `spark` / `notebook` are the real schema block names the hand-written
# sealed `DataplexTaskWorkload` variants already own (dispatched via
# `workload`'s `.blockKey`) — same customSlotKeys blind spot as
# google_dataplex_datascan.yaml. Neither block has an enum site, so
# excluding both costs nothing and avoids emitting a redundant derived class
# per block.
curatedDoc: |-
  /// A Dataplex lake task (scheduled Spark or Notebook workload).
  ///
  /// Choose exactly one [DataplexTaskWorkload] via [workload]. Provide
  /// [triggerSpec] and optional [executionSpec] as literal maps matching the
  /// provider nested blocks (`trigger_spec`, `execution_spec`).

extraImports:
  - "import 'package:meta/meta.dart';"

sealedNames:
  "notebook.infrastructure_spec.vpc_network.network, notebook.infrastructure_spec.vpc_network.sub_network": target
  "spark.infrastructure_spec.vpc_network.network, spark.infrastructure_spec.vpc_network.sub_network": target
  "spark.main_class, spark.main_jar_file_uri, spark.python_script_file, spark.sql_script, spark.sql_script_file": driver
  "notebook, spark": workload

paramOrder:
  - task_id
  - location
  - lake
  - spark
  - notebook
  - trigger_spec
  - execution_spec
  - display_name
  - description
  - labels
  - deletion_policy
  - project

argMapOrder:
  - task_id
  - location
  - lake
  - display_name
  - description
  - labels
  - trigger_spec
  - execution_spec
  - deletion_policy
  - project
  - spark
  - notebook
