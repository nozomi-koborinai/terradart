outputDir: network
deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

# The typed threat_detector_provider param is a HUMAN decision now, not a
# derivation: the 2026-08-16 MM sync restored upstream's `api_name:
# provider` (REST name), which detaches enum_values from the TF attribute
# key, so deriveEnums no longer emits this enum. Upstream's description
# still mandates INFOBLOX as the only value, so the enum lives in the
# prelude (sync-proof) instead of a local MM fixture patch (clobbered by
# every weekly sync — the exact failure of PR #595). If upstream ever
# re-attaches enum_values, deriveEnums + this prelude would emit a
# duplicate type — delete the prelude then, per the derivation-gate rule.

dartTypeOverrides:
  threat_detector_provider: NetworkSecurityDnsThreatDetectorProvider

prelude: |
  /// `threat_detector_provider` for [GoogleNetworkSecurityDnsThreatDetector].
  ///
  /// Upstream documents `INFOBLOX` as the only supported value.
  extension type const NetworkSecurityDnsThreatDetectorProvider._(TfArg<String> _) implements TfArg<String> {
    NetworkSecurityDnsThreatDetectorProvider.variable(String name) : this._(TfArg.variable(name));
    NetworkSecurityDnsThreatDetectorProvider.expression(String template) : this._(TfArg.expression(template));
    const NetworkSecurityDnsThreatDetectorProvider.arg(TfArg<String> arg) : this._(arg);

    static const infoblox = NetworkSecurityDnsThreatDetectorProvider._(TfArgLiteral('INFOBLOX'));

    static const List<NetworkSecurityDnsThreatDetectorProvider> values = [infoblox];
  }

curatedDoc: |-
  /// Network Security **DNS threat detector** (DNS Armor / Infoblox) — enables
  /// DNS-layer advanced threat detection for VPC workloads in a project.
  ///
  /// Creating a detector enables DNS Armor for the project. Billing is
  /// usage-based (workloads / internet-bound DNS queries) via Network Security
  /// SKU `F6D7-37A1-D4A0`, not a flat existence charge for the config alone.
  /// [threatDetectorProvider] must be `INFOBLOX` (only supported value).
  /// Location must be `global`.
  ///
  /// Enable `networksecurity.googleapis.com` via [GoogleProjectService]
  /// before apply. At most one DNS threat detector exists per project.
  ///
  /// Example:
  /// ```dart
  /// GoogleNetworkSecurityDnsThreatDetector(
  ///   'dns_threat',
  ///   name: TfArg.literal('terradart-dns-threat'),
  ///   location: TfArg.literal('global'),
  ///   threatDetectorProvider: NetworkSecurityDnsThreatDetectorProvider.infoblox,
  /// );
  /// ```

paramOrder:
  - name
  - location
  - threat_detector_provider
  - excluded_networks
  - labels
  - deletion_policy
  - project
