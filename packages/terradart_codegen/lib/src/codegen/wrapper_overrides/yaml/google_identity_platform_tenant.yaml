outputDir: identity

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

curatedDoc: |-
  /// Identity Platform tenant — isolated Auth realm under a multi-tenant project.
  ///
  /// Pair with [GoogleIdentityPlatformConfig] (enable multi-tenancy in the
  /// console / config as needed). Set [displayName] at minimum.

paramOrder:
  - display_name
  - allow_password_signup
  - enable_email_link_signin
  - disable_auth
  - deletion_policy
  - client
  - project

prelude: |
  /// Terraform `deletion_policy` for Identity Platform tenants.
  extension type const IdentityPlatformTenantDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    IdentityPlatformTenantDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    IdentityPlatformTenantDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const IdentityPlatformTenantDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = IdentityPlatformTenantDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = IdentityPlatformTenantDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = IdentityPlatformTenantDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<IdentityPlatformTenantDeletionPolicy> values = [delete, prevent, abandon];
  }

dartTypeOverrides:
  deletion_policy: IdentityPlatformTenantDeletionPolicy
