  // path_matcher[] (list, unbounded)
  // ===========================================================================

  // ===========================================================================
  // url_redirect block (max_items=1, reused at every level)
  // ===========================================================================

  // ===========================================================================
  // header_action block (max_items=1, reused at top-level and inside rules)
  // ===========================================================================

  // ===========================================================================
  // test[] block (CI-friendly assertions)
  // ===========================================================================


sealedNames:
  "default_route_action, default_url_redirect": default_action

dartTypeOverrides:
  default_route_action.cache_policy.cache_mode: UrlMapCacheMode
  default_url_redirect.redirect_response_code: UrlMapRedirectResponseCode
  path_matcher.default_route_action.cache_policy.cache_mode: UrlMapCacheMode
  path_matcher.default_url_redirect.redirect_response_code: UrlMapRedirectResponseCode
  path_matcher.path_rule.route_action.cache_policy.cache_mode: UrlMapCacheMode
  path_matcher.path_rule.url_redirect.redirect_response_code: UrlMapRedirectResponseCode
  path_matcher.route_rules.match_rules.metadata_filters.filter_match_criteria: UrlMapMetadataFilterMatchCriteria
  path_matcher.route_rules.route_action.cache_policy.cache_mode: UrlMapCacheMode
  path_matcher.route_rules.url_redirect.redirect_response_code: UrlMapRedirectResponseCode
