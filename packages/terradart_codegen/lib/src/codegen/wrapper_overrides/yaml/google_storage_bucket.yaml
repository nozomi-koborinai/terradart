outputDir: storage
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

curatedDoc: |-
  /// Example:
  /// ```dart
  /// final assets = GoogleStorageBucket(
  ///   'assets',
  ///   name: TfArg.literal('my-app-assets-prod'),
  ///   location: TfArg.literal('ASIA-NORTHEAST1'),
  ///   storageClass: BucketStorageClass.standard,
  ///   forceDestroy: TfArg.literal(false),
  ///   versioning: StorageBucketVersioning(enabled: TfArg.literal(true)),
  ///   uniformBucketLevelAccess: TfArg.literal(true),
  /// );
  /// ```

paramOrder:
  - name
  - location
  - storage_class
  - force_destroy
  - public_access_prevention
  - uniform_bucket_level_access
  - default_event_based_hold
  - enable_object_retention
  - requester_pays
  - rpo
  - labels
  - versioning
  - cors
  - lifecycle_rule
  - encryption
  - retention_policy
  - logging
  - website
  - autoclass
  - custom_placement_config
  - hierarchical_namespace
  - ip_filter
  - soft_delete_policy
  - project

dartTypeOverrides:
  storage_class: BucketStorageClass
  lifecycle_rule.action.storage_class: BucketStorageClass
  lifecycle_rule.action.type: LifecycleActionType

prelude: |
  /// Storage class for `google_storage_bucket.storage_class`.
  ///
  /// `durableReducedAvailability` is the legacy class (deprecated 2018);
  /// keep for completeness, GCP still accepts it for existing buckets.
  extension type const BucketStorageClass._(TfArg<String> _) implements TfArg<String> {
    BucketStorageClass.variable(String name) : this._(TfArg.variable(name));
    BucketStorageClass.expression(String template) : this._(TfArg.expression(template));
    const BucketStorageClass.arg(TfArg<String> arg) : this._(arg);

    static const standard = BucketStorageClass._(TfArgLiteral('STANDARD'));
    static const nearline = BucketStorageClass._(TfArgLiteral('NEARLINE'));
    static const coldline = BucketStorageClass._(TfArgLiteral('COLDLINE'));
    static const archive = BucketStorageClass._(TfArgLiteral('ARCHIVE'));
    static const multiRegional = BucketStorageClass._(TfArgLiteral('MULTI_REGIONAL'));
    static const regional = BucketStorageClass._(TfArgLiteral('REGIONAL'));
    static const durableReducedAvailability = BucketStorageClass._(TfArgLiteral('DURABLE_REDUCED_AVAILABILITY'));

    static const List<BucketStorageClass> values = [standard, nearline, coldline, archive, multiRegional, regional, durableReducedAvailability];
  }

  /// Action type for `lifecycle_rule.action.type`.
  extension type const LifecycleActionType._(TfArg<String> _) implements TfArg<String> {
    LifecycleActionType.variable(String name) : this._(TfArg.variable(name));
    LifecycleActionType.expression(String template) : this._(TfArg.expression(template));
    const LifecycleActionType.arg(TfArg<String> arg) : this._(arg);

    static const delete = LifecycleActionType._(TfArgLiteral('Delete'));
    static const setStorageClass = LifecycleActionType._(TfArgLiteral('SetStorageClass'));

    static const List<LifecycleActionType> values = [delete, setStorageClass];
  }

