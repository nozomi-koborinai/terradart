outputDir: gkeonprem
deriveClassDoc: true
deriveOutputGetters: true
deriveNestedTypes: true
deriveEnums: true

extraImports:
  - "import 'package:meta/meta.dart';"

curatedDoc: |-
  /// GKE on-prem / GDC **VMware admin cluster** — bootstrap admin cluster for
  /// VMware user clusters.
  ///
  /// **Cost / apply:** gcp-cost: GKE Enterprise / GDC `9186-F79E-3871` vSphere
  /// SKU `82D9-AB10-CA55` **$0.03288/h**. billing-behavior: GDC platform fees
  /// while clusters are registered; requires a real vSphere environment absent
  /// on `terradart-validate`. **Never** wire into apply-smoke.
  ///
  /// Enable `gkeonprem.googleapis.com` before apply.

paramOrder:
  - name
  - location
  - on_prem_version
  - description
  - bootstrap_cluster_membership
  - network_config
  - control_plane_node
  - load_balancer
  - vcenter
  - addon_node
  - anti_affinity_groups
  - authorization
  - auto_repair_config
  - platform_config
  - private_registry_config
  - proxy
  - image_type
  - enable_advanced_cluster
  - annotations
  - project

extraGetters: |2
    /// Reference to `id` attribute.
    TfRef<String> get idRef => TfRef.attribute<String>(this, 'id');

    /// Reference to `name` attribute.
    TfRef<String> get nameRef => TfRef.attribute<String>(this, 'name');
