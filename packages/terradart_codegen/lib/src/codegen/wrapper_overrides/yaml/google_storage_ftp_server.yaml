outputDir: storage

deriveClassDoc: true
deriveExactlyOne: true
deriveEnums: true
deriveNestedTypes: true
deriveOutputGetters: true

dartTypeOverrides:
  access_type: StorageFtpServerAccessType

curatedDoc: |-
  /// `config` carries the access mode: `.internalConfig(...)` for Private
  /// Service Connect consumers (with the `.internal` `accessType`) or
  /// `.externalConfig(...)` for allowed CIDR ranges (with
  /// the `.external` `accessType`).

paramOrder:
  - server_id
  - location
  - access_type
  - internal_config
  - external_config
  - display_name
  - labels
  - deletion_policy
  - project

sealedNames:
  "external_config, internal_config": config
