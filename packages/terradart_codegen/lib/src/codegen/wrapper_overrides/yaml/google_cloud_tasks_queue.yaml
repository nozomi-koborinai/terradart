outputDir: cloud_tasks
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

# Slot order chosen to mirror the hand-written constructor: identity
# (name, location) first, then the five helper-typed nested-block slots
# in hand-written order, then the optional scalars (project,
# desired_state). argMap order matches paramOrder one-to-one (verified
# against hand-written), so no separate `argMapOrder` is needed.
paramOrder:
  - name
  - location
  - app_engine_routing_override
  - rate_limits
  - retry_config
  - stackdriver_logging_config
  - http_target
  - project
  - desired_state

extraImports:
  - "import 'package:meta/meta.dart';"

dartTypeOverrides:
  desired_state: CloudTasksQueueDesiredState

prelude: |
  extension type const CloudTasksQueueDesiredState._(TfArg<String> _) implements TfArg<String> {
    CloudTasksQueueDesiredState.variable(String name) : this._(TfArg.variable(name));
    CloudTasksQueueDesiredState.expression(String template) : this._(TfArg.expression(template));
    const CloudTasksQueueDesiredState.arg(TfArg<String> arg) : this._(arg);

    static const running = CloudTasksQueueDesiredState._(TfArgLiteral('RUNNING'));
    static const paused = CloudTasksQueueDesiredState._(TfArgLiteral('PAUSED'));

    static const List<CloudTasksQueueDesiredState> values = [running, paused];
  }

  // ===========================================================================
  // Nested-block helpers
  // ===========================================================================

  // ===========================================================================
  // Factory
  // ===========================================================================

# Hand-written tightens `location` from `optional + computed` to required
# for ergonomic clarity; matches the IAM-member precedent (e.g.
# google_cloud_tasks_queue_iam_member also tightens `location`).
requiredParams:
  - location
