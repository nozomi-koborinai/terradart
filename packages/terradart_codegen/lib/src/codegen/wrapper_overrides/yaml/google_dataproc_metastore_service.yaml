outputDir: dataproc

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true
extraImports:
  - "import 'package:meta/meta.dart';"

curatedDoc: |-
  /// Dataproc Metastore service — managed Apache Hive metastore.
  ///
  /// Enable `metastore.googleapis.com` before apply. Prefer [tier]
  /// `DEVELOPER` for smoke stacks (`ENTERPRISE` and scaling configs bill more).
  /// Set [hiveMetastoreConfig] with a Hive schema [version] (e.g. `3.1.2`).

sealedNames:
  "scaling_config, tier": capacity

paramOrder:
  - service_id
  - location
  - tier
  - database_type
  - release_channel
  - hive_metastore_config
  - network
  - port
  - labels
  - deletion_protection
  - deletion_policy
  - project
  - tags
  - encryption_config
  - maintenance_window
  - metadata_integration
  - network_config
  - scaling_config
  - scheduled_backup
  - telemetry_config

prelude: |
