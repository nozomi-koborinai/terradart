outputDir: compute

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

paramOrder:
  - name
  - replica_zones
  - type
  - size
  - image
  - description
  - labels
  - guest_os_features
  - region
  - project
  - disk_encryption_key
  - source_image_encryption_key
  - source_snapshot_encryption_key
  - async_primary_disk

extraGetters: |2

    /// Reference to `self_link` attribute.
    TfRef<String> get selfLink => TfRef.attribute<String>(this, 'self_link');

prelude: |
  /// `guest_os_features[].type` for regional persistent disks.
  extension type const ComputeRegionDiskGuestOsFeatureType._(TfArg<String> _) implements TfArg<String> {
    ComputeRegionDiskGuestOsFeatureType.variable(String name) : this._(TfArg.variable(name));
    ComputeRegionDiskGuestOsFeatureType.expression(String template) : this._(TfArg.expression(template));
    const ComputeRegionDiskGuestOsFeatureType.arg(TfArg<String> arg) : this._(arg);

    static const multiIpSubnet = ComputeRegionDiskGuestOsFeatureType._(TfArgLiteral('MULTI_IP_SUBNET'));
    static const secureBoot = ComputeRegionDiskGuestOsFeatureType._(TfArgLiteral('SECURE_BOOT'));
    static const sevCapable = ComputeRegionDiskGuestOsFeatureType._(TfArgLiteral('SEV_CAPABLE'));
    static const uefiCompatible = ComputeRegionDiskGuestOsFeatureType._(TfArgLiteral('UEFI_COMPATIBLE'));
    static const virtioScsiMultiqueue = ComputeRegionDiskGuestOsFeatureType._(TfArgLiteral('VIRTIO_SCSI_MULTIQUEUE'));
    static const windows = ComputeRegionDiskGuestOsFeatureType._(TfArgLiteral('WINDOWS'));
    static const gVnic = ComputeRegionDiskGuestOsFeatureType._(TfArgLiteral('GVNIC'));
    static const sevLiveMigratable = ComputeRegionDiskGuestOsFeatureType._(TfArgLiteral('SEV_LIVE_MIGRATABLE'));
    static const sevSnpCapable = ComputeRegionDiskGuestOsFeatureType._(TfArgLiteral('SEV_SNP_CAPABLE'));
    static const suspendResumeCompatible = ComputeRegionDiskGuestOsFeatureType._(TfArgLiteral('SUSPEND_RESUME_COMPATIBLE'));
    static const tdxCapable = ComputeRegionDiskGuestOsFeatureType._(TfArgLiteral('TDX_CAPABLE'));
    static const sevLiveMigratableV2 = ComputeRegionDiskGuestOsFeatureType._(TfArgLiteral('SEV_LIVE_MIGRATABLE_V2'));
    static const snpSvsmCapable = ComputeRegionDiskGuestOsFeatureType._(TfArgLiteral('SNP_SVSM_CAPABLE'));

    static const List<ComputeRegionDiskGuestOsFeatureType> values = [multiIpSubnet, secureBoot, sevCapable, uefiCompatible, virtioScsiMultiqueue, windows, gVnic, sevLiveMigratable, sevSnpCapable, suspendResumeCompatible, tdxCapable, sevLiveMigratableV2, snpSvsmCapable];
  }

  /// One entry of the `guest_os_features` block (repeatable list).
  @immutable
  class ComputeRegionDiskGuestOsFeature {
    const ComputeRegionDiskGuestOsFeature({required this.type});

    final ComputeRegionDiskGuestOsFeatureType type;

    Map<String, Object?> toArgMap() => {'type': type.toTfJson()};
  }

customSlots:
  guest_os_features:
    paramDeclaration: 'List<ComputeRegionDiskGuestOsFeature>? guestOsFeatures'
    argMapEntry: "if (guestOsFeatures != null) 'guest_os_features': TfArg.literal(guestOsFeatures.map((f) => f.toArgMap()).toList()),"

extraImports:
  - "import 'package:meta/meta.dart';"
