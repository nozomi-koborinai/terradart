outputDir: bigquery
deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

dartTypeOverrides:
  data_policy_type: BigqueryDatapolicyv2DataPolicyType

extraImports:
  - "import 'package:meta/meta.dart';"

curatedDoc: |-
  /// BigQuery Data Policy **V2** — column-level masking / raw-data access
  /// without a required V1 policy tag. Prefer
  /// [BigqueryDatapolicyv2DataPolicyType.rawDataAccessPolicy] for smoke stacks
  /// (no taxonomy). For masking, set [dataMaskingPolicy] with a predefined
  /// expression (or a custom routine resource name).
  ///
  /// Enable `bigquerydatapolicy.googleapis.com` before apply.
  ///
  /// Example (raw-data access):
  /// ```dart
  /// GoogleBigqueryDatapolicyv2DataPolicy(
  ///   'raw_access',
  ///   location: TfArg.literal('us-central1'),
  ///   dataPolicyId: TfArg.literal('raw-access'),
  ///   dataPolicyType: BigqueryDatapolicyv2DataPolicyType.rawDataAccessPolicy,
  /// );
  /// ```
  ///
  /// Example (predefined email mask):
  /// ```dart
  /// GoogleBigqueryDatapolicyv2DataPolicy(
  ///   'email_mask_v2',
  ///   location: TfArg.literal('us-central1'),
  ///   dataPolicyId: TfArg.literal('email-mask-v2'),
  ///   dataPolicyType: BigqueryDatapolicyv2DataPolicyType.dataMaskingPolicy,
  ///   dataMaskingPolicy: const BigqueryDatapolicyv2DataPolicyDataMaskingPolicy(
  ///     predefinedExpression:
  ///         BigqueryDatapolicyv2DataPolicyPredefinedExpression.emailMask,
  ///   ),
  /// );
  /// ```

prelude: |
  /// Enrollment level for `google_bigquery_datapolicyv2_data_policy.data_policy_type`.
  extension type const BigqueryDatapolicyv2DataPolicyType._(TfArg<String> _) implements TfArg<String> {
    BigqueryDatapolicyv2DataPolicyType.variable(String name) : this._(TfArg.variable(name));
    BigqueryDatapolicyv2DataPolicyType.expression(String template) : this._(TfArg.expression(template));
    const BigqueryDatapolicyv2DataPolicyType.arg(TfArg<String> arg) : this._(arg);

    static const dataMaskingPolicy = BigqueryDatapolicyv2DataPolicyType._(TfArgLiteral('DATA_MASKING_POLICY'));
    static const rawDataAccessPolicy = BigqueryDatapolicyv2DataPolicyType._(TfArgLiteral('RAW_DATA_ACCESS_POLICY'));
    static const columnLevelSecurityPolicy = BigqueryDatapolicyv2DataPolicyType._(TfArgLiteral('COLUMN_LEVEL_SECURITY_POLICY'));

    static const List<BigqueryDatapolicyv2DataPolicyType> values = [dataMaskingPolicy, rawDataAccessPolicy, columnLevelSecurityPolicy];
  }

  /// Predefined masking expression for V2 [BigqueryDatapolicyv2DataPolicyDataMaskingPolicy].
  extension type const BigqueryDatapolicyv2DataPolicyPredefinedExpression._(TfArg<String> _) implements TfArg<String> {
    BigqueryDatapolicyv2DataPolicyPredefinedExpression.variable(String name) : this._(TfArg.variable(name));
    BigqueryDatapolicyv2DataPolicyPredefinedExpression.expression(String template) : this._(TfArg.expression(template));
    const BigqueryDatapolicyv2DataPolicyPredefinedExpression.arg(TfArg<String> arg) : this._(arg);

    static const sha256 = BigqueryDatapolicyv2DataPolicyPredefinedExpression._(TfArgLiteral('SHA256'));
    static const alwaysNull = BigqueryDatapolicyv2DataPolicyPredefinedExpression._(TfArgLiteral('ALWAYS_NULL'));
    static const defaultMaskingValue = BigqueryDatapolicyv2DataPolicyPredefinedExpression._(TfArgLiteral('DEFAULT_MASKING_VALUE'));
    static const lastFourCharacters = BigqueryDatapolicyv2DataPolicyPredefinedExpression._(TfArgLiteral('LAST_FOUR_CHARACTERS'));
    static const firstFourCharacters = BigqueryDatapolicyv2DataPolicyPredefinedExpression._(TfArgLiteral('FIRST_FOUR_CHARACTERS'));
    static const emailMask = BigqueryDatapolicyv2DataPolicyPredefinedExpression._(TfArgLiteral('EMAIL_MASK'));
    static const dateYearMask = BigqueryDatapolicyv2DataPolicyPredefinedExpression._(TfArgLiteral('DATE_YEAR_MASK'));
    static const randomHash = BigqueryDatapolicyv2DataPolicyPredefinedExpression._(TfArgLiteral('RANDOM_HASH'));

    static const List<BigqueryDatapolicyv2DataPolicyPredefinedExpression> values = [sha256, alwaysNull, defaultMaskingValue, lastFourCharacters, firstFourCharacters, emailMask, dateYearMask, randomHash];
  }

  /// `data_masking_policy` — predefined expression **or** custom routine.
  @immutable
  class BigqueryDatapolicyv2DataPolicyDataMaskingPolicy {
    const BigqueryDatapolicyv2DataPolicyDataMaskingPolicy({
      this.predefinedExpression,
      this.routine,
    });

    final BigqueryDatapolicyv2DataPolicyPredefinedExpression?
        predefinedExpression;
    final TfArg<String>? routine;

    @internal
    Map<String, Object?> encode() => {
          if (predefinedExpression != null)
            'predefined_expression': predefinedExpression!.toTfJson(),
          if (routine != null) 'routine': routine!.toTfJson(),
        };
  }

  /// `data_governance_tag` — optional org/project tag binding on the policy.
  @immutable
  class BigqueryDatapolicyv2DataPolicyDataGovernanceTag {
    const BigqueryDatapolicyv2DataPolicyDataGovernanceTag({
      required this.key,
      required this.value,
    });

    final TfArg<String> key;
    final TfArg<String> value;

    @internal
    Map<String, Object?> encode() => {
          'key': key.toTfJson(),
          'value': value.toTfJson(),
        };
  }

customSlots:
  data_masking_policy:
    paramDeclaration: 'BigqueryDatapolicyv2DataPolicyDataMaskingPolicy? dataMaskingPolicy'
    argMapEntry: "if (dataMaskingPolicy != null) 'data_masking_policy': TfArg.literal([dataMaskingPolicy.encode()]),"
  data_governance_tag:
    paramDeclaration: 'BigqueryDatapolicyv2DataPolicyDataGovernanceTag? dataGovernanceTag'
    argMapEntry: "if (dataGovernanceTag != null) 'data_governance_tag': TfArg.literal([dataGovernanceTag.encode()]),"

paramOrder:
  - data_policy_id
  - data_policy_type
  - location
  - grantees
  - data_masking_policy
  - data_governance_tag
  - deletion_policy
  - project
