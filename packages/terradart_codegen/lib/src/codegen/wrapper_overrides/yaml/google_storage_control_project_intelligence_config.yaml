outputDir: storage_control

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true
# MM ProjectIntelligenceConfig.yaml documents editionConfig as String with
# "Valid values are INHERIT, TRIAL, DISABLED and STANDARD" (no enum_values),
# so deriveEnums cannot emit — hand-write the enum in prelude.
deriveEnums: false

dartTypeOverrides:
  edition_config: StorageControlProjectIntelligenceConfigEditionConfig

prelude: |
  /// Edition configuration of the Storage Intelligence resource.
  extension type const StorageControlProjectIntelligenceConfigEditionConfig._(TfArg<String> _) implements TfArg<String> {
    StorageControlProjectIntelligenceConfigEditionConfig.variable(String name) : this._(TfArg.variable(name));
    StorageControlProjectIntelligenceConfigEditionConfig.expression(String template) : this._(TfArg.expression(template));
    const StorageControlProjectIntelligenceConfigEditionConfig.arg(TfArg<String> arg) : this._(arg);

    static const inherit = StorageControlProjectIntelligenceConfigEditionConfig._(TfArgLiteral('INHERIT'));
    static const trial = StorageControlProjectIntelligenceConfigEditionConfig._(TfArgLiteral('TRIAL'));
    static const disabled = StorageControlProjectIntelligenceConfigEditionConfig._(TfArgLiteral('DISABLED'));
    static const standard = StorageControlProjectIntelligenceConfigEditionConfig._(TfArgLiteral('STANDARD'));

    static const List<StorageControlProjectIntelligenceConfigEditionConfig> values = [inherit, trial, disabled, standard];
  }

curatedDoc: |-
  /// Project-level **Cloud Storage Intelligence config** — a singleton that
  /// controls whether Storage Intelligence runs on this GCP project.
  ///
  /// Prefer [editionConfig] `DISABLED` for smoke stacks: the config is free
  /// project metadata. Do **not** set `STANDARD` (or a paid `TRIAL` path) in
  /// apply-smoke — those editions can enable billed Storage Intelligence.
  /// `INHERIT` follows the parent org/folder setting and may still resolve
  /// to a paid edition.
  ///
  /// Terraform create/update use `PATCH`; destroy is state-only
  /// (`exclude_delete` upstream) and leaves the GCP singleton in place.
  ///
  /// Enable `storage.googleapis.com` via [GoogleProjectService] before apply.
  ///
  /// Example:
  /// ```dart
  /// GoogleStorageControlProjectIntelligenceConfig(
  ///   'intelligence',
  ///   name: TfArg.literal(projectId),
  ///   editionConfig: StorageControlProjectIntelligenceConfigEditionConfig.disabled,
  /// );
  /// ```

paramOrder:
  - name
  - edition_config
  - filter
