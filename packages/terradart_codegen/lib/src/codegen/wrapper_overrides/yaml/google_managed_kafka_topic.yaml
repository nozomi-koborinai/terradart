curatedDoc: |-
  /// Kafka **topic** on a [GoogleManagedKafkaCluster].
  ///
  /// **Cost:** no separate Cloud Billing Catalog SKU under Managed Service
  /// for Apache Kafka (`9544-7B1C-811D`) — topics are metadata on the parent
  /// cluster (cluster compute/storage bills). Deferred with the cluster
  /// (no apply-smoke quickstart).
  ///
  /// Example:
  /// ```dart
  /// final vpc = add(GoogleComputeNetwork('vpc', name: .literal('vpc')));
  /// final subnet = add(GoogleComputeSubnetwork(
  ///   'subnet',
  ///   name: .literal('subnet'),
  ///   network: vpc.ref,
  /// ));
  /// final cluster = add(GoogleManagedKafkaCluster(
  ///   'cluster',
  ///   clusterId: .literal('cluster'),
  ///   location: .literal('us-central1'),
  ///   capacityConfig: ManagedKafkaClusterCapacityConfig(
  ///     memoryBytes: .literal('3221225472'),
  ///     vcpuCount: .literal('3'),
  ///   ),
  ///   gcpConfig: ManagedKafkaClusterGcpConfig(
  ///     accessConfig: ManagedKafkaClusterAccessConfig(
  ///       networkConfigs: [
  ///         ManagedKafkaClusterNetworkConfigs(subnet: subnet.ref),
  ///       ],
  ///     ),
  ///   ),
  /// ));
  /// GoogleManagedKafkaTopic(
  ///   'events',
  ///   topicId: TfArg.literal('events'),
  ///   cluster: cluster.clusterId,
  ///   location: TfArg.literal('us-central1'),
  ///   replicationFactor: TfArg.literal(3),
  ///   partitionCount: TfArg.literal(3),
  /// );
  /// ```

paramOrder:
  - topic_id
  - cluster
  - location
  - replication_factor
  - partition_count
  - configs
  - deletion_policy
  - project
