outputDir: spanner

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

paramOrder:
  - instance
  - name
  - database_dialect
  - version_retention_period
  - ddl
  - deletion_protection
  - default_time_zone
  - enable_drop_protection
  - project
  - encryption_config

dartTypeOverrides:
  database_dialect: SpannerDatabaseDialect

curatedDoc: |-
  /// Cloud Spanner database inside a [GoogleSpannerInstance].
  ///
  /// Required identity:
  /// - [localName]: Terraform local name.
  /// - [instance]: parent instance — `spanner.id` or name.
  /// - [name]: database ID.
  ///
  /// Example:
  /// ```dart
  /// GoogleSpannerDatabase(
  ///   'main',
  ///   instance: spanner.ref,
  ///   name: TfArg.literal('main'),
  ///   versionRetentionPeriod: TfArg.literal('86400s'),
  /// );
  /// ```

prelude: |
  /// `database_dialect` — GoogleSQL vs PostgreSQL interface.
  enum SpannerDatabaseDialect implements TerraformEnum {
    googleStandardSql('GOOGLE_STANDARD_SQL'),
    postgresql('POSTGRESQL');

    const SpannerDatabaseDialect(this.terraformValue);
    @override
    final String terraformValue;
  }
