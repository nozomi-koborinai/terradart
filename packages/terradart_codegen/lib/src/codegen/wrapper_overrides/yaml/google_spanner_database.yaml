outputDir: spanner

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

paramOrder:
  - instance
  - name
  - database_dialect
  - version_retention_period
  - ddl
  - deletion_protection
  - default_time_zone
  - enable_drop_protection
  - project
  - encryption_config

dartTypeOverrides:
  database_dialect: SpannerDatabaseDialect

curatedDoc: |-
  /// Cloud Spanner database inside a [GoogleSpannerInstance].
  ///
  /// Required identity:
  /// - [localName]: Terraform local name.
  /// - [instance]: parent instance — `spanner.id` or name.
  /// - [name]: database ID.
  ///
  /// Example:
  /// ```dart
  /// GoogleSpannerDatabase(
  ///   'main',
  ///   instance: spanner.ref,
  ///   name: TfArg.literal('main'),
  ///   versionRetentionPeriod: TfArg.literal('86400s'),
  /// );
  /// ```

prelude: |
  /// `database_dialect` — GoogleSQL vs PostgreSQL interface.
  extension type const SpannerDatabaseDialect._(TfArg<String> _) implements TfArg<String> {
    SpannerDatabaseDialect.variable(String name) : this._(TfArg.variable(name));
    SpannerDatabaseDialect.expression(String template) : this._(TfArg.expression(template));
    const SpannerDatabaseDialect.arg(TfArg<String> arg) : this._(arg);

    static const googleStandardSql = SpannerDatabaseDialect._(TfArgLiteral('GOOGLE_STANDARD_SQL'));
    static const postgresql = SpannerDatabaseDialect._(TfArgLiteral('POSTGRESQL'));

    static const List<SpannerDatabaseDialect> values = [googleStandardSql, postgresql];
  }
