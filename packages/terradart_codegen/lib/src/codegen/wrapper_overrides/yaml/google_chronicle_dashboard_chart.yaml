outputDir: chronicle

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// Chronicle dashboard chart tile managed against a [GoogleChronicleNativeDashboard].
  ///
  /// Set [nativeDashboard] to `dashboard.name`. Use
  /// [ChronicleDashboardChartLayout], [ChronicleDashboardChartSpec], and
  /// [ChronicleDashboardChartQuery] for the nested blocks.

paramOrder:
  - location
  - instance
  - native_dashboard
  - chart_layout
  - dashboard_chart
  - dashboard_query
  - deletion_policy
  - project

extraImports:
  - "import 'package:meta/meta.dart';"

dartTypeOverrides:
  deletion_policy: ChronicleDashboardChartDeletionPolicy

prelude: |
