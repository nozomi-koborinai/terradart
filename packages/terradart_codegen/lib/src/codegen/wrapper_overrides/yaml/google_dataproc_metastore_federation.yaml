outputDir: dataproc

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

extraImports:
  - "import 'package:meta/meta.dart';"

curatedDoc: |-
  /// Dataproc Metastore federation — query multiple backend metastores as one.
  ///
  /// Provide at least one [backendMetastores] entry. Backend [name] is the
  /// relative resource name of a [GoogleDataprocMetastoreService]
  /// (`projects/…/services/…`).

paramOrder:
  - federation_id
  - version
  - location
  - backend_metastores
  - labels
  - deletion_protection
  - deletion_policy
  - project

prelude: |
  /// Terraform `deletion_policy` for Dataproc Metastore federations.
  extension type const DataprocMetastoreFederationDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    DataprocMetastoreFederationDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    DataprocMetastoreFederationDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const DataprocMetastoreFederationDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = DataprocMetastoreFederationDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = DataprocMetastoreFederationDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = DataprocMetastoreFederationDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<DataprocMetastoreFederationDeletionPolicy> values = [delete, prevent, abandon];
  }

  /// Backend metastore type for federation `backend_metastores`.
  extension type const DataprocMetastoreFederationBackendType._(TfArg<String> _) implements TfArg<String> {
    DataprocMetastoreFederationBackendType.variable(String name) : this._(TfArg.variable(name));
    DataprocMetastoreFederationBackendType.expression(String template) : this._(TfArg.expression(template));
    const DataprocMetastoreFederationBackendType.arg(TfArg<String> arg) : this._(arg);

    static const unspecified = DataprocMetastoreFederationBackendType._(TfArgLiteral('METASTORE_TYPE_UNSPECIFIED'));
    static const dataprocMetastore = DataprocMetastoreFederationBackendType._(TfArgLiteral('DATAPROC_METASTORE'));
    static const bigquery = DataprocMetastoreFederationBackendType._(TfArgLiteral('BIGQUERY'));
    static const dataplex = DataprocMetastoreFederationBackendType._(TfArgLiteral('DATAPLEX'));

    static const List<DataprocMetastoreFederationBackendType> values = [unspecified, dataprocMetastore, bigquery, dataplex];
  }

  /// One `backend_metastores` entry on a federation.
  @immutable
  class DataprocMetastoreFederationBackend {
    const DataprocMetastoreFederationBackend({
      required this.name,
      required this.metastoreType,
      required this.rank,
    });

    final TfArg<String> name;
    final DataprocMetastoreFederationBackendType metastoreType;
    final TfArg<int> rank;

    Map<String, Object?> toArgMap() => {
      'name': name.toTfJson(),
      'metastore_type': metastoreType.toTfJson(),
      'rank': rank.toTfJson(),
    };
  }

dartTypeOverrides:
  deletion_policy: DataprocMetastoreFederationDeletionPolicy

customSlots:
  backend_metastores:
    paramDeclaration: 'required List<DataprocMetastoreFederationBackend> backendMetastores'
    argMapEntry: "'backend_metastores': TfArg.literal(backendMetastores.map((b) => b.toArgMap()).toList()),"
