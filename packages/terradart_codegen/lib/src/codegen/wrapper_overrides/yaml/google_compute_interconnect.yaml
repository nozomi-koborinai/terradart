outputDir: compute
deriveClassDoc: true
deriveNestedTypes: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveEnums: true

dartTypeOverrides:
  interconnect_type: ComputeInterconnectType
  link_type: ComputeInterconnectLinkType

paramOrder:
  - name
  - interconnect_type
  - link_type
  - location
  - requested_link_count
  - customer_name
  - description
  - admin_enabled
  - macsec_enabled
  - noc_contact_email
  - remote_location
  - requested_features
  - labels
  - macsec
  - params
  - deletion_policy
  - project

extraGetters: |2
    TfRef<String> get id => TfRef.attribute<String>(this, 'id');
    TfRef<String> get nameRef => TfRef.attribute<String>(this, 'name');
