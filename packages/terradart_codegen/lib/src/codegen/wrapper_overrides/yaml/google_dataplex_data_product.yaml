outputDir: dataplex

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

paramOrder:
  - location
  - data_product_id
  - display_name
  - owner_emails
  - description
  - labels
  - access_approval_config
  - project
  - icon
  - access_groups

extraGetters: |2
    /// Reference to `data_product_id` attribute.
    TfRef<String> get dataProductIdRef =>
        TfRef.attribute<String>(this, 'data_product_id');


extraImports:
  - "import 'package:meta/meta.dart';"
