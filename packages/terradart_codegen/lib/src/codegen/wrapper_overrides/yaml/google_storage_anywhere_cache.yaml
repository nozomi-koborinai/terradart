outputDir: storage

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true
# Hyphenated MM enum values cannot be derived as Dart identifiers — hand-map
# via [StorageAnywhereCacheAdmissionPolicy].

dartTypeOverrides:
  admission_policy: StorageAnywhereCacheAdmissionPolicy

curatedDoc: |-
  /// Cloud Storage **Anywhere Cache** (Rapid Cache) — a zonal SSD cache in
  /// front of a bucket.
  ///
  /// **Cost / apply:** gcp-cost: Cloud Storage `95FF-2EF5-5EA1` Rapid Cache
  /// Storage Iowa (`us-central1`) SKU `A668-3CA8-42C8` **$0.0001233/GiBy.h**.
  /// billing-behavior: cached bytes bill while the cache is enabled (plus
  /// ingest/data-transfer while warm); create is slow and destroy is a
  /// disable — too expensive / sticky for apply-smoke. **Never** wire into
  /// apply-smoke.
  ///
  /// MM marks [StorageAnywhereCacheAdmissionPolicy.admitOnSecondMiss]
  /// deprecated; prefer [StorageAnywhereCacheAdmissionPolicy.admitOnFirstMiss]
  /// (or omit).

prelude: |
  /// Terraform `admission_policy` for [GoogleStorageAnywhereCache].
  ///
  /// Values use hyphens on the wire (`admit-on-first-miss`); Dart names are
  /// camelCase. Prefer [admitOnFirstMiss] — [admitOnSecondMiss] is deprecated
  /// upstream and treated as first-miss by the backend.
  extension type const StorageAnywhereCacheAdmissionPolicy._(TfArg<String> _) implements TfArg<String> {
    StorageAnywhereCacheAdmissionPolicy.variable(String name) : this._(TfArg.variable(name));
    StorageAnywhereCacheAdmissionPolicy.expression(String template) : this._(TfArg.expression(template));
    const StorageAnywhereCacheAdmissionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const admitOnFirstMiss = StorageAnywhereCacheAdmissionPolicy._(TfArgLiteral('admit-on-first-miss'));
    static const admitOnSecondMiss = StorageAnywhereCacheAdmissionPolicy._(TfArgLiteral('admit-on-second-miss'));

    static const List<StorageAnywhereCacheAdmissionPolicy> values = [admitOnFirstMiss, admitOnSecondMiss];
  }

paramOrder:
  - bucket
  - zone
  - ttl
  - admission_policy
  - ingest_on_write
  - deletion_policy

deprecatedParams:
  admission_policy: '`admit-on-second-miss` is deprecated and will be removed in a future major release. The backend will ignore this attribute and treat it as `admit-on-first-miss`.'
