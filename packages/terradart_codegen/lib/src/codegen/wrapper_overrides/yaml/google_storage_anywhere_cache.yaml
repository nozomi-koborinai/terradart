outputDir: storage

deriveClassDoc: true
deriveOutputGetters: true
# admission_policy values contain hyphens (`admit-on-first-miss`) — keep as
# String rather than a derived enum with illegal Dart identifiers.

curatedDoc: |-
  /// Cloud Storage **Anywhere Cache** (Rapid Cache) — a zonal SSD cache in
  /// front of a bucket.
  ///
  /// **Cost / apply:** gcp-cost: Cloud Storage `95FF-2EF5-5EA1` Rapid Cache
  /// Storage Iowa (`us-central1`) SKU `A668-3CA8-42C8` **$0.0001233/GiBy.h**.
  /// billing-behavior: cached bytes bill while the cache is enabled (plus
  /// ingest/data-transfer while warm); create is slow and destroy is a
  /// disable — too expensive / sticky for apply-smoke. **Never** wire into
  /// apply-smoke.
  ///
  /// MM marks `admission_policy=admit-on-second-miss` deprecated; prefer
  /// `admit-on-first-miss` (or omit).

paramOrder:
  - bucket
  - zone
  - ttl
  - admission_policy
  - ingest_on_write
  - deletion_policy

deprecatedParams:
  admission_policy: '`admit-on-second-miss` is deprecated and will be removed in a future major release. The backend will ignore this attribute and treat it as `admit-on-first-miss`.'

extraGetters: |2
    /// Reference to `anywhere_cache_id`.
    TfRef<String> get anywhereCacheIdRef =>
        TfRef.attribute<String>(this, 'anywhere_cache_id');

    /// Reference to `id` attribute.
    TfRef<String> get idRef => TfRef.attribute<String>(this, 'id');
