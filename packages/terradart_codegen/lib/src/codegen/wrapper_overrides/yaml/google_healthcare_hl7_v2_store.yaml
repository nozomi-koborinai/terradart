outputDir: healthcare
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

extraImports:
  - "import 'package:meta/meta.dart';"

prelude: |
  /// HL7v2 message-schema version used by a [HealthcareHl7V2StoreParserConfig].
  enum HealthcareHl7V2StoreParserConfigVersion implements TerraformEnum {
    /// Legacy parser (V1).
    v1('V1'),

    /// V2 parser.
    v2('V2'),

    /// V3 parser (recommended).
    v3('V3');

    const HealthcareHl7V2StoreParserConfigVersion(this.terraformValue);
    @override
    final String terraformValue;
  }


paramOrder:
  - name
  - dataset
  - reject_duplicate_message
  - parser_config
  - labels
  - notification_config
  - notification_configs

dartTypeOverrides:
  parser_config.version: HealthcareHl7V2StoreParserConfigVersion
