outputDir: healthcare
deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true

extraImports:
  - "import 'package:meta/meta.dart';"

prelude: |
  /// HL7v2 message-schema version used by a [HealthcareHl7V2StoreParserConfig].
  extension type const HealthcareHl7V2StoreParserConfigVersion._(TfArg<String> _) implements TfArg<String> {
    HealthcareHl7V2StoreParserConfigVersion.variable(String name) : this._(TfArg.variable(name));
    HealthcareHl7V2StoreParserConfigVersion.expression(String template) : this._(TfArg.expression(template));
    const HealthcareHl7V2StoreParserConfigVersion.arg(TfArg<String> arg) : this._(arg);

    /// Legacy parser (V1).
    static const v1 = HealthcareHl7V2StoreParserConfigVersion._(TfArgLiteral('V1'));
    /// V2 parser.
    static const v2 = HealthcareHl7V2StoreParserConfigVersion._(TfArgLiteral('V2'));
    /// V3 parser (recommended).
    static const v3 = HealthcareHl7V2StoreParserConfigVersion._(TfArgLiteral('V3'));

    static const List<HealthcareHl7V2StoreParserConfigVersion> values = [v1, v2, v3];
  }


paramOrder:
  - name
  - dataset
  - reject_duplicate_message
  - parser_config
  - labels
  - notification_config
  - notification_configs

dartTypeOverrides:
  parser_config.version: HealthcareHl7V2StoreParserConfigVersion
