outputDir: network

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveNestedTypes: true
deriveEnums: true

extraImports:
  - "import 'package:meta/meta.dart';"

curatedDoc: |-
  /// Cloud Service Mesh **TLS route** — SNI/ALPN matchers that attach to
  /// a [GoogleNetworkServicesMesh] (or a gateway / target proxy). Config
  /// only until workloads join the mesh; do not attach a
  /// [GoogleNetworkServicesGateway] in apply-smoke (SWG is $1.25/h).

paramOrder:
  - name
  - rules
  - meshes
  - gateways
  - target_proxies
  - location
  - description
  - deletion_policy
  - project
