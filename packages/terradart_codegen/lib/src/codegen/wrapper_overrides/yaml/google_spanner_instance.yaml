outputDir: spanner

deriveClassDoc: true
deriveExactlyOne: true
deriveOutputGetters: true
deriveEnums: true
deriveNestedTypes: true

sealedNames:
  "autoscaling_config.asymmetric_autoscaling_options.overrides.autoscaling_limits.max_nodes, autoscaling_config.asymmetric_autoscaling_options.overrides.autoscaling_limits.max_processing_units": max
  "autoscaling_config.asymmetric_autoscaling_options.overrides.autoscaling_limits.min_nodes, autoscaling_config.asymmetric_autoscaling_options.overrides.autoscaling_limits.min_processing_units": min
  "autoscaling_config.autoscaling_limits.max_nodes, autoscaling_config.autoscaling_limits.max_processing_units": max
  "autoscaling_config.autoscaling_limits.min_nodes, autoscaling_config.autoscaling_limits.min_processing_units": min

paramOrder:
  - config
  - display_name
  - num_nodes
  - processing_units
  - edition
  - labels
  - default_backup_schedule_type
  - force_destroy
  - instance_type
  - name
  - project
  - autoscaling_config

dartTypeOverrides:
  edition: SpannerInstanceEdition

curatedDoc: |-
  /// Cloud Spanner instance — horizontally scalable relational database.
  ///
  /// Required identity:
  /// - [localName]: Terraform local name.
  /// - [config]: instance configuration name (e.g. `regional-asia-northeast1`).
  /// - [displayName]: user-visible label.
  ///
  /// Set exactly one of [numNodes] or [processingUnits] for capacity.
  ///
  /// Enable `spanner.googleapis.com` via [GoogleProjectService] before apply.
  ///
  /// Example:
  /// ```dart
  /// GoogleSpannerInstance(
  ///   localName: 'app',
  ///   config: .literal('regional-asia-northeast1'),
  ///   displayName: TfArg.literal('App Spanner'),
  ///   numNodes: TfArg.literal(1),
  /// );
  /// ```
