outputDir: compute

deriveClassDoc: true
deriveExactlyOne: true

curatedDoc: |-
  /// This resource models a regional subnetwork within a VPC.
  ///
  /// Required identity:
  /// - [localName]: Terraform local name.
  /// - `name`: GCP subnetwork name. Pass `TfArg.literal('main-subnet')` or
  ///   `otherSubnet.name`.
  /// - `network`: the parent VPC. Pass `vpc.ref` so the value resolves to
  ///   `${google_compute_network.<localName>.id}`.
  ///
  /// Secondary ranges ([secondaryIpRange]) define alias IP ranges consumed by
  /// GKE pods/services. Flow logs are configured via [logConfig]; not supported
  /// when `purpose` is `REGIONAL_MANAGED_PROXY` or `GLOBAL_MANAGED_PROXY`.
  /// Enable `privateIpGoogleAccess` to allow VMs without external IPs to reach
  /// Google APIs.
  ///
  /// Example:
  /// ```dart
  /// final vpc = GoogleComputeNetwork(
  ///   'main',
  ///   name: TfArg.literal('main-vpc'),
  ///   autoCreateSubnetworks: TfArg.literal(false),
  /// );
  /// final subnet = GoogleComputeSubnetwork(
  ///   'main_subnet',
  ///   name: TfArg.literal('main-subnet'),
  ///   region: TfArg.literal('us-central1'),
  ///   network: vpc.ref,
  ///   ipCidrRange: TfArg.literal('10.0.0.0/16'),
  ///   privateIpGoogleAccess: TfArg.literal(true),
  /// );
  /// ```

deriveNestedTypes: true
deriveOutputGetters: true

paramOrder:
  - name
  - region
  - network
  - ip_cidr_range
  - purpose
  - role
  - secondary_ip_range
  - private_ip_google_access
  - private_ipv6_google_access
  - log_config
  - stack_type
  - ipv6_access_type
  - external_ipv6_prefix
  - internal_ipv6_prefix
  - ip_collection
  - reserved_internal_range
  - resolve_subnet_mask
  - send_secondary_ip_range_if_empty
  - allow_subnet_cidr_routes_overlap
  - description
  - params
  - project

dartTypeOverrides:
  purpose: SubnetworkPurpose
  role: SubnetworkRole
  stack_type: SubnetworkStackType
  ipv6_access_type: SubnetworkIpv6AccessType
  resolve_subnet_mask: SubnetworkResolveSubnetMask

prelude: |
  /// Purpose of the subnetwork. Defaults to [private] when unspecified.
  ///
  /// `regionalManagedProxy` / `globalManagedProxy` reserve the subnet for
  /// Envoy-based load balancers (the [SubnetworkRole] field then selects
  /// ACTIVE vs BACKUP). `privateServiceConnect` reserves the subnet for a
  /// Private Service Connect published service. `peerMigration` reserves the
  /// subnet for migrating resources between peered networks. `privateNat` is
  /// used as the source range for Private NAT gateways.
  extension type const SubnetworkPurpose._(TfArg<String> _) implements TfArg<String> {
    SubnetworkPurpose.variable(String name) : this._(TfArg.variable(name));
    SubnetworkPurpose.expression(String template) : this._(TfArg.expression(template));
    const SubnetworkPurpose.arg(TfArg<String> arg) : this._(arg);

    static const private = SubnetworkPurpose._(TfArgLiteral('PRIVATE'));
    static const regionalManagedProxy = SubnetworkPurpose._(TfArgLiteral('REGIONAL_MANAGED_PROXY'));
    static const globalManagedProxy = SubnetworkPurpose._(TfArgLiteral('GLOBAL_MANAGED_PROXY'));
    static const privateServiceConnect = SubnetworkPurpose._(TfArgLiteral('PRIVATE_SERVICE_CONNECT'));
    static const peerMigration = SubnetworkPurpose._(TfArgLiteral('PEER_MIGRATION'));
    static const privateNat = SubnetworkPurpose._(TfArgLiteral('PRIVATE_NAT'));

    static const List<SubnetworkPurpose> values = [private, regionalManagedProxy, globalManagedProxy, privateServiceConnect, peerMigration, privateNat];
  }

  /// Role of a managed-proxy subnetwork. Only meaningful when `purpose` is
  /// `REGIONAL_MANAGED_PROXY` or `GLOBAL_MANAGED_PROXY`.
  extension type const SubnetworkRole._(TfArg<String> _) implements TfArg<String> {
    SubnetworkRole.variable(String name) : this._(TfArg.variable(name));
    SubnetworkRole.expression(String template) : this._(TfArg.expression(template));
    const SubnetworkRole.arg(TfArg<String> arg) : this._(arg);

    static const active = SubnetworkRole._(TfArgLiteral('ACTIVE'));
    static const backup = SubnetworkRole._(TfArgLiteral('BACKUP'));

    static const List<SubnetworkRole> values = [active, backup];
  }

  /// IP stack type for the subnetwork. Immutable after creation.
  extension type const SubnetworkStackType._(TfArg<String> _) implements TfArg<String> {
    SubnetworkStackType.variable(String name) : this._(TfArg.variable(name));
    SubnetworkStackType.expression(String template) : this._(TfArg.expression(template));
    const SubnetworkStackType.arg(TfArg<String> arg) : this._(arg);

    static const ipv4Only = SubnetworkStackType._(TfArgLiteral('IPV4_ONLY'));
    static const ipv4Ipv6 = SubnetworkStackType._(TfArgLiteral('IPV4_IPV6'));
    static const ipv6Only = SubnetworkStackType._(TfArgLiteral('IPV6_ONLY'));

    static const List<SubnetworkStackType> values = [ipv4Only, ipv4Ipv6, ipv6Only];
  }

  /// Access type of the IPv6 address range held by the subnetwork. Immutable
  /// after creation. Only meaningful when [SubnetworkStackType] includes IPv6.
  extension type const SubnetworkIpv6AccessType._(TfArg<String> _) implements TfArg<String> {
    SubnetworkIpv6AccessType.variable(String name) : this._(TfArg.variable(name));
    SubnetworkIpv6AccessType.expression(String template) : this._(TfArg.expression(template));
    const SubnetworkIpv6AccessType.arg(TfArg<String> arg) : this._(arg);

    static const internal = SubnetworkIpv6AccessType._(TfArgLiteral('INTERNAL'));
    static const external = SubnetworkIpv6AccessType._(TfArgLiteral('EXTERNAL'));

    static const List<SubnetworkIpv6AccessType> values = [internal, external];
  }

  /// VPC flow log aggregation interval. The default on GCP is
  /// [interval5Sec] (denser sampling, higher cost).
  extension type const SubnetworkLogConfigAggregationInterval._(TfArg<String> _) implements TfArg<String> {
    SubnetworkLogConfigAggregationInterval.variable(String name) : this._(TfArg.variable(name));
    SubnetworkLogConfigAggregationInterval.expression(String template) : this._(TfArg.expression(template));
    const SubnetworkLogConfigAggregationInterval.arg(TfArg<String> arg) : this._(arg);

    static const interval5Sec = SubnetworkLogConfigAggregationInterval._(TfArgLiteral('INTERVAL_5_SEC'));
    static const interval30Sec = SubnetworkLogConfigAggregationInterval._(TfArgLiteral('INTERVAL_30_SEC'));
    static const interval1Min = SubnetworkLogConfigAggregationInterval._(TfArgLiteral('INTERVAL_1_MIN'));
    static const interval5Min = SubnetworkLogConfigAggregationInterval._(TfArgLiteral('INTERVAL_5_MIN'));
    static const interval10Min = SubnetworkLogConfigAggregationInterval._(TfArgLiteral('INTERVAL_10_MIN'));
    static const interval15Min = SubnetworkLogConfigAggregationInterval._(TfArgLiteral('INTERVAL_15_MIN'));

    static const List<SubnetworkLogConfigAggregationInterval> values = [interval5Sec, interval30Sec, interval1Min, interval5Min, interval10Min, interval15Min];
  }

  /// VPC flow log metadata-inclusion mode. Pair `customMetadata` with the
  /// [ComputeSubnetworkLogConfig.metadataFields] selector.
  extension type const SubnetworkLogConfigMetadata._(TfArg<String> _) implements TfArg<String> {
    SubnetworkLogConfigMetadata.variable(String name) : this._(TfArg.variable(name));
    SubnetworkLogConfigMetadata.expression(String template) : this._(TfArg.expression(template));
    const SubnetworkLogConfigMetadata.arg(TfArg<String> arg) : this._(arg);

    static const includeAllMetadata = SubnetworkLogConfigMetadata._(TfArgLiteral('INCLUDE_ALL_METADATA'));
    static const excludeAllMetadata = SubnetworkLogConfigMetadata._(TfArgLiteral('EXCLUDE_ALL_METADATA'));
    static const customMetadata = SubnetworkLogConfigMetadata._(TfArgLiteral('CUSTOM_METADATA'));

    static const List<SubnetworkLogConfigMetadata> values = [includeAllMetadata, excludeAllMetadata, customMetadata];
  }

  /// ARP resolution mode for the subnetwork. Controls which ranges respond
  /// to ARP requests. Used only by reserved-internal-range subnetworks.
  extension type const SubnetworkResolveSubnetMask._(TfArg<String> _) implements TfArg<String> {
    SubnetworkResolveSubnetMask.variable(String name) : this._(TfArg.variable(name));
    SubnetworkResolveSubnetMask.expression(String template) : this._(TfArg.expression(template));
    const SubnetworkResolveSubnetMask.arg(TfArg<String> arg) : this._(arg);

    static const arpAllRanges = SubnetworkResolveSubnetMask._(TfArgLiteral('ARP_ALL_RANGES'));
    static const arpPrimaryRange = SubnetworkResolveSubnetMask._(TfArgLiteral('ARP_PRIMARY_RANGE'));
    static const arpBroadcastPrimaryRange = SubnetworkResolveSubnetMask._(TfArgLiteral('ARP_BROADCAST_PRIMARY_RANGE'));
    static const arpBroadcastPrimaryRangeWithLearning = SubnetworkResolveSubnetMask._(TfArgLiteral('ARP_BROADCAST_PRIMARY_RANGE_WITH_LEARNING'));

    static const List<SubnetworkResolveSubnetMask> values = [arpAllRanges, arpPrimaryRange, arpBroadcastPrimaryRange, arpBroadcastPrimaryRangeWithLearning];
  }

  // ===========================================================================
  // Nested-block helper classes
  // ===========================================================================

  /// One `secondary_ip_range` entry. Defines an alias IP range usable by
  /// instances in this subnetwork (typically consumed by GKE pods/services).
  @immutable
  class ComputeSubnetworkSecondaryIpRange {
    const ComputeSubnetworkSecondaryIpRange({
      required this.rangeName,
      this.ipCidrRange,
      this.reservedInternalRange,
    });

    /// Name of the secondary range (referenced from downstream resources like
    /// GKE node pools).
    final TfArg<String> rangeName;

    /// CIDR of the secondary range (e.g. `10.1.0.0/16`). Required unless
    /// [reservedInternalRange] is set.
    final TfArg<String>? ipCidrRange;

    /// Optional reserved internal range path. Mutually exclusive with
    /// [ipCidrRange] in most configurations.
    final TfArg<String>? reservedInternalRange;

    Map<String, Object?> toArgMap() => {
      'range_name': rangeName.toTfJson(),
      if (ipCidrRange != null) 'ip_cidr_range': ipCidrRange!.toTfJson(),
      if (reservedInternalRange != null)
        'reserved_internal_range': reservedInternalRange!.toTfJson(),
    };
  }

  /// `log_config` block. Enables VPC flow logs for the subnetwork. Flow
  /// logging is not supported when the subnetwork `purpose` is
  /// `REGIONAL_MANAGED_PROXY` or `GLOBAL_MANAGED_PROXY`.
  @immutable
  class ComputeSubnetworkLogConfig {
    const ComputeSubnetworkLogConfig({
      this.aggregationInterval,
      this.flowSampling,
      this.metadata,
      this.metadataFields,
      this.filterExpr,
    });

    /// Toggles between dense and sparse aggregation. Defaults to
    /// `INTERVAL_5_SEC` on GCP.
    final SubnetworkLogConfigAggregationInterval? aggregationInterval;

    /// Fraction of packets to sample, between 0.0 and 1.0.
    final TfArg<num>? flowSampling;

    /// Metadata-inclusion mode. Use `customMetadata` to scope via
    /// [metadataFields].
    final SubnetworkLogConfigMetadata? metadata;

    /// Metadata field names included when [metadata] is `customMetadata`.
    final TfArg<List<String>>? metadataFields;

    /// CEL expression filtering which logs to export.
    final TfArg<String>? filterExpr;

    Map<String, Object?> toArgMap() => {
      if (aggregationInterval != null)
        'aggregation_interval': aggregationInterval!.toTfJson(),
      if (flowSampling != null) 'flow_sampling': flowSampling!.toTfJson(),
      if (metadata != null) 'metadata': metadata!.toTfJson(),
      if (metadataFields != null)
        'metadata_fields': metadataFields!.toTfJson(),
      if (filterExpr != null) 'filter_expr': filterExpr!.toTfJson(),
    };
  }

extraImports:
  - "import 'package:meta/meta.dart';"

customSlots:
  secondary_ip_range:
    paramDeclaration: "List<ComputeSubnetworkSecondaryIpRange>? secondaryIpRange"
    argMapEntry: "if (secondaryIpRange != null) 'secondary_ip_range': TfArg.literal(secondaryIpRange.map((s) => s.toArgMap()).toList()),"
  log_config:
    paramDeclaration: "ComputeSubnetworkLogConfig? logConfig"
    argMapEntry: "if (logConfig != null) 'log_config': TfArg.literal([logConfig.toArgMap()]),"
