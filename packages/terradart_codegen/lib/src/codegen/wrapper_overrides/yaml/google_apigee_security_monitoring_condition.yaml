outputDir: apigee
deriveClassDoc: true
deriveOutputGetters: true
deriveEnums: true

curatedDoc: |-
  /// Apigee **security monitoring condition** — Advanced API Security
  /// config metadata that names a profile and environment scope.
  /// Creating the condition does **not** process API requests, create
  /// an organization, or enable the add-on.
  ///
  /// Prefer a thin smoke stack: placeholder [orgId]
  /// `organizations/demo-org`, [profile] and [scope] environment IDs,
  /// and [conditionId] `terradart-smc`. Set [deletionPolicy] to
  /// `DELETE`. The provider requires empty
  /// [includeAllResources] (`include_all_resources {}`); the GA
  /// sibling `include` block is not shipped yet.
  ///
  /// `apigee_quickstart` is apply-smoke skipped (needs a live Apigee
  /// org), so this factory is synth + `terraform validate` only.
  ///
  /// Example:
  /// ```dart
  /// GoogleApigeeSecurityMonitoringCondition(
  ///   localName: 'demo_smc',
  ///   conditionId: TfArg.literal('terradart-smc'),
  ///   orgId: TfArg.literal('organizations/demo-org'),
  ///   profile: TfArg.literal('demo-profile'),
  ///   scope: TfArg.literal('demo-env'),
  ///   deletionPolicy: TfArg.literal('DELETE'),
  /// );
  /// ```

paramOrder:
  - condition_id
  - org_id
  - profile
  - scope
  - include_all_resources
  - deletion_policy

prelude: |
  /// Empty `include_all_resources {}` block required by the provider
  /// (`exactly_one_of` with one live member; sibling `include` is not
  /// shipped yet).
  final class ApigeeSecurityMonitoringConditionIncludeAllResources {
    const ApigeeSecurityMonitoringConditionIncludeAllResources();

    List<Map<String, Object?>> encode() => [{}];
  }

customSlots:
  include_all_resources:
    paramDeclaration: 'ApigeeSecurityMonitoringConditionIncludeAllResources includeAllResources = const ApigeeSecurityMonitoringConditionIncludeAllResources()'
    argMapEntry: "'include_all_resources': TfArg.literal(includeAllResources.encode()),"
