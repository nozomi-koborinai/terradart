outputDir: migration

deriveClassDoc: true
deriveExactlyOne: true
deriveNestedTypes: true
deriveOutputGetters: true

curatedDoc: |-
  /// Migration Center regional settings singleton (preference set default, logging).
  ///
  /// Enable `migrationcenter.googleapis.com` before apply. One settings resource
  /// exists per project location.

paramOrder:
  - location
  - preference_set
  - disable_cloud_logging
  - deletion_policy
  - project

prelude: |
  /// Terraform `deletion_policy` for Migration Center settings.
  extension type const MigrationCenterSettingsDeletionPolicy._(TfArg<String> _) implements TfArg<String> {
    MigrationCenterSettingsDeletionPolicy.variable(String name) : this._(TfArg.variable(name));
    MigrationCenterSettingsDeletionPolicy.expression(String template) : this._(TfArg.expression(template));
    const MigrationCenterSettingsDeletionPolicy.arg(TfArg<String> arg) : this._(arg);

    static const delete = MigrationCenterSettingsDeletionPolicy._(TfArgLiteral('DELETE'));
    static const prevent = MigrationCenterSettingsDeletionPolicy._(TfArgLiteral('PREVENT'));
    static const abandon = MigrationCenterSettingsDeletionPolicy._(TfArgLiteral('ABANDON'));

    static const List<MigrationCenterSettingsDeletionPolicy> values = [delete, prevent, abandon];
  }

dartTypeOverrides:
  deletion_policy: MigrationCenterSettingsDeletionPolicy
