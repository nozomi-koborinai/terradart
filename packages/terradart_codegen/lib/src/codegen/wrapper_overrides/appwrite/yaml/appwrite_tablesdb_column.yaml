outputDir: tablesdb
deriveClassDoc: true
deriveOutputGetters: true
deriveEnums: true
deriveExactlyOne: true

# `default` and `required` are Dart reserved / contextual keywords — virtual
# slots keep the constructor parseable (`defaultValue`, `columnRequired`).
paramOrder:
  - database_id
  - table_id
  - type
  - key
  - columnRequired
  - defaultValue
  - size
  - array
  - elements
  - encrypt
  - float_max
  - float_min
  - max
  - min
  - on_delete
  - related_table_id
  - relationship_type
  - two_way
  - two_way_key
  - project_id

customSlots:
  defaultValue:
    paramDeclaration: 'TfArg<String>? defaultValue'
    argMapEntry: "if (defaultValue != null) 'default': defaultValue,"
  columnRequired:
    paramDeclaration: 'TfArg<bool>? columnRequired'
    argMapEntry: "if (columnRequired != null) 'required': columnRequired,"

# The provider enforces this set (`allColumnTypes`) in Create's `switch`, not
# with a validator, so tool/extract_provider_hints.dart cannot see it.
# Re-check internal/services/column/resource.go when the pin moves.
prelude: |
  /// Tablesdb Column enum for `type`.
  extension type const TablesdbColumnType._(TfArg<String> _) implements TfArg<String> {
    TablesdbColumnType.variable(String name) : this._(TfArg.variable(name));
    TablesdbColumnType.expression(String template) : this._(TfArg.expression(template));
    const TablesdbColumnType.arg(TfArg<String> arg) : this._(arg);

    static const varchar = TablesdbColumnType._(TfArgLiteral('varchar'));
    static const text = TablesdbColumnType._(TfArgLiteral('text'));
    static const longtext = TablesdbColumnType._(TfArgLiteral('longtext'));
    static const mediumtext = TablesdbColumnType._(TfArgLiteral('mediumtext'));
    static const integer = TablesdbColumnType._(TfArgLiteral('integer'));
    static const bigint = TablesdbColumnType._(TfArgLiteral('bigint'));
    static const float = TablesdbColumnType._(TfArgLiteral('float'));
    static const boolean = TablesdbColumnType._(TfArgLiteral('boolean'));
    static const enumCase = TablesdbColumnType._(TfArgLiteral('enum'));
    static const email = TablesdbColumnType._(TfArgLiteral('email'));
    static const datetime = TablesdbColumnType._(TfArgLiteral('datetime'));
    static const url = TablesdbColumnType._(TfArgLiteral('url'));
    static const ip = TablesdbColumnType._(TfArgLiteral('ip'));
    static const point = TablesdbColumnType._(TfArgLiteral('point'));
    static const line = TablesdbColumnType._(TfArgLiteral('line'));
    static const polygon = TablesdbColumnType._(TfArgLiteral('polygon'));
    static const relationship = TablesdbColumnType._(TfArgLiteral('relationship'));
    static const string = TablesdbColumnType._(TfArgLiteral('string'));

    static const List<TablesdbColumnType> values = [varchar, text, longtext, mediumtext, integer, bigint, float, boolean, enumCase, email, datetime, url, ip, point, line, polygon, relationship, string];
  }

dartTypeOverrides:
  type: TablesdbColumnType
