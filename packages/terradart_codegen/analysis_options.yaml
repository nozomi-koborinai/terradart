include: package:lints/recommended.yaml

analyzer:
  exclude:
    # Golden files are expected emitter output, consumed by string equality.
    # They contain `# ignore` directives and other stylistic markers that the
    # analyser would otherwise flag.
    - 'test/golden/**'
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    - prefer_relative_imports
    - directives_ordering
    - prefer_const_constructors
    - avoid_print
