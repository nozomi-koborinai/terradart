name: terradart_codegen
description: terradart maintainer tooling — parses Terraform provider schema JSON and Magic Modules YAML and emits curated factory wrappers via terradart wrap. Ships the terradart CLI.
version: 0.21.0
homepage: https://github.com/nozomi-koborinai/terradart
repository: https://github.com/nozomi-koborinai/terradart
issue_tracker: https://github.com/nozomi-koborinai/terradart/issues
documentation: https://github.com/nozomi-koborinai/terradart#readme

topics:
  - terraform
  - infrastructure
  - codegen
  - google-cloud

environment:
  sdk: ^3.6.0

# Upstream Magic Modules test fixtures include reCAPTCHA site keys that trip
# pub.dev's secret scanner (false positive: "AWS Secret Key").
false_secrets:
  - /test/fixtures/**

resolution: workspace

executables:
  terradart: terradart

dependencies:
  args: ^2.5.0
  io: ^1.0.4
  yaml: ^3.1.2
  path: ^1.9.0
  meta: ^1.15.0
  dart_style: ^3.0.0
  stack_trace: ^1.11.1
  terradart_core: ^0.21.0

dev_dependencies:
  http: ^1.0.0
  lints: ^6.0.0
  pub_semver: ^2.1.0
  test: ^1.25.6
