name: terradart_coverage
description: Read-only Terraform coverage checker — reports how much of a Terraform config is covered by curated TerraDart factories (google, google-beta, appwrite, cloudflare, aws).
version: 0.29.0
publish_to: none
homepage: https://github.com/nozomi-koborinai/terradart
repository: https://github.com/nozomi-koborinai/terradart
issue_tracker: https://github.com/nozomi-koborinai/terradart/issues

environment:
  sdk: ^3.10.0

resolution: workspace

executables:
  terradart-coverage: terradart_coverage

dependencies:
  terradart_google: ^0.29.0
  terradart_google_beta: ^0.29.0
  terradart_appwrite: ^0.29.0
  terradart_cloudflare: ^0.29.0
  terradart_aws: ^0.29.0
  terradart_hcl: ^0.29.0
  args: ^2.5.0

dev_dependencies:
  terradart_core: ^0.29.0
  terradart_time: ^0.29.0
  lints: ^6.0.0
  test: ^1.25.6
