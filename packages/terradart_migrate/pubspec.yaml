name: terradart_migrate
description: HCL → Dart migrator for existing Terraform users (terradart-migrate) — turns Terraform modules into TerraDart Stacks via the curated catalogs.
version: 0.32.0
homepage: https://github.com/nozomi-koborinai/terradart
repository: https://github.com/nozomi-koborinai/terradart
issue_tracker: https://github.com/nozomi-koborinai/terradart/issues

environment:
  sdk: ^3.10.0

resolution: workspace

executables:
  terradart-migrate: terradart_migrate

dependencies:
  args: ^2.4.0
  dart_style: ^3.0.0
  path: ^1.9.0
  terradart_appwrite: ^0.32.0
  terradart_aws: ^0.32.0
  terradart_cloudflare: ^0.32.0
  terradart_core: ^0.32.0
  terradart_google: ^0.32.0
  terradart_google_beta: ^0.32.0
  terradart_hcl: ^0.32.0
  terradart_time: ^0.32.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
