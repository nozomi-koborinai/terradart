# Path-based labels for pull requests (actions/labeler@v5).

'area:core':
  - changed-files:
      - any-glob-to-any-file: 'packages/terradart_core/**'

'area:codegen':
  - changed-files:
      - any-glob-to-any-file: 'packages/terradart_codegen/**'

'area:google':
  - changed-files:
      - any-glob-to-any-file: 'packages/terradart_google/**'

'area:google-beta':
  - changed-files:
      - any-glob-to-any-file:
          - 'packages/terradart_google_beta/**'
          - 'packages/terradart_codegen/lib/src/codegen/wrapper_overrides/google_beta/**'
          - 'packages/terradart_codegen/test/fixtures/wrap/source_beta/**'
          - 'examples/beta_*_quickstart/**'

'area:appwrite':
  - changed-files:
      - any-glob-to-any-file:
          - 'packages/terradart_appwrite/**'
          - 'packages/terradart_codegen/lib/src/codegen/wrapper_overrides/appwrite/**'
          - 'packages/terradart_codegen/test/fixtures/wrap/source_appwrite/**'

'area:cloudflare':
  - changed-files:
      - any-glob-to-any-file:
          - 'packages/terradart_cloudflare/**'
          - 'packages/terradart_codegen/lib/src/codegen/wrapper_overrides/cloudflare/**'
          - 'packages/terradart_codegen/test/fixtures/wrap/source_cloudflare/**'
          - 'examples/cloudflare_dns_quickstart/**'
          - 'examples/cloudflare_leftover_quickstart/**'

'area:aws':
  - changed-files:
      - any-glob-to-any-file:
          - 'packages/terradart_aws/**'
          - 'packages/terradart_codegen/lib/src/codegen/wrapper_overrides/aws/**'
          - 'packages/terradart_codegen/test/fixtures/wrap/source_aws/**'
          - 'examples/aws_*_quickstart/**'

'area:agent':
  - changed-files:
      - any-glob-to-any-file:
          - 'skills/**'
          - 'website/src/content/docs/docs/agents.md'

'area:migrate':
  - changed-files:
      - any-glob-to-any-file:
          - 'packages/terradart_migrate/**'
          - 'tool/migrate_*_gates.dart'
          - 'tool/migrate_*_debt.yaml'
          - 'website/src/content/docs/docs/migrate-from-hcl.md'

'area:hcl':
  - changed-files:
      - any-glob-to-any-file: 'packages/terradart_hcl/**'

'area:time':
  - changed-files:
      - any-glob-to-any-file: 'packages/terradart_time/**'

'area:website':
  - changed-files:
      - any-glob-to-any-file: 'website/**'

'area:tool':
  - changed-files:
      - any-glob-to-any-file:
          - 'tool/**'
          - 'examples/**'

'area:ci':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/ISSUE_TEMPLATE/**'

'area:docs':
  - changed-files:
      - any-glob-to-any-file:
          - 'AGENTS.md'
          - 'CONTEXT.md'
          - 'README.md'
          - 'MIGRATING.md'
          - 'CLAUDE.md'
          - 'CONTRIBUTING.md'
          - 'RELEASE.md'
          - '.cursor/**'
          - '.claude/**'
          - '.agents/**'
