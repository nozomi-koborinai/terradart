name: Bug report
description: Something doesn't work as documented or expected.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file. terradart is **alpha** on
        **0.26.x** today. Single-maintainer;
        triage is best-effort. See https://terradart.dev/docs/status/

        **PII note**: synthesized `.tf.json`, error output, and schema excerpts
        may contain GCP project IDs, GCS bucket names, service account emails,
        or secret names. Please redact before pasting
        (e.g. `my-prod-1234` → `REDACTED-PROJECT`). If redacting is difficult,
        use the [private security advisory](https://github.com/nozomi-koborinai/terradart/security/advisories/new) instead.

  - type: input
    id: terradart_version
    attributes:
      label: terradart version
      placeholder: "0.12.0"
    validations:
      required: false

  - type: input
    id: dart_version
    attributes:
      label: Dart SDK version
      placeholder: "3.10.0"
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: What happened?
      description: What did you expect instead? Include a failing Dart stack trace or terraform output if applicable. Remember to redact PII.
      render: dart
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal commands / Dart code to reproduce.
    validations:
      required: true
