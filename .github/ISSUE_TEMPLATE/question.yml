name: Question
description: Ask how to use terradart or clarify expected behavior.
title: "[question] "
labels: ["question", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to ask. terradart is **alpha** on
        **0.26.x** today. Single-maintainer;
        triage is best-effort. See https://terradart.dev/docs/status/

        Docs: https://terradart.dev/docs/getting-started/

  - type: input
    id: terradart_version
    attributes:
      label: terradart version
      placeholder: "0.12.0"
    validations:
      required: false

  - type: input
    id: dart_version
    attributes:
      label: Dart SDK version
      placeholder: "3.10.0"
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: Your question
      description: What are you trying to do? Include a minimal Dart snippet if it helps.
      render: dart
    validations:
      required: true
