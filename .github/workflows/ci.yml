name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    name: select examples
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.sel.outputs.examples }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Select examples to validate
        id: sel
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Selection logic lives in tested Dart
          # (tool/select_changed_examples.dart + its unit test) — an earlier
          # awk regex here once fanned a pubspec-only bump out to every
          # example, a real GCP-cost leak. The shell only feeds it the git
          # diff. The script is dart:core-only, so no `dart pub get` needed.
          if [ "$EVENT" = 'pull_request' ]; then
            base="${BASE_SHA:-origin/main}"
            json="$(git diff --name-only "$base" HEAD \
              | dart tool/select_changed_examples.dart --event "$EVENT")"
          else
            json="$(dart tool/select_changed_examples.dart --event "$EVENT" < /dev/null)"
          fi
          echo "examples=$json" >> "$GITHUB_OUTPUT"
          echo "selected=$json"

  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [terradart_core, terradart_codegen, terradart_google, terradart_google_beta, terradart_appwrite, terradart_cloudflare, terradart_agent, terradart_coverage, terradart_hcl, terradart_migrate]
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      # Format check is scoped to the hand-written packages (terradart_core,
      # terradart_codegen, terradart_agent) because
      # terradart_google wrappers are formatted by `terradart wrap`'s pinned
      # dart_style (3.1.9), which can drift from the SDK-bundled `dart format`
      # CLI. wrap CLI output is the authoritative format for generated wrappers
      # and is guarded by the `wrap_check` job (`terradart wrap --check`).
      - if: matrix.package == 'terradart_core'
        run: dart format --output=none --set-exit-if-changed packages/terradart_core/ packages/terradart_codegen/ packages/terradart_agent/ packages/terradart_coverage/ packages/terradart_hcl/ packages/terradart_migrate/
      - if: matrix.package == 'terradart_core'
        run: dart analyze packages/ tool/ --fatal-infos --fatal-warnings
      - if: matrix.package == 'terradart_core'
        run: dart test tool/render_formula_test.dart tool/render_to_file_test.dart tool/select_changed_examples_test.dart tool/check_bump_scope_test.dart tool/extract_schema_subset_test.dart tool/generate_drift_report_test.dart
      - run: dart test --reporter=github
        working-directory: packages/${{ matrix.package }}

  apply_smoke_selection_test:
    name: apply_smoke.sh selection test
    runs-on: ubuntu-latest
    # Selection + skip-list + cost-ledger tests (no live GCP). A broken awk
    # regex once fanned a pubspec-only bump out to every example. The cost
    # gate (test 9) reads tf-out/main.tf.json, which is
    # gitignored, so example_synth_gates synths every example once (also running
    # the coverage + API-enablement gates); the topology and cost gates reuse
    # those tf-outs instead of re-synthing. terraform validate is skipped here —
    # the per-example terraform_validate matrix covers it.
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Synth all examples + coverage/API gates (populates tf-out)
        run: dart tool/example_synth_gates.dart --skip-validate
      - name: Topology gate (reuses tf-out)
        run: dart tool/check_example_topology.dart --reuse-tf-out
      - name: Coverage page freshness (reuses tf-out)
        run: dart tool/render_coverage_page.dart --check
      - run: bash tool/apply_smoke_test.sh

  wrap_check:
    name: terradart wrap --check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Verify generated wrappers are up to date
        working-directory: packages/terradart_codegen
        run: |
          dart run bin/terradart.dart wrap \
            --provider hashicorp/google \
            --source test/fixtures/wrap/source \
            --output ../terradart_google/lib/src \
            --migrate-manifest ../terradart_migrate/lib/src/manifest/google.g.dart \
            --check
      # Per-provider lanes beyond GA google — coordinates in
      # tool/providers.yaml. A lane that lives only in agent_verify.sh
      # rots silently (the documented override_gates lesson).
      - name: Verify generated google-beta wrappers are up to date
        working-directory: packages/terradart_codegen
        run: |
          dart run bin/terradart.dart wrap \
            --provider hashicorp/google-beta \
            --source test/fixtures/wrap/source_beta \
            --output ../terradart_google_beta/lib/src \
            --overrides-root lib/src/codegen/wrapper_overrides/google_beta/yaml \
            --barrels-manifest lib/src/codegen/barrels/barrels_google_beta.yaml \
            --resource-provider google-beta \
            --migrate-manifest ../terradart_migrate/lib/src/manifest/google_beta.g.dart \
            --check
      - name: Verify generated appwrite wrappers are up to date
        working-directory: packages/terradart_codegen
        run: |
          dart run bin/terradart.dart wrap \
            --provider appwrite/appwrite \
            --source test/fixtures/wrap/source_appwrite \
            --output ../terradart_appwrite/lib/src \
            --overrides-root lib/src/codegen/wrapper_overrides/appwrite/yaml \
            --barrels-manifest lib/src/codegen/barrels/barrels_appwrite.yaml \
            --migrate-manifest ../terradart_migrate/lib/src/manifest/appwrite.g.dart \
            --check
      - name: Verify generated cloudflare wrappers are up to date
        working-directory: packages/terradart_codegen
        run: |
          dart run bin/terradart.dart wrap \
            --provider cloudflare/cloudflare \
            --source test/fixtures/wrap/source_cloudflare \
            --output ../terradart_cloudflare/lib/src \
            --overrides-root lib/src/codegen/wrapper_overrides/cloudflare/yaml \
            --barrels-manifest lib/src/codegen/barrels/barrels_cloudflare.yaml \
            --migrate-manifest ../terradart_migrate/lib/src/manifest/cloudflare.g.dart \
            --check

  override_gates:
    name: override gates (lint, enum gaps, MM fingerprint)
    runs-on: ubuntu-latest
    # These three gates previously lived ONLY in tool/agent_verify.sh — when
    # nobody ran the full local gate, they silently rotted (enum-gap failures
    # accumulated across Waves 42-77 with CI staying green). Running them per
    # PR closes that structural hole; they are all seconds-cheap.
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: terradart lint-override
        working-directory: packages/terradart_codegen
        run: dart run bin/terradart.dart lint-override
      - name: check_override_enum_gaps (+ debt ledger staleness)
        run: dart tool/check_override_enum_gaps.dart --strict-nested
      - name: check_mm_upstream_fingerprint
        run: dart tool/check_mm_upstream_fingerprint.dart

  publish_dry_run:
    name: pub publish --dry-run (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: test
    # Pre-merge dry-run catches what previously broke publish AFTER merge:
    # MM/cert fixtures tripping pub.dev's secret scanner (fixed reactively in
    # 0.12.5 and 0.12.11 by adding false_secrets). terradart_agent is excluded
    # — it ships as a brew binary, not a pub.dev package.
    strategy:
      fail-fast: false
      matrix:
        package: [terradart_core, terradart_codegen, terradart_google]
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: pub publish --dry-run
        working-directory: packages/${{ matrix.package }}
        run: dart pub publish --dry-run

  wrap_init_check:
    name: terradart wrap-init smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: wrap-init determinism + loader invariant
        working-directory: packages/terradart_codegen
        run: dart test --run-skipped -t e2e --name 'wrap-init'

  wrap_promote_check:
    name: terradart wrap-promote smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: wrap-promote determinism (L4)
        working-directory: packages/terradart_codegen
        run: dart test --run-skipped -t e2e --name 'wrap-promote'

  terraform_validate:
    name: terraform validate (${{ matrix.example }})
    runs-on: ubuntu-latest
    needs: [test, changes]
    # Skip entirely when no relevant example changed (the gate job below still
    # runs and reports success, so the required-check status stays satisfied).
    if: needs.changes.outputs.examples != '[]'
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
      # tf-out is regenerated every run and its .terraform.lock.hcl is
      # gitignored, so `terraform init` never has a lock file to verify cached
      # providers against — and without this opt-in Terraform ignores the
      # cache and downloads ~100 MB per leg from releases.hashicorp.com. A
      # registry hiccup then fails the whole matrix (two legs on #647,
      # 2026-09-06: "connection reset by peer"). Validate-only, no state, so
      # the "may break the lock file" caveat has nothing to break.
      TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE: "1"
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.changes.outputs.examples) }}
    steps:
      - name: Job start
        id: job_start
        run: echo "started_ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.2"
      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          # A cache entry is immutable per key, and synth writes the floating
          # constraint `~> 7.0`, so `terraform init` resolves the NEWEST
          # provider release while a key derived from the pinned metadata
          # never changed: the entry went stale on the first upstream release
          # and every leg then restored it, missed, downloaded, and could not
          # save ("Cache hit occurred on the primary key, not saving"). Key on
          # the run instead: each run saves what it downloaded (the first leg
          # to finish wins), and the next run restores the newest entry via
          # the prefix, so a provider release costs one run of downloads.
          key: tfplugins-${{ runner.os }}-${{ github.run_id }}
          restore-keys: tfplugins-${{ runner.os }}-
      - name: Ensure plugin cache dir exists
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Setup checkpoint
        id: after_setup
        run: echo "ts_ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"

      - name: Workspace pub get
        id: pub_get_workspace
        run: |
          start=$(date +%s%N)
          dart pub get
          echo "duration_ms=$(( ($(date +%s%N) - start) / 1000000 ))" >> "$GITHUB_OUTPUT"

      - name: Example pub get
        id: pub_get_example
        working-directory: examples/${{ matrix.example }}_quickstart
        run: |
          start=$(date +%s%N)
          dart pub get
          echo "duration_ms=$(( ($(date +%s%N) - start) / 1000000 ))" >> "$GITHUB_OUTPUT"

      - name: Synth
        id: synth
        working-directory: examples/${{ matrix.example }}_quickstart
        env:
          GCP_PROJECT_ID: ci-test-project-id
          DB_PASSWORD: ci-test-secret
        run: |
          start=$(date +%s%N)
          dart run bin/infra.dart
          echo "duration_ms=$(( ($(date +%s%N) - start) / 1000000 ))" >> "$GITHUB_OUTPUT"

      - name: Terraform validate
        id: tf_validate
        working-directory: examples/${{ matrix.example }}_quickstart/tf-out
        run: |
          start=$(date +%s%N)
          terraform fmt -check
          terraform init -backend=false
          terraform validate
          echo "duration_ms=$(( ($(date +%s%N) - start) / 1000000 ))" >> "$GITHUB_OUTPUT"

      - name: Phase 5.0 timing summary
        if: always()
        run: |
          job_start_ns="${{ steps.job_start.outputs.started_ns }}"
          after_setup_ns="${{ steps.after_setup.outputs.ts_ns }}"
          setup_ms=$(( (after_setup_ns - job_start_ns) / 1000000 ))
          {
            echo "### ${{ matrix.example }}_quickstart timing"
            echo ""
            echo "| Step | Duration (ms) |"
            echo "|---|---|"
            echo "| Setup (checkout + Dart + Terraform install) | $setup_ms |"
            echo "| Workspace \`pub get\` | ${{ steps.pub_get_workspace.outputs.duration_ms }} |"
            echo "| Example \`pub get\` | ${{ steps.pub_get_example.outputs.duration_ms }} |"
            echo "| Synth (\`dart run bin/infra.dart\`) | ${{ steps.synth.outputs.duration_ms }} |"
            echo "| \`terraform fmt + init + validate\` | ${{ steps.tf_validate.outputs.duration_ms }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  terraform_validate_gate:
    name: terraform validate gate
    runs-on: ubuntu-latest
    needs: [changes, test, terraform_validate]
    if: always()
    # Stable, always-present check that aggregates the dynamic validate matrix,
    # so a PR that validates a subset — or none — still presents a green
    # check. `skipped` is a pass ONLY when nothing was selected: the matrix is
    # also skipped when `test` fails (it `needs: test`), and that must not
    # read as "validated".
    steps:
      - name: Aggregate terraform validate result
        env:
          CHANGES: ${{ needs.changes.result }}
          TESTS: ${{ needs.test.result }}
          RESULT: ${{ needs.terraform_validate.result }}
          SELECTED: ${{ needs.changes.outputs.examples }}
        run: |
          echo "selected examples: $SELECTED"
          echo "changes: $CHANGES / test: $TESTS / terraform_validate: $RESULT"
          if [ "$CHANGES" != 'success' ]; then
            echo "::error::example-selection job did not succeed ($CHANGES)"
            exit 1
          fi
          if [ "$TESTS" != 'success' ]; then
            echo "::error::package tests did not succeed ($TESTS), so the validate matrix never ran"
            exit 1
          fi
          case "$RESULT" in
            success) echo "gate: PASS"; exit 0 ;;
            skipped)
              if [ "$SELECTED" = '[]' ]; then
                echo "gate: PASS (no example selected)"; exit 0
              fi
              echo "::error::terraform validate was skipped although examples were selected"
              exit 1 ;;
            *) echo "::error::terraform validate did not pass (result=$RESULT)"; exit 1 ;;
          esac

  migrate_roundtrip:
    name: migrate round-trip gate
    runs-on: ubuntu-latest
    needs: test
    # The migrator's correctness oracle (#660): synthesize every quickstart,
    # migrate the tf.json back to Dart with terradart_migrate, analyze the
    # generated Stacks once, re-synthesize and deep-compare. Strict examples
    # must round-trip completely; tool/migrate_roundtrip_debt.yaml ratchets
    # the reasoned exceptions.
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Synthesize every quickstart (no terraform)
        run: dart tool/example_synth_gates.dart --skip-validate
      - name: Migrate and re-synthesize
        run: dart tool/migrate_roundtrip_gates.dart --reuse-tf-out

  migrate_fixtures:
    name: migrate fixture gate
    runs-on: ubuntu-latest
    needs: test
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    # The migrator's end-to-end acceptance (#661): terradart-migrate the
    # coverage fixtures config_tree/ (two environment roots over six local
    # modules) and real_plan_src/ (a root with a child), analyze and
    # synthesize the generated package, and terraform-validate every
    # directory of the mirrored tf-out/ tree — Stack synth output next to the
    # leftover sidecar. Every kept block must have landed in a sidecar file.
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.2"
      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tfplugins-${{ runner.os }}-${{ github.run_id }}
          restore-keys: tfplugins-${{ runner.os }}-
      - name: Ensure plugin cache dir exists
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - run: dart pub get
      - name: Migrate, synthesize and validate the fixtures
        run: dart tool/migrate_fixture_gates.dart

  ci_gate:
    name: ci gate
    runs-on: ubuntu-latest
    needs:
      - changes
      - test
      - apply_smoke_selection_test
      - wrap_check
      - migrate_roundtrip
      - migrate_fixtures
      - override_gates
      - publish_dry_run
      - wrap_init_check
      - wrap_promote_check
      - terraform_validate_gate
    if: always()
    # The one check branch protection should require. Requiring individual
    # job names let the required set drift: the cost gate
    # (apply_smoke_selection_test), four of the eight package test legs, and
    # the publish dry-runs were never required, so a PR with any of them red
    # — or still pending — could auto-merge. Every job must be `success`;
    # `skipped` counts as failure because a job skipped by a failed
    # dependency has not proven anything.
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: |
            select examples=${{ needs.changes.result }}
            test=${{ needs.test.result }}
            apply_smoke.sh selection test=${{ needs.apply_smoke_selection_test.result }}
            terradart wrap --check=${{ needs.wrap_check.result }}
            migrate round-trip gate=${{ needs.migrate_roundtrip.result }}
            migrate fixture gate=${{ needs.migrate_fixtures.result }}
            override gates=${{ needs.override_gates.result }}
            pub publish --dry-run=${{ needs.publish_dry_run.result }}
            terradart wrap-init smoke=${{ needs.wrap_init_check.result }}
            terradart wrap-promote smoke=${{ needs.wrap_promote_check.result }}
            terraform validate gate=${{ needs.terraform_validate_gate.result }}
        run: |
          fail=0
          while IFS='=' read -r job result; do
            [ -n "$job" ] || continue
            if [ "$result" = 'success' ]; then
              echo "ok    $job"
            else
              echo "::error::$job: $result"
              fail=1
            fi
          done <<< "$RESULTS"
          [ "$fail" = '0' ] && echo "ci gate: PASS" || exit 1
