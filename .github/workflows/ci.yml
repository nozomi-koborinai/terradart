name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    name: select examples
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.sel.outputs.examples }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select examples to validate
        id: sel
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Matrix uses the slug without the `_quickstart` suffix.
          all() { for d in examples/*_quickstart/; do basename "$d" | sed 's/_quickstart$//'; done | sort; }
          if [ "$EVENT" != 'pull_request' ]; then
            # push to main / manual dispatch: full matrix (regression backstop).
            sel="$(all)"
          else
            base="${BASE_SHA:-origin/main}"
            changed="$(git diff --name-only "$base" HEAD)"
            # A library/codegen/tooling/CI change can alter every example's synth
            # output, so validate the whole set; otherwise only changed examples.
            if printf '%s\n' "$changed" | grep -qE '^(packages/|tool/|\.github/workflows/ci\.yml$)'; then
              sel="$(all)"
            else
              sel="$(printf '%s\n' "$changed" \
                | awk -F/ '/^examples\/[^/]+_quickstart\// {print $2}' \
                | sed 's/_quickstart$//' | sort -u)"
            fi
          fi
          json="$(printf '%s\n' "$sel" | grep -v '^[[:space:]]*$' | jq -R . | jq -cs .)"
          echo "examples=$json" >> "$GITHUB_OUTPUT"
          echo "selected=$json"

  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [terradart_core, terradart_codegen, terradart_google, terradart_agent, terradart_coverage]
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      # Format check is scoped to the hand-written packages (terradart_core,
      # terradart_codegen, terradart_agent) because
      # terradart_google wrappers are formatted by `terradart wrap`'s pinned
      # dart_style (3.1.9), which can drift from the SDK-bundled `dart format`
      # CLI. wrap CLI output is the authoritative format for generated wrappers
      # and is guarded by the `wrap_check` job (`terradart wrap --check`).
      - if: matrix.package == 'terradart_core'
        run: dart format --output=none --set-exit-if-changed packages/terradart_core/ packages/terradart_codegen/ packages/terradart_agent/ packages/terradart_coverage/
      - if: matrix.package == 'terradart_core'
        run: dart analyze packages/ tool/ --fatal-infos --fatal-warnings
      - if: matrix.package == 'terradart_core'
        run: dart test tool/render_formula_test.dart tool/render_to_file_test.dart
      - run: dart test --reporter=github
        working-directory: packages/${{ matrix.package }}

  apply_smoke_selection_test:
    name: apply_smoke.sh selection test
    runs-on: ubuntu-latest
    # The change-gate that scopes apply-smoke to changed examples lives in shell;
    # a broken awk regex once fanned a pubspec-only bump out to every example (a
    # real GCP-cost leak). Run the selection unit test so that can't regress
    # unnoticed — it needs neither Dart nor GCP.
    steps:
      - uses: actions/checkout@v6
      - run: bash tool/apply_smoke_test.sh

  wrap_check:
    name: terradart wrap --check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Verify generated wrappers are up to date
        working-directory: packages/terradart_codegen
        run: |
          dart run bin/terradart.dart wrap \
            --provider hashicorp/google \
            --source test/fixtures/wrap/source \
            --output ../terradart_google/lib/src \
            --check

  publish_dry_run:
    name: pub publish --dry-run (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: test
    # Pre-merge dry-run catches what previously broke publish AFTER merge:
    # MM/cert fixtures tripping pub.dev's secret scanner (fixed reactively in
    # 0.12.5 and 0.12.11 by adding false_secrets). terradart_agent is excluded
    # — it ships as a brew binary, not a pub.dev package.
    strategy:
      fail-fast: false
      matrix:
        package: [terradart_core, terradart_codegen, terradart_google]
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: pub publish --dry-run
        working-directory: packages/${{ matrix.package }}
        run: dart pub publish --dry-run

  wrap_init_check:
    name: terradart wrap-init smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: wrap-init determinism + loader invariant
        working-directory: packages/terradart_codegen
        run: dart test --run-skipped -t e2e --name 'wrap-init'

  wrap_promote_check:
    name: terradart wrap-promote smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: wrap-promote determinism (L4)
        working-directory: packages/terradart_codegen
        run: dart test --run-skipped -t e2e --name 'wrap-promote'

  terraform_validate:
    name: terraform validate (${{ matrix.example }})
    runs-on: ubuntu-latest
    needs: [test, changes]
    # Skip entirely when no relevant example changed (the gate job below still
    # runs and reports success, so the required-check status stays satisfied).
    if: needs.changes.outputs.examples != '[]'
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.changes.outputs.examples) }}
    steps:
      - name: Job start
        id: job_start
        run: echo "started_ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.2"
      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          # Keyed on the pinned provider version; a provider bump invalidates it.
          key: tfplugins-${{ runner.os }}-${{ hashFiles('packages/terradart_google/lib/src/_provider_meta.dart') }}
          restore-keys: tfplugins-${{ runner.os }}-
      - name: Ensure plugin cache dir exists
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Setup checkpoint
        id: after_setup
        run: echo "ts_ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"

      - name: Workspace pub get
        id: pub_get_workspace
        run: |
          start=$(date +%s%N)
          dart pub get
          echo "duration_ms=$(( ($(date +%s%N) - start) / 1000000 ))" >> "$GITHUB_OUTPUT"

      - name: Example pub get
        id: pub_get_example
        working-directory: examples/${{ matrix.example }}_quickstart
        run: |
          start=$(date +%s%N)
          dart pub get
          echo "duration_ms=$(( ($(date +%s%N) - start) / 1000000 ))" >> "$GITHUB_OUTPUT"

      - name: Synth
        id: synth
        working-directory: examples/${{ matrix.example }}_quickstart
        env:
          GCP_PROJECT_ID: ci-test-project-id
          DB_PASSWORD: ci-test-secret
        run: |
          start=$(date +%s%N)
          dart run bin/infra.dart
          echo "duration_ms=$(( ($(date +%s%N) - start) / 1000000 ))" >> "$GITHUB_OUTPUT"

      - name: Terraform validate
        id: tf_validate
        working-directory: examples/${{ matrix.example }}_quickstart/tf-out
        run: |
          start=$(date +%s%N)
          terraform fmt -check
          terraform init -backend=false
          terraform validate
          echo "duration_ms=$(( ($(date +%s%N) - start) / 1000000 ))" >> "$GITHUB_OUTPUT"

      - name: Phase 5.0 timing summary
        if: always()
        run: |
          job_start_ns="${{ steps.job_start.outputs.started_ns }}"
          after_setup_ns="${{ steps.after_setup.outputs.ts_ns }}"
          setup_ms=$(( (after_setup_ns - job_start_ns) / 1000000 ))
          {
            echo "### ${{ matrix.example }}_quickstart timing"
            echo ""
            echo "| Step | Duration (ms) |"
            echo "|---|---|"
            echo "| Setup (checkout + Dart + Terraform install) | $setup_ms |"
            echo "| Workspace \`pub get\` | ${{ steps.pub_get_workspace.outputs.duration_ms }} |"
            echo "| Example \`pub get\` | ${{ steps.pub_get_example.outputs.duration_ms }} |"
            echo "| Synth (\`dart run bin/infra.dart\`) | ${{ steps.synth.outputs.duration_ms }} |"
            echo "| \`terraform fmt + init + validate\` | ${{ steps.tf_validate.outputs.duration_ms }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  terraform_validate_gate:
    name: terraform validate gate
    runs-on: ubuntu-latest
    needs: [changes, terraform_validate]
    if: always()
    # Stable, always-present check that aggregates the dynamic validate matrix.
    # Branch protection requires THIS (not the per-example jobs), so a PR that
    # validates a subset — or none — still presents a green required check.
    steps:
      - name: Aggregate terraform validate result
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.terraform_validate.result }}
          SELECTED: ${{ needs.changes.outputs.examples }}
        run: |
          echo "selected examples: $SELECTED"
          echo "changes job: $CHANGES / terraform_validate: $RESULT"
          if [ "$CHANGES" != 'success' ]; then
            echo "::error::example-selection job did not succeed ($CHANGES)"
            exit 1
          fi
          case "$RESULT" in
            success|skipped) echo "gate: PASS"; exit 0 ;;
            *) echo "::error::terraform validate did not pass (result=$RESULT)"; exit 1 ;;
          esac
