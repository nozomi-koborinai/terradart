name: schema-bump

# Weekly provider schema bumps: one job and one PR per tool/providers.yaml
# lane with a `bump:` entry (tool/bump_plan.dart) — google (with the
# google-beta ride-along), aws, cloudflare. appwrite has no `bump:` entry
# and stays pinned by hand. The lanes' crons fall on different days, so
# one lane's PR can merge before the next opens instead of leaving it
# behind main.
#
# A lane's PR body is its drift report. The workflow enables auto-merge
# (squash) only when the report finds nothing for a human
# (tool/generate_drift_report.dart autoMergeBlockers): a pr-only lane
# (cloudflare) always waits for a maintainer. Branch protection's required
# checks still gate every merge.
#
# A new upstream type does not block auto-merge: the bump scaffolds a
# default override for it (tool/bump_new_factories.dart scaffold), wraps it
# into a factory, and records it in tool/curation_backlog.yaml (API polish)
# and — unless the lane's leftover example covers it — tool/example_debt.yaml
# (`awaiting-example:`). A removed type or a breaking API diff still blocks.

on:
  schedule:
    # One cron per lane, from tool/providers.yaml `bump.cron`
    # (tool/bump_plan_test.dart keeps the two in step).
    - cron: '0 22 * * 0' # google + google-beta (Monday 07:00 JST)
    - cron: '0 22 * * 1' # aws
    - cron: '0 22 * * 2' # cloudflare
  workflow_dispatch:
    inputs:
      lane:
        description: 'Lane to bump (a tool/providers.yaml lane with bump:), or all.'
        type: choice
        options: [all, google, aws, cloudflare]
        default: all
      dry_run:
        description: 'If true, do not create a PR (only run detection + report).'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  plan:
    name: plan bump lanes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
    steps:
      - uses: actions/checkout@v6

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve workspace deps
        run: dart pub get

      - name: Select lanes
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          LANE: ${{ github.event.inputs.lane }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            lanes=$(dart tool/bump_plan.dart --schedule="$SCHEDULE")
          else
            lanes=$(dart tool/bump_plan.dart --lane="${LANE:-all}")
          fi
          echo "lanes=$lanes" >> "$GITHUB_OUTPUT"
          echo "$lanes"

  bump:
    name: bump ${{ matrix.lane }}
    needs: plan
    if: needs.plan.outputs.lanes != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # A lane's failure (terraform init, a fail-closed extraction) must not
      # cancel the other lanes' bumps.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.lanes) }}
    concurrency:
      group: schema-bump-${{ matrix.lane }}
      cancel-in-progress: false
    env:
      LANE: ${{ matrix.lane }}
      MODE: ${{ matrix.mode }}
      SOURCE: ${{ matrix.source }}
      REFRESH: ${{ matrix.refresh }}
      OVERRIDES_ROOT: ${{ matrix.overrides_root }}
      SCHEMA_DIR: ${{ matrix.schema_dir }}
      PACKAGE: ${{ matrix.package }}
      CATALOG: ${{ matrix.catalog }}
      MANIFEST: ${{ matrix.manifest }}
      DATA_SOURCES: ${{ matrix.data_sources }}
      API_LANES: ${{ matrix.api_lanes }}
      RIDE_ALONG: ${{ matrix.ride_along }}
      RIDE_ALONG_SOURCE: ${{ matrix.ride_along_source }}
      RIDE_ALONG_SCHEMA_DIR: ${{ matrix.ride_along_schema_dir }}
      RIDE_ALONG_PACKAGE: ${{ matrix.ride_along_package }}
      RIDE_ALONG_MANIFEST: ${{ matrix.ride_along_manifest }}
      EXAMPLE_GENERATOR: ${{ matrix.example_generator }}
    steps:
      - uses: actions/checkout@v6

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: hashicorp/setup-terraform@v3
        # Default terraform_version is latest stable; intentional per
        # docs/superpowers/specs/2026-05-17-plan5e-schema-bump-automation-design.md
        # Section 9 question 1.

      - name: Resolve workspace deps
        run: dart pub get

      - name: Snapshot generated API surface (before)
        run: dart tool/bump_api_surface.dart dump --lanes="$API_LANES" --out=/tmp/api_before.json

      - name: Read current provider version
        id: current_version
        run: |
          # The fixture records the release it was generated from; the
          # refresh step below rewrites it on every bump.
          v=$(tr -d '[:space:]' < "$SCHEMA_DIR/provider_version.txt")
          if [ -z "$v" ]; then
            echo "::error::Could not read the provider version from $SCHEMA_DIR/provider_version.txt"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Current $SOURCE version: $v"

      - name: Detect latest release in the tracked major + max major
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: ${{ steps.current_version.outputs.version }}
        run: |
          dart tool/fetch_schema.dart --lane="$LANE" --current-version="$CURRENT" \
            > /tmp/state.json
          cat /tmp/state.json

      - name: Refresh provider schema
        run: |
          latest=$(jq -r '.latest' /tmp/state.json)
          bump_needed=$(jq -r '.bump_needed' /tmp/state.json)
          # Save the pre-bump schema for the resource diff.
          cp "$SCHEMA_DIR/schema.json" /tmp/old_schema.json
          if [ "$bump_needed" != "true" ]; then
            echo "No bump needed; skipping schema refresh."
            cp "$SCHEMA_DIR/schema.json" /tmp/new_schema.json
            exit 0
          fi

          case "$REFRESH" in
            dump)
              mkdir -p /tmp/tf-schema-bump
              cat > /tmp/tf-schema-bump/main.tf <<EOF
          terraform {
            required_providers {
              ${SOURCE##*/} = {
                source  = "$SOURCE"
                version = "= $latest"
              }
            }
          }
          EOF
              (cd /tmp/tf-schema-bump && terraform init -no-color && \
                terraform providers schema -json > /tmp/new_schema.json)
              cp /tmp/new_schema.json "$SCHEMA_DIR/schema.json"
              printf '%s\n' "$latest" > "$SCHEMA_DIR/provider_version.txt"
              ;;
            extract)
              # The whole catalog at the new release, never --resources-from:
              # that fails closed when upstream removes a type, and the diff
              # step below is what reports removals.
              dart tool/extract_schema_subset.dart \
                --provider="$SOURCE" \
                --version="$latest" \
                --all-resources --all-data-sources \
                --out="$SCHEMA_DIR"
              cp "$SCHEMA_DIR/schema.json" /tmp/new_schema.json
              ;;
            *)
              echo "::error::unknown refresh mode $REFRESH"
              exit 1
              ;;
          esac

      - name: Sync MM YAML overlays
        if: matrix.mm
        run: |
          dart tool/sync_mm_yaml.dart \
            --manifest=tool/mm_yaml_sources.yaml \
            --target-dir="$SCHEMA_DIR/mm" \
            > /tmp/mm_yaml_sync.json
          cat /tmp/mm_yaml_sync.json

      - name: Compute schema resource diff
        run: |
          # Removed types count only when the catalog still wraps them.
          flags=()
          if [ "$DATA_SOURCES" = "true" ]; then flags+=(--data-sources); fi
          dart tool/schema_resource_diff.dart \
            --old=/tmp/old_schema.json --new=/tmp/new_schema.json \
            --catalog="$CATALOG" "${flags[@]}" \
            --out=/tmp/schema_diff.json
          cat /tmp/schema_diff.json

      - name: Scaffold default overrides for new types
        run: |
          # Fail-soft: a failed scaffold leaves the overrides as they were;
          # the regenerate then skips the new types and the drift report
          # blocks auto-merge on scaffold.json.
          set +e
          dart tool/bump_new_factories.dart scaffold --lane="$LANE" \
            --diff=/tmp/schema_diff.json --out=/tmp/scaffold.json
          rc=$?
          set -e
          echo "Exit: $rc"
          if [ "$rc" != "0" ]; then
            git checkout -- "$OVERRIDES_ROOT" tool/mm_yaml_sources.yaml
            git clean -fdq -- "$OVERRIDES_ROOT" "$SCHEMA_DIR/mm"
          fi

      - name: Regenerate wrappers (`terradart wrap`)
        run: |
          set +e
          dart tool/wrap_lanes.dart --lane "$LANE" --gate regen > /tmp/wrap_regen.txt 2>&1
          rc=$?
          set -e
          echo "Exit: $rc"
          cat /tmp/wrap_regen.txt
          if [ "$rc" != "0" ]; then
            # wrap builds its whole buffer before materialising, so a failure
            # writes nothing — but discard any partial state defensively so
            # the bump PR carries inputs + the check log only. The --check
            # step below then records the divergence for the drift report,
            # and a maintainer regenerates locally.
            git checkout -- "$PACKAGE/lib" "$MANIFEST"
            echo "wrap failed; bump PR will carry inputs only (see drift report)."
            exit 0
          fi
          example_ok=true
          if [ -n "$EXAMPLE_GENERATOR" ]; then
            # The leftover example covers every factory no other example
            # does; a regenerate can add, drop or reshape them.
            if ! dart "$EXAMPLE_GENERATOR"; then
              git checkout -- examples
              git clean -fdq -- examples
              example_ok=false
              echo "::warning::$EXAMPLE_GENERATOR failed; the example is unchanged and the new factories are recorded as awaiting an example."
            fi
          fi
          # Every new type the catalog now wraps goes into the curation
          # backlog (API polish) and, when no leftover example covers it,
          # into tool/example_debt.yaml as awaiting an example.
          dart tool/bump_new_factories.dart record --lane="$LANE" \
            --diff=/tmp/schema_diff.json \
            --detected-at="$(date -u +%Y-%m-%d)" \
            --provider-version="$(jq -r '.latest' /tmp/state.json)" \
            --example-generator-ok="$example_ok" \
            --out=/tmp/new_factories.json

      - name: Run `terradart wrap --check`
        run: |
          # After a successful regenerate this verifies (and records) that the
          # committed tree matches the new schema byte-for-byte; after a failed
          # regenerate it records the divergence for the drift report.
          set +e
          dart tool/wrap_lanes.dart --lane "$LANE" --gate wrap > /tmp/wrap_check.txt 2>&1
          rc=$?
          echo "$rc" > /tmp/wrap_check_exit
          echo "Exit: $rc"
          cat /tmp/wrap_check.txt

      - name: Sync catalog counts in the docs
        run: |
          # Only the terradart_google catalog is restated in prose
          # (tool/doc_expectations.dart); the coverage page renders from the
          # catalog plus every example's synth output.
          if git diff --quiet -- "$CATALOG" || [ "$LANE" != "google" ]; then
            echo "Catalog unchanged or not restated; docs untouched."
            exit 0
          fi
          dart tool/check_docs_consistency.dart --fix \
            || echo "::warning::docs consistency still fails after --fix (the lane gates report it)."
          if dart tool/example_synth_gates.dart --skip-validate > /tmp/synth_gates.txt 2>&1; then
            echo "Synth gates green."
          else
            echo "::warning::example synth gates fail; the coverage page renders from what synthed."
            tail -n 40 /tmp/synth_gates.txt
          fi
          dart tool/render_coverage_page.dart

      - name: Refresh the ride-along lane's fixture + regenerate
        if: matrix.ride_along != ''
        run: |
          # Runs BEFORE the lane gates so Gate 9 (beta/GA overlap) sees the
          # refreshed fixture pair. Fail-soft: a ride-along failure never
          # fails the bump — it lands in beta_bump.json for the report.
          bump_needed=$(jq -r '.bump_needed' /tmp/state.json)
          if [ "$bump_needed" != "true" ]; then
            echo "No $LANE bump; $RIDE_ALONG skipped."
            exit 0
          fi
          latest=$(jq -r '.latest' /tmp/state.json)
          prev=$(cat "$RIDE_ALONG_SCHEMA_DIR/provider_version.txt")

          set +e
          dart tool/extract_schema_subset.dart \
            --provider="$RIDE_ALONG_SOURCE" \
            --version="$latest" \
            --resources-from="$RIDE_ALONG_SCHEMA_DIR/schema.json" \
            --out="$RIDE_ALONG_SCHEMA_DIR" > /tmp/beta_extract.txt 2>&1
          extract_rc=$?
          set -e
          cat /tmp/beta_extract.txt

          wrap_check_rc=null
          if [ "$extract_rc" = "0" ]; then
            printf '%s\n' "$latest" > "$RIDE_ALONG_SCHEMA_DIR/provider_version.txt"
            set +e
            dart tool/wrap_lanes.dart --lane "$RIDE_ALONG" --gate regen > /tmp/beta_wrap.txt 2>&1
            regen_rc=$?
            set -e
            cat /tmp/beta_wrap.txt
            if [ "$regen_rc" != "0" ]; then
              # Same as the lane: keep the refreshed fixture (PR carries
              # inputs), discard partial generation; --check records it.
              git checkout -- "$RIDE_ALONG_PACKAGE/lib" "$RIDE_ALONG_MANIFEST"
            fi
            set +e
            dart tool/wrap_lanes.dart --lane "$RIDE_ALONG" --gate wrap > /tmp/beta_wrap_check.txt 2>&1
            wrap_check_rc=$?
            set -e
            cat /tmp/beta_wrap_check.txt
          else
            # Fail-closed extractor tripped (upstream type removal?) or
            # terraform init failed — ship the lane alone, keep the fixture.
            git checkout -- "$RIDE_ALONG_SCHEMA_DIR"
          fi

          excerpt=""
          if [ "$extract_rc" != "0" ]; then
            excerpt=$(tail -c 2000 /tmp/beta_extract.txt)
          elif [ "$wrap_check_rc" != "null" ] && [ "$wrap_check_rc" != "0" ]; then
            excerpt=$(tail -c 2000 /tmp/beta_wrap_check.txt)
          fi
          jq -n \
            --arg prev "$prev" \
            --arg version "$latest" \
            --argjson extract_exit "$extract_rc" \
            --argjson wrap_check_exit "$wrap_check_rc" \
            --arg log_excerpt "$excerpt" \
            '{previous_version: $prev, version: $version, extract_exit: $extract_exit, wrap_check_exit: $wrap_check_exit, log_excerpt: $log_excerpt}' \
            > /tmp/beta_bump.json
          cat /tmp/beta_bump.json

      - name: Diff generated API surface
        run: |
          # Fail-soft: without api_diff.json the drift report blocks
          # auto-merge ("not compared") instead of failing the bump.
          set +e
          dart tool/bump_api_surface.dart dump --lanes="$API_LANES" --out=/tmp/api_after.json \
            && dart tool/bump_api_surface.dart diff \
              --before=/tmp/api_before.json --after=/tmp/api_after.json \
              --out=/tmp/api_diff.json
          echo "Exit: $?"
          [ -f /tmp/api_diff.json ] && cat /tmp/api_diff.json
          exit 0

      - name: Run lane QA gates
        run: |
          set +e
          dart tool/bump_lane_gates.dart --lane "$LANE" > /tmp/gates.txt 2>&1
          rc=$?
          echo "$rc" > /tmp/gates_exit
          echo "Exit: $rc"
          tail -n 50 /tmp/gates.txt

      - name: Assemble drift-report inputs
        run: |
          mkdir -p /tmp/inputs
          cp /tmp/wrap_check.txt /tmp/inputs/wrap_check.txt
          cp /tmp/wrap_check_exit /tmp/inputs/wrap_check_exit
          cp /tmp/gates.txt /tmp/inputs/gates.txt
          cp /tmp/gates_exit /tmp/inputs/gates_exit
          cp /tmp/schema_diff.json /tmp/inputs/schema_diff.json
          # Optional inputs: MM sync (lanes with Magic Modules YAML), the
          # ride-along (bump weeks only), the API diff (absent → blocks).
          # The new-type scaffold and record (absent → nothing new, or wrap
          # failed before record ran).
          for f in mm_yaml_sync.json beta_bump.json api_diff.json scaffold.json new_factories.json; do
            if [ -f "/tmp/$f" ]; then cp "/tmp/$f" "/tmp/inputs/$f"; fi
          done
          # Add bump_date to state.json for the report title.
          today=$(date -u +%Y-%m-%d)
          jq --arg d "$today" '. + {bump_date: $d}' /tmp/state.json \
            > /tmp/inputs/state.json

      - name: Generate drift report
        run: |
          mkdir -p .schema-bump
          dart tool/generate_drift_report.dart \
            --lane="$LANE" \
            --inputs-dir=/tmp/inputs \
            --out=.schema-bump/drift_report.md \
            --decision-out=/tmp/auto_merge.json
          cat .schema-bump/drift_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Append new types to curation backlog
        run: |
          # The types record already listed are skipped; what is left are
          # types that did not become factories (a failed scaffold or wrap).
          added_count=$(jq '(.added_resources | length) + ((.added_data_sources // []) | length)' /tmp/schema_diff.json)
          if [ "$added_count" = "0" ]; then
            echo "No new types; backlog unchanged."
            exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          latest=$(jq -r '.latest' /tmp/state.json)
          dart tool/append_curation_backlog.dart \
            --backlog=tool/curation_backlog.yaml \
            --diff=/tmp/schema_diff.json \
            --detected-at="$today" \
            --provider-version="$latest"

      - name: Skip if nothing changed
        id: skip_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Anything to ship if: any tracked file differs OR a new major.
          new_major=$(jq -r '.new_major_available' /tmp/state.json)
          changes=$(git status --porcelain | wc -l)
          if [ "$changes" = "0" ] && [ "$new_major" != "true" ]; then
            echo "Nothing to report this week. Exiting."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$changes" = "0" ]; then
            # A quiet new-major week: one open PR already carries the banner
            # while the major stays unabsorbed, so don't stack an empty one
            # every week.
            open=$(gh pr list --state open --label schema-bump --limit 100 \
              --json headRefName \
              --jq "[.[] | select(.headRefName | startswith(\"chore/schema-bump-$LANE-\"))] | length")
            if [ "$open" != "0" ]; then
              echo "New major still unabsorbed; an open $LANE bump PR already reports it. Exiting."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Create branch + commit + PR
        if: steps.skip_check.outputs.skip != 'true' && github.event.inputs.dry_run != 'true'
        env:
          # GITHUB_TOKEN can push branches but cannot open PRs when the repo blocks
          # "GitHub Actions creating/approving pull requests". Use a fine-grained PAT
          # stored as SCHEMA_BUMP_PAT (contents + pull-requests write).
          GH_TOKEN: ${{ secrets.SCHEMA_BUMP_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SCHEMA_BUMP_PAT secret is missing. Add a fine-grained PAT with contents and pull-requests write so schema-bump can open PRs."
            exit 1
          fi
          today=$(date -u +%Y-%m-%d)
          branch="chore/schema-bump-$LANE-$today"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          # Everything the bump wrote: fixtures, overrides, wrappers,
          # manifests, ledgers, docs, examples. The drift report is the PR
          # body, and tf-out/ synth output is gitignored.
          git add -A -- . ':(exclude).schema-bump'
          # --allow-empty: a new-major week with nothing to regenerate still
          # opens a PR so the drift report's new-major banner reaches a human.
          git commit --allow-empty -m "chore(schema): weekly $LANE bump $today"
          git push -u origin "$branch"
          # Ensure the PR labels exist (idempotent) so a missing label can't fail
          # the bump the way it did on 2026-06-14. Best-effort: ignore "already exists".
          gh label create dependencies --color 0366d6 \
            --description "Dependency / provider schema bumps" 2>/dev/null || true
          gh label create schema-bump --color D4C5F9 \
            --description "Weekly provider schema / MM bump automation" 2>/dev/null || true
          url=$(gh pr create \
            --title "chore(schema): weekly $LANE bump $today" \
            --body-file .schema-bump/drift_report.md \
            --label dependencies --label schema-bump)
          echo "$url"
          if [ "$(jq -r '.auto_merge' /tmp/auto_merge.json)" = "true" ]; then
            # Needs the repository's "Allow auto-merge" setting; without it
            # the PR simply waits for a maintainer.
            gh pr merge "$url" --auto --squash \
              || echo "::warning::could not enable auto-merge on $url; merge it by hand."
          else
            echo "Auto-merge not enabled: $(jq -r '.blockers | join("; ")' /tmp/auto_merge.json)"
          fi
