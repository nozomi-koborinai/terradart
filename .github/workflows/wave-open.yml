name: wave-open

# Delivery bridge for the wave-shipper agent, whose token can push but
# cannot create PRs or apply labels (403, verified 2026-07-04..06). A push
# to wave/** whose HEAD commit message contains [wave-ready] gets a ready
# PR + the wave-approved label (firing the wave-merge executor); a push
# without the marker gets a draft PR (backup only). Every marker push
# re-applies the label, so repair rounds re-run the executor. Auth uses
# SCHEMA_BUMP_PAT: labels applied by
# GITHUB_TOKEN would not trigger wave-merge's labeled event.

on:
  push:
    branches: ['wave/**']

permissions:
  contents: read

concurrency:
  group: wave-open-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Open or ready the PR per the marker protocol
        env:
          GH_TOKEN: ${{ secrets.SCHEMA_BUMP_PAT }}
          BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          msg=$(git log -1 --format=%B "$HEAD_SHA")
          ready=false
          case "$msg" in *"[wave-ready]"*) ready=true ;; esac

          number=$(gh pr list --head "$BRANCH" --state open \
            --json number --jq '.[0].number // empty')
          isdraft=$(gh pr list --head "$BRANCH" --state open \
            --json isDraft --jq '.[0].isDraft // false')

          body_file=/tmp/pr_body.md
          {
            echo "Opened automatically by wave-open.yml — the wave-shipper agent's"
            echo "rationale and cost evidence live in the commit messages below."
            echo
            git log --format='- %s' "origin/main..$HEAD_SHA" 2>/dev/null || true
            echo
            echo "Files changed: $(git diff --name-only "origin/main...$HEAD_SHA" | wc -l | tr -d ' ')"
          } > "$body_file"
          # Prefer the branch's first feat/fix subject as the PR title — the
          # HEAD commit is often just the [wave-ready] finalize marker, which
          # would otherwise become the squash-merge title on main.
          title=$(git log --format=%s "origin/main..$HEAD_SHA" | grep -E '^(feat|fix)' | tail -1 || true)
          if [ -z "$title" ]; then
            title=$(git log -1 --format=%s "$HEAD_SHA" | sed 's/ \[wave-ready\]//')
          fi

          if [ -z "$number" ]; then
            if [ "$ready" = "true" ]; then
              gh pr create --head "$BRANCH" --title "$title" --body-file "$body_file"
            else
              gh pr create --head "$BRANCH" --title "$title" --body-file "$body_file" --draft
            fi
            number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          elif [ "$ready" = "true" ] && [ "$isdraft" = "true" ]; then
            gh pr ready "$number"
          fi

          if [ "$ready" = "true" ]; then
            # Adding a label that is already present emits no `labeled`
            # event, so a repair round's second [wave-ready] push would never
            # re-run wave-merge (PR #634 stranded this way on 2026-08-25 and
            # needed a manual merge). Remove first so the add is a fresh
            # event; `unlabeled` triggers nothing.
            # The label the executor keys on must exist before it is applied;
            # create it idempotently (schema-bump.yml does the same for its
            # labels) so a deleted label cannot silently stop the wave loop.
            gh label create wave-approved --color 0E8A16 \
              --description "wave-shipper verdict: Wave PR ready, executor may merge" 2>/dev/null || true
            gh pr edit "$number" --remove-label wave-approved > /dev/null 2>&1 || true
            gh pr edit "$number" --add-label wave-approved
            echo "ready: PR #$number labeled wave-approved"
          else
            echo "draft: PR #$number (no [wave-ready] marker)"
          fi
