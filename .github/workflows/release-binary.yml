name: release-binary
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos-arm64
          - os: macos-13
            target: macos-x86_64
          - os: ubuntu-22.04
            target: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Compile binary
        working-directory: packages/terradart_agent
        run: dart compile exe bin/terradart_mcp.dart -o terradart-mcp
      - name: Smoke test
        working-directory: packages/terradart_agent
        run: ./terradart-mcp --version
      - name: Package tarball
        working-directory: packages/terradart_agent
        run: |
          tar -czf terradart-mcp-${{ matrix.target }}.tar.gz terradart-mcp
          shasum -a 256 terradart-mcp-${{ matrix.target }}.tar.gz | tee terradart-mcp-${{ matrix.target }}.sha256
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/terradart_agent/terradart-mcp-${{ matrix.target }}.tar.gz
            packages/terradart_agent/terradart-mcp-${{ matrix.target }}.sha256
