name: Apply smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'examples/**'
      - 'tool/apply_smoke.sh'
      - 'tool/apply_smoke_skip.yaml'
  workflow_dispatch:

concurrency:
  # One independent lane per PR so a fresh push cancels its OWN in-flight run (a
  # Wave PR can push many times in an hour). Different PRs — and the full sweep
  # and janitor (group "apply-smoke") — stay on their own groups, so this never
  # cancels them. A cancelled apply's teardown is reclaimed by the janitor.
  group: apply-smoke-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  apply_smoke:
    name: apply smoke (terradart-validate)
    runs-on: ubuntu-latest
    # Skip while the PR is a draft — apply only once it's ready for review, so
    # work-in-progress pushes don't each spin up real GCP resources.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    # No label gate: the paths filter above already scopes this to PRs that touch
    # examples or the smoke tooling. apply_smoke.sh (changed mode) then applies
    # only the examples that differ from the PR base.
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - run: dart pub get
      - name: Apply smoke changed quickstarts
        env:
          GCP_VALIDATE_PROJECT_ID: ${{ secrets.GCP_VALIDATE_PROJECT_ID }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          chmod +x tool/apply_smoke.sh
          tool/apply_smoke.sh
