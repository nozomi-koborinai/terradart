name: Lunch Concierge Deploy

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation.
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy
      image_tag:
        description: >-
          Container image tag to build and deploy. Leave empty to use the
          commit SHA, which guarantees a Terraform diff and a new revision.
        required: false
        default: ""
        type: string

concurrency:
  group: lunch-concierge-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-northeast1
  PROJECT_ID: ${{ secrets.LUNCH_PROJECT_ID }}
  PROJECT_NUMBER: ${{ secrets.LUNCH_PROJECT_NUMBER }}
  TF_STATE_BUCKET: ${{ secrets.LUNCH_TF_STATE_BUCKET }}
  TF_STATE_PREFIX: ${{ secrets.LUNCH_TF_STATE_PREFIX }}
  WIF_PROVIDER: ${{ secrets.LUNCH_WIF_PROVIDER }}
  DEPLOYER_SERVICE_ACCOUNT: ${{ secrets.LUNCH_DEPLOYER_SERVICE_ACCOUNT }}
  INVOKER_EMAIL: ${{ secrets.LUNCH_INVOKER_EMAIL }}

jobs:
  deploy:
    name: ${{ inputs.operation }} Lunch Concierge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.2"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - run: dart pub get

      - name: Resolve deployment inputs
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          tag="${INPUT_IMAGE_TAG:-${GITHUB_SHA::12}}"
          image_uri="${REGION}-docker.pkg.dev/${PROJECT_ID}/lunch-concierge/app:${tag}"
          echo "IMAGE_URI=$image_uri" >> "$GITHUB_ENV"

      - name: Generate shared schemas
        working-directory: cookbook/lunch-concierge/shared
        run: dart run build_runner build

      - name: Synth Terraform JSON
        working-directory: cookbook/lunch-concierge/infra
        env:
          GCP_PROJECT_ID: ${{ env.PROJECT_ID }}
          IMAGE_URI: ${{ env.IMAGE_URI }}
          INVOKER_EMAIL: ${{ env.INVOKER_EMAIL }}
          TF_STATE_BUCKET: ${{ env.TF_STATE_BUCKET }}
          TF_STATE_PREFIX: ${{ env.TF_STATE_PREFIX }}
        run: dart run bin/infra.dart

      - name: Terraform init and validate
        working-directory: cookbook/lunch-concierge/infra/tf-out
        run: |
          terraform init
          terraform validate

      - name: Import Artifact Registry repository if present
        if: inputs.operation == 'apply' || inputs.operation == 'destroy'
        working-directory: cookbook/lunch-concierge/infra/tf-out
        run: |
          if ! terraform state show google_artifact_registry_repository.app_images >/dev/null 2>&1; then
            if gcloud artifacts repositories describe lunch-concierge \
              --project="$PROJECT_ID" \
              --location="$REGION" >/dev/null 2>&1; then
              terraform import \
                google_artifact_registry_repository.app_images \
                "projects/${PROJECT_ID}/locations/${REGION}/repositories/lunch-concierge"
            fi
          fi

      - name: Terraform plan
        if: inputs.operation == 'plan'
        working-directory: cookbook/lunch-concierge/infra/tf-out
        run: terraform plan -out=tfplan

      - name: Build and push image
        if: inputs.operation == 'apply'
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -f cookbook/lunch-concierge/server/Dockerfile -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Terraform apply
        if: inputs.operation == 'apply'
        working-directory: cookbook/lunch-concierge/infra/tf-out
        run: |
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan

      - name: Delete demo image before destroy
        if: inputs.operation == 'destroy'
        run: |
          gcloud artifacts docker images delete "$IMAGE_URI" \
            --project="$PROJECT_ID" \
            --delete-tags \
            --quiet || true

      - name: Terraform destroy
        if: inputs.operation == 'destroy'
        working-directory: cookbook/lunch-concierge/infra/tf-out
        run: terraform destroy -auto-approve