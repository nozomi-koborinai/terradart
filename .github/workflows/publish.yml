name: Publish to pub.dev

on:
  push:
    tags:
      - 'v*.*.*-dev'
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.0.4-dev). Required for workflow_dispatch.'
        required: true

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Publish ordering rationale.
#
# terradart_codegen's published pubspec declares `terradart_core: ^X.Y.Z-dev`,
# and terradart_google's published pubspec is rewritten by
# tool/prepare_publish.sh to declare hosted ^X.Y.Z-dev constraints for
# terradart_core and terradart_codegen. pub.dev
# validates these constraints against its index at upload time, so a
# dependent package can't ship until its dependencies' versions are visible
# on pub.dev.
#
# Phase 1 publishes the two no-deps packages in parallel.
# Phase 2 waits for pub.dev's index to catch up, then publishes terradart_codegen.
# Phase 3 waits again, then publishes terradart_google.
# Phase 4 publishes terradart_google_beta (depends only on terradart_core,
# which has been indexed since Phase 2's wait — no extra sleep needed).
# Phase 5 publishes terradart_appwrite (same shape and rationale).
# NOTE: pub.dev's OIDC automated publishing only works for packages that
# already exist there, so a NEW package's FIRST release is a manual
# `dart pub publish` by the maintainer (then enable automated publishing in
# the pub.dev admin UI); skip_if_published keeps these jobs a no-op until
# the workflow takes over.
#
# Previous shape (matrix of all 3 leaves in parallel) raced terradart_codegen
# against terradart_core's index propagation and intermittently failed
# version-solving at the codegen upload step.

jobs:
  publish-no-deps:
    name: publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [terradart_core]
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          echo "a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7  /usr/local/bin/yq" | sha256sum -c -
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - run: dart pub get

      - name: Pre-publish pubspec mutations
        run: tool/prepare_publish.sh "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" ${{ matrix.package }}

      - name: Check if already on pub.dev
        id: pub
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          if tool/skip_if_published.sh "${{ matrix.package }}" "$VERSION"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to pub.dev
        if: steps.pub.outputs.skip != 'true'
        run: dart pub publish --force
        working-directory: packages/${{ matrix.package }}

  publish-codegen:
    name: publish terradart_codegen
    needs: publish-no-deps
    runs-on: ubuntu-latest
    steps:
      - name: Wait for pub.dev index propagation
        run: |
          echo "Waiting 5 minutes for pub.dev to index terradart_core before publishing terradart_codegen..."
          sleep 300

      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          echo "a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7  /usr/local/bin/yq" | sha256sum -c -
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - run: dart pub get

      - name: Pre-publish pubspec mutations
        run: tool/prepare_publish.sh "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" terradart_codegen

      - name: Check if already on pub.dev
        id: pub
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          if tool/skip_if_published.sh terradart_codegen "$VERSION"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to pub.dev
        if: steps.pub.outputs.skip != 'true'
        run: dart pub publish --force
        working-directory: packages/terradart_codegen

  publish-google:
    name: publish terradart_google
    needs: publish-codegen
    runs-on: ubuntu-latest
    steps:
      - name: Wait for pub.dev index propagation
        run: |
          echo "Waiting 5 minutes for pub.dev to index terradart_codegen + terradart_core before publishing terradart_google..."
          sleep 300

      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          echo "a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7  /usr/local/bin/yq" | sha256sum -c -
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - run: dart pub get

      - name: Verify generated wrapper files
        run: |
          # Source of truth: per-resource yaml overrides under terradart_codegen.
          yaml_count=$(find packages/terradart_codegen/lib/src/codegen/wrapper_overrides/yaml -name '*.yaml' | wc -l | tr -d ' ')
          data_source_count=$(grep -l '^kind: data_source$' packages/terradart_codegen/lib/src/codegen/wrapper_overrides/yaml/*.yaml | wc -l | tr -d ' ')
          resource_count=$((yaml_count - data_source_count))
          # Wrapper (`google_*.dart`): one per yaml override.
          wrapper_count=$(find packages/terradart_google/lib/src -mindepth 2 -name 'google_*.dart' -not -path '*/generated/*' | wc -l | tr -d ' ')
          echo "yaml=$yaml_count (resources=$resource_count, data_sources=$data_source_count) wrapper=$wrapper_count"
          [ "$yaml_count" -eq "$wrapper_count" ] || { echo "::error::wrapper count ($wrapper_count) != yaml count ($yaml_count)"; exit 1; }

      - name: Pre-publish pubspec mutations
        run: tool/prepare_publish.sh "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" terradart_google

      - name: Check if already on pub.dev
        id: pub
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          if tool/skip_if_published.sh terradart_google "$VERSION"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to pub.dev
        if: steps.pub.outputs.skip != 'true'
        run: dart pub publish --force
        working-directory: packages/terradart_google

  publish-google-beta:
    name: publish terradart_google_beta
    needs: publish-google
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          echo "a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7  /usr/local/bin/yq" | sha256sum -c -
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - run: dart pub get

      - name: Verify generated wrapper files
        run: |
          # Source of truth: the google_beta override registry.
          yaml_count=$(find packages/terradart_codegen/lib/src/codegen/wrapper_overrides/google_beta/yaml -name '*.yaml' | wc -l | tr -d ' ')
          wrapper_count=$(find packages/terradart_google_beta/lib/src -mindepth 2 -name 'google_*.dart' | wc -l | tr -d ' ')
          echo "yaml=$yaml_count wrapper=$wrapper_count"
          [ "$yaml_count" -eq "$wrapper_count" ] || { echo "::error::wrapper count ($wrapper_count) != yaml count ($yaml_count)"; exit 1; }

      - name: Pre-publish pubspec mutations
        run: tool/prepare_publish.sh "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" terradart_google_beta

      - name: Check if already on pub.dev
        id: pub
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          if tool/skip_if_published.sh terradart_google_beta "$VERSION"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to pub.dev
        if: steps.pub.outputs.skip != 'true'
        run: dart pub publish --force
        working-directory: packages/terradart_google_beta

  publish-appwrite:
    name: publish terradart_appwrite
    needs: publish-google-beta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          echo "a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7  /usr/local/bin/yq" | sha256sum -c -
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - run: dart pub get

      - name: Verify generated wrapper files
        run: |
          # Source of truth: the appwrite override registry.
          yaml_count=$(find packages/terradart_codegen/lib/src/codegen/wrapper_overrides/appwrite/yaml -name '*.yaml' | wc -l | tr -d ' ')
          wrapper_count=$(find packages/terradart_appwrite/lib/src -mindepth 2 -name 'appwrite_*.dart' | wc -l | tr -d ' ')
          echo "yaml=$yaml_count wrapper=$wrapper_count"
          [ "$yaml_count" -eq "$wrapper_count" ] || { echo "::error::wrapper count ($wrapper_count) != yaml count ($yaml_count)"; exit 1; }

      - name: Pre-publish pubspec mutations
        run: tool/prepare_publish.sh "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" terradart_appwrite

      - name: Check if already on pub.dev
        id: pub
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          if tool/skip_if_published.sh terradart_appwrite "$VERSION"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to pub.dev
        if: steps.pub.outputs.skip != 'true'
        run: dart pub publish --force
        working-directory: packages/terradart_appwrite
