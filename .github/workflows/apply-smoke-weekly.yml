name: Apply smoke weekly

on:
  schedule:
    # Weekly: Sunday 02:00 UTC (Sunday 11:00 JST). The PR change-gate
    # (apply-smoke.yml) verifies changed/new examples per-PR; this full sweep is
    # the regression backstop for the rest of the set (provider/API drift, etc.).
    - cron: "0 2 * * 0"
  workflow_dispatch:

concurrency:
  group: apply-smoke
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  sweep:
    name: weekly apply sweep (terradart-validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - run: dart pub get
      - name: Apply-smoke all quickstarts
        id: sweep
        env:
          GCP_VALIDATE_PROJECT_ID: ${{ secrets.GCP_VALIDATE_PROJECT_ID }}
        run: |
          chmod +x tool/apply_smoke.sh
          set -o pipefail
          tool/apply_smoke.sh --all 2>&1 | tee /tmp/sweep.log
      - name: Open or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          summary="$(grep -E 'FAILED:' /tmp/sweep.log | tail -1 || echo 'see run log')"
          title="weekly apply-smoke failures"
          body="$(printf 'Weekly apply sweep failed on %s.\n\n%s\n\nRun: %s' \
            "$(date -u +%Y-%m-%d)" "$summary" "$RUN_URL")"
          existing="$(gh issue list --repo "$REPO" --state open \
            --search "$title in:title" --json number --jq '.[0].number')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
