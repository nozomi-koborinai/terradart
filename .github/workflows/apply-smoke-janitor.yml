name: Apply smoke janitor

on:
  schedule:
    # Weekly (Sundays 14:00 UTC). Teardown now runs with -lock=false, so a
    # cancelled run no longer leaves a lock-blocked orphan; the janitor is just a
    # periodic backstop for state-tracked leftovers — 6-hourly was overkill.
    # (Avoids the monthly sweep's 02:00-on-the-1st slot.)
    - cron: "0 14 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  janitor:
    name: terradart-validate janitor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Destroy orphaned quickstart state
        env:
          GCP_VALIDATE_PROJECT_ID: ${{ secrets.GCP_VALIDATE_PROJECT_ID }}
        run: |
          chmod +x tool/apply_smoke_janitor.sh
          tool/apply_smoke_janitor.sh
