name: Apply smoke janitor

on:
  schedule:
    # Every 6 hours: reclaim anything a failed or cancelled apply left behind
    # promptly (PR runs now cancel in-progress, so a teardown can be interrupted).
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  janitor:
    name: terradart-validate janitor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Destroy orphaned quickstart state
        env:
          GCP_VALIDATE_PROJECT_ID: ${{ secrets.GCP_VALIDATE_PROJECT_ID }}
        run: |
          chmod +x tool/apply_smoke_janitor.sh
          tool/apply_smoke_janitor.sh
