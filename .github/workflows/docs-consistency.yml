name: Docs consistency

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: docs-consistency-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  docs_consistency:
    name: docs consistency + pubsub smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Synth-gate logic unit tests
        # Guards the coverage / API-enablement-ratchet logic itself; the gate
        # runs over the real examples in ci.yml's apply_smoke_selection_test
        # job (example_synth_gates.dart) — not here, so docs pushes stay fast.
        run: dart --enable-asserts tool/example_synth_gates_test.dart
      - name: Docs caret + catalog count (text-only)
        run: dart tool/check_docs_consistency.dart
      - name: Pub/Sub quickstart smoke
        run: |
          chmod +x tool/smoke_quickstart.sh
          tool/smoke_quickstart.sh