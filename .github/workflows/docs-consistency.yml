name: Docs consistency

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: docs-consistency-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  docs_consistency:
    # The job name is a required status check in branch protection, so it
    # keeps its historical name. The pubsub smoke it names was retired: CI's
    # example gates synth and analyze every example.
    name: docs consistency + pubsub smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Docs caret + catalog count (text-only)
        run: dart tool/check_docs_consistency.dart
