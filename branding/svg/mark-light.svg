<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="TerraDart mark">
  <title>TerraDart</title>
  <desc>Two overlapping planes descend in the Dart visual lineage. A single Terra stratum cuts across the upper plane, embedding the IaC layer inside the Dart glyph.</desc>

  <!-- Upper plane: asymmetric trapezoid in Dart cyan -->
  <polygon points="32,48 224,48 180,152 76,152" fill="#13B9FD"/>

  <!-- Lower plane: descending triangle in deep Dart blue -->
  <polygon points="76,152 180,152 128,232" fill="#0175C2"/>

  <!-- Terra stratum across the upper plane -->
  <rect x="60" y="96" width="136" height="6" fill="#1E2A56" opacity="0.88"/>
</svg>
