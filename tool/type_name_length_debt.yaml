# Generated type names over the 80-character limit
# (tool/type_name_length_test.dart): type name → reason.
#
# A name that is only the resource stem plus one Terraform segment (two for a
# sealed variant) passes without an entry — only the stem is long. A name
# listed here also carries an ancestor segment, usually because the leaf block
# names differently shaped blocks elsewhere in the resource. Shorten it (a `sealedNames` concept, or a
# reshaped override) and delete the entry; an entry that no longer names such
# a type fails the gate as stale.

