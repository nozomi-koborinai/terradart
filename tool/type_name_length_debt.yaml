# Generated type names over the 80-character limit
# (tool/type_name_length_test.dart): type name → reason.
#
# A name one Terraform segment past the type it is named after passes without
# an entry: a helper or enum past the resource stem, a sealed type past the
# stem or the helper holding it, a variant past its sealed type (or that
# type's owner). Only the prefix is long there. A name listed here also
# carries an ancestor segment, usually because the leaf block names
# differently shaped blocks elsewhere in the resource. Shorten it (a
# `sealedNames` concept, or a reshaped override) and delete the entry; an
# entry that no longer names such a type fails the gate as stale.
