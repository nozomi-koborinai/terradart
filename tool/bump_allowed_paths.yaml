# Paths a weekly schema-bump PR (chore/schema-bump-*) may touch.
# Consumed by tool/check_bump_scope.dart, which the bump-merge executor runs
# before merging — a changed file matching NO rule blocks the auto-merge
# (fail-closed). Lines ending in '/' are prefix rules; others are exact paths.
#
# Deliberately excluded (touching them is Tier 3 — never auto-merge):
# MIGRATING.md, CHANGELOG.md, .github/workflows/, tool/*.dart, .cursor/,
# .claude/. Wanting to edit MIGRATING.md means the bump is breaking.

# Bump inputs (schema fixture, provider pin, MM overlays)
packages/terradart_codegen/test/fixtures/wrap/source/

# Generated surface (wrappers, catalog, barrels, umbrella) + provider meta
packages/terradart_google/lib/

# Tier-2 repair surface
packages/terradart_codegen/lib/src/codegen/wrapper_overrides/yaml/
packages/terradart_codegen/lib/src/codegen/barrels/barrels.yaml
packages/terradart_codegen/test/golden/
packages/terradart_codegen/test/fixtures/wrap/expected_output/

# Count assertions that move with the catalog
tool/doc_expectations.dart
packages/terradart_agent/test/catalog_count_test.dart
packages/terradart_codegen/test/cli/wrap_command_test.dart

# Bump bookkeeping
tool/curation_backlog.yaml
.schema-bump/

# Mechanical example follow-ups (note: touching examples triggers the
# apply-smoke change-gate — keep example edits minimal)
examples/
