# Curated factories not yet exercised by any example quickstart.
#
# Policy (AGENTS.md "Wave shipping policy"): every NEW factory must appear in
# an example within its Wave PR. Pre-existing gaps live here explicitly, one
# `ClassName: reason` line each. `tool/check_docs_consistency.dart` fails when
# a factory is neither covered nor listed, and when a listed factory becomes
# covered (remove the line) — adding a line is a reviewed decision, not a
# default.

# Monitoring factories that cannot `terraform apply` against a standalone
# apply-smoke project, so monitoring_quickstart uses the applyable variants
# instead (the custom-service resource) and drops the self-linking monitored
# project. Tracked here rather than forced into an example that would fail the
# apply-smoke sweep.
GoogleMonitoringService: typed google_monitoring_service needs a basic_service identifier bound to a real well-known service (App Engine / Istio / etc.) absent from a bare project; the applyable GoogleMonitoringCustomService is exercised by monitoring_quickstart instead
GoogleMonitoringMonitoredProject: links another project into a metrics scope — self-linking the scoping project is rejected, and cross-project linking needs a second project plus roles/monitoring.admin on both, which a standalone apply-smoke project can't provide

# GKE Backup channels are inherently cross-project: a channel connects a source
# project to a *different* destination project. In a standalone apply-smoke
# project source==dest, which the API rejects with "source and destination
# project cannot be same". Exercising them needs a second project, so
# gke_quickstart drops them (it keeps the applyable backup/restore plans).
GoogleGkeBackupBackupChannel: connects a source project to a different destination project; with only one project source==dest and creation fails 400 "source and destination project cannot be same". Needs a second project an apply-smoke run can't provide
GoogleGkeBackupRestoreChannel: same cross-project constraint as GoogleGkeBackupBackupChannel — destination project must differ from the source, which a single standalone apply-smoke project cannot satisfy

# Every project has exactly one fleet, auto-created on first GKE Hub use, so
# creating google_gke_hub_fleet for the default fleet always fails 409
# "Resource '.../fleets/default' already exists". gke_quickstart enrolls the
# cluster via GoogleGkeHubMembership against the auto-created default fleet
# instead of creating the fleet resource.
GoogleGkeHubFleet: the project default fleet is auto-created, so applying google_gke_hub_fleet returns 409 "fleets/default already exists"; there is no second fleet to create in a standalone project and the provider exposes no data source to adopt the existing one

# google_firestore_user_creds creates a database-level credential for a Cloud
# Firestore with MongoDB compatibility (Enterprise-edition) database. Applying
# it against a Standard-edition database fails 400 "This operation requires an
# Enterprise database." firestore_quickstart deliberately uses a Standard-edition
# named database (quickstart-db) so it can be created/destroyed repeatably;
# switching to Enterprise would change the example's intent (a heavier,
# cost-different product), so the resource is dropped from the example instead.
GoogleFirestoreUserCreds: requires an Enterprise-edition (MongoDB-compatible) Firestore database; firestore_quickstart uses a Standard-edition named database, against which creation fails 400 "This operation requires an Enterprise database." Switching the database to Enterprise would change the example's intent, so the resource is dropped

# Setting IAM on a restore plan rejected the binding with 400 "Invalid argument"
# at the restore-plan resource scope. GoogleGkeBackupBackupPlanIamMember already
# demonstrates GKE Backup resource-level IAM in gke_quickstart, so the redundant
# per-restore-plan binding is dropped rather than chased further.
GoogleGkeBackupRestorePlanIamMember: resource-level setIamPolicy on a restore plan failed 400 "Invalid argument"; the sibling GoogleGkeBackupBackupPlanIamMember already covers GKE Backup resource-level IAM in gke_quickstart, so this binding is dropped

# Regional Secret Manager secrets have no write-only (`_wo`) data field, and
# synth refuses a literal on the sensitive `secret_data` field (v1.0 no longer
# masks sensitive literals). Supplying the value via a Terraform variable would
# make secret_manager_quickstart (otherwise applyable) require `-var` at apply
# time and force it onto the apply-smoke skip list. The regional secret +
# regional secret IAM member are exercised in secret_manager_quickstart; only
# the version factory is deferred here.
GoogleSecretManagerRegionalSecretVersion: regional secrets lack a write-only data field and synth rejects a literal on the sensitive secret_data field; exercising it needs a Terraform variable that would break the applyable secret_manager_quickstart, so the version factory is tracked here while the regional secret + IAM member ship in the example

# Parameter Manager parameter versions hold the payload in the sensitive
# `parameter_data` field. As with regional Secret Manager versions, synth v1.0
# refuses a literal on a sensitive field, and supplying it via a Terraform
# variable would make parameter_manager_quickstart (otherwise applyable)
# require `-var` at apply time. The global + regional parameter factories ship
# in parameter_manager_quickstart; only the version factories are deferred here.
GoogleParameterManagerParameterVersion: parameter versions carry the payload in the sensitive parameter_data field; synth rejects a literal there and a Terraform variable would break the applyable parameter_manager_quickstart, so the version factory is tracked here while the global parameter ships in the example
GoogleParameterManagerRegionalParameterVersion: regional parameter versions carry the payload in the sensitive parameter_data field; same constraint as the global version, so the regional version factory is tracked here while the regional parameter ships in parameter_manager_quickstart

# Compute networking factories that cannot `terraform apply` against a
# standalone apply-smoke project. compute_quickstart keeps the applyable
# surface (VPC / subnet / router / NAT / address / instance / disk /
# filestore / IAM) and drops these because none can be provisioned
# deterministically in the sweep.
GoogleComputeSharedVpcHostProject: enabling a Shared VPC host needs an organization — "The project has no organization" on a standalone apply-smoke project
GoogleComputeSharedVpcServiceProject: attaches a service project to a Shared VPC host, which requires an organization the standalone apply-smoke project lacks
GoogleComputeInterconnect: a Dedicated Interconnect needs a real physical cross-connect (a provisioned circuit / customerName); it cannot be created in a bare project
GoogleComputeInterconnectAttachment: a VLAN attachment requires a provisioned Interconnect, which needs a physical circuit absent from the apply-smoke project
GoogleComputeExternalVpnGateway: only useful paired with a VPN tunnel to an external peer; the tunnels are dropped, so the external gateway is dropped with them
GoogleComputeVpnGateway: a classic target VPN gateway needs ESP/UDP forwarding rules before a tunnel can be created; that scaffolding is out of scope for the applyable example
GoogleComputeHaVpnGateway: HA VPN tunnels need a Cloud Router with BGP sessions; the extra interface/peer wiring is out of scope for the applyable example
GoogleComputeVpnTunnel: VPN tunnels require a configured gateway (forwarding rules for classic, Cloud Router BGP for HA), neither of which can be provisioned deterministically in the sweep
GoogleComputeNetworkPeering: bidirectional VPC peering races on GCP's async peering operation ("peering operation in progress") even when serialized, so it cannot apply deterministically
GoogleComputeNetworkPeeringRoutesConfig: configures routes on a VPC peering; with the peering dropped there is nothing to attach it to

# Identity Platform project config is a singleton. Shared validate projects that
# already enabled Identity Platform reject create with 400 "already been enabled".
# Tenant apply also fails on terradart-validate (400 INVALID_PROJECT_ID) — the
# quickstart stays synth-only via tool/apply_smoke_skip.yaml.
GoogleIdentityPlatformConfig: project singleton — terradart-validate (and any project with Identity Platform already on) rejects create with 400 "Identity Platform has already been enabled"; use the factory on a fresh project or import the existing config
