# High-cost examples (hourly-billed: GKE, Compute VMs, Memorystore, …).
#
# Live apply-smoke is retired. This list remains the cost-gate partition for
# sweep_only types: an example that provisions those types must appear here
# or in tool/apply_smoke_skip.yaml. Honored by tool/apply_smoke.sh --dry-run
# ONLY in `changed` mode. `--all` and `--example <slug>` ignore it.
# Distinct from tool/apply_smoke_skip.yaml (examples that cannot stand alone);
# an entry must NOT appear in both. tool/apply_smoke_test.sh enforces this.
#
# Format (one per line):  <example_slug>: <reason>

dataproc_metastore_quickstart: Dataproc Metastore DEVELOPER tier bills hourly (~$0.34/h list SKU E00F-6B0F-6FE3); apply only in the full sweep
gke_quickstart: GKE control plane management fee + node VMs bill hourly; apply only in the full sweep
compute_quickstart: Compute Engine VM bills hourly; apply only in the full sweep
cloud_run_quickstart: Memorystore Redis + Memcache bill hourly; apply only in the full sweep
bigtable_quickstart: production Bigtable instance (hourly node billing) plus multi-step table/view ordering; apply only in the full sweep
biglake_quickstart: BigLake Iceberg table hits Table Management SKU C2FF-D8D9-D9EF ~$0.12/h; apply only in the full sweep
network_security_dns_threat_quickstart: DNS Armor (SKU F6D7-37A1-D4A0) bills usage units hourly when the detector is enabled and workloads produce internet-bound DNS queries; apply only in the full sweep
