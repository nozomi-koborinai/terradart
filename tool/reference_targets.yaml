  - target: appwrite_tablesdb_table
    attribute: id
    slots: '^(table_id|related_table_id)$'
  - target: appwrite_mongo_database
    attribute: id
    slots: '^database_id$'
    types: '^appwrite_mongo_'
  - target: appwrite_mysql_database
    attribute: id
    slots: '^database_id$'
    types: '^appwrite_mysql_'
  - target: appwrite_postgresql_database
    attribute: id
    slots: '^database_id$'
    types: '^appwrite_postgresql_'

hashicorp/google-beta:
  - inherit: hashicorp/google
    attributes:
      # As on google_dataflow_job.
      google_dataflow_flex_template_job.network: name
      google_dataflow_flex_template_job.subnetwork: self_link
    exclude:
      # A dataset the subscription creates.
      - google_bigquery_analytics_hub_data_exchange_subscription.destination_dataset.dataset_reference.dataset_id
