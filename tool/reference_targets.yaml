    slots: '(^|\.)inspect_template_name$'
  - target: google_dataplex_lake
    attribute: name
    slots: '^lake$'
    types: '^google_dataplex_(?!.*_iam_)'
  - target: google_dataplex_zone
    attribute: name
    slots: '^dataplex_zone$'
    types: '^google_dataplex_(?!.*_iam_)'
  - target: google_dataplex_data_product
    attribute: data_product_id
    slots: '^data_product_id$'
    types: '^google_dataplex_(?!.*_iam_)'
  - target: google_dialogflow_version
    attribute: id
    slots: '^agent_version$'
    types: '^google_dialogflow_environment$'
  - target: google_discovery_engine_data_store
    attribute: data_store_id
    slots: '^data_store_id$'
    types: '^google_discovery_engine_(schema|sitemap|target_site)$'
  - target: google_discovery_engine_search_engine
    attribute: engine_id
    slots: '^engine_id$'
    types: '^google_discovery_engine_(control|serving_config)$'
  - target: google_dns_managed_zone
    attribute: name
    slots: '^managed_zone$'
    types: '^google_dns_(?!.*_iam_)'
  - target: google_document_ai_processor
    attribute: id
    slots: '^processor$'
    types: '^google_document_ai_processor_default_version$'
  - target: google_eventarc_message_bus
    attribute: name
