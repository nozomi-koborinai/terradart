  - target: google_network_security_ull_mirroring_collector
    attribute: name
    slots: '^ull_mirroring_collector$'
  - target: google_oracle_database_odb_network
    attribute: name
    slots: '^odb_network$'
    types: '^google_oracle_database_'
  - target: google_oracle_database_odb_subnet
    attribute: name
    slots: '^(odb_subnet|backup_odb_subnet)$'
    types: '^google_oracle_database_'
  - target: google_oracle_database_cloud_exadata_infrastructure
    attribute: id
    slots: '^exadata_infrastructure$'
    types: '^google_oracle_database_cloud_vm_cluster$'
  - target: google_oracle_database_exascale_db_storage_vault
    attribute: id
    slots: '(^|\.)exascale_db_storage_vault$'
  - target: google_oracle_database_goldengate_connection
    attribute: name
    slots: '^properties\.goldengate_connection$'
  - target: google_oracle_database_goldengate_deployment
    attribute: name
