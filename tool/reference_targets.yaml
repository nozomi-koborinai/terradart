    slots: '^workload_identity_pool_id$'
    types: '^google_iam_workload_identity_pool_(?!iam_)'
  - target: google_identity_platform_tenant
    attribute: name
    slots: '^tenant$'
    types: '^google_identity_platform_tenant_'
  - target: google_logging_project_bucket_config
