# Before cells of the top section of MIGRATING.md that tool/migrating_cells.dart
# does not compile, because their package has no release in the series the
# heading upgrades from (`## Unreleased`: any; `## 0.35.x → 0.36.0`: 0.35.x).
# pub.dev is the only Before API CI can read, so such a cell has nothing to
# compile against.
#
# Each entry is a reviewed decision: the cell's exact Before text, the
# unpublished package, and why the cell cannot compile against the published
# packages. Every Before cell not listed here compiles, and any failure is red.
# An entry fails the check when it matches no Before cell (the cell was edited
# or removed), when its package has a release in the series, or when its cell
# compiles. Once the package is published, the next release section starts
# without entries.

- before: 'AzurermMssqlManagedDatabase(''db'', managedInstanceId: instance.id, name: .literal(''app''), pointInTimeRestore: MssqlManagedDatabasePointInTimeRestore(restorePointInTime: .literal(''2026-01-01T00:00:00Z''), sourceDatabaseId: source.id))'
  package: terradart_azure
  reason: >-
    terradart_azure has no release on pub.dev; its unpublished API took `pointInTimeRestore` before the restore and the recover choice became one sealed argument.
