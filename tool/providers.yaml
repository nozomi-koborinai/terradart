# tool/providers.yaml — per-provider generation-pipeline coordinates.
#
# The provider-parameterization ledger: each entry records where a
# provider's schema fixture lives, which package `terradart wrap` emits
# into, and which override registry / barrels manifest / provider
# meta-argument the wrap invocation uses. Adding a provider means adding
# an entry here plus its directories: tool/wrap_lanes.dart reads every
# entry and runs `terradart wrap --check` and `terradart lint-override`
# for it, and both tool/agent_verify.sh and the CI wrap_check /
# override_gates jobs run that script. .github/workflows/schema-bump.yml
# reads the `bump:` entries through tool/bump_plan.dart, so a lane's weekly
# bump is declared here too.
#
# Fields:
#   source:          terraform registry source (NAMESPACE/NAME)
#   schemaDir:       checked-in schema fixture directory
#   schemaMode:      full | filtered
#                    full     — entire provider schema (GA google, where
#                               backlog detection needs every resource key;
#                               aws, whose overrides fill the catalog in
#                               stages against one extraction)
#                    filtered — only curated resources, re-extracted with
#                               tool/extract_schema_subset.dart (see the
#                               fixture's README)
#   mm:              whether Magic Modules YAML enriches the merged IR
#   outputPackage:   the package wrap emits into
#   overridesRoot:   wrapper-override YAML registry (wrap --overrides-root)
#   barrelsManifest: authored barrels manifest (wrap --barrels-manifest)
#   resourceProvider: value for wrap --resource-provider, or null for the
#                    implied default provider (GA google). Non-default
#                    providers sharing the google_* type prefix MUST set
#                    this or synth attributes their resources to `google`.
#   migrateManifest: the migration manifest wrap emits for the lane
#                    (wrap --migrate-manifest), generated into
#                    terradart_migrate and verified by the same --check.
#   providerEnums:   (optional, default false) wrap --provider-enums: type
#                    enum-valued inputs from <schemaDir>/hints/*.yaml
#                    (tool/extract_provider_hints.dart) and the
#                    `Available values:` description dialect. Never set it
#                    on a google lane — the GA schema carries that dialect.
#   bump:            (optional) the weekly schema bump's coordinates for
#                    the lane; a lane without it is never bumped by the
#                    workflow (google-beta rides the google bump at the
#                    same version; appwrite stays pinned by hand).
#     mode:          auto    — open a PR and enable auto-merge when the
#                              drift report finds nothing for a human
#                    pr-only — open a PR, never auto-merge
#     repo:          GitHub repo whose releases tool/fetch_schema.dart reads
#     major:         the major the lane tracks; releases of any other major
#                    are ignored, a newer one is only reported
#     cron:          the schedule that bumps this lane — one of the crons in
#                    schema-bump.yml's `on.schedule` (tool/bump_plan_test.dart
#                    keeps the two in step). Lanes get different days so one
#                    lane's PR merges before the next opens instead of
#                    leaving it behind main.
#     refresh:       dump    — overwrite schema.json with the raw
#                              `terraform providers schema -json`
#                    extract — re-extract the full catalog with
#                              tool/extract_schema_subset.dart
#                              --all-resources --all-data-sources
#     dataSources:   (optional, default false) diff data sources too: the
#                    lane wraps every data source at the pin
#     scaffold:      how a new upstream type gets its default override
#                    (tool/bump_new_factories.dart scaffold):
#                    wrap-init — `terradart wrap-init` per new resource,
#                                a leftover-thin override per new data
#                                source (tool/batch_data_source_overrides.dart)
#                    lane      — scaffold_lane_overrides.dart, which fills
#                                every schema type that lacks one
#     rideAlong:     (optional) a lane re-extracted and regenerated at the
#                    same version inside this lane's bump (google-beta)
#     exampleGenerator: (optional) a tool/ script the bump reruns after a
#                    regenerate (the lane's leftover example)

providers:
  google:
    source: hashicorp/google
    schemaDir: packages/terradart_codegen/test/fixtures/wrap/source
    schemaMode: full
    mm: true
    outputPackage: packages/terradart_google
    overridesRoot: packages/terradart_codegen/lib/src/codegen/wrapper_overrides/yaml
    barrelsManifest: packages/terradart_codegen/lib/src/codegen/barrels/barrels.yaml
    resourceProvider: null
    migrateManifest: packages/terradart_migrate/lib/src/manifest/google.g.dart
    bump:
      mode: auto
      repo: hashicorp/terraform-provider-google
      major: 8
      cron: '0 22 * * 0' # Sunday 22:00 UTC (Monday 07:00 JST)
      refresh: dump
      dataSources: true
      scaffold: wrap-init
      rideAlong: google-beta
  google-beta:
    source: hashicorp/google-beta
    schemaDir: packages/terradart_codegen/test/fixtures/wrap/source_beta
    schemaMode: filtered
    mm: false
    outputPackage: packages/terradart_google_beta
    overridesRoot: packages/terradart_codegen/lib/src/codegen/wrapper_overrides/google_beta/yaml
    barrelsManifest: packages/terradart_codegen/lib/src/codegen/barrels/barrels_google_beta.yaml
    resourceProvider: google-beta
    migrateManifest: packages/terradart_migrate/lib/src/manifest/google_beta.g.dart
  appwrite:
    source: appwrite/appwrite
    schemaDir: packages/terradart_codegen/test/fixtures/wrap/source_appwrite
    schemaMode: filtered
    mm: false
    outputPackage: packages/terradart_appwrite
    overridesRoot: packages/terradart_codegen/lib/src/codegen/wrapper_overrides/appwrite/yaml
    barrelsManifest: packages/terradart_codegen/lib/src/codegen/barrels/barrels_appwrite.yaml
    resourceProvider: null # appwrite_ prefix collides with nothing
    migrateManifest: packages/terradart_migrate/lib/src/manifest/appwrite.g.dart
    providerEnums: true
  cloudflare:
    source: cloudflare/cloudflare
    schemaDir: packages/terradart_codegen/test/fixtures/wrap/source_cloudflare
    schemaMode: filtered
    mm: false
    outputPackage: packages/terradart_cloudflare
    overridesRoot: packages/terradart_codegen/lib/src/codegen/wrapper_overrides/cloudflare/yaml
    barrelsManifest: packages/terradart_codegen/lib/src/codegen/barrels/barrels_cloudflare.yaml
    resourceProvider: null # cloudflare_ prefix collides with nothing
    migrateManifest: packages/terradart_migrate/lib/src/manifest/cloudflare.g.dart
    providerEnums: true
    bump:
      mode: pr-only # minor releases ship breaking changes
      repo: cloudflare/terraform-provider-cloudflare
      major: 5
      cron: '0 22 * * 2' # Tuesday 22:00 UTC
      refresh: extract
      dataSources: true
      scaffold: lane
      exampleGenerator: tool/generate_cloudflare_leftover_example.dart
  aws:
    source: hashicorp/aws
    schemaDir: packages/terradart_codegen/test/fixtures/wrap/source_aws
    schemaMode: full
    mm: false
    outputPackage: packages/terradart_aws
    overridesRoot: packages/terradart_codegen/lib/src/codegen/wrapper_overrides/aws/yaml
    barrelsManifest: packages/terradart_codegen/lib/src/codegen/barrels/barrels_aws.yaml
    resourceProvider: null # aws_ prefix collides with nothing
    migrateManifest: packages/terradart_migrate/lib/src/manifest/aws.g.dart
    bump:
      mode: auto
      repo: hashicorp/terraform-provider-aws
      major: 6
      cron: '0 22 * * 1' # Monday 22:00 UTC
      refresh: extract
      dataSources: true
      scaffold: lane
      exampleGenerator: tool/generate_aws_leftover_example.dart
