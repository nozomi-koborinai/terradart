# apply_cost_denylist.yaml — Terraform resource types that make an example too
# expensive to `terraform apply` freely in apply-smoke. Enforced by
# tool/apply_smoke_test.sh (test 9): an example whose generated tf-out contains
# one of these types MUST be skip-listed, or CI fails. This is the machine guard
# that stops a high-cost resource — e.g. a software license that bills merely by
# existing — from slipping into the sweep. That gap caused the Cloud License
# Manager cost spike: license_manager_quickstart provisioned Office SPLA licenses
# and was in neither skip list, so the per-PR gate applied it on every push.
#
# Format (one per line):  <terraform_type>: <tier>   # reason
#
# Tiers:
#   safe        — no existence billing; apply→destroy stops all charges; cheap.
#                 Applied per-PR and in the full sweep.
#   sweep_only  — billed hourly and expensive, but safe to apply briefly in the
#                 full sweep (apply -> destroy). Must not apply per-PR. The
#                 example MUST be in tool/apply_smoke_skip.yaml OR
#                 tool/apply_smoke_pr_skip.yaml.
#   never_apply — bills heavily merely by existing (software licenses,
#                 reservations) or cannot be cheaply torn down. Must NEVER apply,
#                 even in the full sweep. The example MUST be in
#                 tool/apply_smoke_skip.yaml.
#
# DEFAULT-DENY: a type absent from ALL three tiers is "unclassified" and is NOT
# applied (apply_smoke.sh skips the example; apply_smoke_test.sh test9 fails the
# build). Classify new types here — confirm cost via terraform MCP + docs; when
# unsure leave it unclassified (it stays skipped, which is safe).

# --- safe_exception: safe types whose name matches COST_DANGER_RE but are confirmed zero-billing ---
# Format: safe_exception: <type>  # rationale
safe_exception: google_compute_instance_iam_member  # IAM binding, no billing — _instance substring false positive
safe_exception: google_compute_instance_template  # instance template metadata only; VMs bill via google_compute_instance (sweep_only)
safe_exception: google_compute_instance_settings  # zonal metadata defaults singleton; no VM provisioned — _instance substring false positive
safe_exception: google_service_directory_endpoint  # Service Directory metadata record, no existence billing — _endpoint false positive
safe_exception: google_bigtable_instance_iam_member  # IAM binding on Bigtable instance; no existence billing — _instance substring false positive
safe_exception: google_secure_source_manager_instance_iam_member  # IAM binding on SSM instance; no existence billing — _instance substring false positive (parent google_secure_source_manager_instance is never_apply)
safe_exception: google_notebooks_instance_iam_member  # IAM binding on notebook instance; no existence billing — _instance substring false positive (parent google_notebooks_instance is never_apply)
safe_exception: google_workbench_instance_iam_member  # IAM binding on Workbench instance; no existence billing — _instance substring false positive (parent google_workbench_instance is never_apply)
safe_exception: google_memorystore_instance_desired_user_created_endpoints  # PSC endpoint metadata on a parent Memorystore Valkey instance; no existence billing — _instance substring false positive (parent google_memorystore_instance is never_apply)
safe_exception: google_vertex_ai_endpoint  # prediction endpoint shell; no existence billing until a model is deployed — _endpoint substring false positive
safe_exception: google_vertex_ai_index_endpoint  # index endpoint shell; no existence billing until a deployed index — _endpoint substring false positive (sibling google_vertex_ai_index_endpoint_deployed_index is never_apply)
safe_exception: google_apigee_instance_attachment  # environment↔instance binding; no existence billing — _instance substring false positive (parent google_apigee_instance is never_apply)
safe_exception: google_redis_cluster_user_created_connections  # PSC connection metadata on a parent Redis Cluster; no existence billing — _cluster substring false positive (parent google_redis_cluster is never_apply)
safe_exception: google_dataproc_cluster_iam_member  # IAM binding on Dataproc cluster; no existence billing — cluster substring false positive (parent google_dataproc_cluster is never_apply)

safe_exception: google_notebooks_environment  # Workbench environment is an image recipe only; Notebooks SKUs bill when an instance/VM runs — _notebooks substring false positive
safe_exception: google_bigquery_reservation_group  # reservation group is a named container only; BigQuery Reservation API 16B8-3DDA-9F10 SKUs bill slots/commits (e.g. Standard Edition PAYG 0165-271F-5086 ~$0.049/slot-hour) — reservation substring false positive

