# Examples the apply-smoke sweep does NOT `terraform apply`, with the reason.
#
# These examples still get `dart run bin/infra.dart` (synth) + `terraform
# validate` via tool/example_synth_gates.dart. They are excluded ONLY from real
# `terraform apply` because they need inputs that terradart-validate (a
# standalone project: no organization, no real secrets/certs, not registered
# with Firebase) cannot provide. The list doubles as a coverage-debt ledger —
# delete an entry to put that example back in the sweep.
#
# Honored by tool/apply_smoke.sh in apply modes (--all and the PR change-gate).
# `--example <slug>` applies even a listed example (explicit override), and
# `--destroy-only` (the janitor) never skips, so leftover state stays
# reclaimable.
#
# Format (one per line):  <example_slug>: <reason>

# --- Org-only: the resource requires the project to belong to an organization
apigee_quickstart: requires a pre-existing Apigee organization (organizations/{org_name}) and a GCS bucket for the analytics datastore target — neither is provisioned in terradart-validate
bigquery_quickstart: datapolicy + analyticshub resources require an organization
privileged_access_manager_quickstart: PAM entitlement create returns 400 ORGLESS_RESOURCE ("PAM cannot be used on resources that are not part of an Organization") on standalone terradart-validate — synth + terraform validate still cover google_privileged_access_manager_entitlement

# --- Need real external secrets / certs / ids
compute_lb_quickstart: needs a real TLS cert + private key + CAS CSR / trust anchor
cloud_sql_quickstart: needs a real source-replica password
ops_quickstart: needs a real organization id / folder id
access_context_quickstart: needs a real organization id for access policy parent
scc_quickstart: needs an organization-activated Security Command Center parent (org/folder sources, mute configs, custom modules, BQ exports) — terradart-validate has no org ancestor
org_leftover_quickstart: org-scoped hierarchical firewall / Cloud Armor, BYOIP advertised/delegated prefixes (owned public CIDR), Storage Intelligence folder/org configs, and a Wasm plugin image artifact — none applyable on standalone terradart-validate
deferred_leftover_quickstart: remaining uncurated GA leftovers (org / folder / billing / DMS / Datastream / Cloud Domains / Assured Workloads / Identity Platform IdP / …) — none applyable on standalone terradart-validate; synth + terraform validate only
data_source_leftover_quickstart: remaining GA data sources (read-only lookups against dummy ids) — synth + terraform validate only; do not apply on terradart-validate
firebase_app_check_quickstart: needs real App Check debug token / DeviceCheck key / reCAPTCHA secret

# --- Need the project registered with Firebase (firebase.googleapis.com is not
#     enough; the project must be added to Firebase, which Terraform can't do here)
firebase_data_connect_quickstart: needs the project registered with Firebase
firebase_remote_config_quickstart: needs the project registered with Firebase
firebase_app_hosting_quickstart: needs the project registered with Firebase + a connected source repo

# --- Identity Platform / GCIP multi-tenancy needs more than API enablement
identity_platform_quickstart: tenant create returns 400 INVALID_PROJECT_ID after enabling identitytoolkit.googleapis.com — terradart-validate lacks GCIP multi-tenancy / Firebase Auth project linkage that Terraform cannot establish here; config is also a project singleton (see tool/example_debt.yaml)

# --- Legacy Data Catalog writes blocked by GCP deprecation on terradart-validate
#     (API returns 400 "not allowed to perform write operations due to Data
#     Catalog deprecation"; prefer google_dataplex_entry_group). Synth +
#     terraform validate still cover the curated factory.
data_catalog_quickstart: Project is not allowed to perform write operations due to Data Catalog deprecation (HTTP 400 on EntryGroup create); prefer Dataplex Universal Catalog — synth + terraform validate cover google_data_catalog_entry_group

# --- Cloud Source Repositories API is not enableable on terradart-validate
#     (sourcerepo.googleapis.com absent from the project's available services
#     list; enable returns 403 AUTH_PERMISSION_DENIED — product is in
#     maintenance / SSM successor). Synth + terraform validate still cover it.
sourcerepo_quickstart: sourcerepo.googleapis.com cannot be enabled on terradart-validate (API absent from available services / enable 403); Cloud Source Repositories is maintenance-mode in favor of Secure Source Manager

# --- Need a source artifact staged into the generated tf-out at apply time
cloud_functions_quickstart: needs a real function source zip staged into tf-out
app_engine_quickstart: needs a staged app.zip in the deploy bucket and a verifiable domain for domain mapping; one App Engine app per project
storage_quickstart: uploads a local source file (config/app.json) absent from generated tf-out

# --- Need external infra / secrets
cloud_build_quickstart: needs a real GitHub App OAuth token secret + a peered VPC

# --- Provisioning latency / network infra the example doesn't provision
eventarc_quickstart: Eventarc Advanced bus+pipeline take ~5min and the http_endpoint trigger needs a NetworkAttachment to apply; revisit to add one or retarget the trigger

# --- Snapshot-capable Filestore tiers need HighScaleSSD / Enterprise quota
filestore_quickstart: High Scale SSD Filestore needs HighScaleSSDStorageGibPerRegion quota; terradart-validate has limit 0 in us-central1 (and asia-northeast1) so apply cannot provision the 10 TiB minimum instance

# --- Collides with the apply-smoke WIF auth infrastructure (must never apply here)
iam_quickstart: creates a WIF pool id 'github-actions' that COLLIDES with the apply-smoke auth pool — applying it would 409 and its teardown could delete the pool CI auth depends on; WIF pools also have a 30-day soft-delete lock that breaks repeated sweeps
wif_trust_domain_quickstart: WIF trust-domain pool/namespace/managed identity IDs are soft-deleted ~30 days; terraform create does not undelete (hashicorp/terraform-provider-google#14191) so a fixed-id re-apply after destroy 409s; pool id terradart-trust is distinct from skip-listed iam_quickstart (github-actions collision)

# --- Create resources GCP cannot delete (or soft-deletes), so a 2nd run 409s ---
# These can't be repeated against a reused project: the resource (or its name)
# survives teardown, so the next sweep fails "already exists" / "existed too
# recently". synth + validate still cover them.
kms_quickstart: KMS key rings (and keys) cannot be deleted, so a re-run fails 409 "KeyRing already exists"; also provisions google_kms_key_ring_import_job (never_apply wrapping-key material); no way to reclaim names in a reused project
firestore_document_quickstart: creates the Firestore (default) database, which cannot be deleted, so a re-run fails 409 "Database already exists"
cloud_tasks_quickstart: a deleted Cloud Tasks queue name is locked ~7 days ("queue cannot be created because a queue with this name existed too recently"), so a daily sweep with a fixed name always 409s
api_security_quickstart: google_apikeys_key is soft-deleted for 30 days and the example uses a fixed name, so a re-apply after destroy fails "Resource already exists - apply blocked by lifecycle params" (first surfaced by PR #265's change-gate; teardown itself is clean)
discovery_engine_quickstart: Discovery Engine data stores are soft-deleted for hours; fixed example IDs can fail reruns with "being deleted" before the previous deletion completes
# --- Infrastructure Manager actuation needs config.agent SA + network admin and applies a live VPC module
config_deployment_quickstart: needs config.agent and compute.networkAdmin IAM on a dedicated SA plus a long-running Git blueprint apply (terraform-google-network VPC module)

# --- Dialogflow SIP trunking needs a live carrier TLS hostname peer
dialogflow_quickstart: SIP trunk apply needs a real carrier TLS peer certificate matching expected_hostname — placeholder hostnames fail at apply time

# --- Partner CCI transport needs a live remote profile + partner account
network_connectivity_quickstart: Partner CCI transport apply needs a real remoteTransportProfile handshake and partner account — placeholder remote_account_id fails at apply time

# --- ULL mirroring needs a live forwarding rule and zone-scoped engine
network_security_ull_quickstart: ULL mirroring apply needs a real internal forwarding rule and networksecurity zone resources — placeholder forwarding rule self-link fails at apply time

# --- Chronicle requires a provisioned SecOps instance ID
chronicle_quickstart: needs a real Chronicle (Google SecOps) instance ID — placeholder UUID fails at apply time

# --- Oracle Base Database DB System needs live ODB subnet and subscription entitlement
oracle_db_system_quickstart: DB System apply needs Oracle zone entitlement and live ODB subnet provisioning — API rejects placeholder wiring in terradart-validate
oracle_exadata_quickstart: Exadata/ExaDB apply needs Oracle zone entitlement and live Exascale vault wiring — API rejects placeholder wiring in terradart-validate

# --- Oracle Autonomous Database needs live ODB subnet and subscription entitlement
oracle_autonomous_database_quickstart: Autonomous Database apply needs Oracle zone entitlement and live ODB subnet provisioning — API rejects placeholder wiring in terradart-validate

# --- Oracle GoldenGate needs live ODB subnet/network and subscription entitlement
oracle_goldengate_quickstart: GoldenGate apply needs Oracle zone entitlement and live ODB subnet provisioning — API rejects placeholder VPC/ODB wiring in terradart-validate

# --- Bills heavily even for a brief existence (third-party software licenses) ---
# License Manager reserves third-party software licenses (e.g. Office SPLA) that
# bill per license_count for the configuration's entire lifetime — no Compute VM
# is attached. Even a brief apply→destroy in the sweep accrues real Microsoft
# license fees at a per-unit rate far above any other resource here (it caused a
# large single-month cost spike). Unlike gke/compute in apply_smoke_pr_skip.yaml,
# this must NOT apply even in the full sweep, so it belongs here. synth +
# terraform validate still cover it.
license_manager_quickstart: reserves Office SPLA licenses (license_count, active) that bill for the configuration's existence with no VM attached; a brief apply→destroy still accrues high Microsoft license fees — synth + terraform validate cover it instead

# --- Vector Search DataObject meters Write Ops + payload storage ---
# Collection-only was applyable (~$0 schema). Adding google_vector_search_data_object
# for synth coverage introduces Write Ops SKU C1E5-1A7F-E9B3 ~$0.18/count plus
# Data Stored 1AE9-553C-C219 while the object exists. Skip the whole example
# (apply is example-scoped) so personal validate projects do not accrue those
# meters; synth + terraform validate still cover collection + data object.
vector_quickstart: Vector Search DataObject meters Write Ops (C1E5-1A7F-E9B3 ~$0.18/count) and payload storage; apply skipped intentionally — synth + terraform validate cover google_vector_search_collection and google_vector_search_data_object
