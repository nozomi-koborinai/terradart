# Inputs whose description has a value-set cue (`Possible values`, `Valid
# options`, `One of`, `either`) that only the checker's loose reader
# (`cueValues` in check_google_enum_gaps.dart) reads, and that a reviewer
# found to be prose rather than a value set, each with the reason.
#
# This is not gap debt: an input listed here has no fixed value set, so it
# stays a string by design. A line can only name a `cue` gap. An input the
# enum parser or Magic Modules reads is a value set and cannot be excused
# here, and a line that no longer matches a cue-only gap fails the check.
# A new wording the parser skips therefore fails the gate until the parser
# reads it or a reviewer adds a line here.

# The cue names sibling inputs of a mutual-exclusion group, not values.
google_compute_firewall.source_ranges: one of 'source_ranges', 'source_tags' or 'source_service_accounts' is required (sibling inputs)
google_compute_firewall.source_service_accounts: one of 'source_ranges', 'source_tags' or 'source_service_accounts' is required (sibling inputs)
google_compute_firewall.source_tags: one of 'source_ranges', 'source_tags' or 'source_service_accounts' is required (sibling inputs)
google_secret_manager_secret.expire_time: only one of 'expire_time' or 'ttl' can be provided (sibling inputs)
google_secret_manager_secret.ttl: only one of 'ttl' or 'expire_time' can be provided (sibling inputs)
google_secret_manager_regional_secret.expire_time: only one of 'expire_time' or 'ttl' can be provided (sibling inputs)
google_secret_manager_regional_secret.ttl: only one of 'ttl' or 'expire_time' can be provided (sibling inputs)
google_dialogflow_cx_flow.knowledge_connector_settings.target_flow: only one of 'targetPage' or 'targetFlow' may be set (union members)
google_dialogflow_cx_flow.knowledge_connector_settings.target_page: only one of 'targetPage' or 'targetFlow' may be set (union members)
google_dialogflow_cx_flow.knowledge_connector_settings.trigger_fulfillment.messages.payload: only one of the message union members may be set; the payload is a JSON string
google_dialogflow_cx_flow.knowledge_connector_settings.trigger_fulfillment.messages.output_audio_text.ssml: only one of 'text' or 'ssml' may be set; the value is SSML text
google_dialogflow_cx_page.knowledge_connector_settings.target_flow: only one of 'targetPage' or 'targetFlow' may be set (union members)
google_dialogflow_cx_page.knowledge_connector_settings.target_page: only one of 'targetPage' or 'targetFlow' may be set (union members)
google_dialogflow_cx_page.knowledge_connector_settings.trigger_fulfillment.messages.payload: only one of the message union members may be set; the payload is a JSON string
google_dialogflow_cx_page.knowledge_connector_settings.trigger_fulfillment.messages.output_audio_text.ssml: only one of 'text' or 'ssml' may be set; the value is SSML text
google_discovery_engine_chat_engine.chat_engine_config.dialogflow_agent_to_link: exactly one of 'agent_creation_config' or 'dialogflow_agent_to_link' must be set; the value is an agent resource name
