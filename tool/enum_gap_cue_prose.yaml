google_compute_region_security_policy_rule.network_match.ip_protocols: each element is a protocol name, an 8-bit decimal number, or a range

# The value set depends on another input, so one enum would admit values the
# API rejects.
google_app_engine_flexible_app_version.instance_class: the valid classes depend on the scaling mode (F classes for automatic, B classes for manual)
