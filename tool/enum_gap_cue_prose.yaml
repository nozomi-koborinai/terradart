# The cue lists the values of another input.
google_sql_user.password_wo: "either CLOUD_IAM_USER or CLOUD_IAM_SERVICE_ACCOUNT" are values of 'type'; this input is a password
google_compute_ssl_policy.custom_features: the 'COMPATIBLE' ... 'CUSTOM' list describes 'profile'; this input lists SSL feature names
google_composer_environment.config.maintenance_window.recurrence: the allowed 'FREQ' values constrain one RRULE field; the input is a full RFC 5545 rule
google_iam_workload_identity_pool_provider.oidc.allowed_audiences: acceptable values for the token's 'aud' claim, which are any audience strings

