# Dummy values for constructor arguments in the appwrite coverage stack
# (examples/appwrite_leftover_quickstart). The generator asks for a
# value by Dart owner and parameter (`CoverageDummies.valueFor`);
# `dart tool/coverage_stack.dart --lane appwrite` renders the stack from this
# file, validates it as required CI does, and writes back each value the
# provider asked for, with the diagnostic it answered as `why:`.
#
# Key: `Owner.param` (the Dart class holding the parameter), a bare `param`
# (any owner), or a glob of either with `*` for any run of characters,
# matched case-sensitively. An exact `Owner.param` wins, then a bare
# `param`, then the first glob in file order. Value: a string, number, bool
# or list of them. The appwrite stack declares no names, so no value reads
# `${name}`. The map form adds `why:`, or holds Dart source as `dart:`
# where no literal can say it.
#
# The seeds are the formats the provider schema's descriptions name for
# required inputs; every other input takes the generator's type default.

'*email*': 'leftover@example.com'
'*Email*': 'leftover@example.com'
'*url': 'https://example.com'
'*Url': 'https://example.com'

buildRuntime: 'node-22'
data: '{}'
domain: 'leftover.example.com'
framework: 'other'
runtime: 'node-22'
schedule: '0 3 * * *'
services: ['databases']

AppwriteDomainRecord.type:
  value: 'A'
  why: 'appwrite_domain_record.domain_record.type rejected leftover: Attribute type value must be one of: ["A" "AAAA" "ALIAS" "CAA" "CNAME" "HTTPS" "MX" "NS" "SRV" "TXT"], got: "leftover" (family one-of)'
AppwriteDomainRecord.value:
  value: '10.0.0.1'
  why: 'appwrite_domain_record.domain_record.value rejected leftover: A records take an IPv4 address, got "leftover". (family ipv4)'
AppwriteWafRule.type:
  value: 'bypass'
  why: 'appwrite_waf_rule.waf_rule.type rejected leftover: Attribute type value must be one of: ["bypass" "challenge" "deny" "rateLimit" "redirect"], got: "leftover" (family one-of)'
DataAppwriteDomain.domain:
  value: 'leftover.example.com'
  why: 'data.appwrite_domain.domain: Exactly one of these attributes must be configured: [id,domain]'
