# Sealed groups no rule names yet (terradart wrap).
#
# A group with no `sealedNames` entry and no derived name
# (shared prefix / suffix, or its whole block) falls back to
# its members joined with `Or`. `wrap` adds that group here
# so a schema bump still merges; name it by adding
# `sealedNames: {"<members>": <concept>}` to the override and
# re-running wrap, which drops the entry. `wrap --check` fails
# on a missing or stale entry.
appwrite_function:
  "interval, schedule": "awaiting-name: appwrite/appwrite 2.3.0"
aws_observabilityadmin_telemetry_evaluation:
  "all_regions, regions": "awaiting-name: hashicorp/aws 6.69.1"
aws_observabilityadmin_telemetry_evaluation_for_organization:
  "all_regions, regions": "awaiting-name: hashicorp/aws 6.69.1"
google_iam_folders_policy_binding:
  "target.principal_set, target.resource": "awaiting-name: hashicorp/google 8.6.0"
google_iam_organizations_policy_binding:
  "target.principal_set, target.resource": "awaiting-name: hashicorp/google 8.6.0"
google_iam_projects_policy_binding:
  "target.principal_set, target.resource": "awaiting-name: hashicorp/google 8.6.0"
