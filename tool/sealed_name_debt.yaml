# Sealed groups no rule names yet (terradart wrap).
#
# A group with no `sealedNames` entry and no derived name
# (shared prefix / suffix, or its whole block) falls back to
# its members joined with `Or`. `wrap` adds that group here
# so a schema bump still merges; name it by adding
# `sealedNames: {"<members>": <concept>}` to the override and
# re-running wrap, which drops the entry. `wrap --check` fails
# on a missing or stale entry.
google_app_engine_standard_app_version:
  "vpc_access, vpc_access_connector": "awaiting-name: hashicorp/google 8.11.0"
google_compute_global_forwarding_rule:
  "backend_service, target": "awaiting-name: hashicorp/google 8.12.0"
google_vertex_ai_evaluation_item:
  "evaluation_request, gcs_uri": "awaiting-name: hashicorp/google 8.11.0"
  "evaluation_request.golden_response.agent_data, evaluation_request.golden_response.text, evaluation_request.golden_response.value": "awaiting-name: hashicorp/google 8.11.0"
