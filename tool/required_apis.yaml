# The Google API each Terraform type prefix needs: terradart wrap
# --required-apis (the google lane in tool/providers.yaml) emits one
# GoogleApi constant per API named here, and requiredApiForTerraformType,
# from it into packages/terradart_google/lib/src/project/google_api.dart.
#
# Longest matching prefix wins. A null value carves a type out of a broader
# prefix: no Discovery document confirms its API. tool/required_apis_test.dart
# checks every other wrapped type against the Discovery copy.
