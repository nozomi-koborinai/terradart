# Overrides exempt from `migrate-shape-underivable` (migration manifest, #659).
#
# Each line is `<terraform_type>: reason`. Listed overrides carry a prelude
# helper class (or a custom slot) whose Terraform encoding the migration
# manifest cannot derive, so `terradart wrap --migrate-manifest` records the
# shape as `manual` and `terradart migrate` keeps such blocks in Terraform.
# Stale entries (override no longer violates) fail `terradart lint-override`.
# New entries are a reviewed maintainer decision — prefer reshaping the
# helper to a field-per-key `encode()` map literal (see #659).
# Shared by every tool/providers.yaml lane: each lane's lint checks the
# entries naming its own overrides, and `tool/wrap_lanes.dart` fails on an
# entry that names an override in no lane.

google_chronicle_dashboard_chart: ChronicleDashboardChartVisualization spreads a `...axisType.encode()` enum into the block; the manifest has no merged-enum shape
google_compute_autoscaler: AutoscalingPolicy.scalingSchedules is a `Map<String, ScalingSchedule>` encoded as a set of blocks with the key moved into `name`; the manifest's keyed shape is an object of blocks
google_compute_firewall: Allow/DenyPolicy.encode() fans one Dart value out into several `allow {}` / `deny {}` blocks via additionalRules
google_compute_image: ComputeImageSourceRawDisk.rawDisk holds the derived ComputeImageRawDisk helper; the YAML-only lint cannot see deriveNestedTypes symbols, while the generated manifest derives the variant as a helper
google_compute_region_autoscaler: AutoscalingPolicy.scalingSchedules is a `Map<String, ScalingSchedule>` encoded as a set of blocks with the key moved into `name`; the manifest's keyed shape is an object of blocks
google_network_connectivity_policy_based_route: NetworkConnectivityPolicyBasedRouteNextHopOtherRoutesChoice.routes holds the derived NetworkConnectivityPolicyBasedRouteNextHopOtherRoutes enum; the YAML-only lint cannot see deriveEnums symbols, while the generated manifest derives the variant as an enum value
