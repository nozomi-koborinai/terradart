# Paths a weekly Wave PR (wave/*) may touch. Consumed by
# tool/check_bump_scope.dart --ledger tool/wave_allowed_paths.yaml, run by
# the wave-merge executor before auto-merging (fail-closed).
#
# Deliberately excluded (needing them means the Wave is NOT additive or
# needs maintainer judgment — no auto-merge): MIGRATING.md, CHANGELOG.md,
# pubspec.yaml files, .github/workflows/, tool/*.dart,
# tool/exactly_one_lint_debt.yaml (sealed design = escalate), .cursor/,
# .claude/.

