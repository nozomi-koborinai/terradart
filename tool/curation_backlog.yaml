# tool/curation_backlog.yaml
#
# Append-only log of types detected in an upstream provider schema that
# still need a human's curation in their lane's package (google_* in
# terradart_google; aws_* / cloudflare_* resources and data sources).
# Maintained by the weekly schema-bump workflow
# (.github/workflows/schema-bump.yml) — each cron run appends any
# newly-detected types here. The bump already generates a factory from a
# default override for each one (tool/bump_new_factories.dart); those
# entries carry a `note:` saying so, and what is left is API polish and an
# example (a google factory also has an `awaiting-example:` line in
# tool/example_debt.yaml, which needs this entry). An entry without that
# note predates this, or is a type the bump could not scaffold or wrap.
#
# Maintainers: when curating a resource (via Wave N), remove its entry from
# this file in the same PR that polishes (or introduces) the curated wrapper. This file
# is the single source of truth for "what's left to look at".
#
# Schema:
#   entries:
#     - resource: google_X_Y_Z   (or data_source: aws_x_y for a data source)
#       detected_at: YYYY-MM-DD (date of the schema-bump PR that detected it)
#       provider_version: X.Y.Z (the lane's release that introduced it)
#       note: (optional, maintainer-added)
#
# This file is the queue for on-demand Waves: no scheduled agent reads it.
# Ship entries with the terradart-ship-wave skill (by hand or via a cloud
# agent), removing each shipped entry in that PR. An entry that needs a
# design decision first (e.g. a sealed exactly_one_of slot) carries a
# `note:` saying so. An empty list is normal.

