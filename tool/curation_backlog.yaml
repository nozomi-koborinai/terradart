# tool/curation_backlog.yaml
#
# Append-only log of google_* resources detected in upstream provider schema
# that are NOT yet curated in terradart_google. Maintained by the weekly
# schema-bump workflow (.github/workflows/schema-bump.yml) — each cron run
# appends any newly-detected resources here.
#
# Maintainers: when curating a resource (via Wave N), remove its entry from
# this file in the same PR that introduces the curated wrapper. This file
# is the single source of truth for "what's left to look at".
#
# Schema:
#   entries:
#     - resource: google_X_Y_Z
#       detected_at: YYYY-MM-DD (date of the schema-bump PR that detected it)
#       provider_version: 7.X.Y (the v7 release that introduced it)
#       note: (optional, maintainer-added)
#
# 2026-08-12 maintainer triage: refilled from the GA fixture gap (~245
# uncured non-IAM). Product order is intentional for wave-shipper (first
# un-skipped product group, then first 3–6 resources): compute →
# network_services → dialogflow → discovery_engine → storage.
# Org/folder/BYOIP and artifact-gated entries carry
# `skipped by wave-shipper` notes so daily runs do not stall on them.
#
# 2026-08-13 follow-up: CES leftovers (toolset / example / deployment)
# shipped. Remaining un-skipped product groups in this file are empty —
# compute/network_services/dialogflow/discovery_engine/storage and IAM
# workforce / SCC / ACM leftovers stay skip-noted. Other remaining gap
# families (logging org/folder, identity platform IdP configs, billing,
# DMS, Datastream, …) stay deferred.
#
# 2026-08-15 leftover batch: all 53 skip-noted GA-fixture leftovers
# (compute org/BYOIP, Wasm plugin, Dialogflow encryption spec, Discovery
# Engine CMEK/connector, Storage Intelligence folder/org, IAM workforce,
# SCC v1/v2/management, ACM attachments) shipped on the apply-excluded
# path.
#
# 2026-08-15 remaining-uncurated batch: the other 89 GA-fixture leftovers
# (logging org/folder/billing, Identity Platform IdP configs except
# `google_identity_platform_oauth_idp_config`, billing, DMS, Datastream,
# Assured Workloads, Cloud Domains, …) shipped on the apply-excluded path.
# 2026-08-15: that last GA type was curated after the coverage real-plan
# test stopped requiring a live uncurated sentinel. An empty backlog is a
# normal wave-shipper no-op until the weekly schema bump appends newly
# detected types.

